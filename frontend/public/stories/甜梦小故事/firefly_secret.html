<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萤火虫的秘密</title>
    <!-- 核心技术栈，包含 fallback -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script>(function () { var g = "tailwind", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script>(function () { var g = "Vue", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script>(function () { var g = "gsap", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/rough.js'"></script>
    <script>(function () { var g = "rough", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/rough.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0D1117;
            font-family: 'Noto Sans SC', sans-serif;
            user-select: none;
        }

        #main-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .night-interface {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .whisper-top {
            text-align: center;
            font-size: 1.1rem;
            color: #9FA8DA;
            opacity: 0.8;
            font-style: italic;
            max-width: 700px;
            margin: 0 auto;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .narrative-bottom {
            text-align: center;
            max-width: 900px;
            margin: 0 auto 100px;
        }

        .stage-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 3.2rem;
            color: #C5CAE9;
            margin-bottom: 20px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
        }

        .stage-content {
            font-size: 1.4rem;
            color: #9FA8DA;
            line-height: 1.8;
            padding: 10px 40px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 80%);
        }

        .btn-attract {
            position: absolute;
            bottom: 50px;
            right: 50px;
            background: rgba(255, 235, 59, 0.15);
            border: 1px solid #FFEB3B;
            color: #FFEB3B;
            padding: 18px 55px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .btn-attract:hover {
            background: rgba(255, 235, 59, 0.3);
            transform: scale(1.05);
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.8s;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>

<body>
    <canvas id="main-canvas"></canvas>

    <div id="app" class="night-interface">
        <!-- 顶部感悟 -->
        <transition name="fade" mode="out-in">
            <div :key="step" class="whisper-top">
                ✨ {{ parentWords[step-1] }}
            </div>
        </transition>

        <!-- 底部剧情 -->
        <div class="narrative-bottom">
            <transition name="fade" mode="out-in">
                <div :key="step">
                    <h1 class="stage-title">{{ stages[step-1].title }}</h1>
                    <p class="stage-content">{{ stages[step-1].content }}</p>
                </div>
            </transition>
        </div>

        <!-- 浮放交互 -->
        <div class="action-area pointer-events-auto">
            <button v-if="step === 3" @click="handleAttract" class="btn-attract"> 伸出手：吸引萤火虫飞过来 </button>
            <button v-else-if="step < 5" @click="nextStage" class="btn-attract">继续探索</button>
            <button v-else @click="reset"
                class="btn-attract bg-indigo-900 !text-white !border-indigo-400">回到仲夏夜</button>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const fireflies = ref([]);
                const mouse = ref({ x: -1000, y: -1000 });

                const stages = [
                    { title: '仲夏夜之梦', content: '当最后一缕夕阳消失在远山，静谧的森林换上了深蓝色的睡袍。草丛里，无数微小的‘星星’正揉着眼睛，静静苏醒。' },
                    { title: '灯笼小分队', content: '这些闪烁的光芒，是萤火虫在寻找伙伴。它们提着半透明的小灯笼，在低矮的灌木林里翩翩起舞，守护着夜晚的宁静。' },
                    { title: '光影的共鸣', content: '萤火虫喜欢和温柔的孩子做朋友。轻轻挥动你的手指，看，这些亮晶晶的小生命正被你的温暖吸引，向你飞来。' },
                    { title: '微光的聚会', content: '瞧！它们聚在一起了。点点微光汇成了温暖的河流，照亮了那些平时躲在阴影里的秘密角落，让每一个角落都充满了爱。' },
                    { title: '永恒的陪伴', content: '萤火虫累了，它们要熄灭灯笼去睡觉啦。虽然光芒会暂时休息，但那份温暖会一直留在心里。晚安，勇敢的小灯笼们。' }
                ];

                const parentWords = [
                    "宝贝，你看草丛里那些一闪一闪的小亮片，像不像天上的星星掉下来陪你玩啦？",
                    "嘘——别吓跑它们。它们的小翅膀薄薄的，正在为好梦扇风呢。",
                    "来，咱们伸出手指，给它们指引回家的路。你看，它们是不是跟着你走啦？",
                    "哇！它们聚在你的手指尖啦，你现在也是一个会发光的‘小守护者’了呢。",
                    "萤火虫回草窝睡觉啦。咱们也闭上眼，把这份光亮带进梦里吧。晚安。"
                ];

                let rc, ctx, canvas;
                const initVisuals = () => {
                    canvas = document.getElementById('main-canvas');
                    ctx = canvas.getContext('2d');
                    rc = rough.canvas(canvas);
                    resize();
                    for (let i = 0; i < 15; i++) {
                        fireflies.value.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, seed: Math.random() * 100, following: false });
                    }
                    animate();
                };

                const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };

                const drawFirefly = (f, t) => {
                    const pulse = Math.sin(t * 3 + f.seed) * 0.5 + 0.5;
                    ctx.save(); ctx.translate(f.x, f.y);
                    ctx.globalAlpha = 0.3;
                    rc.ellipse(-5, -5, 15, 5, { fill: '#EEE' }); rc.ellipse(5, -5, 15, 5, { fill: '#EEE' });
                    ctx.globalAlpha = 0.8;
                    rc.ellipse(0, 0, 8, 12, { fill: '#333', fillStyle: 'solid' });
                    const glowSize = 10 + pulse * 25;
                    const gradient = ctx.createRadialGradient(0, 5, 0, 0, 5, glowSize);
                    gradient.addColorStop(0, `rgba(255, 235, 59, ${0.8 * pulse})`);
                    gradient.addColorStop(1, 'rgba(255, 235, 59, 0)');
                    ctx.fillStyle = gradient; ctx.beginPath(); ctx.arc(0, 5, glowSize, 0, Math.PI * 2); ctx.fill();
                    rc.circle(0, 5, 4, { fill: '#FFEB3B', stroke: 'none' });
                    ctx.restore();
                };

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const time = Date.now() * 0.001;
                    fireflies.value.forEach(f => {
                        const nX = Math.sin(time + f.seed) * 2; const nY = Math.cos(time * 0.7 + f.seed) * 2;
                        if (f.following) { f.x += (mouse.value.x - f.x) * 0.05 + nX; f.y += (mouse.value.y - f.y) * 0.05 + nY; }
                        else { f.x += nX; f.y += nY; }
                        if (f.x < -20) f.x = canvas.width + 20; if (f.x > canvas.width + 20) f.x = -20;
                        if (f.y < -20) f.y = canvas.height + 20; if (f.y > canvas.height + 20) f.y = -20;
                        drawFirefly(f, time);
                    });
                    requestAnimationFrame(animate);
                };

                const handleMove = (e) => {
                    const rect = canvas.getBoundingClientRect();
                    mouse.value.x = (e.clientX || e.touches?.[0].clientX) - rect.left;
                    mouse.value.y = (e.clientY || e.touches?.[0].clientY) - rect.top;
                    if (step.value === 3) {
                        fireflies.value.forEach(f => {
                            if (Math.hypot(f.x - mouse.value.x, f.y - mouse.value.y) < 150) f.following = true;
                        });
                        if (fireflies.value.filter(f => f.following).length >= 10) setTimeout(() => nextStage(), 2000);
                    }
                };

                const nextStage = () => {
                    step.value = Math.min(step.value + 1, 5);
                    window.eduNestRuntime?.dispatchLearningEvent('stage_change', { stageIndex: step.value, totalStages: 5 });
                };
                const reset = () => { step.value = 1; fireflies.value.forEach(f => f.following = false); };

                onMounted(() => {
                    initVisuals(); window.addEventListener('resize', resize);
                    canvas.addEventListener('mousemove', handleMove); canvas.addEventListener('touchmove', handleMove);
                });

                if (typeof window !== 'undefined') {
                    window.__eduNestUIStateProvider = function () {
                        return { stageIndex: step.value, totalStages: 5, currentStage: stages[step.value - 1].title };
                    };
                }

                return { step, stages, parentWords, nextStage, reset, handleAttract: () => { } };
            }
        }).mount('#app');
    </script>
</body>

</html>
