<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小猪的漂亮马甲</title>
    <!-- 核心技术栈，包含 fallback -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script>(function () { var g = "tailwind", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script>(function () { var g = "Vue", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script>(function () { var g = "gsap", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/rough.js'"></script>
    <script>(function () { var g = "rough", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/rough.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;700&display=swap');

        :root {
            --theme-color: #FF5252;
            --text-primary: #880E4F;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #FFF9C4;
            font-family: 'Noto Sans SC', sans-serif;
        }

        #main-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5vh 5vw;
        }

        .story-text-container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            transition: all 1s ease;
        }

        .stage-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 3.5rem;
            color: var(--text-primary);
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(255, 255, 255, 0.8);
        }

        .stage-content {
            font-size: 1.4rem;
            color: #AD1457;
            line-height: 1.8;
            padding: 10px 20px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.4), transparent);
            border-radius: 10px;
        }

        .parent-words {
            font-style: italic;
            color: #C2185B;
            font-size: 1.1rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(2px);
            padding: 10px;
            border-radius: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .action-area {
            text-align: center;
            pointer-events: auto;
        }

        .btn-action {
            background: var(--theme-color);
            color: white;
            padding: 18px 45px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 8px 25px rgba(255, 82, 82, 0.3);
        }

        .btn-action:hover {
            transform: scale(1.05) translateY(-5px);
            background: #D32F2F;
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.8s, transform 0.8s;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
            transform: translateY(10px);
        }
    </style>
</head>

<body>
    <canvas id="main-canvas"></canvas>

    <div id="app" class="ui-overlay">
        <!-- 顶部：亲子引导语 -->
        <transition name="fade" mode="out-in">
            <div :key="step" class="parent-words">🐷 [[ parentWords[step-1] ]]</div>
        </transition>

        <!-- 中间：故事情节 -->
        <transition name="fade" mode="out-in">
            <div :key="step" class="story-text-container">
                <h1 v-if="stages[step-1].title" class="stage-title">[[ stages[step-1].title ]]</h1>
                <p v-if="stages[step-1].content" class="stage-content">[[ stages[step-1].content ]]</p>
            </div>
        </transition>

        <!-- 底部核心交互 -->
        <div class="action-area">
            <button v-if="step === 2" @click="thinkIdea" class="btn-action">摸摸小猪的脑袋想个好主意 💡</button>
            <button v-else-if="step === 3" @click="openVest" class="btn-action">解开马甲，让小雀钻进来躲雨 🧣</button>
            <button v-else-if="step < 5" @click="nextStage" class="btn-action">看它们多暖和</button>
            <button v-else @click="reset" class="btn-action !bg-rose-900 !text-white">在暖融融的梦里睡吧</button>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            delimiters: ['[[', ']]'],
            setup() {
                const step = ref(1);
                const isOpened = ref(false);
                const isThinking = ref(false);

                const stages = [
                    { title: '亮眼的红马甲', content: '小猪嘟嘟穿着奶奶亲手织的红马甲，心里美滋滋的。这件马甲软绵绵的，像身上贴着个温润的小暖炉。嘟嘟快乐地在落叶堆里跳舞。' },
                    { title: '缩着脖子的小雀', content: '冷嗖嗖的秋风吹过，树上的小雀冻得缩起了脖子，羽毛都立了起来。嘟嘟停下脚步想：‘如果我的马甲能变大一点，分给小雀一点温暖就好了。’' },
                    { title: '温暖的避风港', content: '嘟嘟轻轻解开了马甲的扣子：‘嘿，小雀，快钻进来吧！’小雀高兴地飞了下来，钻进了红红的马甲怀抱。虽然马甲只有一件，但两个心跳在一起就不冷了。' },
                    { title: '心里的热气腾腾', content: '虽然外面的风还在呼呼地刮，但嘟嘟觉得身体里热气腾腾的，比自己穿马甲时还要暖和。原来，当你分给别人温暖时，你自己也会被照亮。' },
                    { title: '红色的摇篮梦', content: '金色的落叶给大地铺上了厚毯子。嘟嘟和小雀互相依偎着，被红马甲紧紧包裹，像睡在一个红色的摇篮里。晚安，善良的小宝贝。' }
                ];

                const parentWords = [
                    "宝贝，你看，嘟嘟的马甲真像一团跳动的小火苗。你最喜欢的朋友是谁呀？",
                    "嘘——小雀在发抖呢。如果你是嘟嘟，你会怎么帮这个冷得难受的小邻居？",
                    "哇！一件衣服能装下两个小伙伴的快乐。这种有商有量的陪伴，是不是世界上最感人的魔法？",
                    "分享不是失去了什么，而是让快乐翻了一倍。宝贝，你把玩具分给别人的时候，心里是不是也暖呼呼的？",
                    "故事讲完啦。红色的小马甲正守护着它们的美梦。咱们也闭上眼睛，去寻找梦里的彩虹。晚安。"
                ];

                let rc, ctx, canvas;
                const init = () => {
                    canvas = document.getElementById('main-canvas');
                    ctx = canvas.getContext('2d');
                    rc = rough.canvas(canvas);
                    resize(); animate();
                };
                const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };

                const drawPig = (x, y, scale, t, action = 'idle') => {
                    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
                    const bounce = Math.sin(t * 3) * 5;
                    // Body
                    rc.circle(0, bounce, 120, { fill: '#F8BBD0', fillStyle: 'hachure' });
                    // Ears
                    rc.polygon([[-60, -80 + bounce], [-90, -120 + bounce], [-30, -110 + bounce]], { fill: '#F06292', fillStyle: 'solid' });
                    rc.polygon([[60, -80 + bounce], [90, -120 + bounce], [30, -110 + bounce]], { fill: '#F06292', fillStyle: 'solid' });
                    // Eyes
                    rc.circle(-30, -20 + bounce, 6, { fill: '#333' }); rc.circle(30, -20 + bounce, 6, { fill: '#333' });
                    // Nose
                    rc.circle(0, 10 + bounce, 15, { fill: '#F06292', fillStyle: 'solid' });

                    // Vest
                    if (step.value >= 1) {
                        const vestW = isOpened.value ? 240 : 160;
                        rc.rectangle(-vestW / 2, 40 + bounce, vestW, 100, { fill: '#FF5252', fillStyle: 'solid' });
                        if (!isOpened.value) {
                            rc.line(0, 40 + bounce, 0, 140 + bounce, { stroke: '#FFF' });
                            rc.circle(0, 80 + bounce, 8, { fill: '#FFF' });
                        }
                    }
                    ctx.restore();
                };

                const drawBird = (x, y, scale, t) => {
                    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
                    const fly = Math.sin(t * 10) * 10;
                    rc.circle(0, fly, 30, { fill: '#81D4FA' });
                    rc.polygon([[20, 0 + fly], [40, -10 + fly], [40, 10 + fly]], { fill: '#FFB300' }); // Beak
                    ctx.restore();
                };

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    const t = Date.now() * 0.001;
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height * 0.65;

                    // Autumn Leaves
                    for (let i = 0; i < 3; i++) {
                        const ly = (t * 100 + i * 200) % canvas.height;
                        rc.circle(i * 300 + 100, ly, 15, { fill: '#FBC02D', opacity: 0.3 });
                    }

                    if (step.value === 1) {
                        drawPig(centerX, centerY, 1, t);
                    } else if (step.value === 2) {
                        drawPig(centerX - 120, centerY + 50, 0.9, t);
                        drawBird(centerX + 150, centerY - 100, 0.7, t);
                    } else if (step.value === 3) {
                        drawPig(centerX, centerY, 1.2, t);
                        if (isOpened.value) {
                            drawBird(centerX, centerY + 80, 0.5, t * 0.5);
                        }
                    } else if (step.value === 4) {
                        drawPig(centerX, centerY, 1.1, t);
                        drawBird(centerX, centerY + 80, 0.4, 0);
                        // Hearth
                        rc.circle(centerX, centerY - 100, 30 + Math.sin(t * 5) * 5, { fill: '#FF8A80', fillStyle: 'solid', opacity: 0.6 });
                    } else if (step.value === 5) {
                        drawPig(centerX - 100, centerY + 100, 0.7, 0);
                        rc.circle(canvas.width * 0.8, 150, 50, { fill: '#FFF176', fillStyle: 'solid' });
                    }

                    requestAnimationFrame(animate);
                };

                const thinkIdea = () => { isThinking.value = true; setTimeout(() => nextStage(), 1500); };
                const openVest = () => { isOpened.value = true; setTimeout(() => nextStage(), 1500); };
                const nextStage = () => { step.value++; window.eduNestRuntime?.dispatchLearningEvent('stage_change', { stageIndex: step.value, totalStages: 5 }); };
                const reset = () => { step.value = 1; isOpened.value = false; isThinking.value = false; };

                onMounted(() => { init(); window.addEventListener('resize', resize); });

                if (typeof window !== 'undefined') {
                    window.__eduNestUIStateProvider = () => ({ stageIndex: step.value, totalStages: 5, currentStage: stages[step.value - 1].title });
                }

                return { step, stages, parentWords, nextStage, thinkIdea, openVest, reset };
            }
        }).mount('#app');
    </script>
</body>

</html>
