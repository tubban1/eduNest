<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D英语单词学习</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
    
    #container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    /* 游戏UI */
    .game-ui {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 20px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      z-index: 10;
      text-align: center;
      min-width: 400px;
    }
    
    .game-ui h1 {
      font-size: 24px;
      color: #667eea;
      margin-bottom: 10px;
    }
    
    .current-word {
      font-size: 48px;
      font-weight: bold;
      color: #333;
      margin: 20px 0;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    
    .options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-top: 20px;
    }
    
    .options button {
      padding: 15px;
      border: 3px solid #667eea;
      background: white;
      color: #667eea;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    .options button:hover {
      background: #667eea;
      color: white;
      transform: scale(1.05);
    }
    
    .options button.correct {
      background: #4caf50 !important;
      border-color: #4caf50;
      color: white;
    }
    
    .options button.wrong {
      background: #f44336 !important;
      border-color: #f44336;
      color: white;
    }
    
    .score-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }
    
    .score-panel h3 {
      color: #667eea;
      margin-bottom: 10px;
    }
    
    .score-panel p {
      margin: 8px 0;
      font-size: 16px;
      color: #333;
    }
    
    .score-value {
      font-size: 32px;
      font-weight: bold;
      color: #4caf50;
    }
    
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #e0e0e0;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 10px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4caf50, #8bc34a);
      transition: width 0.3s;
    }
    
    /* 弹出提示 */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 30px 50px;
      border-radius: 15px;
      font-size: 24px;
      z-index: 1000;
      display: none;
    }
    
    .toast.show {
      display: block;
    }
    
    .toast.correct {
      background: rgba(76, 175, 80, 0.95);
    }
    
    .toast.wrong {
      background: rgba(244, 67, 54, 0.95);
    }
    
    /* 加载提示 */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 24px;
      z-index: 100;
    }
    
    .loading.hidden {
      display: none;
    }
  </style>
  
  <!-- Three.js 基础库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <!-- 加载提示 -->
  <div class="loading" id="loading">加载中...</div>
  
  <!-- 3D 容器 -->
  <div id="container"></div>
  
  <!-- 游戏UI -->
  <div class="game-ui" id="gameUI">
    <h1>📚 英语单词学习</h1>
    <div class="current-word" id="currentWord">Loading...</div>
    <div class="options" id="optionsContainer">
      <!-- 选项将通过 JavaScript 动态生成 -->
    </div>
  </div>
  
  <!-- 分数面板 -->
  <div class="score-panel" id="scorePanel">
    <h3>📊 游戏进度</h3>
    <p>得分: <span class="score-value" id="score">0</span></p>
    <p>正确: <span id="correct">0</span></p>
    <p>错误: <span id="wrong">0</span></p>
    <p>进度: <span id="progress">0/10</span></p>
    <div class="progress-bar">
      <div class="progress-fill" id="progressBar" style="width: 0%"></div>
    </div>
  </div>
  
  <!-- 弹出提示 -->
  <div class="toast" id="toast"></div>
  
  <script>
    const sceneData = (function(win) {
      'use strict';
      
    // 隐藏加载提示
    document.getElementById('loading').classList.add('hidden');
    
    // ==================== 游戏数据 ====================
    const wordDatabase = [
      { word: 'apple', meaning: '苹果', category: 'food' },
      { word: 'book', meaning: '书', category: 'object' },
      { word: 'cat', meaning: '猫', category: 'animal' },
      { word: 'dog', meaning: '狗', category: 'animal' },
      { word: 'elephant', meaning: '大象', category: 'animal' },
      { word: 'flower', meaning: '花', category: 'nature' },
      { word: 'house', meaning: '房子', category: 'building' },
      { word: 'water', meaning: '水', category: 'nature' },
      { word: 'school', meaning: '学校', category: 'building' },
      { word: 'moon', meaning: '月亮', category: 'nature' },
      { word: 'sun', meaning: '太阳', category: 'nature' },
      { word: 'star', meaning: '星星', category: 'nature' },
      { word: 'tree', meaning: '树', category: 'nature' },
      { word: 'bird', meaning: '鸟', category: 'animal' },
      { word: 'fish', meaning: '鱼', category: 'animal' }
    ];
    
    let currentWord = null;
    let options = [];
    let score = 0;
    let correct = 0;
    let wrong = 0;
    let totalAnswered = 0;
    let answeredWords = new Set();
    
    // ==================== 场景初始化 ====================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    const camera = new THREE.PerspectiveCamera(
      60, 
      win.innerWidth / win.innerHeight, 
      0.1, 
      1000
    );
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    
    renderer.setSize(win.innerWidth, win.innerHeight);
    renderer.setPixelRatio(win.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    document.getElementById('container').appendChild(renderer.domElement);
    
    camera.position.set(0, 5, 15);
    
    // ==================== 添加光照 ====================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(10, 20, 10);
    directionalLight.castShadow = true;
    scene.add(directionalLight);
    
    // ==================== 创建地面 ====================
    const groundGeometry = new THREE.PlaneGeometry(50, 50);
    const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x4caf50 });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);
    
    // 3D物体映射
    const objectMap = {
      apple: () => createApple(),
      book: () => createBook(),
      cat: () => createCat(),
      dog: () => createDog(),
      elephant: () => createElephant(),
      flower: () => createFlower(),
      house: () => createHouse(),
      water: () => createWater(),
      school: () => createSchool(),
      moon: () => createMoon(),
      sun: () => createSun(),
      star: () => createStar(),
      tree: () => createTree(),
      bird: () => createBird(),
      fish: () => createFish()
    };
    
    // ==================== 3D对象创建函数 ====================
    function createApple() {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(1, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0xff6b6b })
      );
      group.add(body);
      
      const leaf = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0x4caf50 })
      );
      leaf.position.set(0, 1.5, 0);
      leaf.scale.set(1, 3, 0.5);
      group.add(leaf);
      
      group.position.set(0, 1, 0);
      return group;
    }
    
    function createBook() {
      const group = new THREE.Group();
      const book = new THREE.Mesh(
        new THREE.BoxGeometry(1, 0.3, 1.5),
        new THREE.MeshStandardMaterial({ color: 0xff9800 })
      );
      group.add(book);
      group.position.set(0, 0.15, 0);
      return group;
    }
    
    function createCat() {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.8, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xff9800 })
      );
      group.add(body);
      
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xff9800 })
      );
      head.position.set(0, 1, 0);
      group.add(head);
      group.position.set(0, 0.8, 0);
      return group;
    }
    
    function createDog() {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1, 0.8, 1.2),
        new THREE.MeshStandardMaterial({ color: 0x8b4513 })
      );
      group.add(body);
      
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0x8b4513 })
      );
      head.position.set(0, 0.7, 0.6);
      group.add(head);
      group.position.set(0, 0.5, 0);
      return group;
    }
    
    function createElephant() {
      const group = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(2, 1.5, 2),
        new THREE.MeshStandardMaterial({ color: 0xcccccc })
      );
      group.add(body);
      
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.1, 0.1, 1.5, 16),
        new THREE.MeshStandardMaterial({ color: 0xcccccc })
      );
      trunk.rotation.x = Math.PI / 2;
      trunk.position.set(0, 1, 1.5);
      group.add(trunk);
      group.position.set(0, 0.75, 0);
      return group;
    }
    
    function createFlower() {
      const group = new THREE.Group();
      
      for (let i = 0; i < 5; i++) {
        const petal = new THREE.Mesh(
          new THREE.SphereGeometry(0.3, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0xff69b4 })
        );
        petal.position.set(
          Math.cos(i * Math.PI * 2 / 5) * 0.5,
          0.5,
          Math.sin(i * Math.PI * 2 / 5) * 0.5
        );
        petal.scale.set(1, 1, 0.3);
        group.add(petal);
      }
      
      const center = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xffff00 })
      );
      center.position.y = 0.5;
      group.add(center);
      
      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 1, 16),
        new THREE.MeshStandardMaterial({ color: 0x228b22 })
      );
      group.add(stem);
      group.position.set(0, 0.5, 0);
      return group;
    }
    
    function createHouse() {
      const group = new THREE.Group();
      
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(2, 1.5, 2),
        new THREE.MeshStandardMaterial({ color: 0xd4a574 })
      );
      group.add(base);
      
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(2, 1.5, 4),
        new THREE.MeshStandardMaterial({ color: 0x8b0000 })
      );
      roof.position.y = 1.25;
      roof.rotation.y = Math.PI / 4;
      group.add(roof);
      
      group.position.set(0, 0.75, 0);
      return group;
    }
    
    function createWater() {
      const group = new THREE.Group();
      const water = new THREE.Mesh(
        new THREE.BoxGeometry(3, 0.2, 3),
        new THREE.MeshStandardMaterial({ 
          color: 0x2196f3,
          transparent: true,
          opacity: 0.6
        })
      );
      group.add(water);
      group.position.set(0, 0.1, 0);
      return group;
    }
    
    function createSchool() {
      const group = new THREE.Group();
      const building = new THREE.Mesh(
        new THREE.BoxGeometry(3, 2, 3),
        new THREE.MeshStandardMaterial({ color: 0xffd700 })
      );
      group.add(building);
      group.position.set(0, 1, 0);
      return group;
    }
    
    function createMoon() {
      const group = new THREE.Group();
      const moon = new THREE.Mesh(
        new THREE.SphereGeometry(1.5, 32, 32),
        new THREE.MeshStandardMaterial({ 
          color: 0xcccccc,
          emissive: 0x888888,
          emissiveIntensity: 0.3
        })
      );
      group.add(moon);
      group.position.set(0, 2, 0);
      return group;
    }
    
    function createSun() {
      const group = new THREE.Group();
      const sun = new THREE.Mesh(
        new THREE.SphereGeometry(2, 32, 32),
        new THREE.MeshStandardMaterial({ 
          color: 0xffd700,
          emissive: 0xffd700,
          emissiveIntensity: 0.8
        })
      );
      group.add(sun);
      group.position.set(0, 2, 0);
      return group;
    }
    
    function createStar() {
      const group = new THREE.Group();
      
      // 五角星形状
      for (let i = 0; i < 5; i++) {
        const point = new THREE.Mesh(
          new THREE.ConeGeometry(0.1, 0.8, 3),
          new THREE.MeshStandardMaterial({ color: 0xffd700 })
        );
        point.position.set(
          Math.cos(i * Math.PI * 2 / 5) * 0.3,
          0,
          Math.sin(i * Math.PI * 2 / 5) * 0.3
        );
        point.rotation.z = i * Math.PI * 2 / 5;
        group.add(point);
      }
      
      const center = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xffaa00 })
      );
      group.add(center);
      group.position.set(0, 1, 0);
      return group;
    }
    
    function createTree() {
      const group = new THREE.Group();
      
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.3, 2, 16),
        new THREE.MeshStandardMaterial({ color: 0x8b4513 })
      );
      group.add(trunk);
      
      const foliage = new THREE.Mesh(
        new THREE.ConeGeometry(1.5, 2, 16),
        new THREE.MeshStandardMaterial({ color: 0x228b22 })
      );
      foliage.position.y = 1.5;
      group.add(foliage);
      
      group.position.set(0, 1, 0);
      return group;
    }
    
    function createBird() {
      const group = new THREE.Group();
      
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xff6b00 })
      );
      group.add(body);
      
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0xff6b00 })
      );
      head.position.set(0, 0.3, 0.3);
      group.add(head);
      
      group.position.set(0, 2, 0);
      return group;
    }
    
    function createFish() {
      const group = new THREE.Group();
      const fish = new THREE.Mesh(
        new THREE.ConeGeometry(0.5, 1, 3),
        new THREE.MeshStandardMaterial({ color: 0x00bcd4 })
      );
      fish.rotation.x = Math.PI / 2;
      group.add(fish);
      group.position.set(0, 0.5, 0);
      return group;
    }
    
    // ==================== 游戏逻辑 ====================
    let current3DObject = null;
    
    function loadNewWord() {
      // 选择未回答的单词
      const availableWords = wordDatabase.filter(w => !answeredWords.has(w.word));
      if (availableWords.length === 0) {
        showToast('🎉 恭喜完成所有题目！', 'correct');
        setTimeout(() => {
          resetGame();
        }, 2000);
        return;
      }
      
      currentWord = availableWords[Math.floor(Math.random() * availableWords.length)];
      
      // 生成选项
      const wrongAnswers = wordDatabase
        .filter(w => w.word !== currentWord.word)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);
      
      options = [currentWord, ...wrongAnswers].sort(() => Math.random() - 0.5);
      
      // 更新UI
      updateUI();
    }
    
    function updateUI() {
      document.getElementById('currentWord').textContent = currentWord.word;
      
      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';
      
      options.forEach((option, index) => {
        const button = document.createElement('button');
        button.textContent = option.meaning;
        button.onclick = () => checkAnswer(index);
        optionsContainer.appendChild(button);
      });
      
      // 显示3D对象
      if (current3DObject) {
        scene.remove(current3DObject);
      }
      
      const createObject = objectMap[currentWord.word];
      if (createObject) {
        current3DObject = createObject();
        scene.add(current3DObject);
      }
    }
    
    function checkAnswer(selectedIndex) {
      const selected = options[selectedIndex];
      const isCorrect = selected.word === currentWord.word;
      
      totalAnswered++;
      
      if (isCorrect) {
        score += 10;
        correct++;
        showToast('✓ 正确！', 'correct');
        updateScore();
      } else {
        wrong++;
        showToast('✗ 错误！', 'wrong');
        updateScore();
      }
      
      answeredWords.add(currentWord.word);
      
      setTimeout(() => {
        if (totalAnswered >= 10) {
          showToast(`游戏结束！得分: ${score}`, 'correct');
          setTimeout(() => resetGame(), 3000);
        } else {
          loadNewWord();
        }
      }, 1000);
    }
    
    function updateScore() {
      document.getElementById('score').textContent = score;
      document.getElementById('correct').textContent = correct;
      document.getElementById('wrong').textContent = wrong;
      document.getElementById('progress').textContent = `${totalAnswered}/10`;
      document.getElementById('progressBar').style.width = `${(totalAnswered / 10) * 100}%`;
    }
    
    function showToast(message, type) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      
      setTimeout(() => {
        toast.className = 'toast';
      }, 1500);
    }
    
    function resetGame() {
      score = 0;
      correct = 0;
      wrong = 0;
      totalAnswered = 0;
      answeredWords.clear();
      if (current3DObject) {
        scene.remove(current3DObject);
        current3DObject = null;
      }
      updateScore();
      loadNewWord();
    }
    
    // ==================== 添加控制器 ====================
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.minDistance = 8;
    controls.maxDistance = 20;
    
    // ==================== 动画循环 ====================
    function animate() {
      requestAnimationFrame(animate);
      
      controls.update();
      
      // 旋转当前对象
      if (current3DObject) {
        current3DObject.rotation.y += 0.01;
      }
      
      renderer.render(scene, camera);
    }
    
    animate();
    
    // 初始化游戏
    loadNewWord();
    
    // 返回场景数据
    return { camera, renderer, controls };
    })(window);
    
    // 保存到全局
    window.sceneData = sceneData;
    
    // ==================== 窗口大小调整 ====================
    window.addEventListener('resize', () => {
      if (window.sceneData) {
        window.sceneData.camera.aspect = window.innerWidth / window.innerHeight;
        window.sceneData.camera.updateProjectionMatrix();
        window.sceneData.renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
    
    // ==================== 控制台信息 ====================
    console.log('🎮 3D 英语单词学习游戏已初始化');
  </script>
</body>
</html>
