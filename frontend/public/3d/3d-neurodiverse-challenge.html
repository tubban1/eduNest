<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 注意力与序列挑战</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: linear-gradient(135deg, #0b1020 0%, #17223b 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
    #container { width: 100%; height: 100%; position: relative; }

    /* 顶部HUD */
    .hud { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.95); padding: 14px 18px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); z-index: 10; min-width: 420px; text-align: center; }
    .hud h1 { font-size: 18px; color: #17223b; }
    .hud .meta { display: flex; gap: 16px; justify-content: center; margin-top: 6px; color: #333; font-size: 14px; }

    /* 侧边设置面板 */
    .panel { position: absolute; right: 16px; top: 16px; background: rgba(255,255,255,0.95); padding: 12px 14px; border-radius: 12px; z-index: 10; width: 280px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
    .panel h3 { color: #17223b; margin-bottom: 8px; font-size: 16px; }
    .panel .row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; font-size: 14px; color: #333; }
    .panel button, .panel select { padding: 8px 10px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; color: #17223b; cursor: pointer; }
    .panel button.primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }

    /* Toast 提示 */
    .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: #fff; padding: 18px 26px; border-radius: 12px; font-size: 20px; z-index: 1000; display: none; }
    .toast.show { display: block; }
    .toast.good { background: rgba(34,197,94,0.95); }
    .toast.warn { background: rgba(234,179,8,0.95); }
    .toast.bad { background: rgba(239,68,68,0.95); }

    /* 屏幕底部引导 */
    .guide { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #fff; padding: 8px 12px; border-radius: 10px; z-index: 10; font-size: 14px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="container"></div>

  <div class="hud">
    <h1>🧠 注意力与序列挑战</h1>
    <div class="meta">
      <div>关卡：<span id="level">1</span></div>
      <div>分数：<span id="score">0</span></div>
      <div>剩余时间：<span id="timeLeft">60</span>s</div>
    </div>
  </div>

  <div class="panel">
    <h3>设置与辅助</h3>
    <div class="row"><span>难度</span>
      <select id="difficulty">
        <option value="easy">简单</option>
        <option value="normal" selected>适中</option>
        <option value="hard">困难</option>
      </select>
    </div>
    <div class="row"><span>感官友好模式</span>
      <button id="sensoryToggle">关闭</button>
    </div>
    <div class="row"><span>开始/重开</span>
      <button class="primary" id="restartBtn">开始</button>
    </div>
    <div class="row"><span>提示次数</span>
      <span id="hints">3</span></div>
    <div class="row"><span>当前序列长度</span>
      <span id="seqLen">3</span></div>
  </div>

  <div class="guide">提示：观察中央平台的发光图形顺序，然后按相同顺序前往对应图形的平台并站立确认。</div>

  <div class="toast" id="toast"></div>

  <script>
  (function(win){
    'use strict';

    // 场景基础
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1020);
    const camera = new THREE.PerspectiveCamera(60, win.innerWidth / win.innerHeight, 0.1, 1000);
    camera.position.set(0, 8, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(win.innerWidth, win.innerHeight);
    renderer.setPixelRatio(win.devicePixelRatio);
    document.getElementById('container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.05;
    controls.enableZoom = true; controls.minDistance = 8; controls.maxDistance = 30;

    // 光照
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dir = new THREE.DirectionalLight(0xffffff, 0.9); dir.position.set(10, 15, 10); scene.add(dir);

    // 地面与平台
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 }));
    ground.rotation.x = -Math.PI/2; ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);

    // 中央展示台
    const centerPedestal = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 0.6, 32), new THREE.MeshStandardMaterial({ color: 0x1f2937, metalness: 0.1, roughness: 0.8 }));
    centerPedestal.position.set(0, 0.3, 0); scene.add(centerPedestal);

    // 四周目标平台
    const targetPlatforms = [];
    const platformPositions = [
      new THREE.Vector3(-8, 0.3, 0), // 左
      new THREE.Vector3(8, 0.3, 0),  // 右
      new THREE.Vector3(0, 0.3, -8), // 前
      new THREE.Vector3(0, 0.3, 8)   // 后
    ];
    const platformColors = [0x60a5fa, 0xfbbf24, 0x34d399, 0xf87171];
    for (let i = 0; i < 4; i++) {
      const p = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 0.5, 24), new THREE.MeshStandardMaterial({ color: 0x111827 }));
      p.position.copy(platformPositions[i]);
      p.userData = { index: i };
      scene.add(p); targetPlatforms.push(p);
    }

    // 几何图形（作为序列项目）：圆、方、三角、星
    function createSymbolMesh(kind, color){
      switch(kind){
        case 'circle': return new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.2, 48), new THREE.MeshStandardMaterial({ color }));
        case 'square': return new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.2, 1.6), new THREE.MeshStandardMaterial({ color }));
        case 'triangle': {
          const geo = new THREE.ConeGeometry(1.2, 0.3, 3); const m = new THREE.MeshStandardMaterial({ color }); const mesh = new THREE.Mesh(geo, m); mesh.rotation.x = Math.PI/2; return mesh;
        }
        case 'star': {
          const group = new THREE.Group();
          for(let i=0;i<5;i++){ const wing = new THREE.ConeGeometry(0.5, 0.3, 5); const mm = new THREE.MeshStandardMaterial({ color }); const w = new THREE.Mesh(wing, mm); w.position.set(Math.cos(i*2*Math.PI/5)*0.9, 0.12, Math.sin(i*2*Math.PI/5)*0.9); w.rotation.x = Math.PI/2; group.add(w);} 
          return group;
        }
      }
    }
    const symbolKinds = ['circle','square','triangle','star'];

    // UI 引用
    const $level = document.getElementById('level');
    const $score = document.getElementById('score');
    const $timeLeft = document.getElementById('timeLeft');
    const $difficulty = document.getElementById('difficulty');
    const $sensory = document.getElementById('sensoryToggle');
    const $restart = document.getElementById('restartBtn');
    const $hints = document.getElementById('hints');
    const $seqLen = document.getElementById('seqLen');
    const $toast = document.getElementById('toast');

    // 状态
    let level = 1, score = 0, timeLeft = 60, timerId = null;
    let sensoryFriendly = false; // 降低对比/动画速度、关闭闪烁
    let sequence = []; // 如：['square', 'circle', ...]
    let sequencePlatforms = []; // 对应平台索引
    let showIndex = 0; // 正在展示到第几步
    let inputIndex = 0; // 玩家当前需要输入的步数
    let hintsLeft = 3;

    function toast(msg, type='good'){ $toast.textContent = msg; $toast.className = `toast ${type} show`; setTimeout(()=>{ $toast.className = 'toast'; }, 900); }

    function resetSceneSymbols(){
      // 清理旧的symbol
      [...centerPedestal.children].forEach(c => centerPedestal.remove(c));
      targetPlatforms.forEach(p => { [...p.children].forEach(c => p.remove(c)); p.material.color.setHex(0x111827); });
    }

    function genSequence(len){
      sequence = []; sequencePlatforms = [];
      for(let i=0;i<len;i++){
        const kind = symbolKinds[Math.floor(Math.random()*symbolKinds.length)];
        const platformIdx = Math.floor(Math.random()*targetPlatforms.length);
        sequence.push(kind); sequencePlatforms.push(platformIdx);
      }
      $seqLen.textContent = String(len);
    }

    function placeSymbols(){
      resetSceneSymbols();
      // 在目标平台放置对应symbol（作为玩家导航目标）
      for(let i=0;i<sequence.length;i++){
        const color = platformColors[sequencePlatforms[i]];
        const mesh = createSymbolMesh(sequence[i], color);
        mesh.position.y = 0.26;
        targetPlatforms[sequencePlatforms[i]].add(mesh);
      }
      // 中台放置当前展示symbol
      const preview = createSymbolMesh(sequence[0], 0xffffff);
      preview.position.y = 0.45; centerPedestal.add(preview);
    }

    async function showSequence(){
      // 在中台按顺序高亮展示
      showIndex = 0;
      const speed = sensoryFriendly ? 900 : ($difficulty.value==='hard'? 450 : $difficulty.value==='normal'? 650 : 800);
      const intensity = sensoryFriendly ? 0.35 : 0.6;
      while(showIndex < sequence.length){
        const kind = sequence[showIndex];
        // 切换中台图形
        [...centerPedestal.children].forEach(c => centerPedestal.remove(c));
        const color = 0xffffff;
        const m = createSymbolMesh(kind, color); m.position.y = 0.45; centerPedestal.add(m);
        // 高亮对应平台
        const pIdx = sequencePlatforms[showIndex];
        targetPlatforms[pIdx].material.emissive = new THREE.Color(platformColors[pIdx]);
        targetPlatforms[pIdx].material.emissiveIntensity = intensity;
        await wait(speed);
        targetPlatforms[pIdx].material.emissiveIntensity = 0;
        showIndex++;
      }
      inputIndex = 0;
      toast('请按顺序前往对应平台！','warn');
    }

    function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

    // 玩家球（用于路径导航）
    const player = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 24), new THREE.MeshStandardMaterial({ color: 0x93c5fd }));
    player.position.set(0, 0.5, 12); scene.add(player);

    // 控制移动（键盘）
    const keys = { w:false, a:false, s:false, d:false };
    win.addEventListener('keydown', e=>{ if(keys.hasOwnProperty(e.key)) keys[e.key]=true; if(e.key==='W') keys.w=true; if(e.key==='A') keys.a=true; if(e.key==='S') keys.s=true; if(e.key==='D') keys.d=true; });
    win.addEventListener('keyup', e=>{ if(keys.hasOwnProperty(e.key)) keys[e.key]=false; if(e.key==='W') keys.w=false; if(e.key==='A') keys.a=false; if(e.key==='S') keys.s=false; if(e.key==='D') keys.d=false; });

    function updatePlayer(dt){
      const speed = ($difficulty.value==='hard'? 7 : $difficulty.value==='normal'? 6 : 5) * (sensoryFriendly? 0.8:1);
      const vx = (keys.d - keys.a) * speed * dt;
      const vz = (keys.s - keys.w) * speed * dt;
      player.position.x += vx; player.position.z += vz;
      // 边界限制
      player.position.x = THREE.MathUtils.clamp(player.position.x, -20, 20);
      player.position.z = THREE.MathUtils.clamp(player.position.z, -20, 20);
      // 碰撞检测：到达正确平台
      if(sequence.length>0 && inputIndex < sequence.length){
        const pIdx = sequencePlatforms[inputIndex];
        const targetPos = targetPlatforms[pIdx].position;
        const d = player.position.distanceTo(targetPos);
        if(d < 1.8){ // 认为到达
          // 给予反馈
          targetPlatforms[pIdx].material.emissive = new THREE.Color(platformColors[pIdx]);
          targetPlatforms[pIdx].material.emissiveIntensity = 0.7;
          setTimeout(()=>{ targetPlatforms[pIdx].material.emissiveIntensity = 0; }, 200);
          inputIndex++;
          score += 10; $score.textContent = score;
          if(inputIndex === sequence.length){
            toast('完成序列！+时间奖励','good');
            timeLeft += 6; // 完成加时
            nextLevel();
          }
        }
      }
    }

    function nextLevel(){
      level += 1; $level.textContent = level;
      const len = Math.min(3 + level, 10); // 序列长度递增
      genSequence(len); placeSymbols(); showSequence();
    }

    function startGame(){
      // 初始化状态
      level = 1; score = 0; timeLeft = 60; hintsLeft = 3;
      $level.textContent = level; $score.textContent = score; $timeLeft.textContent = timeLeft; $hints.textContent = hintsLeft;
      genSequence(3); placeSymbols(); showSequence();
      clearInterval(timerId);
      timerId = setInterval(()=>{ timeLeft -= 1; $timeLeft.textContent = timeLeft; if(timeLeft<=0){ clearInterval(timerId); toast('时间到！','bad'); } }, 1000);
    }

    // 提示：重复当前剩余序列中的下一步
    function useHint(){
      if(hintsLeft<=0) return;
      hintsLeft -= 1; $hints.textContent = hintsLeft;
      const idx = inputIndex;
      if(idx < sequence.length){
        const pIdx = sequencePlatforms[idx];
        targetPlatforms[pIdx].material.emissive = new THREE.Color(platformColors[pIdx]);
        targetPlatforms[pIdx].material.emissiveIntensity = 0.8;
        setTimeout(()=>{ targetPlatforms[pIdx].material.emissiveIntensity = 0; }, 450);
      }
    }

    // 感官友好：降低对比与动画速度、去除闪烁
    function toggleSensory(){
      sensoryFriendly = !sensoryFriendly;
      $sensory.textContent = sensoryFriendly? '开启' : '关闭';
      const bg = sensoryFriendly? new THREE.Color(0x0d1326) : new THREE.Color(0x0b1020);
      scene.background = bg; ground.material.color.setHex(sensoryFriendly? 0x111827 : 0x0f172a);
    }

    // 绑定UI
    $restart.onclick = startGame;
    $sensory.onclick = toggleSensory;
    // 双击面板提示即为hint
    document.querySelector('.guide').ondblclick = useHint;

    // 主循环
    let last = performance.now();
    function animate(){
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min(0.05, (now - last)/1000); last = now;
      controls.update();
      updatePlayer(dt);
      renderer.render(scene, camera);
    }

    animate();
  })(window);
  </script>
</body>
</html>
