<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆 - 初中数学教学</title>
    <meta name="description" content="学习圆的基本概念，理解半径、直径、弦、弧、扇形的含义，掌握圆的周长和面积计算公式，了解圆周率的直观来源，认识圆心角和内接角的关系。">
    <meta name="keywords" content="圆,半径,直径,弦,弧,扇形,周长,面积,圆周率,圆心角,内接角,初中数学">
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" 
          onerror="this.onerror=null; this.href='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.css'">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.2em;
        }
        
        .section {
            margin-bottom: 50px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .concept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .concept-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .concept-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .concept-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .canvas-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 500px;
            background: #f8f9fa;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            background: #667eea;
            color: white;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .info-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .info-item {
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }
        
        .info-item strong {
            color: #667eea;
            margin-right: 10px;
        }
        
        .slider-container {
            margin: 15px 0;
        }
        
        .slider-container label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #667eea;
        }
        
        .slider-container input[type="range"] {
            width: 100%;
            max-width: 400px;
        }
        
        .calculator {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .calculator h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .input-group {
            margin: 15px 0;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }
        
        .input-group input {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 16px;
            width: 200px;
        }
        
        .result {
            margin-top: 15px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 5px;
            border-left: 4px solid #2196f3;
        }
        
        .result strong {
            color: #1976d2;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <!-- Vue 3.5.20 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    
    <!-- Konva -->
    <script src="https://cdn.jsdelivr.net/npm/konva@10.0.12/konva.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/konva.min.js'"></script>
    
    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    
    <!-- KaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.auto-render.min.js'"></script>
    
    <script>
        const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;
        
        createApp({
            setup() {
                // 画布引用
                const basicCircleStage = ref(null);
                const basicCircleLayer = ref(null);
                const radiusAnimStage = ref(null);
                const radiusAnimLayer = ref(null);
                const sectorStage = ref(null);
                const sectorLayer = ref(null);
                const piStage = ref(null);
                const piLayer = ref(null);
                const angleStage = ref(null);
                const angleLayer = ref(null);
                
                // 圆的基本参数
                const circleRadius = ref(100);
                const centerX = ref(250);
                const centerY = ref(250);
                
                // 半径动画控制
                const animatingRadius = ref(false);
                
                // 扇形参数
                const sectorAngle = ref(90); // 角度
                const sectorRadius = ref(120);
                const sectorExpanded = ref(false);
                
                // 圆周率演示
                const piSegments = ref(12); // 正多边形边数
                
                // 圆心角和内接角
                const centralAngle = ref(60); // 圆心角（度）
                
                // 计算工具
                const calcRadius = ref(10);
                const calcAngle = ref(90);
                
                // 周长计算
                const circumference = computed(() => {
                    return 2 * Math.PI * calcRadius.value;
                });
                
                // 面积计算
                const area = computed(() => {
                    return Math.PI * calcRadius.value * calcRadius.value;
                });
                
                // 弧长计算
                const arcLength = computed(() => {
                    return (calcAngle.value / 360) * circumference.value;
                });
                
                // 扇形面积计算
                const sectorArea = computed(() => {
                    return (calcAngle.value / 360) * area.value;
                });
                
                // 绘制基本圆元素
                function drawBasicCircle() {
                    if (!basicCircleLayer.value) return;
                    
                    basicCircleLayer.value.destroyChildren();
                    
                    const width = basicCircleStage.value.width();
                    const height = basicCircleStage.value.height();
                    const cx = width / 2;
                    const cy = height / 2;
                    const r = 120;
                    
                    // 绘制圆
                    const circle = new Konva.Circle({
                        x: cx,
                        y: cy,
                        radius: r,
                        fill: 'rgba(102, 126, 234, 0.1)',
                        stroke: '#667eea',
                        strokeWidth: 3
                    });
                    basicCircleLayer.value.add(circle);
                    
                    // 圆心
                    const center = new Konva.Circle({
                        x: cx,
                        y: cy,
                        radius: 5,
                        fill: '#ff5722',
                        stroke: '#fff',
                        strokeWidth: 2
                    });
                    basicCircleLayer.value.add(center);
                    const centerLabel = new Konva.Text({
                        x: cx - 20,
                        y: cy + 15,
                        text: 'O',
                        fontSize: 18,
                        fill: '#ff5722',
                        fontStyle: 'bold'
                    });
                    basicCircleLayer.value.add(centerLabel);
                    
                    // 半径
                    const radiusLine = new Konva.Line({
                        points: [cx, cy, cx + r, cy],
                        stroke: '#4caf50',
                        strokeWidth: 2,
                        dash: [5, 5]
                    });
                    basicCircleLayer.value.add(radiusLine);
                    const radiusLabel = new Konva.Text({
                        x: cx + r / 2 - 15,
                        y: cy - 25,
                        text: 'r',
                        fontSize: 16,
                        fill: '#4caf50',
                        fontStyle: 'bold',
                        padding: 3,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 3
                    });
                    basicCircleLayer.value.add(radiusLabel);
                    
                    // 直径
                    const diameterLine = new Konva.Line({
                        points: [cx - r, cy, cx + r, cy],
                        stroke: '#f57c00',
                        strokeWidth: 2
                    });
                    basicCircleLayer.value.add(diameterLine);
                    const diameterLabel = new Konva.Text({
                        x: cx - 10,
                        y: cy + 25,
                        text: 'd = 2r',
                        fontSize: 14,
                        fill: '#f57c00',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 5
                    });
                    basicCircleLayer.value.add(diameterLabel);
                    
                    // 弦
                    const chordStartX = cx - r * 0.7;
                    const chordStartY = cy + r * 0.7;
                    const chordEndX = cx + r * 0.7;
                    const chordEndY = cy + r * 0.7;
                    const chordLine = new Konva.Line({
                        points: [chordStartX, chordStartY, chordEndX, chordEndY],
                        stroke: '#9c27b0',
                        strokeWidth: 3
                    });
                    basicCircleLayer.value.add(chordLine);
                    const chordLabel = new Konva.Text({
                        x: cx - 20,
                        y: cy + r + 30,
                        text: '弦',
                        fontSize: 14,
                        fill: '#9c27b0',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 5
                    });
                    basicCircleLayer.value.add(chordLabel);
                    
                    // 弧（标注）
                    const arcStartAngle = Math.atan2(chordStartY - cy, chordStartX - cx);
                    const arcEndAngle = Math.atan2(chordEndY - cy, chordEndX - cx);
                    const arcPath = new Konva.Arc({
                        x: cx,
                        y: cy,
                        innerRadius: r - 30,
                        outerRadius: r - 20,
                        angle: (arcEndAngle - arcStartAngle) * 180 / Math.PI,
                        rotation: arcStartAngle * 180 / Math.PI,
                        fill: 'rgba(156, 39, 176, 0.3)',
                        stroke: '#9c27b0',
                        strokeWidth: 2
                    });
                    basicCircleLayer.value.add(arcPath);
                    const arcLabel = new Konva.Text({
                        x: cx + 30,
                        y: cy + r - 50,
                        text: '弧',
                        fontSize: 14,
                        fill: '#9c27b0',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 5
                    });
                    basicCircleLayer.value.add(arcLabel);
                    
                    // 扇形
                    const sectorAngleRad = 60 * Math.PI / 180;
                    const sectorStartAngle = -Math.PI / 2;
                    const sectorPath = new Konva.Wedge({
                        x: cx - 150,
                        y: cy,
                        radius: 80,
                        angle: 60,
                        rotation: -90,
                        fill: 'rgba(255, 152, 0, 0.4)',
                        stroke: '#ff9800',
                        strokeWidth: 2
                    });
                    basicCircleLayer.value.add(sectorPath);
                    const sectorLabel = new Konva.Text({
                        x: cx - 150 - 30,
                        y: cy + 30,
                        text: '扇形',
                        fontSize: 14,
                        fill: '#ff9800',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 5
                    });
                    basicCircleLayer.value.add(sectorLabel);
                    
                    basicCircleLayer.value.draw();
                }
                
                // 半径变化动画
                function animateRadius() {
                    if (animatingRadius.value) return;
                    animatingRadius.value = true;
                    
                    if (!radiusAnimLayer.value) return;
                    
                    const width = radiusAnimStage.value.width();
                    const height = radiusAnimStage.value.height();
                    const cx = width / 2;
                    const cy = height / 2;
                    
                    radiusAnimLayer.value.destroyChildren();
                    
                    const circle = new Konva.Circle({
                        x: cx,
                        y: cy,
                        radius: 50,
                        fill: 'rgba(102, 126, 234, 0.2)',
                        stroke: '#667eea',
                        strokeWidth: 3,
                        name: 'circle'
                    });
                    radiusAnimLayer.value.add(circle);
                    
                    const radiusLine = new Konva.Line({
                        points: [cx, cy, cx + 50, cy],
                        stroke: '#4caf50',
                        strokeWidth: 3,
                        name: 'radius'
                    });
                    radiusAnimLayer.value.add(radiusLine);
                    
                    const radiusLabel = new Konva.Text({
                        x: cx + 30,
                        y: cy - 30,
                        text: 'r = 50',
                        fontSize: 16,
                        fill: '#4caf50',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 5,
                        name: 'radiusLabel'
                    });
                    radiusAnimLayer.value.add(radiusLabel);
                    
                    radiusAnimLayer.value.draw();
                    
                    // 动画：半径从小到大再变小
                    if (typeof gsap !== 'undefined') {
                        const tl = gsap.timeline({ repeat: -1, yoyo: true, ease: 'power2.inOut' });
                        tl.to(circle, {
                            radius: 150,
                            duration: 2,
                            onUpdate: () => {
                                const r = circle.radius();
                                radiusLine.points([cx, cy, cx + r, cy]);
                                radiusLabel.text(`r = ${r.toFixed(0)}`);
                                radiusAnimLayer.value.draw();
                            }
                        });
                    }
                }
                
                // 扇形展开动画
                function expandSector() {
                    if (sectorExpanded.value) return;
                    sectorExpanded.value = true;
                    
                    if (!sectorLayer.value) return;
                    
                    const width = sectorStage.value.width();
                    const height = sectorStage.value.height();
                    const cx = width / 2;
                    const cy = height / 2;
                    const r = sectorRadius.value;
                    const angle = sectorAngle.value;
                    
                    sectorLayer.value.destroyChildren();
                    
                    // 原始扇形
                    const originalSector = new Konva.Wedge({
                        x: cx - 150,
                        y: cy,
                        radius: r,
                        angle: angle,
                        rotation: -90,
                        fill: 'rgba(255, 152, 0, 0.4)',
                        stroke: '#ff9800',
                        strokeWidth: 2
                    });
                    sectorLayer.value.add(originalSector);
                    
                    // 展开后的扇形（扁平）
                    const expandedSector = new Konva.Group({
                        x: cx + 150,
                        y: cy,
                        opacity: 0,
                        name: 'expanded'
                    });
                    
                    // 弧长线条
                    const arcLengthLine = new Konva.Line({
                        points: [0, 0, (angle / 360) * 2 * Math.PI * r, 0],
                        stroke: '#ff9800',
                        strokeWidth: 3,
                        name: 'arcLength'
                    });
                    expandedSector.add(arcLengthLine);
                    
                    // 半径线条
                    const r1 = new Konva.Line({
                        points: [0, 0, 0, -r],
                        stroke: '#4caf50',
                        strokeWidth: 2,
                        dash: [5, 5],
                        name: 'radius1'
                    });
                    expandedSector.add(r1);
                    
                    const r2 = new Konva.Line({
                        points: [(angle / 360) * 2 * Math.PI * r, 0, (angle / 360) * 2 * Math.PI * r, -r],
                        stroke: '#4caf50',
                        strokeWidth: 2,
                        dash: [5, 5],
                        name: 'radius2'
                    });
                    expandedSector.add(r2);
                    
                    // 标签
                    const arcLengthLabel = new Konva.Text({
                        x: (angle / 360) * Math.PI * r - 40,
                        y: 20,
                        text: `弧长 = ${((angle / 360) * 2 * Math.PI * r).toFixed(1)}`,
                        fontSize: 14,
                        fill: '#ff9800',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 5
                    });
                    expandedSector.add(arcLengthLabel);
                    
                    const angleLabel = new Konva.Text({
                        x: -20,
                        y: -r - 25,
                        text: `${angle}°`,
                        fontSize: 14,
                        fill: '#667eea',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 5
                    });
                    expandedSector.add(angleLabel);
                    
                    sectorLayer.value.add(expandedSector);
                    
                    if (typeof gsap !== 'undefined') {
                        // 展开动画
                        gsap.to(expandedSector, {
                            opacity: 1,
                            duration: 1,
                            ease: 'power2.out'
                        });
                    }
                    
                    sectorLayer.value.draw();
                }
                
                function resetSector() {
                    sectorExpanded.value = false;
                    drawSector();
                }
                
                function drawSector() {
                    if (!sectorLayer.value) return;
                    
                    sectorLayer.value.destroyChildren();
                    
                    const width = sectorStage.value.width();
                    const height = sectorStage.value.height();
                    const cx = width / 2;
                    const cy = height / 2;
                    const r = sectorRadius.value;
                    const angle = sectorAngle.value;
                    
                    // 绘制扇形
                    const sector = new Konva.Wedge({
                        x: cx,
                        y: cy,
                        radius: r,
                        angle: angle,
                        rotation: -90,
                        fill: 'rgba(255, 152, 0, 0.4)',
                        stroke: '#ff9800',
                        strokeWidth: 3
                    });
                    sectorLayer.value.add(sector);
                    
                    // 绘制半径线
                    const radius1 = new Konva.Line({
                        points: [cx, cy, cx, cy - r],
                        stroke: '#4caf50',
                        strokeWidth: 2
                    });
                    sectorLayer.value.add(radius1);
                    
                    const radius2Angle = (angle - 90) * Math.PI / 180;
                    const radius2 = new Konva.Line({
                        points: [cx, cy, cx + r * Math.cos(radius2Angle), cy + r * Math.sin(radius2Angle)],
                        stroke: '#4caf50',
                        strokeWidth: 2
                    });
                    sectorLayer.value.add(radius2);
                    
                    // 角度标注
                    const angleArc = new Konva.Arc({
                        x: cx,
                        y: cy,
                        innerRadius: 30,
                        outerRadius: 40,
                        angle: angle,
                        rotation: -90,
                        stroke: '#667eea',
                        strokeWidth: 2
                    });
                    sectorLayer.value.add(angleArc);
                    
                    const angleLabel = new Konva.Text({
                        x: cx + 20,
                        y: cy - 40,
                        text: `${angle}°`,
                        fontSize: 16,
                        fill: '#667eea',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 5
                    });
                    sectorLayer.value.add(angleLabel);
                    
                    sectorLayer.value.draw();
                }
                
                // 圆周率直观演示
                function drawPiVisualization() {
                    if (!piLayer.value) return;
                    
                    piLayer.value.destroyChildren();
                    
                    const width = piStage.value.width();
                    const height = piStage.value.height();
                    const cx = width / 2;
                    const cy = height / 2;
                    const r = 150;
                    const n = piSegments.value;
                    
                    // 绘制正多边形（近似圆）
                    const points = [];
                    for (let i = 0; i < n; i++) {
                        const angle = (i * 2 * Math.PI / n) - Math.PI / 2;
                        const x = cx + r * Math.cos(angle);
                        const y = cy + r * Math.sin(angle);
                        points.push(x, y);
                    }
                    
                    const polygon = new Konva.Line({
                        points: [...points, points[0], points[1]],
                        closed: true,
                        fill: 'rgba(102, 126, 234, 0.1)',
                        stroke: '#667eea',
                        strokeWidth: 2
                    });
                    piLayer.value.add(polygon);
                    
                    // 绘制外接圆
                    const circle = new Konva.Circle({
                        x: cx,
                        y: cy,
                        radius: r,
                        fill: 'transparent',
                        stroke: '#ff9800',
                        strokeWidth: 2,
                        dash: [5, 5]
                    });
                    piLayer.value.add(circle);
                    
                    // 计算周长（多边形边长和）
                    const sideLength = 2 * r * Math.sin(Math.PI / n);
                    const polygonPerimeter = n * sideLength;
                    const circleCircumference = 2 * Math.PI * r;
                    const approxPi = polygonPerimeter / (2 * r);
                    
                    // 显示信息
                    const infoText = new Konva.Text({
                        x: 20,
                        y: 20,
                        text: `正${n}边形\n边长和 ≈ ${polygonPerimeter.toFixed(2)}\n圆周长 = ${circleCircumference.toFixed(2)}\nπ ≈ ${approxPi.toFixed(4)}`,
                        fontSize: 16,
                        fill: '#333',
                        fontStyle: 'bold',
                        padding: 15,
                        background: 'rgba(255,255,255,0.95)',
                        cornerRadius: 10,
                        lineHeight: 1.5
                    });
                    piLayer.value.add(infoText);
                    
                    piLayer.value.draw();
                }
                
                // 圆心角和内接角
                function drawAngles() {
                    if (!angleLayer.value) return;
                    
                    angleLayer.value.destroyChildren();
                    
                    const width = angleStage.value.width();
                    const height = angleStage.value.height();
                    const cx = width / 2;
                    const cy = height / 2;
                    const r = 120;
                    const centralAngleRad = centralAngle.value * Math.PI / 180;
                    
                    // 绘制圆
                    const circle = new Konva.Circle({
                        x: cx,
                        y: cy,
                        radius: r,
                        fill: 'rgba(102, 126, 234, 0.05)',
                        stroke: '#667eea',
                        strokeWidth: 2
                    });
                    angleLayer.value.add(circle);
                    
                    // 圆心角的两个端点（在圆上）
                    // 让圆心角从-90度开始，这样A在顶部，B根据角度确定
                    // 点A在顶部右侧，点B在左侧（形成弧AB）
                    const startAngle = -Math.PI / 2; // -90度，顶部
                    const pointA = { 
                        x: cx + r * Math.cos(startAngle + centralAngleRad / 2), 
                        y: cy + r * Math.sin(startAngle + centralAngleRad / 2) 
                    };  // 弧AB的一个端点（在右侧）
                    const pointB = { 
                        x: cx + r * Math.cos(startAngle - centralAngleRad / 2), 
                        y: cy + r * Math.sin(startAngle - centralAngleRad / 2) 
                    };  // 弧AB的另一个端点（在左侧）
                    
                    // 圆心角的两条半径（从圆心O到点A和B）
                    const radiusOA = new Konva.Line({
                        points: [cx, cy, pointA.x, pointA.y],
                        stroke: '#4caf50',
                        strokeWidth: 3
                    });
                    angleLayer.value.add(radiusOA);
                    
                    const radiusOB = new Konva.Line({
                        points: [cx, cy, pointB.x, pointB.y],
                        stroke: '#4caf50',
                        strokeWidth: 3
                    });
                    angleLayer.value.add(radiusOB);
                    
                    // 标注圆心
                    const centerDot = new Konva.Circle({
                        x: cx,
                        y: cy,
                        radius: 5,
                        fill: '#ff5722',
                        stroke: '#fff',
                        strokeWidth: 2
                    });
                    angleLayer.value.add(centerDot);
                    const centerLabel = new Konva.Text({
                        x: cx - 10,
                        y: cy + 15,
                        text: 'O',
                        fontSize: 18,
                        fill: '#ff5722',
                        fontStyle: 'bold',
                        padding: 3,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 3
                    });
                    angleLayer.value.add(centerLabel);
                    
                    // 标注点A（在弧AB的一个端点）
                    const dotA = new Konva.Circle({
                        x: pointA.x,
                        y: pointA.y,
                        radius: 6,
                        fill: '#2196f3',
                        stroke: '#fff',
                        strokeWidth: 2
                    });
                    angleLayer.value.add(dotA);
                    const labelA = new Konva.Text({
                        x: pointA.x + 10,
                        y: pointA.y - 10,
                        text: 'A',
                        fontSize: 18,
                        fill: '#2196f3',
                        fontStyle: 'bold',
                        padding: 3,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 3
                    });
                    angleLayer.value.add(labelA);
                    
                    // 标注点B（在弧AB的另一个端点）
                    const dotB = new Konva.Circle({
                        x: pointB.x,
                        y: pointB.y,
                        radius: 6,
                        fill: '#2196f3',
                        stroke: '#fff',
                        strokeWidth: 2
                    });
                    angleLayer.value.add(dotB);
                    const labelB = new Konva.Text({
                        x: pointB.x - 25,
                        y: pointB.y - 10,
                        text: 'B',
                        fontSize: 18,
                        fill: '#2196f3',
                        fontStyle: 'bold',
                        padding: 3,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 3
                    });
                    angleLayer.value.add(labelB);
                    
                    // 圆心角标注（从OB到OA，逆时针）
                    const angleOB = Math.atan2(pointB.y - cy, pointB.x - cx) * 180 / Math.PI;
                    const centralArc = new Konva.Arc({
                        x: cx,
                        y: cy,
                        innerRadius: 35,
                        outerRadius: 50,
                        angle: centralAngle.value,
                        rotation: angleOB,
                        fill: 'rgba(76, 175, 80, 0.4)',
                        stroke: '#4caf50',
                        strokeWidth: 3
                    });
                    angleLayer.value.add(centralArc);
                    
                    const centralLabel = new Konva.Text({
                        x: cx + 35,
                        y: cy - 50,
                        text: `圆心角 ∠AOB = ${centralAngle.value}°`,
                        fontSize: 17,
                        fill: '#4caf50',
                        fontStyle: 'bold',
                        padding: 10,
                        background: 'rgba(255,255,255,0.95)',
                        cornerRadius: 8,
                        border: '2px solid #4caf50'
                    });
                    angleLayer.value.add(centralLabel);
                    
                    // 内接角（圆周角）：顶点C在弧AB上（但不是A或B），同弧所对的圆周角是圆心角的一半
                    const inscribedAngle = centralAngle.value / 2;
                    // 点C应该在弧AB上，但不在A或B。让C在弧AB上，靠近A但不在A
                    // 从A的角度向B的方向偏移一点
                    const angleA = Math.atan2(pointA.y - cy, pointA.x - cx);
                    const angleB = Math.atan2(pointB.y - cy, pointB.x - cx);
                    // 计算从A到B的弧，C在这个弧上，但不在端点
                    // 让C在弧AB上，稍微偏向A侧（比如从A向B方向偏移弧长的20%）
                    let pointCAngle = angleA;
                    if (centralAngleRad < Math.PI) {
                        // 小弧：从A向B方向
                        pointCAngle = angleA + centralAngleRad * 0.15; // 在弧AB上，偏向A
                    } else {
                        // 大弧：从A向B的反方向
                        pointCAngle = angleA - (2 * Math.PI - centralAngleRad) * 0.15;
                    }
                    const pointC = {
                        x: cx + r * Math.cos(pointCAngle),
                        y: cy + r * Math.sin(pointCAngle)
                    };
                    
                    // 标注点C（内接角的顶点）
                    const dotC = new Konva.Circle({
                        x: pointC.x,
                        y: pointC.y,
                        radius: 6,
                        fill: '#ff9800',
                        stroke: '#fff',
                        strokeWidth: 2
                    });
                    angleLayer.value.add(dotC);
                    const labelC = new Konva.Text({
                        x: pointC.x + 15,
                        y: pointC.y - 25,
                        text: 'C（顶点）',
                        fontSize: 16,
                        fill: '#ff9800',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.95)',
                        cornerRadius: 5
                    });
                    angleLayer.value.add(labelC);
                    
                    // 内接角的两条弦
                    const chordAC = new Konva.Line({
                        points: [pointA.x, pointA.y, pointC.x, pointC.y],
                        stroke: '#ff9800',
                        strokeWidth: 3
                    });
                    angleLayer.value.add(chordAC);
                    
                    const chordBC = new Konva.Line({
                        points: [pointB.x, pointB.y, pointC.x, pointC.y],
                        stroke: '#ff9800',
                        strokeWidth: 3
                    });
                    angleLayer.value.add(chordBC);
                    
                    // 内接角标注（在点C处，从CA到CB）
                    const angleCA = Math.atan2(pointA.y - pointC.y, pointA.x - pointC.x) * 180 / Math.PI;
                    const inscribedArc = new Konva.Arc({
                        x: pointC.x,
                        y: pointC.y,
                        innerRadius: 35,
                        outerRadius: 50,
                        angle: inscribedAngle,
                        rotation: angleCA,
                        fill: 'rgba(255, 152, 0, 0.4)',
                        stroke: '#ff9800',
                        strokeWidth: 3
                    });
                    angleLayer.value.add(inscribedArc);
                    
                    // 根据C的位置调整标签位置
                    let labelX = pointC.x + 55;
                    let labelY = pointC.y - 10;
                    if (pointC.x > cx) {
                        labelX = pointC.x + 55;
                    } else {
                        labelX = pointC.x - 120;
                    }
                    if (pointC.y < cy) {
                        labelY = pointC.y - 50;
                    }
                    
                    const inscribedLabel = new Konva.Text({
                        x: labelX,
                        y: labelY,
                        text: `内接角 ∠ACB = ${inscribedAngle.toFixed(1)}°`,
                        fontSize: 17,
                        fill: '#ff9800',
                        fontStyle: 'bold',
                        padding: 10,
                        background: 'rgba(255,255,255,0.95)',
                        cornerRadius: 8,
                        border: '2px solid #ff9800'
                    });
                    angleLayer.value.add(inscribedLabel);
                    
                    // 说明文字
                    const definitionText = new Konva.Text({
                        x: 20,
                        y: 20,
                        text: '内接角（圆周角）：顶点C在圆周上\n两条边是弦AC和BC',
                        fontSize: 16,
                        fill: '#666',
                        fontStyle: 'bold',
                        padding: 12,
                        background: 'rgba(255,255,255,0.95)',
                        cornerRadius: 8,
                        lineHeight: 1.5
                    });
                    angleLayer.value.add(definitionText);
                    
                    // 关系说明
                    const relationText = new Konva.Text({
                        x: 20,
                        y: height - 100,
                        text: `同弧所对的圆心角和内接角：\n内接角 = 圆心角 ÷ 2\n∠ACB = ∠AOB ÷ 2\n${inscribedAngle.toFixed(1)}° = ${centralAngle.value}° ÷ 2`,
                        fontSize: 17,
                        fill: '#333',
                        fontStyle: 'bold',
                        padding: 15,
                        background: 'rgba(255,255,255,0.95)',
                        cornerRadius: 10,
                        lineHeight: 1.6
                    });
                    angleLayer.value.add(relationText);
                    
                    angleLayer.value.draw();
                }
                
                // 初始化画布
                function initCanvas(canvasId, stageRef, layerRef, drawFunc) {
                    const container = document.getElementById(canvasId);
                    if (!container || stageRef.value) return;
                    
                    const width = container.offsetWidth;
                    const height = container.offsetHeight || 500;
                    
                    stageRef.value = new Konva.Stage({
                        container: canvasId,
                        width: width,
                        height: height
                    });
                    
                    layerRef.value = new Konva.Layer();
                    stageRef.value.add(layerRef.value);
                    
                    if (drawFunc) drawFunc();
                }
                
                // 监听参数变化
                Vue.watch([sectorAngle, sectorRadius], () => {
                    if (sectorLayer.value) {
                        drawSector();
                    }
                });
                
                Vue.watch(piSegments, () => {
                    if (piLayer.value) {
                        drawPiVisualization();
                    }
                });
                
                Vue.watch(centralAngle, () => {
                    if (angleLayer.value) {
                        drawAngles();
                    }
                });
                
                onMounted(() => {
                    nextTick(() => {
                        initCanvas('basic-circle-canvas', basicCircleStage, basicCircleLayer, drawBasicCircle);
                        initCanvas('radius-anim-canvas', radiusAnimStage, radiusAnimLayer, animateRadius);
                        initCanvas('sector-canvas', sectorStage, sectorLayer, drawSector);
                        initCanvas('pi-canvas', piStage, piLayer, drawPiVisualization);
                        initCanvas('angle-canvas', angleStage, angleLayer, drawAngles);
                        
                        // 自动渲染 KaTeX
                        setTimeout(() => {
                            if (typeof renderMathInElement !== 'undefined') {
                                try {
                                    renderMathInElement(document.body, {
                                        delimiters: [
                                            {left: '$$', right: '$$', display: true},
                                            {left: '$', right: '$', display: false},
                                            {left: '\\[', right: '\\]', display: true},
                                            {left: '\\(', right: '\\)', display: false}
                                        ],
                                        throwOnError: false
                                    });
                                } catch (e) {
                                    console.error('KaTeX 渲染错误:', e);
                                }
                            }
                            
                            // 手动渲染静态公式
                            if (typeof katex !== 'undefined') {
                                const katexStaticElements = document.querySelectorAll('.katex-static');
                                katexStaticElements.forEach(el => {
                                    const formula = el.getAttribute('data-formula');
                                    if (formula && !el.querySelector('.katex-html')) {
                                        try {
                                            katex.render(formula, el, {
                                                throwOnError: false
                                            });
                                        } catch (e) {
                                            console.error('KaTeX 静态公式渲染错误:', e);
                                        }
                                    }
                                });
                            }
                        }, 100);
                    });
                });
                
                return {
                    circleRadius,
                    sectorAngle,
                    sectorRadius,
                    sectorExpanded,
                    piSegments,
                    centralAngle,
                    calcRadius,
                    calcAngle,
                    circumference,
                    area,
                    arcLength,
                    sectorArea,
                    expandSector,
                    resetSector
                };
            },
            template: `
                <div class="container">
                    <h1>⭕ 圆</h1>
                    <p class="subtitle">探索圆的几何性质和计算方法</p>
                    
                    <!-- 基本概念 -->
                    <div class="section">
                        <h2>📚 基本概念</h2>
                        <div class="concept-grid">
                            <div class="concept-card">
                                <h3>半径 (r)</h3>
                                <p>从圆心到圆周上任意一点的距离</p>
                            </div>
                            <div class="concept-card">
                                <h3>直径 (d)</h3>
                                <p>通过圆心，两端在圆周上的线段</p>
                                <p style="margin-top: 5px; color: #666;">d = 2r</p>
                            </div>
                            <div class="concept-card">
                                <h3>弦</h3>
                                <p>圆上任意两点之间的线段</p>
                            </div>
                            <div class="concept-card">
                                <h3>弧</h3>
                                <p>圆上两点之间的部分</p>
                            </div>
                            <div class="concept-card">
                                <h3>扇形</h3>
                                <p>由两条半径和它们所夹的弧围成的图形</p>
                            </div>
                            <div class="concept-card">
                                <h3>圆心角</h3>
                                <p>以圆心为顶点的角，两条边是半径</p>
                            </div>
                            <div class="concept-card">
                                <h3>内接角（圆周角）</h3>
                                <p>顶点在圆周上，两条边是弦的角。同弧所对的内接角等于圆心角的一半</p>
                            </div>
                        </div>
                        
                        <div class="canvas-container">
                            <div id="basic-circle-canvas" class="canvas-wrapper"></div>
                        </div>
                    </div>
                    
                    <!-- 半径变化动画 -->
                    <div class="section">
                        <h2>🔵 半径变化演示</h2>
                        <div class="canvas-container">
                            <div id="radius-anim-canvas" class="canvas-wrapper"></div>
                            <div class="info-panel">
                                <div class="info-item">
                                    <strong>说明：</strong>观察半径变化时，圆的大小如何改变
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 扇形展开 -->
                    <div class="section">
                        <h2>🍰 扇形展开</h2>
                        <div class="canvas-container">
                            <div class="slider-container">
                                <label>圆心角（度）：</label>
                                <input type="range" v-model.number="sectorAngle" min="30" max="270" step="10">
                                <span style="margin-left: 10px; font-weight: bold; color: #667eea;">{{ sectorAngle }}°</span>
                            </div>
                            <div class="slider-container">
                                <label>半径：</label>
                                <input type="range" v-model.number="sectorRadius" min="80" max="180" step="10">
                                <span style="margin-left: 10px; font-weight: bold; color: #667eea;">{{ sectorRadius }}</span>
                            </div>
                            <div class="controls">
                                <button class="btn" @click="expandSector">展开扇形</button>
                                <button class="btn btn-secondary" @click="resetSector">重置</button>
                            </div>
                            <div id="sector-canvas" class="canvas-wrapper"></div>
                        </div>
                    </div>
                    
                    <!-- 圆周率直观来源 -->
                    <div class="section">
                        <h2>π 的直观来源</h2>
                        <div class="canvas-container">
                            <div class="info-panel">
                                <div class="info-item">
                                    <strong>原理：</strong>用正多边形的周长近似圆的周长。边数越多，越接近圆。
                                </div>
                                <div class="slider-container">
                                    <label>正多边形边数：</label>
                                    <input type="range" v-model.number="piSegments" min="4" max="50" step="2">
                                    <span style="margin-left: 10px; font-weight: bold; color: #667eea;">{{ piSegments }}</span>
                                </div>
                            </div>
                            <div id="pi-canvas" class="canvas-wrapper"></div>
                            <div class="info-item" style="margin-top: 20px;">
                                <strong>公式：</strong>
                                <span class="katex-static" data-formula="π = \\frac{圆周长}{直径} = \\frac{C}{d}"></span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 圆心角和内接角 -->
                    <div class="section">
                        <h2>🔺 圆心角和内接角</h2>
                        <div class="canvas-container">
                            <div class="slider-container">
                                <label>圆心角（度）：</label>
                                <input type="range" v-model.number="centralAngle" min="30" max="180" step="10">
                                <span style="margin-left: 10px; font-weight: bold; color: #667eea;">{{ centralAngle }}°</span>
                            </div>
                            <div id="angle-canvas" class="canvas-wrapper"></div>
                            <div class="info-item" style="margin-top: 20px;">
                                <strong>关系：</strong>同弧所对的内接角（圆周角）等于圆心角的一半
                                <span class="katex-static" data-formula="内接角 = \\frac{圆心角}{2}"></span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 计算公式 -->
                    <div class="section">
                        <h2>📐 计算公式</h2>
                        <div class="info-panel">
                            <div class="info-item">
                                <strong>周长：</strong>
                                <span class="katex-static" data-formula="C = 2πr = πd"></span>
                            </div>
                            <div class="info-item">
                                <strong>面积：</strong>
                                <span class="katex-static" data-formula="S = πr^2"></span>
                            </div>
                            <div class="info-item">
                                <strong>弧长：</strong>
                                <span class="katex-static" data-formula="l = \\frac{n°}{360°} \\times 2πr"></span>
                                <p style="margin-top: 5px; color: #666;">其中 n° 是圆心角的度数</p>
                            </div>
                            <div class="info-item">
                                <strong>扇形面积：</strong>
                                <span class="katex-static" data-formula="S_{扇形} = \\frac{n°}{360°} \\times πr^2"></span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 计算工具 -->
                    <div class="section">
                        <h2>🧮 计算工具</h2>
                        <div class="calculator">
                            <h3>周长和面积计算</h3>
                            <div class="input-group">
                                <label>半径 r：</label>
                                <input type="number" v-model.number="calcRadius" min="0" step="0.1">
                            </div>
                            <div class="result">
                                <strong>周长：</strong>{{ circumference.toFixed(2) }}<br>
                                <strong>面积：</strong>{{ area.toFixed(2) }}
                            </div>
                        </div>
                        
                        <div class="calculator">
                            <h3>弧长和扇形面积计算</h3>
                            <div class="input-group">
                                <label>半径 r：</label>
                                <input type="number" v-model.number="calcRadius" min="0" step="0.1">
                            </div>
                            <div class="input-group">
                                <label>圆心角（度）：</label>
                                <input type="number" v-model.number="calcAngle" min="0" max="360" step="1">
                            </div>
                            <div class="result">
                                <strong>弧长：</strong>{{ arcLength.toFixed(2) }}<br>
                                <strong>扇形面积：</strong>{{ sectorArea.toFixed(2) }}
                            </div>
                        </div>
                    </div>
                </div>
            `
        }).mount('#app');
    </script>
</body>
</html>
