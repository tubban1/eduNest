<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整数指数与指数运算 - 初中数学教学</title>
    <meta name="description" content="学习整数指数的概念，掌握指数运算的性质，理解零指数和负指数的意义，通过可视化模拟器直观理解指数增长的规律。">
    <meta name="keywords" content="指数,幂,指数运算,零指数,负指数,指数增长,指数性质,初中数学">
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" 
          onerror="this.onerror=null; this.href='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.css'">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.2em;
        }
        
        .section {
            margin-bottom: 50px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .demo-panel {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            margin: 20px 0;
        }
        
        .animation-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 400px;
        }
        
        .animation-canvas {
            width: 100%;
            height: 400px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .control-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #666;
        }
        
        .control-group input[type="number"],
        .control-group input[type="text"],
        .control-group select {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .control-group input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        
        .control-group input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .growth-simulator {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 20px 0;
        }
        
        .growth-canvas {
            width: 100%;
            height: 400px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .concept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .concept-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .concept-card:hover {
            transform: translateY(-5px);
        }
        
        .concept-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .practice-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        
        .practice-item {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .practice-item input {
            width: 150px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 6px;
            margin: 0 10px;
        }
        
        .practice-item.correct {
            background: #d4edda;
            border: 2px solid #28a745;
        }
        
        .practice-item.incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }
        
        .score-display {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-top: 20px;
        }
        
        .formula-display {
            background: #f0f9ff;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <!-- Vue 3.5.20 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    
    <!-- Konva -->
    <script src="https://cdn.jsdelivr.net/npm/konva@10.0.12/konva.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/konva.min.js'"></script>
    
    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    
    <!-- KaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.auto-render.min.js'"></script>
    
    <script>
        const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;

        createApp({
            setup() {
                // 重复乘法演示
                const baseValue = ref(2);
                const exponentValue = ref(5);
                const animating = ref(false);
                const animationStage = ref(null);
                const animationLayer = ref(null);
                
                // 指数增长模拟器
                const growthBase = ref(2);
                const growthSteps = ref(8);
                const growthStage = ref(null);
                const growthLayer = ref(null);
                
                // 练习题目
                const practiceQuestions = ref([
                    { id: 1, q: '计算 $2^3$', ans: 8, user: null, correct: null },
                    { id: 2, q: '计算 $5^0$', ans: 1, user: null, correct: null },
                    { id: 3, q: '计算 $3^{-2}$', ans: 1/9, user: null, correct: null },
                    { id: 4, q: '计算 $2^4 \\times 2^3$', ans: 128, user: null, correct: null },
                    { id: 5, q: '计算 $(3^2)^3$', ans: 729, user: null, correct: null }
                ]);
                const practiceScore = ref(null);
                
                // 计算指数值
                const powerResult = computed(() => {
                    if (exponentValue.value === 0) return 1;
                    if (exponentValue.value < 0) {
                        return 1 / Math.pow(baseValue.value, Math.abs(exponentValue.value));
                    }
                    return Math.pow(baseValue.value, exponentValue.value);
                });
                
                // 当前公式文本
                const currentFormula = computed(() => {
                    if (exponentValue.value === 0) {
                        return `\\(${baseValue.value}^0 = 1\\)`;
                    } else if (exponentValue.value < 0) {
                        return `\\(${baseValue.value}^{${exponentValue.value}} = \\frac{1}{${baseValue.value}^{${Math.abs(exponentValue.value)}}} = ${powerResult.value.toFixed(4)}\\)`;
                    } else {
                        return `\\(${baseValue.value}^{${exponentValue.value}} = ${powerResult.value}\\)`;
                    }
                });
                
                // 重复乘法展开
                const multiplicationExpansion = computed(() => {
                    if (exponentValue.value === 0) return '1';
                    if (exponentValue.value < 0) {
                        return `\\frac{1}{${baseValue.value} \\times ${baseValue.value} \\times ... \\times ${baseValue.value}} (${Math.abs(exponentValue.value)}个)`;
                    }
                    const parts = Array(exponentValue.value).fill(baseValue.value).join(' \\times ');
                    return parts;
                });
                
                // 绘制重复乘法动画
                const drawMultiplicationAnimation = () => {
                    if (!animationStage.value || !animationLayer.value) return;
                    if (animating.value) return;
                    
                    animationLayer.value.destroyChildren();
                    
                    const stage = animationStage.value;
                    const layer = animationLayer.value;
                    const w = stage.width();
                    const h = stage.height();
                    
                    const base = baseValue.value;
                    const exponent = exponentValue.value;
                    
                    if (exponent === 0) {
                        // 零指数
                        const text = new Konva.Text({
                            x: w / 2,
                            y: h / 2,
                            text: `${base}^0 = 1`,
                            fontSize: 32,
                            fill: '#667eea',
                            fontStyle: 'bold',
                            align: 'center',
                            offsetX: 60
                        });
                        layer.add(text);
                        layer.draw();
                        return;
                    }
                    
                    if (exponent < 0) {
                        // 负指数
                        const text1 = new Konva.Text({
                            x: w / 2,
                            y: h / 2 - 30,
                            text: `${base}^{${exponent}} = 1 / ${base}^{${Math.abs(exponent)}}`,
                            fontSize: 24,
                            fill: '#667eea',
                            fontStyle: 'bold',
                            align: 'center',
                            offsetX: 150
                        });
                        layer.add(text1);
                        
                        const text2 = new Konva.Text({
                            x: w / 2,
                            y: h / 2 + 20,
                            text: `= 1 / (${base} × ${base} × ... × ${base})`,
                            fontSize: 20,
                            fill: '#666',
                            align: 'center',
                            offsetX: 150
                        });
                        layer.add(text2);
                        
                        const text3 = new Konva.Text({
                            x: w / 2,
                            y: h / 2 + 60,
                            text: `= ${powerResult.value.toFixed(4)}`,
                            fontSize: 24,
                            fill: '#16a34a',
                            fontStyle: 'bold',
                            align: 'center',
                            offsetX: 80
                        });
                        layer.add(text3);
                        layer.draw();
                        return;
                    }
                    
                    // 正指数：绘制重复乘法
                    const centerY = h / 2;
                    const boxSize = 50;
                    const spacing = 60;
                    const totalWidth = exponent * spacing;
                    const startX = (w - totalWidth) / 2 + boxSize / 2;
                    
                    const boxes = [];
                    const labels = [];
                    
                    for (let i = 0; i < exponent; i++) {
                        const x = startX + i * spacing;
                        
                        const box = new Konva.Rect({
                            x: x - boxSize / 2,
                            y: centerY - boxSize / 2,
                            width: boxSize,
                            height: boxSize,
                            fill: 'rgba(102, 126, 234, 0.2)',
                            stroke: '#667eea',
                            strokeWidth: 2,
                            cornerRadius: 5,
                            opacity: 0
                        });
                        boxes.push(box);
                        layer.add(box);
                        
                        const label = new Konva.Text({
                            x: x,
                            y: centerY,
                            text: String(base),
                            fontSize: 24,
                            fill: '#667eea',
                            fontStyle: 'bold',
                            align: 'center',
                            offsetX: 10,
                            opacity: 0
                        });
                        labels.push(label);
                        layer.add(label);
                        
                        if (i < exponent - 1) {
                            const multiply = new Konva.Text({
                                x: x + spacing / 2,
                                y: centerY,
                                text: '×',
                                fontSize: 28,
                                fill: '#666',
                                align: 'center',
                                offsetX: 12,
                                opacity: 0
                            });
                            layer.add(multiply);
                        }
                    }
                    
                    // 等号和结果
                    const equals = new Konva.Text({
                        x: startX + exponent * spacing + 30,
                        y: centerY,
                        text: '=',
                        fontSize: 32,
                        fill: '#333',
                        fontStyle: 'bold',
                        align: 'center',
                        offsetX: 15,
                        opacity: 0
                    });
                    layer.add(equals);
                    
                    const result = new Konva.Text({
                        x: startX + exponent * spacing + 80,
                        y: centerY,
                        text: String(powerResult.value),
                        fontSize: 32,
                        fill: '#16a34a',
                        fontStyle: 'bold',
                        align: 'center',
                        offsetX: 30,
                        opacity: 0
                    });
                    layer.add(result);
                    
                    // 动画
                    animating.value = true;
                    const timeline = gsap.timeline({
                        onComplete: () => { animating.value = false; }
                    });
                    
                    boxes.forEach((box, i) => {
                        timeline.to(box, { opacity: 1, duration: 0.3 }, i * 0.1)
                            .to(labels[i], { opacity: 1, duration: 0.3 }, i * 0.1);
                    });
                    
                    timeline.to(equals, { opacity: 1, duration: 0.3 }, exponent * 0.1 + 0.2)
                        .to(result, { opacity: 1, duration: 0.3 }, exponent * 0.1 + 0.5);
                    
                    layer.draw();
                };
                
                // 绘制指数增长图
                const drawGrowthGraph = () => {
                    if (!growthStage.value || !growthLayer.value) return;
                    
                    growthLayer.value.destroyChildren();
                    
                    const stage = growthStage.value;
                    const layer = growthLayer.value;
                    const w = stage.width();
                    const h = stage.height();
                    
                    const padding = { top: 40, right: 40, bottom: 60, left: 60 };
                    const plotWidth = w - padding.left - padding.right;
                    const plotHeight = h - padding.top - padding.bottom;
                    
                    const base = growthBase.value;
                    const steps = growthSteps.value;
                    
                    // 计算数据点
                    const dataPoints = [];
                    let maxY = 0;
                    for (let i = 0; i <= steps; i++) {
                        const y = Math.pow(base, i);
                        dataPoints.push({ x: i, y });
                        maxY = Math.max(maxY, y);
                    }
                    
                    // 坐标转换
                    const toX = (x) => padding.left + (x / steps) * plotWidth;
                    const toY = (y) => padding.top + plotHeight - (y / maxY) * plotHeight;
                    
                    // 绘制坐标轴
                    const axisX = new Konva.Line({
                        points: [padding.left, padding.top + plotHeight, padding.left + plotWidth, padding.top + plotHeight],
                        stroke: '#333',
                        strokeWidth: 2
                    });
                    const axisY = new Konva.Line({
                        points: [padding.left, padding.top, padding.left, padding.top + plotHeight],
                        stroke: '#333',
                        strokeWidth: 2
                    });
                    layer.add(axisX);
                    layer.add(axisY);
                    
                    // 绘制网格
                    for (let i = 0; i <= 10; i++) {
                        const x = padding.left + (i / 10) * plotWidth;
                        const gridX = new Konva.Line({
                            points: [x, padding.top, x, padding.top + plotHeight],
                            stroke: '#e0e0e0',
                            strokeWidth: 1,
                            dash: [5, 5]
                        });
                        layer.add(gridX);
                    }
                    
                    // 绘制曲线
                    const points = [];
                    dataPoints.forEach(p => {
                        points.push(toX(p.x), toY(p.y));
                    });
                    
                    const curve = new Konva.Line({
                        points: points,
                        stroke: '#667eea',
                        strokeWidth: 3,
                        lineCap: 'round',
                        lineJoin: 'round'
                    });
                    layer.add(curve);
                    
                    // 绘制数据点
                    dataPoints.forEach((p, i) => {
                        const circle = new Konva.Circle({
                            x: toX(p.x),
                            y: toY(p.y),
                            radius: 5,
                            fill: '#667eea',
                            stroke: '#fff',
                            strokeWidth: 2
                        });
                        layer.add(circle);
                        
                        // 标签
                        const label = new Konva.Text({
                            x: toX(p.x),
                            y: toY(p.y) - 20,
                            text: `${base}^${i} = ${p.y}`,
                            fontSize: 12,
                            fill: '#666',
                            align: 'center',
                            offsetX: 30
                        });
                        layer.add(label);
                    });
                    
                    // 轴标签
                    const xAxisLabel = new Konva.Text({
                        x: padding.left + plotWidth / 2,
                        y: h - 20,
                        text: '指数 n',
                        fontSize: 14,
                        fill: '#333',
                        align: 'center',
                        offsetX: 30
                    });
                    const yAxisLabel = new Konva.Text({
                        x: 20,
                        y: padding.top + plotHeight / 2,
                        text: `${base}^n 的值`,
                        fontSize: 14,
                        fill: '#333',
                        align: 'center',
                        offsetY: 40,
                        rotation: -90
                    });
                    layer.add(xAxisLabel);
                    layer.add(yAxisLabel);
                    
                    layer.draw();
                };
                
                // 初始化画布
                const initCanvases = () => {
                    nextTick(() => {
                        setTimeout(() => {
                            // 重复乘法动画画布
                            const animContainer = document.getElementById('animation-canvas');
                            if (animContainer && typeof Konva !== 'undefined') {
                                animationStage.value = new Konva.Stage({
                                    container: 'animation-canvas',
                                    width: animContainer.offsetWidth,
                                    height: 400
                                });
                                animationLayer.value = new Konva.Layer();
                                animationStage.value.add(animationLayer.value);
                                drawMultiplicationAnimation();
                            }
                            
                            // 指数增长图
                            const growthContainer = document.getElementById('growth-canvas');
                            if (growthContainer && typeof Konva !== 'undefined') {
                                growthStage.value = new Konva.Stage({
                                    container: 'growth-canvas',
                                    width: growthContainer.offsetWidth,
                                    height: 400
                                });
                                growthLayer.value = new Konva.Layer();
                                growthStage.value.add(growthLayer.value);
                                drawGrowthGraph();
                            }
                            
                            renderKaTeX();
                        }, 100);
                    });
                };
                
                // 渲染 KaTeX
                const renderKaTeX = () => {
                    nextTick(() => {
                        if (typeof renderMathInElement !== 'undefined') {
                            const container = document.getElementById('app');
                            if (container) {
                                renderMathInElement(container, {
                                    delimiters: [
                                        { left: '$$', right: '$$', display: true },
                                        { left: '$', right: '$', display: false },
                                        { left: '\\[', right: '\\]', display: true },
                                        { left: '\\(', right: '\\)', display: false }
                                    ],
                                    throwOnError: false
                                });
                            }
                        }
                    });
                };
                
                // 提交练习
                const submitPractice = () => {
                    let correctCount = 0;
                    practiceQuestions.value.forEach(q => {
                        const userAns = parseFloat(q.user);
                        const correctAns = q.ans;
                        // 允许小的浮点数误差
                        q.correct = Math.abs(userAns - correctAns) < 0.001;
                        if (q.correct) correctCount++;
                    });
                    practiceScore.value = `${correctCount} / ${practiceQuestions.value.length}`;
                };
                
                // 重置练习
                const resetPractice = () => {
                    practiceQuestions.value.forEach(q => {
                        q.user = null;
                        q.correct = null;
                    });
                    practiceScore.value = null;
                };
                
                // 监听变化
                watch([baseValue, exponentValue], () => {
                    nextTick(() => {
                        drawMultiplicationAnimation();
                        renderKaTeX();
                    });
                });
                
                watch([growthBase, growthSteps], () => {
                    nextTick(() => {
                        drawGrowthGraph();
                    });
                });
                
                onMounted(() => {
                    initCanvases();
                    
                    window.addEventListener('resize', () => {
                        setTimeout(() => {
                            if (animationStage.value && animationLayer.value) {
                                const container = document.getElementById('animation-canvas');
                                if (container) {
                                    animationStage.value.width(container.offsetWidth);
                                    drawMultiplicationAnimation();
                                }
                            }
                            if (growthStage.value && growthLayer.value) {
                                const container = document.getElementById('growth-canvas');
                                if (container) {
                                    growthStage.value.width(container.offsetWidth);
                                    drawGrowthGraph();
                                }
                            }
                        }, 100);
                    });
                    
                    if (window.gsap) {
                        gsap.from('.section', { opacity: 0, y: 20, duration: 0.6, stagger: 0.1 });
                    }
                });
                
                return {
                    baseValue,
                    exponentValue,
                    powerResult,
                    currentFormula,
                    multiplicationExpansion,
                    growthBase,
                    growthSteps,
                    practiceQuestions,
                    practiceScore,
                    drawMultiplicationAnimation,
                    submitPractice,
                    resetPractice
                };
            },
            template: `
            <div class="container">
                <h1>整数指数与指数运算</h1>
                <p class="subtitle">学习指数概念，掌握运算性质，理解指数增长规律</p>
                
                <div class="section">
                    <h2>一、指数的基本概念</h2>
                    <div class="concept-grid">
                        <div class="concept-card">
                            <h3>正指数</h3>
                            <p>$a^n$ 表示 $n$ 个 $a$ 相乘，其中 $a$ 是底数，$n$ 是指数。</p>
                            <p>例如：$2^3 = 2 \\times 2 \\times 2 = 8$</p>
                        </div>
                        <div class="concept-card">
                            <h3>零指数</h3>
                            <p>任何非零数的零次幂等于 1，即 $a^0 = 1$（$a \\neq 0$）。</p>
                            <p>例如：$5^0 = 1$，$(-3)^0 = 1$</p>
                        </div>
                        <div class="concept-card">
                            <h3>负指数</h3>
                            <p>$a^{-n} = \\frac{1}{a^n}$（$a \\neq 0$，$n$ 为正整数）。</p>
                            <p>例如：$2^{-3} = \\frac{1}{2^3} = \\frac{1}{8}$</p>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h2>二、重复乘法演示</h2>
                    <div class="demo-panel">
                        <div class="animation-container">
                            <h3 style="color: #667eea; margin-bottom: 15px;">可视化演示</h3>
                            <div id="animation-canvas" class="animation-canvas"></div>
                        </div>
                        
                        <div class="control-panel">
                            <h3 style="color: #667eea; margin-bottom: 20px;">参数设置</h3>
                            
                            <div class="control-group">
                                <label>底数 a</label>
                                <input type="number" v-model.number="baseValue" min="1" max="10" step="1" />
                            </div>
                            
                            <div class="control-group">
                                <label>指数 n</label>
                                <input type="range" v-model.number="exponentValue" min="-5" max="8" step="1" />
                                <div style="text-align: center; margin-top: 5px; color: #666;">{{ exponentValue }}</div>
                            </div>
                            
                            <div class="formula-display" v-html="currentFormula"></div>
                            
                            <button class="btn" @click="drawMultiplicationAnimation">重新播放动画</button>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h2>三、指数运算性质</h2>
                    <div style="padding: 20px; background: white; border-radius: 10px; margin: 20px 0;">
                        <ul style="line-height: 2; font-size: 1.1em;">
                            <li><strong>同底数幂相乘：</strong>$a^m \\times a^n = a^{m+n}$</li>
                            <li><strong>同底数幂相除：</strong>$a^m \\div a^n = a^{m-n}$（$a \\neq 0$）</li>
                            <li><strong>幂的乘方：</strong>$(a^m)^n = a^{mn}$</li>
                            <li><strong>积的乘方：</strong>$(ab)^n = a^n b^n$</li>
                            <li><strong>商的乘方：</strong>$\\left(\\frac{a}{b}\\right)^n = \\frac{a^n}{b^n}$（$b \\neq 0$）</li>
                        </ul>
                    </div>
                </div>
                
                <div class="section">
                    <h2>四、指数增长模拟器</h2>
                    <div class="growth-simulator">
                        <div style="display: grid; grid-template-columns: 1fr 300px; gap: 30px;">
                            <div>
                                <h3 style="color: #667eea; margin-bottom: 15px;">指数增长曲线</h3>
                                <div id="growth-canvas" class="growth-canvas"></div>
                            </div>
                            
                            <div>
                                <div class="control-group">
                                    <label>底数</label>
                                    <input type="number" v-model.number="growthBase" min="2" max="5" step="1" />
                                </div>
                                
                                <div class="control-group">
                                    <label>显示步数</label>
                                    <input type="range" v-model.number="growthSteps" min="5" max="12" step="1" />
                                    <div style="text-align: center; margin-top: 5px; color: #666;">{{ growthSteps }}</div>
                                </div>
                                
                                <div style="margin-top: 20px; padding: 15px; background: #f0f9ff; border-radius: 8px;">
                                    <p style="font-size: 0.95em; line-height: 1.6;">
                                        <strong>观察：</strong><br>
                                        指数函数 $y = a^x$ 具有快速增长的特性。当底数 $a > 1$ 时，随着指数增大，函数值急剧增长。
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="section">
                    <h2>五、练习与自测</h2>
                    <div class="practice-container">
                        <p style="margin-bottom: 20px; font-size: 1.1em;">计算下列指数表达式：</p>
                        
                        <div v-for="q in practiceQuestions" :key="q.id" 
                             :class="['practice-item', q.correct === true ? 'correct' : q.correct === false ? 'incorrect' : '']">
                            <span v-html="q.q"></span>
                            <input type="number" 
                                   v-model.number="q.user" 
                                   step="0.01" 
                                   placeholder="输入答案" 
                                   :disabled="practiceScore !== null" />
                            <span v-if="q.correct === true" style="color: #28a745; font-weight: bold;">✓ 正确</span>
                            <span v-else-if="q.correct === false" style="color: #dc3545; font-weight: bold;">✗ 错误，正确答案：{{ q.ans }}</span>
                        </div>
                        
                        <div style="text-align: center; margin-top: 30px;">
                            <button class="btn" @click="submitPractice" v-if="practiceScore === null">提交答案</button>
                            <button class="btn btn-secondary" @click="resetPractice" v-if="practiceScore !== null">重新答题</button>
                        </div>
                        
                        <div v-if="practiceScore !== null" class="score-display">
                            得分：{{ practiceScore }}
                        </div>
                    </div>
                </div>
            </div>
            `
        }).mount('#app');
    </script>
</body>
</html>
