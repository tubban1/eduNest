<!DOCTYPE html>

<head>

    <title>代数式与项 - 初中数学教学</title>

    <meta name="keywords" content="代数式,项,系数,常数,合并同类项,去括号,分配律,文字叙述转代数式,代数运算,化简,初中数学">
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" 
          onerror="this.onerror=null; this.href='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.css'">
    
    <style>

        .practice-canvas {

        .score-card {

        .drop-zone {

        .step-indicator {

        .demo-explanation {

        .demo-formula {

</head>
<body>
    <div id="app"></div>
    
    <!-- Vue 3.5.20 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    
    <!-- Konva -->
    <script src="https://cdn.jsdelivr.net/npm/konva@10.0.12/konva.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/konva.min.js'"></script>
    
    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    
    <!-- KaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.auto-render.min.js'"></script>
    
    <script>
        const { createApp, ref, reactive, onMounted, onBeforeUnmount, nextTick } = Vue;
        
        createApp({
            setup() {
                const concepts = ref([
                    {
                        title: '代数式',
                        content: '由数和字母用运算符号连接而成的式子叫做代数式。单独的一个数或一个字母也是代数式。',
                        example: '例如：3x, 2a+5, x²-4x+3, -2ab'
                    },
                    {
                        title: '项',
                        content: '在代数式中，用加号或减号连接的每一个部分叫做项。',
                        example: '例如：3x+2y-5 有三项：3x, 2y, -5'
                    },
                    {
                        title: '系数',
                        content: '在代数式中，字母前的数字因数叫做该项的系数。如果字母前没有数字，则系数为1或-1。',
                        example: '例如：3x 中，3 是 x 的系数；-ab 中，-1 是 ab 的系数'
                    },
                    {
                        title: '常数',
                        content: '不含字母的项叫做常数项。',
                        example: '例如：在 3x+2y-5 中，-5 是常数项'
                    },
                    {
                        title: '合并同类项',
                        content: '把同类项的系数相加，字母和字母的指数不变。同类项是指所含字母相同，并且相同字母的指数也相同的项。',
                        example: '例如：3x + 2x = 5x；4ab - ab = 3ab'
                    },
                    {
                        title: '去括号',
                        content: '如果括号前面是加号，去掉括号后，括号内的各项不变号；如果括号前面是减号，去掉括号后，括号内的各项都要变号。',
                        example: '例如：+(a+b) = a+b；-(a+b) = -a-b'
                    },
                    {
                        title: '分配律',
                        content: 'a(b+c) = ab + ac，即一个数与括号内各项相乘，等于这个数与括号内各项分别相乘。',
                        example: '例如：3(2x+5) = 6x + 15'
                    },
                    {
                        title: '文字转代数式',
                        content: '将文字叙述转化为代数式，需要用字母表示未知数，根据题意列出相应的代数式。',
                        example: '例如："x的3倍与5的和" 表示为 3x+5'
                    }
                ]);
                
                // 演示相关
                const demoStage = ref(null);
                const demoLayer = ref(null);
                const demoBlocks = ref([]);
                const demoType = ref('combine');
                const demoExpression = ref('');
                const demoStep = ref(0);
                const demoSteps = ref([]);
                const demoAutoPlaying = ref(false);
                const demoExplanation = ref('');
                const demoFormula = ref('');
                
                // 练习相关
                const practiceQuestions = ref([
                    {
                        id: 1,
                        expression: '3x + 2x - 5',
                        answer: '5x - 5',
                        userAnswer: '',
                        correct: null,
                        terms: [],
                        steps: [],
                        currentStep: 0
                    },
                    {
                        id: 2,
                        expression: '4a - 2a + 3b',
                        answer: '2a + 3b',
                        userAnswer: '',
                        correct: null,
                        terms: [],
                        steps: [],
                        currentStep: 0
                    },
                    {
                        id: 3,
                        expression: '5y + 3 - 2y - 1',
                        answer: '3y + 2',
                        userAnswer: '',
                        correct: null,
                        terms: [],
                        steps: [],
                        currentStep: 0
                    },
                    {
                        id: 4,
                        expression: '2x² + 3x - x² + x',
                        answer: 'x² + 4x',
                        userAnswer: '',
                        correct: null,
                        terms: [],
                        steps: [],
                        currentStep: 0
                    },
                    {
                        id: 5,
                        expression: '6m - 2n + 4m + n',
                        answer: '10m - n',
                        userAnswer: '',
                        correct: null,
                        terms: [],
                        steps: [],
                        currentStep: 0
                    }
                ]);
                
                const score = ref({ show: false, correct: 0, total: 0, percentage: 0 });
                
                // 解析代数式
                function parseExpression(expr) {
                    const terms = [];
                    // 更健壮的正则表达式，处理各种情况
                    let cleaned = expr.trim().replace(/\s+/g, '');
                    // 确保每个项前面都有符号（第一个正数项前面可能没有+号）
                    if (cleaned[0] !== '-' && cleaned[0] !== '+') {
                        cleaned = '+' + cleaned;
                    }
                    
                    // 匹配项：符号、数字、变量（包括上标）
                    const parts = cleaned.match(/([+-]\d*[a-zA-Z²³]*(?:\^?\d+)?|[+-]\d+)/g) || [];
                    
                    parts.forEach(part => {
                        if (!part || part === '+' || part === '-') return;
                        
                        let coefficient = 1;
                        let variable = '';
                        let isConstant = true;
                        
                        // 提取符号
                        let sign = 1;
                        if (part[0] === '-') {
                            sign = -1;
                            part = part.substring(1);
                        } else if (part[0] === '+') {
                            part = part.substring(1);
                        }
                        
                        // 提取系数和变量
                        const match = part.match(/^(\d*)([a-zA-Z²³]*(?:\^?\d+)?)?$/);
                        if (match) {
                            if (match[1] && match[1].length > 0) {
                                coefficient = parseInt(match[1]) * sign;
                            } else {
                                coefficient = sign;
                            }
                            if (match[2] && match[2].length > 0) {
                                variable = match[2];
                                isConstant = false;
                            }
                        }
                        
                        terms.push({
                            coefficient: coefficient,
                            variable: variable,
                            isConstant: isConstant,
                            text: formatTerm(coefficient, variable)
                        });
                    });
                    
                    return terms;
                }
                
                // 创建代数积木
                function createTermBlock(term, x, y, isDraggable = true) {
                    const group = new Konva.Group({
                        x: x,
                        y: y,
                        draggable: isDraggable,
                        id: 'term-' + Date.now() + '-' + Math.random()
                    });
                    
                    // 根据系数和变量确定颜色
                    let color = '#667eea';
                    if (term.isConstant) {
                        color = '#28a745';
                    } else if (term.variable.includes('²')) {
                        color = '#f39c12';
                    } else if (term.variable.includes('³')) {
                        color = '#e74c3c';
                    }
                    
                    // 创建矩形背景
                    const text = term.text;
                    const tempText = new Konva.Text({
                        text: text,
                        fontFamily: 'Arial',
                        fontSize: 24,
                        fill: '#333'
                    });
                    
                    const width = Math.max(tempText.width() + 20, 60);
                    const height = 50;
                    
                    const rect = new Konva.Rect({
                        width: width,
                        height: height,
                        fill: color,
                        cornerRadius: 8,
                        stroke: '#333',
                        strokeWidth: 2,
                        shadowColor: 'black',
                        shadowBlur: 5,
                        shadowOpacity: 0.3
                    });
                    
                    // 创建文字
                    const label = new Konva.Text({
                        text: text,
                        fontFamily: 'Arial',
                        fontSize: 24,
                        fill: 'white',
                        x: (width - tempText.width()) / 2,
                        y: (height - 24) / 2,
                        fontStyle: 'bold'
                    });
                    
                    group.add(rect);
                    group.add(label);
                    
                    // 存储原始数据
                    group.termData = term;
                    
                    return group;
                }
                
                // 初始化演示画布
                function initDemoCanvas() {
                    const container = document.getElementById('demo-canvas');
                    if (!container || demoStage.value) return;
                    
                    const width = container.offsetWidth;
                    const height = 400;
                    
                    demoStage.value = new Konva.Stage({
                        container: 'demo-canvas',
                        width: width,
                        height: height
                    });
                    
                    demoLayer.value = new Konva.Layer();
                    demoStage.value.add(demoLayer.value);
                    
                    loadDemoExpression();
                }
                
                // 加载演示表达式
                function loadDemoExpression() {
                    if (!demoLayer.value) return;
                    
                    // 清空现有积木
                    demoLayer.value.destroyChildren();
                    demoBlocks.value = [];
                    demoStep.value = 0;
                    // 注意：不要清空 demoSteps，保持步骤定义
                    const wasAutoPlaying = demoAutoPlaying.value;
                    demoAutoPlaying.value = false;
                    
                    let expr = '';
                    if (demoType.value === 'combine') {
                        expr = '3x + 2x + 5';
                        setupCombineDemo(expr);
                    } else if (demoType.value === 'distribute') {
                        expr = '3(2x + 5)';
                        setupDistributeDemo(expr);
                    }
                    
                    demoExpression.value = expr;
                    
                    // 如果是自动播放，恢复状态
                    if (wasAutoPlaying) {
                        demoAutoPlaying.value = true;
                    }
                }
                
                // 设置合并同类项演示
                function setupCombineDemo(expr) {
                    const terms = parseExpression(expr);
                    const centerX = demoStage.value.width() / 2;
                    const startX = centerX - (terms.length * 80) / 2;
                    const y = 200;
                    
                    // 创建初始积木
                    terms.forEach((term, index) => {
                        const block = createTermBlock(term, startX + index * 80, y);
                        block.draggable(false); // 演示模式下不可拖拽
                        demoLayer.value.add(block);
                        demoBlocks.value.push(block);
                    });
                    
                    // 设置步骤
                    demoSteps.value = [
                        {
                            text: '观察表达式：' + expr,
                            formula: expr,
                            action: () => highlightAllBlocks()
                        },
                        {
                            text: '找出同类项：3x 和 2x 都含有变量 x',
                            formula: '3x + 2x + 5',
                            action: () => highlightSimilarTerms(['3x', '2x'])
                        },
                        {
                            text: '合并同类项：3x + 2x = (3 + 2)x = 5x',
                            formula: '5x + 5',
                            action: () => animateCombine(['3x', '2x'], '5x')
                        },
                        {
                            text: '最终结果：5x + 5',
                            formula: '5x + 5',
                            action: () => showFinalResult('5x + 5')
                        }
                    ];
                    
                    demoExplanation.value = demoSteps.value[0].text;
                    demoFormula.value = demoSteps.value[0].formula;
                    demoLayer.value.draw();
                }
                
                // 高亮所有积木
                function highlightAllBlocks() {
                    demoBlocks.value.forEach(block => {
                        gsap.to(block, {
                            duration: 0.5,
                            scale: 1.2,
                            yoyo: true,
                            repeat: 1
                        });
                    });
                }
                
                // 高亮同类项
                function highlightSimilarTerms(termTexts) {
                    // 清除之前的高亮
                    demoLayer.value.find('Rect').forEach(rect => {
                        if (rect.fill() === 'yellow') {
                            rect.destroy();
                        }
                    });
                    
                    demoBlocks.value.forEach(block => {
                        const blockText = block.termData.text;
                        // 检查是否匹配（支持不同的格式）
                        const matches = termTexts.some(text => {
                            return blockText === text || 
                                   blockText.replace(/^\+/, '') === text ||
                                   blockText === text.replace(/^\+/, '');
                        });
                        
                        if (matches) {
                            // 添加高亮效果
                            const highlight = new Konva.Rect({
                                x: block.x() - 5,
                                y: block.y() - 5,
                                width: block.width() + 10,
                                height: block.height() + 10,
                                fill: 'yellow',
                                opacity: 0.3,
                                cornerRadius: 10,
                                listening: false
                            });
                            demoLayer.value.add(highlight);
                            highlight.zIndex(0);
                            block.zIndex(1);
                            
                            gsap.to(block, {
                                duration: 0.5,
                                scale: 1.3,
                                yoyo: true,
                                repeat: 2
                            });
                        }
                    });
                    demoLayer.value.draw();
                }
                
                // 动画合并
                function animateCombine(termTexts, resultText) {
                    // 清除之前的高亮
                    demoLayer.value.find('Rect').forEach(rect => {
                        if (rect.fill() === 'yellow') {
                            rect.destroy();
                        }
                    });
                    
                    const blocksToMerge = demoBlocks.value.filter(b => {
                        const blockText = b.termData.text;
                        return termTexts.some(text => {
                            return blockText === text || 
                                   blockText.replace(/^\+/, '') === text ||
                                   blockText === text.replace(/^\+/, '');
                        });
                    });
                    
                    if (blocksToMerge.length < 2) {
                        return;
                    }
                    
                    const block1 = blocksToMerge[0];
                    const block2 = blocksToMerge[1];
                    
                    // 显示合并过程
                    const centerX = (block1.x() + block2.x()) / 2;
                    const centerY = (block1.y() + block2.y()) / 2;
                    
                    // 创建说明文字

                // 格式化项（用于积木显示，不包含+号前缀）
                function formatTerm(coefficient, variable) {
                    if (coefficient === 0) return '0';
                    if (!variable) {
                        // 常数项
                        return coefficient.toString();
                    }
                    if (coefficient === 1) return variable;
                    if (coefficient === -1) return '-' + variable;
                    return coefficient + variable;
                }
                
                // 初始化练习题
                function initPracticeQuestion(question) {
                    // 解析表达式
                    question.terms = parseExpression(question.expression);
                    question.steps = [];
                    question.currentStep = 0;
                }
                
                // 获取当前表达式字符串
                function getCurrentExpression(question) {
                    if (!question.terms || question.terms.length === 0) {
                        return question.expression;
                    }
                    
                    // 排序：变量项在前，常数项在后
                    const sortedTerms = [...question.terms].sort((a, b) => {
                        if (a.isConstant && !b.isConstant) return 1;
                        if (!a.isConstant && b.isConstant) return -1;
                        if (a.variable < b.variable) return -1;
                        if (a.variable > b.variable) return 1;
                        return 0;
                    });
                    
                    return sortedTerms.map(term => formatTermDisplay(term))
                        .join(' ')
                        .replace(/^\+ /, '')
                        .replace(/\s+\+\s+/g, ' + ')
                        .replace(/\s+-\s+/g, ' - ')
                        .replace(/\+ -/g, '-');
                }
                
                // 格式化项显示（用于表达式中的显示）
                function formatTermDisplay(term) {
                    const text = formatTerm(term.coefficient, term.variable);
                    // 如果系数为正，前面加+号和空格；如果为负，已经是-开头了
                    if (term.coefficient > 0) {
                        return '+ ' + text;
                    }
                    return text;
                }
                
                // 获取项的颜色
                function getTermColor(variable) {
                    if (!variable) return '#28a745'; // 绿色 - 常数项
                    if (variable.includes('²')) return '#f39c12'; // 橙色 - x²
                    return '#667eea'; // 蓝色 - x
                }
                
                // 检查是否可以合并
                function canMerge(term, question) {
                    if (!question.terms) return false;
                    
                    // 找到同类项的数量
                    const similarTerms = question.terms.filter(t => 
                        t.variable === term.variable && 
                        (t !== term || question.terms.filter(t2 => t2.variable === term.variable).length > 1)
                    );
                    
                    return similarTerms.length >= 1; // 至少还有一个同类项可以合并
                }
                
                // 合并同类项
                function mergeTermsInPractice(term, question) {
                    if (!question.terms) return;
                    
                    // 找到所有同类项
                    const similarTerms = question.terms.filter(t => t.variable === term.variable);
                    if (similarTerms.length < 2) return;
                    
                    // 计算合并后的系数
                    const totalCoeff = similarTerms.reduce((sum, t) => sum + t.coefficient, 0);
                    
                    // 如果系数为0，直接移除所有同类项
                    if (totalCoeff === 0) {
                        const stepText = similarTerms.map(t => formatTermDisplay(t)).join(' ') + 
                                       ' = 0（抵消）';
                        
                        question.steps.push({
                            text: stepText,
                            result: getCurrentExpressionAfterMerge(question, similarTerms, null)
                        });
                        
                        question.terms = question.terms.filter(t => t.variable !== term.variable);
                        question.userAnswer = getCurrentExpression(question).replace(/^\+ /, '');
                        return;
                    }
                    
                    // 创建新项
                    const newTerm = {
                        coefficient: totalCoeff,
                        variable: term.variable,
                        isConstant: term.isConstant,
                        text: formatTerm(totalCoeff, term.variable)
                    };
                    
                    // 生成合并步骤说明
                    const stepText = similarTerms.map(t => formatTermDisplay(t)).join(' ') + 
                                   ' = ' + formatTermDisplay(newTerm).replace(/^\+ /, '');
                    
                    // 添加到步骤
                    const resultExpr = getCurrentExpressionAfterMerge(question, similarTerms, newTerm);
                    question.steps.push({
                        text: stepText,
                        result: resultExpr
                    });
                    
                    // 移除同类项，添加新项
                    question.terms = question.terms.filter(t => t.variable !== term.variable);
                    question.terms.push(newTerm);
                    
                    // 更新答案
                    question.userAnswer = resultExpr;
                }
                
                // 获取合并后的表达式
                function getCurrentExpressionAfterMerge(question, removedTerms, newTerm) {
                    const remainingTerms = question.terms.filter(t => 
                        !removedTerms.includes(t)
                    );
                    if (newTerm && newTerm.coefficient !== 0) {
                        remainingTerms.push(newTerm);
                    }
                    
                    // 排序：变量项在前，常数项在后
                    remainingTerms.sort((a, b) => {
                        if (a.isConstant && !b.isConstant) return 1;
                        if (!a.isConstant && b.isConstant) return -1;
                        if (a.variable < b.variable) return -1;
                        if (a.variable > b.variable) return 1;
                        return 0;
                    });
                    
                    return remainingTerms.map(term => formatTermDisplay(term))
                        .join(' ')
                        .replace(/^\+ /, '')
                        .replace(/\s+\+\s+/g, ' + ')
                        .replace(/\s+-\s+/g, ' - ')
                        .replace(/\+ -/g, '-');
                }
                
                // 简化表达式
                function simplifyExpression(blocks) {
                    if (!blocks || blocks.length === 0) return '';
                    
                    const termMap = new Map();
                    
                    blocks.forEach(block => {
                        if (!block.termData) return;
                        const key = block.termData.variable || 'constant';
                        const current = termMap.get(key) || 0;
                        termMap.set(key, current + block.termData.coefficient);
                    });
                    
                    const terms = [];
                    termMap.forEach((coef, varKey) => {
                        if (coef === 0) return;
                        const variable = varKey === 'constant' ? '' : varKey;
                        terms.push({ coefficient: coef, variable: variable });
                    });
                    
                    // 排序：常数项放在最后
                    terms.sort((a, b) => {
                        const aIsConst = a.variable === '';
                        const bIsConst = b.variable === '';
                        if (aIsConst && !bIsConst) return 1;
                        if (!aIsConst && bIsConst) return -1;
                        if (a.variable < b.variable) return -1;
                        if (a.variable > b.variable) return 1;
                        return 0;
                    });
                    
                    // 格式化：生成用户友好的格式
                    const formatted = terms.map((term, index) => {
                        const coef = term.coefficient;
                        const varStr = term.variable;
                        
                        if (coef === 0) return '';
                        if (!varStr) {
                            // 常数项
                            if (index === 0) return coef.toString();
                            return coef > 0 ? '+ ' + coef : '- ' + Math.abs(coef);
                        }
                        if (coef === 1) {
                            if (index === 0) return varStr;
                            return '+ ' + varStr;
                        }
                        if (coef === -1) {
                            if (index === 0) return '-' + varStr;
                            return '- ' + varStr;
                        }
                        if (index === 0) {
                            return coef + varStr;
                        }
                        return coef > 0 ? '+ ' + coef + varStr : '- ' + Math.abs(coef) + varStr;
                    }).filter(t => t !== '').join(' ');
                    
                    return formatted;
                }
                
                // 检查答案
                function checkPracticeAnswer(question) {
                    if (!question.userAnswer) return;
                    
                    // 标准化答案格式：去除空格，统一格式
                    const normalize = (str) => {
                        if (!str) return '';
                        // 去除所有空格
                        let normalized = str.trim().replace(/\s+/g, '');
                        // 标准化符号
                        normalized = normalized.replace(/\+\-/g, '-');
                        normalized = normalized.replace(/\-\+/g, '-');
                        // 确保第一个正数项前面有+号（可选，用于比较）
                        if (normalized && normalized[0] !== '-' && normalized[0] !== '+') {
                            normalized = '+' + normalized;
                        }
                        // 排序项（用于比较）
                        return sortExpressionTerms(normalized);
                    };
                    
                    const userAnswer = normalize(question.userAnswer);
                    const correctAnswer = normalize(question.answer);
                    
                    // 比较两个表达式是否等价
                    question.correct = areExpressionsEqual(userAnswer, correctAnswer);
                    
                    // 检查所有题目
                    checkAllAnswers();
                }
                
                // 排序表达式项（用于比较）
                function sortExpressionTerms(expr) {
                    const terms = parseExpression(expr.replace(/^\+/, ''));
                    // 按变量排序，常数项放最后
                    terms.sort((a, b) => {
                        const aIsConst = a.isConstant;
                        const bIsConst = b.isConstant;
                        if (aIsConst && !bIsConst) return 1;
                        if (!aIsConst && bIsConst) return -1;
                        if (a.variable < b.variable) return -1;
                        if (a.variable > b.variable) return 1;
                        return 0;
                    });
                    
                    return terms.map(t => t.text).join('').replace(/^\+/, '');
                }
                
                // 比较两个表达式是否等价
                function areExpressionsEqual(expr1, expr2) {
                    if (expr1 === expr2) return true;
                    
                    const terms1 = parseExpression(expr1.replace(/^\+/, ''));
                    const terms2 = parseExpression(expr2.replace(/^\+/, ''));
                    
                    if (terms1.length !== terms2.length) return false;
                    
                    // 合并同类项
                    const map1 = new Map();
                    terms1.forEach(t => {
                        const key = t.variable || 'constant';
                        map1.set(key, (map1.get(key) || 0) + t.coefficient);
                    });
                    
                    const map2 = new Map();
                    terms2.forEach(t => {
                        const key = t.variable || 'constant';
                        map2.set(key, (map2.get(key) || 0) + t.coefficient);
                    });
                    
                    if (map1.size !== map2.size) return false;
                    
                    for (const [key, value] of map1.entries()) {
                        if (map2.get(key) !== value) return false;
                    }
                    
                    return true;
                }
                
                // 检查所有答案
                function checkAllAnswers() {
                    let correct = 0;
                    practiceQuestions.value.forEach(q => {
                        if (q.correct === true) correct++;
                    });
                    
                    const total = practiceQuestions.value.length;
                    score.value = {
                        show: true,
                        correct: correct,
                        total: total,
                        percentage: Math.round((correct / total) * 100)
                    };
                }
                
                // 重置练习
                function resetPractice(question) {
                    question.userAnswer = '';
                    question.correct = null;
                    question.steps = [];

                                    {left: '$$', right: '$$', display: true},
                                    {left: '$', right: '$', display: false},
                                    {left: '\\[', right: '\\]', display: true},
                                    {left: '\\(', right: '\\)', display: false}
                                ]
                            });
                        }
                    });
                });
                
                onBeforeUnmount(() => {
                    if (demoStage.value) {
                        demoStage.value.destroy();
                    }
                });
                
                return {
                    concepts,
                    demoStage,
                    demoType,
                    demoExpression,
                    demoStep,
                    demoSteps,
                    demoAutoPlaying,
                    demoExplanation,
                    demoFormula,
                    practiceQuestions,
                    score,
                    loadDemoExpression,
                    resetDemo,
                    switchDemoType,
                    nextDemoStep,
                    prevDemoStep,
                    autoPlayDemo,
                    goToStep,
                    checkPracticeAnswer,
                    resetPractice,
                    getCurrentExpression,
                    formatTermDisplay,
                    getTermColor,
                    canMerge,
                    mergeTermsInPractice,
                    initPracticeQuestion
                };
            },
            template: `
                <div class="container">
                    <h1>代数式与项</h1>
                    <p class="subtitle">学习代数式的基本概念和运算方法</p>
                    
                    <!-- 概念讲解 -->
                    <div class="section">
                        <h2>基本概念</h2>
                        <div class="concept-grid">
                            <div class="concept-card" v-for="concept in concepts" :key="concept.title">
                                <h3>{{ concept.title }}</h3>
                                <p>{{ concept.content }}</p>
                                <div class="example">{{ concept.example }}</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 演示区域 -->
                    <div class="section">
                        <h2>交互演示</h2>
                        <div class="demo-area">
                            <div class="demo-controls">
                                <button class="btn btn-primary" @click="switchDemoType('combine')">合并同类项演示</button>
                                <button class="btn btn-primary" @click="switchDemoType('distribute')">分配律演示</button>
                                <button class="btn btn-success" @click="autoPlayDemo">
                                    {{ demoAutoPlaying ? '停止自动播放' : '自动播放' }}
                                </button>
                                <button class="btn btn-secondary" @click="prevDemoStep" :disabled="demoStep === 0">上一步</button>
                                <button class="btn btn-secondary" @click="nextDemoStep" :disabled="demoStep >= demoSteps.length - 1">下一步</button>
                                <button class="btn btn-secondary" @click="resetDemo">重置演示</button>
                            </div>
                            
                            <!-- 步骤指示器 -->
                            <div v-if="demoSteps.length > 0" class="step-indicator">
                                <span style="font-weight: bold; color: #667eea; font-size: 16px;">步骤：</span>
                                <span v-for="(step, index) in demoSteps" :key="index" 
                                      :class="['step-badge', { active: index === demoStep }]"
                                      @click="goToStep(index)">
                                    {{ index + 1 }}
                                </span>
                            </div>
                            
                            <!-- 说明文字 -->
                            <div v-if="demoExplanation" class="demo-explanation">
                                {{ demoExplanation }}
                            </div>
                            
                            <!-- 公式显示 -->
                            <div v-if="demoFormula" class="demo-formula">
                                {{ demoFormula }}
                            </div>
                            
                            <div class="canvas-container">
                                <div id="demo-canvas"></div>
                            </div>
                            
                            <div style="padding: 20px; background: #e9ecef; border-radius: 8px; margin-top: 20px;">
                                <p v-if="demoType === 'combine'"><strong>演示说明：</strong></p>
                                <p v-if="demoType === 'combine'">观察合并同类项的过程。同类项是指含有相同字母且字母指数也相同的项。点击"自动播放"按钮观看完整演示，或使用"上一步"/"下一步"按钮手动控制。</p>
                                
                                <p v-if="demoType === 'distribute'"><strong>演示说明：</strong></p>
                                <p v-if="demoType === 'distribute'">观察分配律的展开过程。分配律：a(b+c) = ab + ac。点击"自动播放"按钮观看完整演示，或使用"上一步"/"下一步"按钮手动控制。</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 练习区域 -->
                    <div class="section">
                        <h2>小练习</h2>
                        
                        <!-- 操作说明 -->
                        <div style="background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); padding: 20px; border-radius: 10px; margin-bottom: 30px; border-left: 5px solid #2196f3;">
                            <h3 style="color: #1976d2; margin-bottom: 15px; font-size: 1.3em;">📋 操作说明</h3>
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; color: #333;">
                                <div>
                                    <strong style="color: #1976d2;">🎯 目标：</strong>
                                    <p>通过点击合并同类项，逐步化简代数式</p>
                                </div>
                                <div>
                                    <strong style="color: #1976d2;">✨ 操作步骤：</strong>
                                    <ol style="margin: 5px 0; padding-left: 20px;">
                                        <li>观察各项，找出同类项（变量相同）</li>
                                        <li>点击同类项旁边的合并按钮</li>
                                        <li>查看合并过程</li>
                                        <li>继续合并直到无法再合并</li>
                                        <li>输入最终化简结果</li>
                                    </ol>
                                </div>
                            </div>
                        </div>
                        
                        <div v-for="question in practiceQuestions" :key="question.id" class="practice-question">
                            <h4>题目 {{ question.id }}：化简 <span style="color: #667eea; font-size: 1.1em; font-weight: bold;">{{ question.expression }}</span></h4>
                            
                            <!-- 当前表达式展示 -->
                            <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin: 20px 0; border: 2px solid #667eea;">
                                <div style="margin-bottom: 15px;">
                                    <strong style="color: #667eea; font-size: 16px;">当前表达式：</strong>
                                    <span style="font-size: 24px; font-weight: bold; color: #333; margin-left: 10px;">
                                        {{ getCurrentExpression(question) }}
                                    </span>
                                </div>
                                
                                <!-- 各项展示 -->
                                <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px;">
                                    <div v-for="(term, index) in question.terms" :key="index" 
                                         :style="{
                                             padding: '12px 20px',
                                             background: getTermColor(term.variable),
                                             color: 'white',
                                             borderRadius: '8px',
                                             fontWeight: 'bold',
                                             fontSize: '18px',
                                             display: 'flex',
                                             alignItems: 'center',
                                             gap: '10px',
                                             boxShadow: '0 2px 8px rgba(0,0,0,0.2)'
                                         }">
                                        <span>{{ formatTermDisplay(term) }}</span>
                                        <button v-if="canMerge(term, question)" 
                                                @click="mergeTermsInPractice(term, question)"
                                                style="background: rgba(255,255,255,0.3); border: 2px solid white; color: white; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px;">
                                            合并同类项
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 合并步骤展示 -->
                            <div v-if="question.steps.length > 0" style="background: #fff; padding: 20px; border-radius: 10px; margin: 20px 0; border-left: 5px solid #28a745;">
                                <strong style="color: #28a745; font-size: 16px; margin-bottom: 15px; display: block;">合并步骤：</strong>
                                <div v-for="(step, index) in question.steps" :key="index" 
                                     style="padding: 12px; background: #f8f9fa; margin-bottom: 10px; border-radius: 8px; border-left: 3px solid #28a745;">
                                    <div style="font-size: 18px; font-weight: bold; color: #333;">
                                        {{ step.text }}
                                    </div>
                                    <div style="margin-top: 5px; color: #666; font-size: 14px;">
                                        结果：{{ step.result }}
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 答案输入 -->
                            <div class="answer-area" style="margin-top: 20px;">
                                <label style="font-weight: bold; font-size: 16px;">化简结果：</label>
                                <input 
                                    type="text" 
                                    v-model="question.userAnswer" 
                                    placeholder="例如：5x - 5"
                                    @keyup.enter="checkPracticeAnswer(question)"
                                    style="margin-left: 10px;"
                                />
                                <button class="btn btn-success" @click="checkPracticeAnswer(question)" style="margin-left: 10px;">提交答案</button>
                                <button class="btn btn-secondary" @click="resetPractice(question)" style="margin-left: 10px;">重置</button>
                            </div>
                            
                            <div v-if="question.correct === true" class="answer-feedback correct">
                                ✓ 回答正确！
                            </div>
                            <div v-if="question.correct === false" class="answer-feedback incorrect">
                                ✗ 回答错误。正确答案是：{{ question.answer }}
                            </div>
                        </div>
                    </div>
                    
                    <!-- 分数显示 -->
                    <div v-if="score.show" class="score-card" @click="score.show = false">
                        <h3>练习结果</h3>
                        <div class="score-number">{{ score.correct }}/{{ score.total }}</div>
                        <p style="font-size: 1.2em; color: #666;">正确率：{{ score.percentage }}%</p>
                        <p style="margin-top: 20px; color: #999; cursor: pointer;">点击关闭</p>
                    </div>
                </div>
            `
        }).mount('#app');
    </script>
</body>
</html>
