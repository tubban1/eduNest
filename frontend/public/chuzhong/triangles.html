<body>

    <!-- Vue 3.5.20 -->

            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    
    <!-- Konva -->

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    
    <!-- KaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.auto-render.min.js'"></script>
    
    <script>
        const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;
        
        createApp({
            setup() {
                // 三角形三边
                const sideA = ref(80);
                const sideB = ref(100);
                const sideC = ref(120);
                
                // 图形
                const triangleStage = ref(null);
                const triangleLayer = ref(null);
                const proofStage = ref(null);
                const proofLayer = ref(null);
                
                // 内角和证明动画
                const currentProofStep = ref(0);
                const isAnimatingProof = ref(false);
                const proofSteps = ref([]);
                const proofElements = ref({
                    triangle: null,
                    vertices: [],
                    labels: [],
                    angles: [],
                    parallelLine: null,
                    angle1Arc: null,
                    angle2Arc: null,
                    highlights: []
                });
                
                // 练习题目
                const practiceQuestions = ref([
                    {
                        id: 1,
                        question: '三角形的内角和是多少度？',
                        answer: '180',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 2,
                        question: '三边长分别为 3、4、5 的三角形是什么三角形？',
                        answer: '直角三角形',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 3,
                        question: '一个三角形的两个内角分别是 60° 和 80°，第三个内角是多少度？',
                        answer: '40',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 4,
                        question: '三角形三边必须满足什么条件？',
                        answer: '任意两边之和大于第三边',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 5,
                        question: '等腰三角形的两个底角有什么关系？',
                        answer: '相等',
                        userAnswer: '',
                        correct: null
                    }
                ]);
                
                // 计算三角形顶点坐标
                const triangleVertices = computed(() => {
                    const a = sideA.value;
                    const b = sideB.value;
                    const c = sideC.value;
                    
                    // 检查三角形不等式
                    if (a + b <= c || a + c <= b || b + c <= a) {
                        return null; // 无法构成三角形
                    }
                    
                    // 使用余弦定理计算角度
                    const angleA = Math.acos((b * b + c * c - a * a) / (2 * b * c));
                    const angleB = Math.acos((a * a + c * c - b * b) / (2 * a * c));
                    
                    // 计算顶点坐标（以 A 为原点，AB 在 x 轴上）
                    const A = { x: 0, y: 0 };
                    const B = { x: c, y: 0 };
                    const C = {
                        x: b * Math.cos(angleA),
                        y: b * Math.sin(angleA)
                    };
                    
                    return { A, B, C, angleA, angleB };
                });
                
                // 计算内角
                const angles = computed(() => {
                    const vertices = triangleVertices.value;
                    if (!vertices) return { A: 0, B: 0, C: 0 };
                    
                    const a = sideA.value;
                    const b = sideB.value;
                    const c = sideC.value;
                    
                    // 使用余弦定理
                    const angleA = Math.acos((b * b + c * c - a * a) / (2 * b * c)) * 180 / Math.PI;
                    const angleB = Math.acos((a * a + c * c - b * b) / (2 * a * c)) * 180 / Math.PI;
                    const angleC = 180 - angleA - angleB;
                    
                    return {
                        A: angleA,
                        B: angleB,
                        C: angleC
                    };
                });
                
                // 内角和
                const angleSum = computed(() => {
                    const ang = angles.value;
                    return ang.A + ang.B + ang.C;
                });
                
                // 三角形分类
                const triangleType = computed(() => {
                    const vertices = triangleVertices.value;
                    if (!vertices) return '无法构成三角形';
                    
                    const a = sideA.value;
                    const b = sideB.value;
                    const c = sideC.value;
                    const ang = angles.value;
                    
                    // 按边分类
                    let bySide = '';
                    if (a === b && b === c) {
                        bySide = '等边三角形';
                    } else if (a === b || b === c || a === c) {
                        bySide = '等腰三角形';
                    } else {
                        bySide = '不等边三角形';
                    }
                    
                    // 按角分类
                    let byAngle = '';
                    if (Math.abs(ang.A - 90) < 0.1 || Math.abs(ang.B - 90) < 0.1 || Math.abs(ang.C - 90) < 0.1) {
                        byAngle = '直角三角形';
                    } else if (ang.A < 90 && ang.B < 90 && ang.C < 90) {
                        byAngle = '锐角三角形';
                    } else {
                        byAngle = '钝角三角形';
                    }
                    
                    return bySide + '，' + byAngle;
                });
                
                // 检查三角形不等式
                const triangleInequality = computed(() => {
                    const a = sideA.value;
                    const b = sideB.value;
                    const c = sideC.value;
                    
                    return {
                        valid: a + b > c && a + c > b && b + c > a,
                        conditions: [
                            { condition: `a + b > c`, result: `${a} + ${b} > ${c}`, valid: a + b > c },
                            { condition: `a + c > b`, result: `${a} + ${c} > ${b}`, valid: a + c > b },
                            { condition: `b + c > a`, result: `${b} + ${c} > ${a}`, valid: b + c > a }
                        ]
                    };
                });
                
                // 绘制三角形
                function drawTriangle() {
                    if (!triangleLayer.value) return;
                    
                    triangleLayer.value.destroyChildren();
                    
                    const width = triangleStage.value.width();
                    const height = triangleStage.value.height();
                    
                    const vertices = triangleVertices.value;
                    if (!vertices) {
                        const errorText = new Konva.Text({
                            x: width / 2,
                            y: height / 2,
                            text: '无法构成三角形\n请调整三边长度',
                            fontSize: 24,
                            fill: '#f44336',
                            fontStyle: 'bold',
                            align: 'center',
                            offsetX: 150,
                            offsetY: 20
                        });
                        triangleLayer.value.add(errorText);
                        triangleLayer.value.draw();
                        return;
                    }
                    
                    // 计算缩放和居中
                    const margin = 80;
                    const scale = Math.min(
                        (width - 2 * margin) / Math.max(vertices.B.x, vertices.C.x),
                        (height - 2 * margin) / Math.max(vertices.A.y, vertices.B.y, vertices.C.y)
                    );
                    
                    const centerX = width / 2;
                    const centerY = height / 2;
                    
                    const A = {
                        x: centerX + (vertices.A.x - vertices.B.x / 2) * scale,
                        y: centerY + (vertices.A.y - vertices.C.y / 2) * scale
                    };
                    const B = {
                        x: centerX + (vertices.B.x - vertices.B.x / 2) * scale,
                        y: centerY + (vertices.B.y - vertices.C.y / 2) * scale
                    };
                    const C = {
                        x: centerX + (vertices.C.x - vertices.B.x / 2) * scale,
                        y: centerY + (vertices.C.y - vertices.C.y / 2) * scale
                    };
                    
                    // 绘制三角形
                    const triangle = new Konva.Line({
                        points: [A.x, A.y, B.x, B.y, C.x, C.y, A.x, A.y],
                        closed: true,
                        fill: 'rgba(102, 126, 234, 0.2)',
                        stroke: '#667eea',
                        strokeWidth: 3,
                        name: 'triangle'
                    });
                    triangleLayer.value.add(triangle);
                    
                    // 绘制顶点
                    const vertexA = new Konva.Circle({
                        x: A.x,
                        y: A.y,
                        radius: 6,
                        fill: '#f57c00',
                        stroke: '#fff',
                        strokeWidth: 2,
                        name: 'vertex'
                    });
                    triangleLayer.value.add(vertexA);
                    
                    const vertexB = new Konva.Circle({
                        x: B.x,
                        y: B.y,
                        radius: 6,
                        fill: '#f57c00',
                        stroke: '#fff',
                        strokeWidth: 2,
                        name: 'vertex'
                    });
                    triangleLayer.value.add(vertexB);
                    
                    const vertexC = new Konva.Circle({
                        x: C.x,
                        y: C.y,
                        radius: 6,
                        fill: '#f57c00',
                        stroke: '#fff',
                        strokeWidth: 2,
                        name: 'vertex'
                    });
                    triangleLayer.value.add(vertexC);
                    
                    // 绘制边标签
                    const midAB = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
                    const labelAB = new Konva.Text({
                        x: midAB.x,
                        y: midAB.y - 20,
                        text: 'c = ' + sideC.value,
                        fontSize: 14,
                        fill: '#333',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 3,
                        name: 'label'
                    });
                    triangleLayer.value.add(labelAB);
                    
                    const midBC = { x: (B.x + C.x) / 2, y: (B.y + C.y) / 2 };
                    const labelBC = new Konva.Text({
                        x: midBC.x,
                        y: midBC.y + 10,
                        text: 'a = ' + sideA.value,
                        fontSize: 14,
                        fill: '#333',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 3,
                        name: 'label'
                    });
                    triangleLayer.value.add(labelBC);
                    
                    const midCA = { x: (C.x + A.x) / 2, y: (C.y + A.y) / 2 };
                    const labelCA = new Konva.Text({
                        x: midCA.x - 30,
                        y: midCA.y - 10,
                        text: 'b = ' + sideB.value,
                        fontSize: 14,
                        fill: '#333',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 3,
                        name: 'label'
                    });
                    triangleLayer.value.add(labelCA);
                    
                    // 绘制角度标签
                    const ang = angles.value;
                    const angleLabelA = new Konva.Text({
                        x: A.x - 35,
                        y: A.y - 35,
                        text: ang.A.toFixed(1) + '°',
                        fontSize: 16,
                        fill: '#ff5722',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 5,
                        name: 'angleLabel'
                    });
                    triangleLayer.value.add(angleLabelA);
                    
                    const angleLabelB = new Konva.Text({
                        x: B.x + 10,
                        y: B.y - 35,
                        text: ang.B.toFixed(1) + '°',
                        fontSize: 16,
                        fill: '#ff5722',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 5,
                        name: 'angleLabel'
                    });
                    triangleLayer.value.add(angleLabelB);
                    
                    const angleLabelC = new Konva.Text({
                        x: C.x + 10,
                        y: C.y + 10,
                        text: ang.C.toFixed(1) + '°',
                        fontSize: 16,
                        fill: '#ff5722',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.9)',
                        cornerRadius: 5,
                        name: 'angleLabel'
                    });
                    triangleLayer.value.add(angleLabelC);
                    
                    // 绘制角度弧
                    function drawAngleArc(center, startAngle, endAngle, radius, color) {
                        const arcPoints = [];
                        const steps = 20;
                        for (let i = 0; i <= steps; i++) {
                            const angle = startAngle + (endAngle - startAngle) * i / steps;
                            const rad = angle * Math.PI / 180;
                            const x = center.x + radius * Math.cos(rad);
                            const y = center.y + radius * Math.sin(rad);
                            arcPoints.push(x, y);
                        }
                        
                        const arc = new Konva.Line({
                            points: arcPoints,
                            stroke: color,
                            strokeWidth: 2,
                            name: 'arc'
                        });
                        triangleLayer.value.add(arc);
                    }
                    
                    // 计算各顶点的角度弧
                    const angleA = Math.atan2(C.y - A.y, C.x - A.x) * 180 / Math.PI;
                    const angleB = Math.atan2(A.y - B.y, A.x - B.x) * 180 / Math.PI;
                    const angleC = Math.atan2(B.y - C.y, B.x - C.x) * 180 / Math.PI;
                    
                    drawAngleArc(A, angleA, angleA + ang.A, 25, '#ff5722');
                    drawAngleArc(B, angleB, angleB + ang.B, 25, '#ff5722');
                    drawAngleArc(C, angleC, angleC + ang.C, 25, '#ff5722');
                    
                    triangleLayer.value.draw();
                }
                
                // 重置证明动画
                function resetProof() {
                    if (proofLayer.value) {
                        proofLayer.value.destroyChildren();
                    }
                    currentProofStep.value = 0;
                    isAnimatingProof.value = false;
                    proofElements.value = {
                        triangle: null,
                        vertices: [],
                        labels: [],
                        angles: [],
                        parallelLine: null,
                        angle1Arc: null,
                        angle2Arc: null,
                        highlights: []
                    };
                }
                
                // 下一步证明步骤
                function nextProofStep() {
                    if (currentProofStep.value >= 4) return;
                    currentProofStep.value++;
                    showProofStep(currentProofStep.value);
                }
                
                // 上一步证明步骤
                function prevProofStep() {
                    if (currentProofStep.value <= 0) return;
                    currentProofStep.value--;
                    showProofStep(currentProofStep.value);
                }
                
                // 显示特定步骤
                function showProofStep(step) {
                    if (!proofLayer.value) return;
                    
                    const vertices = triangleVertices.value;
                    if (!vertices) return;
                    
                    const width = proofStage.value.width();
                    const height = proofStage.value.height();
                    
                    // 计算三角形位置
                    const margin = 80;
                    const scale = Math.min(
                        (width - 2 * margin) / Math.max(vertices.B.x, vertices.C.x),
                        (height - 2 * margin) / Math.max(vertices.A.y, vertices.B.y, vertices.C.y)
                    );
                    
                    const centerX = width / 2;
                    const centerY = height / 2;
                    
                    const A = {
                        x: centerX + (vertices.A.x - vertices.B.x / 2) * scale,
                        y: centerY + (vertices.A.y - vertices.C.y / 2) * scale
                    };
                    const B = {
                        x: centerX + (vertices.B.x - vertices.B.x / 2) * scale,
                        y: centerY + (vertices.B.y - vertices.C.y / 2) * scale
                    };
                    const C = {
                        x: centerX + (vertices.C.x - vertices.B.x / 2) * scale,
                        y: centerY + (vertices.C.y - vertices.C.y / 2) * scale
                    };
                    
                    const ang = angles.value;
                    
                    // 清除旧内容

                    // 绘制角度标注的辅助函数
                    function drawAngleArc(center, startAngle, endAngle, radius, color) {
                        const arcPoints = [];
                        const steps = 20;
                        for (let i = 0; i <= steps; i++) {
                            const angle = startAngle + (endAngle - startAngle) * i / steps;
                            const rad = angle * Math.PI / 180;
                            const x = center.x + radius * Math.cos(rad);
                            const y = center.y + radius * Math.sin(rad);
                            arcPoints.push(x, y);

                        const arc = new Konva.Line({
                            points: arcPoints,
                            stroke: color,
                            strokeWidth: 2,
                            name: 'arc'
                        });
                        proofLayer.value.add(arc);
                        return arc;

                    // 步骤2：显示平行线

                        // ∠2
                        let angle2Start = acDir * 180 / Math.PI;
                        let angle2End = (bcDir + Math.PI) * 180 / Math.PI;
                        let angle2Diff = angle2End - angle2Start;
                        if (angle2Diff > 180) angle2Diff -= 360;
                        if (angle2Diff < -180) angle2Diff += 360;

                    // 步骤4：显示结论
                    if (step >= 4) {
                        const conclusion = new Konva.Text({

                // 自动播放证明动画
                function animateProof() {
                    if (isAnimatingProof.value || typeof gsap === 'undefined') return;
                    
                    isAnimatingProof.value = true;
                    currentProofStep.value = 0;
                    
                    const vertices = triangleVertices.value;

                        return;

                    if (!proofLayer.value) {

                    // 步骤3：标记同位角和内错角

                        // ∠2：在平行线和 AC 之间（与 ∠C 是内错角）

                        let angle2Start = acDir * 180 / Math.PI;

                        // 确保角度在正确的范围内
                        let angle2Diff = angle2End - angle2Start;

                        angle2End = angle2Start + angle2Diff;
                        
                        const angle2ArcEl = drawAngleArc(A, angle2Start, angle2End, 40, '#ff9800');
                        angle2ArcEl.strokeWidth(3);
                        angle2ArcEl.opacity(0);
                        
                        // ∠2 标签位置（在角度弧的中点）
                        const angle2LabelAngle = (angle2Start + angle2End) / 2;
                        const angle2LabelRad = angle2LabelAngle * Math.PI / 180;
                        const angle2LabelX = A.x + 55 * Math.cos(angle2LabelRad);
                        const angle2LabelY = A.y + 55 * Math.sin(angle2LabelRad);
                        
                        const angle2 = new Konva.Text({
                            x: angle2LabelX,
                            y: angle2LabelY - 10,
                            text: '∠2',
                            fontSize: 18,
                            fill: '#ff9800',
                            fontStyle: 'bold',
                            padding: 5,
                            background: 'rgba(255,255,255,0.95)',
                            cornerRadius: 5,
                            opacity: 0,
                            name: 'angle2',
                            offsetX: 15,
                            offsetY: 10
                        });
                        proofLayer.value.add(angle2);
                        
                        const angle2Equality = new Konva.Text({
                            x: A.x - 150,
                            y: A.y - 40,
                            text: '∠2 = ∠C (内错角)',
                            fontSize: 16,
                            fill: '#ff9800',
                            fontStyle: 'bold',
                            padding: 8,
                            background: 'rgba(255,255,255,0.95)',
                            cornerRadius: 5,
                            opacity: 0,
                            name: 'angle2Equality',
                            offsetX: 70
                        });
                        proofLayer.value.add(angle2Equality);
                        
                        // 高亮显示 ∠B（用更粗的弧线）
                        const angleBHighlight = drawAngleArc(B, angleB_rad, angleB_rad + ang.B, 50, '#ff5722');
                        angleBHighlight.strokeWidth(4);
                        angleBHighlight.opacity(0);
                        
                        // 高亮显示 ∠C（用更粗的弧线）
                        const angleCHighlight = drawAngleArc(C, angleC_rad, angleC_rad + ang.C, 50, '#ff9800');
                        angleCHighlight.strokeWidth(4);
                        angleCHighlight.opacity(0);
                        
                        // 动画显示
                        gsap.to([angle1ArcEl, angle1, angle1Equality, angleBHighlight], {
                            opacity: 1,
                            duration: 0.8,
                            ease: 'power2.out'
                        });
                        
                        setTimeout(() => {
                            gsap.to([angle2ArcEl, angle2, angle2Equality, angleCHighlight], {
                                opacity: 1,
                                duration: 0.8,
                                ease: 'power2.out',
                                onComplete: () => {
                                    currentProofStep.value = 3;
                                }
                            });
                        }, 800);
                    }, 3000);
                    
                    // 步骤4：显示结论
                    setTimeout(() => {
                        const conclusion = new Konva.Text({
                            x: width / 2,
                            y: height - 60,
                            text: `∠A + ∠B + ∠C = ∠A + ∠1 + ∠2 = 180°`,
                            fontSize: 20,
                            fill: '#f57c00',
                            fontStyle: 'bold',
                            padding: 10,
                            background: 'rgba(255,255,255,0.95)',
                            cornerRadius: 8,
                            align: 'center',
                            offsetX: 180,
                            offsetY: 15,
                            opacity: 0,
                            name: 'conclusion'
                        });
                        proofLayer.value.add(conclusion);
                        
                        gsap.to(conclusion, {
                            opacity: 1,
                            scale: 1.1,
                            duration: 0.8,
                            yoyo: true,
                            repeat: 1,
                            ease: 'power2.inOut',
                            onComplete: () => {
                                currentProofStep.value = 4;
                                isAnimatingProof.value = false;
                            }
                        });
                    }, 4500);
                }
                
                // 初始化三角形画布
                function initTriangleCanvas() {
                    const container = document.getElementById('triangle-canvas');
                    if (!container || triangleStage.value) return;
                    
                    const width = container.offsetWidth;
                    const height = 600;
                    
                    triangleStage.value = new Konva.Stage({
                        container: 'triangle-canvas',
                        width: width,
                        height: height
                    });
                    
                    triangleLayer.value = new Konva.Layer();
                    triangleStage.value.add(triangleLayer.value);
                    
                    drawTriangle();
                }
                
                // 初始化证明画布
                function initProofCanvas() {
                    const container = document.getElementById('proof-canvas');
                    if (!container || proofStage.value) return;
                    
                    const width = container.offsetWidth;
                    const height = 600;
                    
                    proofStage.value = new Konva.Stage({
                        container: 'proof-canvas',
                        width: width,
                        height: height
                    });
                    
                    proofLayer.value = new Konva.Layer();
                    proofStage.value.add(proofLayer.value);
                }
                
                // 检查练习答案
                function checkAnswer(question) {
                    const userAns = question.userAnswer.trim().toLowerCase().replace(/\s+/g, '');
                    const correctAns = question.answer.trim().toLowerCase().replace(/\s+/g, '');
                    question.correct = userAns === correctAns;
                }
                
                // 计算得分
                const score = computed(() => {
                    if (!practiceQuestions.value || practiceQuestions.value.length === 0) {
                        return { correct: 0, total: 0 };
                    }
                    const total = practiceQuestions.value.length;
                    const correct = practiceQuestions.value.filter(q => q.correct === true).length;
                    return { correct, total };
                });
                
                // 监听三边变化
                Vue.watch([sideA, sideB, sideC], () => {
                    if (triangleLayer.value) {
                        drawTriangle();
                    }
                });
                
                onMounted(() => {
                    nextTick(() => {
                        initTriangleCanvas();
                        initProofCanvas();
                        
                        // 监听窗口大小变化
                        window.addEventListener('resize', () => {
                            if (triangleStage.value) {
                                const container = document.getElementById('triangle-canvas');
                                if (container) {
                                    triangleStage.value.width(container.offsetWidth);
                                    drawTriangle();
                                }
                            }
                            if (proofStage.value) {
                                const container = document.getElementById('proof-canvas');
                                if (container) {
                                    proofStage.value.width(container.offsetWidth);
                                }
                            }
                        });
                        
                        // 自动渲染 KaTeX
                        nextTick(() => {
                            setTimeout(() => {
                                if (typeof renderMathInElement !== 'undefined') {
                                    try {
                                        renderMathInElement(document.body, {
                                            delimiters: [
                                                {left: '$$', right: '$$', display: true},
                                                {left: '$', right: '$', display: false},
                                                {left: '\\[', right: '\\]', display: true},
                                                {left: '\\(', right: '\\)', display: false}
                                            ],
                                            throwOnError: false
                                        });
                                    } catch (e) {
                                        console.error('KaTeX 渲染错误:', e);
                                    }
                                }
                                
                                // 手动渲染 .katex-static 元素
                                if (typeof katex !== 'undefined') {
                                    const katexStaticElements = document.querySelectorAll('.katex-static');
                                    katexStaticElements.forEach(el => {
                                        const formula = el.getAttribute('data-formula');
                                        if (formula && !el.querySelector('.katex-html')) {
                                            try {
                                                katex.render(formula, el, {
                                                    throwOnError: false
                                                });
                                            } catch (e) {
                                                console.error('KaTeX 静态公式渲染错误:', e);
                                            }
                                        }
                                    });
                                }
                            }, 100);
                        });
                    });
                });
                
                return {
                    sideA,
                    sideB,
                    sideC,
                    angles,
                    angleSum,
                    triangleType,
                    triangleInequality,
                    triangleVertices,
                    currentProofStep,
                    isAnimatingProof,
                    practiceQuestions,
                    score,
                    animateProof,
                    resetProof,
                    nextProofStep,
                    prevProofStep,
                    checkAnswer
                };
            },
            template: `
                <div class="container">
                    <h1>△ 三角形</h1>
                    <p class="subtitle">探索三角形的奥秘</p>
                    
                    <!-- 基本概念 -->
                    <div class="section">
                        <h2>📚 基本概念</h2>
                        <div class="concept-grid">
                            <div class="concept-card">
                                <h3>三角形定义</h3>
                                <p>由不在同一直线上的三条线段首尾顺次连接所组成的封闭图形</p>
                                <p style="margin-top: 10px; color: #666;">三个顶点：A、B、C</p>
                                <p style="color: #666;">三条边：a、b、c</p>
                                <p style="color: #666;">三个内角：∠A、∠B、∠C</p>
                            </div>
                            <div class="concept-card">
                                <h3>按边分类</h3>
                                <p><strong>等边三角形：</strong>三边相等</p>
                                <p><strong>等腰三角形：</strong>有两边相等</p>
                                <p><strong>不等边三角形：</strong>三边都不相等</p>
                            </div>
                            <div class="concept-card">
                                <h3>按角分类</h3>
                                <p><strong>锐角三角形：</strong>三个内角都小于 90°</p>
                                <p><strong>直角三角形：</strong>有一个内角等于 90°</p>
                                <p><strong>钝角三角形：</strong>有一个内角大于 90°</p>
                            </div>
                            <div class="concept-card">
                                <h3>内角和定理</h3>
                                <p>三角形三个内角的和等于 180°</p>
                                <p style="margin-top: 10px; color: #667eea; font-weight: bold;">
                                    <span class="katex-static" data-formula="\\angle A + \\angle B + \\angle C = 180°"></span>
                                </p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 三角形构建 -->
                    <div class="section">
                        <h2>🔧 构造三角形</h2>
                        <div class="canvas-container">
                            <div class="controls">
                                <div class="slider-group">
                                    <label>边 a:</label>
                                    <input type="range" v-model.number="sideA" min="20" max="200" step="5">
                                    <span class="slider-value">{{ sideA }}</span>
                                </div>
                                <div class="slider-group">
                                    <label>边 b:</label>
                                    <input type="range" v-model.number="sideB" min="20" max="200" step="5">
                                    <span class="slider-value">{{ sideB }}</span>
                                </div>
                                <div class="slider-group">
                                    <label>边 c:</label>
                                    <input type="range" v-model.number="sideC" min="20" max="200" step="5">
                                    <span class="slider-value">{{ sideC }}</span>
                                </div>
                            </div>
                            
                            <div id="triangle-canvas" class="canvas-wrapper"></div>
                            
                            <div class="info-panel">
                                <div class="info-item">
                                    <strong>三角形类型：</strong>{{ triangleType }}
                                </div>
                                <div class="info-item">
                                    <strong>内角：</strong>
                                    ∠A = {{ angles.A.toFixed(1) }}°，
                                    ∠B = {{ angles.B.toFixed(1) }}°，
                                    ∠C = {{ angles.C.toFixed(1) }}°
                                </div>
                                <div class="info-item">
                                    <strong>内角和：</strong>{{ angleSum.toFixed(1) }}°
                                </div>
                                <div class="info-item">
                                    <strong>三角形不等式：</strong>
                                    <span v-if="triangleInequality.valid" style="color: #28a745;">✓ 满足</span>
                                    <span v-else style="color: #dc3545;">✗ 不满足（无法构成三角形）</span>
                                    <ul style="margin-top: 10px; padding-left: 20px; color: #666;">
                                        <li v-for="(cond, index) in triangleInequality.conditions" :key="index">
                                            {{ cond.condition }}：{{ cond.result }}
                                            <span v-if="cond.valid" style="color: #28a745;">✓</span>
                                            <span v-else style="color: #dc3545;">✗</span>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 内角和证明 -->
                    <div class="section">
                        <h2>📐 内角和为 180° 的证明</h2>
                        <div class="canvas-container">
                            <div class="controls">
                                <button class="btn" @click="resetProof" :disabled="isAnimatingProof">重置</button>
                                <button class="btn btn-secondary" @click="prevProofStep" :disabled="currentProofStep <= 0 || isAnimatingProof">上一步</button>
                                <button class="btn btn-secondary" @click="nextProofStep" :disabled="currentProofStep >= 4 || isAnimatingProof || !triangleVertices">下一步</button>
                                <button class="btn" @click="animateProof" :disabled="isAnimatingProof || !triangleVertices">
                                    {{ isAnimatingProof ? '播放中...' : '自动播放' }}
                                </button>
                            </div>
                            
                            <div id="proof-canvas" class="canvas-wrapper"></div>
                            
                            <div class="proof-steps" v-if="currentProofStep >= 1">
                                <h4>步骤 {{ currentProofStep }} / 4</h4>
                                <p v-if="currentProofStep === 1">显示原始三角形 ABC，标注三个内角</p>
                                <p v-if="currentProofStep === 2">过顶点 A 作边 BC 的平行线</p>
                                <p v-if="currentProofStep === 3">根据平行线性质，标记同位角：∠1 = ∠B（同位角），∠2 = ∠C（内错角）</p>
                                <p v-if="currentProofStep === 4">因为平行线，∠A + ∠1 + ∠2 = 180°（平角），所以 ∠A + ∠B + ∠C = 180°</p>
                            </div>
                            <div class="proof-steps" v-else>
                                <p style="color: #666;">点击"下一步"或"自动播放"开始证明</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 外角定理 -->
                    <div class="section">
                        <h2>🔗 外角定理</h2>
                        <div class="concept-grid">
                            <div class="concept-card">
                                <h3>外角定义</h3>
                                <p>三角形的一个外角等于与它不相邻的两个内角的和</p>
                                <p style="margin-top: 10px; color: #667eea; font-weight: bold;">
                                    <span class="katex-static" data-formula="\\angle 外角 = \\angle B + \\angle C"></span>
                                </p>
                            </div>
                            <div class="concept-card">
                                <h3>外角性质</h3>
                                <p>三角形的一个外角大于与它不相邻的任何一个内角</p>
                                <p style="margin-top: 10px; color: #666;">外角 = 180° - 相邻内角</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 三角形不等式 -->
                    <div class="section">
                        <h2>📏 三角形不等式</h2>
                        <div class="concept-card" style="max-width: 800px; margin: 0 auto;">
                            <h3>三边关系</h3>
                            <p>三角形任意两边的和大于第三边</p>
                            <p style="margin-top: 10px; color: #667eea; font-weight: bold;">
                                <span class="katex-static" data-formula="a + b > c"></span>
                                <br>
                                <span class="katex-static" data-formula="a + c > b"></span>
                                <br>
                                <span class="katex-static" data-formula="b + c > a"></span>
                            </p>
                            <p style="margin-top: 15px; color: #666;">这是构成三角形的必要条件</p>
                        </div>
                    </div>
                    
                    <!-- 练习 -->
                    <div class="section">
                        <h2>✏️ 练习</h2>
                        <div class="practice-area">
                            <div v-for="question in practiceQuestions" :key="question.id" 
                                 :class="['practice-question', question.correct === true ? 'correct' : question.correct === false ? 'incorrect' : '']">
                                <h3>{{ question.question }}</h3>
                                <div class="controls">
                                    <input type="text" v-model="question.userAnswer" class="answer-input" placeholder="输入答案">
                                    <button class="btn" @click="checkAnswer(question)">检查</button>
                                </div>
                                <div v-if="question.correct === true" class="feedback correct">
                                    ✓ 正确！
                                </div>
                                <div v-if="question.correct === false" class="feedback incorrect">
                                    ✗ 错误，正确答案是：{{ question.answer }}
                                </div>
                            </div>
                            
                            <div style="margin-top: 30px; padding: 20px; background: #e3f2fd; border-radius: 10px;">
                                <h3 style="color: #1976d2;">得分：{{ score.correct }} / {{ score.total }}</h3>
                            </div>
                        </div>
                    </div>
                </div>
            `
        }).mount('#app');
    </script>
</body>
</html>
