<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>四边形 - 初中数学教学</title>
    <meta name="description" content="学习四边形的基本概念，理解平行四边形、矩形、菱形、正方形、梯形的性质和特征，掌握多边形内角和公式的应用。">
    <meta name="keywords" content="四边形,平行四边形,矩形,菱形,正方形,梯形,多边形内角和,对边平行,对角相等,初中数学">
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" 
          onerror="this.onerror=null; this.href='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.css'">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.2em;
        }
        
        .section {
            margin-bottom: 50px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .concept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

        .concept-card {
            background: white;

            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .concept-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .concept-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .canvas-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 600px;
            background: #f8f9fa;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .controls {
            display: flex;
            gap: 15px;

        .btn {

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .info-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .info-item {
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }
        
        .info-item strong {
            color: #667eea;
            margin-right: 10px;
        }
        
        .property-list {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .property-list li {
            margin: 5px 0;
            color: #666;
        }
        
        .practice-area {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
        }
        
        .practice-question {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }
        
        .practice-question.correct {
            border-color: #28a745;
            background: #d4edda;
        }
        
        .practice-question.incorrect {
            border-color: #dc3545;
            background: #f8d7da;
        }
        
        .answer-input {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 16px;
            width: 200px;
            margin: 10px;
        }
        
        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-weight: 500;
        }
        
        .feedback.correct {
            background: #d4edda;
            color: #155724;
        }
        
        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
        }
        
        .shape-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        
        .shape-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .shape-btn:hover {
            background: #e3f2fd;
        }
        
        .shape-btn.active {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <!-- Vue 3.5.20 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    
    <!-- Konva -->
    <script src="https://cdn.jsdelivr.net/npm/konva@10.0.12/konva.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/konva.min.js'"></script>
    
    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    
    <!-- KaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.auto-render.min.js'"></script>
    
    <script>
        const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;
        
        createApp({
            setup() {
                // 四边形类型
                const shapeType = ref('parallelogram'); // parallelogram, rectangle, rhombus, square, trapezoid
                
                // 画布
                const shapeStage = ref(null);
                const shapeLayer = ref(null);
                
                // 四边形顶点（可拖拽）
                const vertices = ref([
                    { x: 150, y: 200 },  // A
                    { x: 350, y: 200 },  // B
                    { x: 400, y: 350 },  // C
                    { x: 200, y: 350 }   // D
                ]);
                
                // 多边形内角和
                const polygonSides = ref(4);
                const polygonStage = ref(null);
                const polygonLayer = ref(null);
                
                // 练习题目
                const practiceQuestions = ref([
                    {
                        id: 1,
                        question: '平行四边形的对边有什么关系？',
                        answer: '平行且相等',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 2,
                        question: '矩形的四个角都是多少度？',
                        answer: '90度',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 3,
                        question: '菱形的四条边有什么关系？',
                        answer: '相等',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 4,
                        question: '四边形的内角和是多少度？',
                        answer: '360',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 5,
                        question: 'n边形的内角和公式是什么？',
                        answer: '(n-2)×180°',
                        userAnswer: '',
                        correct: null
                    }
                ]);
                
                // 计算角度
                function calculateAngle(p1, p2, p3) {
                    const v1 = { x: p1.x - p2.x, y: p1.y - p2.y };
                    const v2 = { x: p3.x - p2.x, y: p3.y - p2.y };
                    const dot = v1.x * v2.x + v1.y * v2.y;
                    const mag1 = Math.sqrt(v1.x * v1.x + v1.y * v1.y);
                    const mag2 = Math.sqrt(v2.x * v2.x + v2.y * v2.y);
                    const angle = Math.acos(dot / (mag1 * mag2)) * 180 / Math.PI;
                    return isNaN(angle) ? 0 : angle;
                }
                
                // 计算四边形的角度
                const angles = computed(() => {
                    const v = vertices.value;
                    return {
                        A: calculateAngle(v[3], v[0], v[1]),
                        B: calculateAngle(v[0], v[1], v[2]),
                        C: calculateAngle(v[1], v[2], v[3]),
                        D: calculateAngle(v[2], v[3], v[0])
                    };
                });
                
                // 计算内角和
                const angleSum = computed(() => {
                    const ang = angles.value;
                    return ang.A + ang.B + ang.C + ang.D;
                });
                
                // 计算边长
                function distance(p1, p2) {
                    return Math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2);
                }
                
                const sideLengths = computed(() => {
                    const v = vertices.value;
                    return {
                        AB: distance(v[0], v[1]),
                        BC: distance(v[1], v[2]),
                        CD: distance(v[2], v[3]),
                        DA: distance(v[3], v[0])
                    };
                });
                
                // 检查是否为平行四边形
                const isParallelogram = computed(() => {
                    const v = vertices.value;
                    // 检查对边是否平行（向量叉积为0）
                    const AB = { x: v[1].x - v[0].x, y: v[1].y - v[0].y };
                    const DC = { x: v[3].x - v[2].x, y: v[3].y - v[2].y };
                    const AD = { x: v[3].x - v[0].x, y: v[3].y - v[0].y };
                    const BC = { x: v[2].x - v[1].x, y: v[2].y - v[1].y };
                    
                    const cross1 = Math.abs(AB.x * DC.y - AB.y * DC.x);
                    const cross2 = Math.abs(AD.x * BC.y - AD.y * BC.x);
                    const tolerance = 10;
                    
                    return cross1 < tolerance && cross2 < tolerance;
                });
                
                // 检查是否为矩形
                const isRectangle = computed(() => {
                    if (!isParallelogram.value) return false;
                    const ang = angles.value;
                    const tolerance = 5;
                    return Math.abs(ang.A - 90) < tolerance && 
                           Math.abs(ang.B - 90) < tolerance;
                });
                
                // 检查是否为菱形
                const isRhombus = computed(() => {
                    if (!isParallelogram.value) return false;
                    const sides = sideLengths.value;
                    const tolerance = 5;
                    return Math.abs(sides.AB - sides.BC) < tolerance;
                });
                
                // 检查是否为正方形
                const isSquare = computed(() => {
                    return isRectangle.value && isRhombus.value;
                });
                
                // 检查是否为梯形
                const isTrapezoid = computed(() => {
                    // 如果已经是平行四边形，不是梯形
                    if (isParallelogram.value) return false;
                    
                    const v = vertices.value;
                    // 检查是否有一组对边平行
                    const AB = { x: v[1].x - v[0].x, y: v[1].y - v[0].y };
                    const DC = { x: v[3].x - v[2].x, y: v[3].y - v[2].y };
                    const AD = { x: v[3].x - v[0].x, y: v[3].y - v[0].y };
                    const BC = { x: v[2].x - v[1].x, y: v[2].y - v[1].y };
                    
                    // 计算向量叉积来判断平行
                    const cross1 = Math.abs(AB.x * DC.y - AB.y * DC.x);
                    const cross2 = Math.abs(AD.x * BC.y - AD.y * BC.x);
                    const tolerance = 15;
                    
                    return (cross1 < tolerance && cross2 >= tolerance) || 
                           (cross1 >= tolerance && cross2 < tolerance);
                });
                
                // 当前四边形类型
                const currentShapeType = computed(() => {
                    if (isSquare.value) return '正方形';
                    if (isRectangle.value) return '矩形';
                    if (isRhombus.value) return '菱形';
                    if (isParallelogram.value) return '平行四边形';
                    if (isTrapezoid.value) return '梯形';
                    return '一般四边形';
                });
                
                // 多边形内角和
                const polygonAngleSum = computed(() => {
                    return (polygonSides.value - 2) * 180;
                });
                
                // 保存四边形元素引用，用于快速更新
                let quadLine = null;
                let vertexGroups = [];
                let angleLabels = [];
                let sideLabels = [];
                
                // 只更新四边形形状（不重新创建所有元素）
                function updateShapeOnly() {
                    if (!shapeLayer.value || !quadLine) return;
                    
                    const v = vertices.value;
                    const points = [
                        v[0].x, v[0].y,
                        v[1].x, v[1].y,
                        v[2].x, v[2].y,
                        v[3].x, v[3].y
                    ];
                    
                    // 更新四边形线条
                    quadLine.points([...points, points[0], points[1]]);
                    
                    // 更新顶点位置
                    vertexGroups.forEach((group, index) => {
                        if (group && v[index]) {
                            group.position({ x: v[index].x, y: v[index].y });
                        }
                    });
                    
                    // 更新角度标签
                    const ang = angles.value;
                    const vertexNames = ['A', 'B', 'C', 'D'];
                    const angleOffsets = [
                        { x: -40, y: -40 },
                        { x: 20, y: -40 },
                        { x: 20, y: 20 },
                        { x: -40, y: 20 }
                    ];
                    
                    angleLabels.forEach((label, index) => {
                        if (label && v[index]) {
                            label.position({
                                x: v[index].x + angleOffsets[index].x,
                                y: v[index].y + angleOffsets[index].y
                            });
                            label.text(`∠${vertexNames[index]} = ${ang[vertexNames[index]].toFixed(1)}°`);
                        }
                    });
                    
                    // 更新边长标签
                    const sides = sideLengths.value;
                    const sideData = [
                        { side: 'AB', length: sides.AB, start: 0, end: 1, offset: { x: 0, y: -30 } },
                        { side: 'BC', length: sides.BC, start: 1, end: 2, offset: { x: 30, y: 0 } },
                        { side: 'CD', length: sides.CD, start: 2, end: 3, offset: { x: 0, y: 30 } },
                        { side: 'DA', length: sides.DA, start: 3, end: 0, offset: { x: -30, y: 0 } }
                    ];
                    
                    sideLabels.forEach((label, index) => {
                        if (label && v[sideData[index].start] && v[sideData[index].end]) {
                            const midX = (v[sideData[index].start].x + v[sideData[index].end].x) / 2;
                            const midY = (v[sideData[index].start].y + v[sideData[index].end].y) / 2;
                            label.position({
                                x: midX + sideData[index].offset.x,
                                y: midY + sideData[index].offset.y
                            });
                            label.text(`${sideData[index].side} = ${sideData[index].length.toFixed(1)}`);
                        }
                    });
                    
                    shapeLayer.value.batchDraw();
                }
                
                // 绘制四边形画布
                function drawShapeCanvas() {
                    if (!shapeLayer.value) return;
                    
                    shapeLayer.value.destroyChildren();
                    vertexGroups = [];
                    angleLabels = [];
                    sideLabels = [];
                    
                    const width = shapeStage.value.width();
                    const height = shapeStage.value.height();
                    
                    // 绘制四边形
                    const v = vertices.value;
                    const points = [
                        v[0].x, v[0].y,
                        v[1].x, v[1].y,
                        v[2].x, v[2].y,
                        v[3].x, v[3].y
                    ];
                    
                    quadLine = new Konva.Line({
                        points: [...points, points[0], points[1]],
                        closed: true,
                        fill: 'rgba(102, 126, 234, 0.2)',
                        stroke: '#667eea',
                        strokeWidth: 3,
                        name: 'quadrilateral'
                    });
                    shapeLayer.value.add(quadLine);
                    
                    // 绘制顶点（可拖拽）
                    const vertexNames = ['A', 'B', 'C', 'D'];
                    v.forEach((vertex, index) => {
                        const vertexGroup = new Konva.Group({
                            x: vertex.x,
                            y: vertex.y,
                            draggable: true,
                            name: 'vertex-' + index
                        });
                        
                        const circle = new Konva.Circle({
                            x: 0,
                            y: 0,
                            radius: 8,
                            fill: '#ff5722',
                            stroke: '#fff',
                            strokeWidth: 2
                        });
                        
                        const label = new Konva.Text({
                            x: -8,
                            y: -25,
                            text: vertexNames[index],
                            fontSize: 16,
                            fill: '#333',
                            fontStyle: 'bold',
                            padding: 3,
                            background: 'rgba(255,255,255,0.9)',
                            cornerRadius: 3
                        });
                        
                        vertexGroup.add(circle);
                        vertexGroup.add(label);
                        
                        let rafId = null;
                        let lastUpdateTime = 0;
                        vertexGroup.on('dragmove', function() {
                            const pos = this.position();
                            // 限制在canvas范围内
                            pos.x = Math.max(30, Math.min(width - 30, pos.x));
                            pos.y = Math.max(30, Math.min(height - 30, pos.y));
                            this.position(pos);
                            vertices.value[index] = { x: pos.x, y: pos.y };
                            
                            // 使用 requestAnimationFrame 优化性能，限制更新频率
                            const now = Date.now();
                            if (now - lastUpdateTime < 16) { // 约60fps
                                if (rafId) cancelAnimationFrame(rafId);
                                rafId = requestAnimationFrame(() => {
                                    lastUpdateTime = Date.now();
                                    updateShapeOnly();
                                });
                            } else {
                                lastUpdateTime = now;
                                updateShapeOnly();
                            }
                        });
                        
                        vertexGroup.on('mouseenter', function() {
                            document.body.style.cursor = 'pointer';
                            circle.scale({ x: 1.3, y: 1.3 });
                        });
                        
                        vertexGroup.on('mouseleave', function() {
                            document.body.style.cursor = 'default';
                            circle.scale({ x: 1, y: 1 });
                        });
                        
                        shapeLayer.value.add(vertexGroup);
                        vertexGroups.push(vertexGroup);
                    });
                    
                    // 绘制角度标注
                    const ang = angles.value;
                    const angleOffsets = [
                        { x: -40, y: -40 },
                        { x: 20, y: -40 },
                        { x: 20, y: 20 },
                        { x: -40, y: 20 }
                    ];
                    
                    vertexNames.forEach((name, index) => {
                        const angleLabel = new Konva.Text({
                            x: v[index].x + angleOffsets[index].x,
                            y: v[index].y + angleOffsets[index].y,
                            text: `∠${name} = ${ang[name].toFixed(1)}°`,
                            fontSize: 14,
                            fill: '#ff5722',
                            fontStyle: 'bold',
                            padding: 5,
                            background: 'rgba(255,255,255,0.9)',
                            cornerRadius: 5
                        });
                        shapeLayer.value.add(angleLabel);
                        angleLabels.push(angleLabel);
                    });
                    
                    // 绘制边长标注
                    const sides = sideLengths.value;
                    const sideData = [
                        { side: 'AB', length: sides.AB, start: 0, end: 1, offset: { x: 0, y: -30 } },
                        { side: 'BC', length: sides.BC, start: 1, end: 2, offset: { x: 30, y: 0 } },
                        { side: 'CD', length: sides.CD, start: 2, end: 3, offset: { x: 0, y: 30 } },
                        { side: 'DA', length: sides.DA, start: 3, end: 0, offset: { x: -30, y: 0 } }
                    ];
                    
                    sideData.forEach(sideLabel => {
                        const midX = (v[sideLabel.start].x + v[sideLabel.end].x) / 2;
                        const midY = (v[sideLabel.start].y + v[sideLabel.end].y) / 2;
                        const sideText = new Konva.Text({
                            x: midX + sideLabel.offset.x,
                            y: midY + sideLabel.offset.y,
                            text: `${sideLabel.side} = ${sideLabel.length.toFixed(1)}`,
                            fontSize: 12,
                            fill: '#4caf50',
                            fontStyle: 'bold',
                            padding: 3,
                            background: 'rgba(255,255,255,0.9)',
                            cornerRadius: 3
                        });
                        shapeLayer.value.add(sideText);
                        sideLabels.push(sideText);
                    });
                    
                    shapeLayer.value.draw();
                }
                
                // 绘制多边形画布
                function drawPolygonCanvas() {
                    if (!polygonLayer.value) return;
                    
                    polygonLayer.value.destroyChildren();
                    
                    const width = polygonStage.value.width();
                    const height = polygonStage.value.height();
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const radius = Math.min(width, height) * 0.3;
                    
                    const n = polygonSides.value;
                    const points = [];
                    
                    // 计算多边形顶点
                    for (let i = 0; i < n; i++) {
                        const angle = (i * 2 * Math.PI / n) - Math.PI / 2; // 从顶部开始
                        const x = centerX + radius * Math.cos(angle);
                        const y = centerY + radius * Math.sin(angle);
                        points.push(x, y);
                    }
                    
                    // 绘制多边形
                    const polygon = new Konva.Line({
                        points: [...points, points[0], points[1]],
                        closed: true,
                        fill: 'rgba(102, 126, 234, 0.2)',
                        stroke: '#667eea',
                        strokeWidth: 3,
                        name: 'polygon'
                    });
                    polygonLayer.value.add(polygon);
                    
                    // 绘制顶点和标签
                    const vertexNames = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
                    for (let i = 0; i < n; i++) {
                        const x = points[i * 2];
                        const y = points[i * 2 + 1];
                        
                        const vertex = new Konva.Circle({
                            x: x,
                            y: y,
                            radius: 6,
                            fill: '#f57c00',
                            stroke: '#fff',
                            strokeWidth: 2
                        });
                        polygonLayer.value.add(vertex);
                        
                        const label = new Konva.Text({
                            x: x + 15,
                            y: y - 10,
                            text: vertexNames[i],
                            fontSize: 16,
                            fill: '#333',
                            fontStyle: 'bold',
                            padding: 3,
                            background: 'rgba(255,255,255,0.9)',
                            cornerRadius: 3
                        });
                        polygonLayer.value.add(label);
                    }
                    
                    // 绘制内角和标注
                    const angleSumText = new Konva.Text({
                        x: centerX,
                        y: centerY + radius + 40,
                        text: `内角和 = ${polygonAngleSum.value}°`,
                        fontSize: 18,
                        fill: '#ff5722',
                        fontStyle: 'bold',
                        padding: 10,
                        background: 'rgba(255,255,255,0.95)',
                        cornerRadius: 8,
                        align: 'center',
                        offsetX: 100
                    });
                    polygonLayer.value.add(angleSumText);
                    
                    polygonLayer.value.draw();
                }
                
                // 初始化多边形画布
                function initPolygonCanvas() {
                    const container = document.getElementById('polygon-canvas');
                    if (!container || polygonStage.value) return;
                    
                    const width = container.offsetWidth;
                    const height = 400;
                    
                    polygonStage.value = new Konva.Stage({
                        container: 'polygon-canvas',
                        width: width,
                        height: height
                    });
                    
                    polygonLayer.value = new Konva.Layer();
                    polygonStage.value.add(polygonLayer.value);
                    
                    drawPolygonCanvas();
                }
                
                // 设置预设形状
                function setPresetShape(type) {
                    const width = shapeStage.value ? shapeStage.value.width() : 800;
                    const height = shapeStage.value ? shapeStage.value.height() : 600;
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const size = 120;
                    
                    switch(type) {
                        case 'parallelogram':
                            vertices.value = [
                                { x: centerX - 100, y: centerY - 50 },
                                { x: centerX + 100, y: centerY - 50 },
                                { x: centerX + 150, y: centerY + 50 },
                                { x: centerX - 50, y: centerY + 50 }
                            ];
                            break;
                        case 'rectangle':
                            vertices.value = [
                                { x: centerX - 100, y: centerY - 60 },
                                { x: centerX + 100, y: centerY - 60 },
                                { x: centerX + 100, y: centerY + 60 },
                                { x: centerX - 100, y: centerY + 60 }
                            ];
                            break;
                        case 'rhombus':
                            vertices.value = [
                                { x: centerX, y: centerY - 80 },
                                { x: centerX + 80, y: centerY },
                                { x: centerX, y: centerY + 80 },
                                { x: centerX - 80, y: centerY }
                            ];
                            break;
                        case 'square':
                            vertices.value = [
                                { x: centerX - 80, y: centerY - 80 },
                                { x: centerX + 80, y: centerY - 80 },
                                { x: centerX + 80, y: centerY + 80 },
                                { x: centerX - 80, y: centerY + 80 }
                            ];
                            break;
                        case 'trapezoid':
                            vertices.value = [
                                { x: centerX - 120, y: centerY - 60 },
                                { x: centerX + 120, y: centerY - 60 },
                                { x: centerX + 80, y: centerY + 60 },
                                { x: centerX - 80, y: centerY + 60 }
                            ];
                            break;
                    }
                    drawShapeCanvas();
                }
                
                // 初始化画布
                function initShapeCanvas() {
                    const container = document.getElementById('shape-canvas');
                    if (!container || shapeStage.value) return;
                    
                    const width = container.offsetWidth;
                    const height = 600;
                    
                    shapeStage.value = new Konva.Stage({
                        container: 'shape-canvas',
                        width: width,
                        height: height
                    });
                    
                    shapeLayer.value = new Konva.Layer();
                    shapeStage.value.add(shapeLayer.value);
                    
                    drawShapeCanvas();
                }
                
                // 检查练习答案
                function checkAnswer(question) {
                    const userAns = question.userAnswer.trim().toLowerCase().replace(/\s+/g, '');
                    const correctAns = question.answer.trim().toLowerCase().replace(/\s+/g, '');
                    question.correct = userAns === correctAns;
                }
                
                // 计算得分
                const score = computed(() => {
                    if (!practiceQuestions.value || practiceQuestions.value.length === 0) {
                        return { correct: 0, total: 0 };
                    }
                    const total = practiceQuestions.value.length;
                    const correct = practiceQuestions.value.filter(q => q.correct === true).length;
                    return { correct, total };
                });
                
                // 监听边数变化
                Vue.watch(polygonSides, () => {
                    if (polygonLayer.value) {
                        drawPolygonCanvas();
                    }
                    // 重新渲染KaTeX公式
                    nextTick(() => {
                        setTimeout(() => {
                            if (typeof katex !== 'undefined') {
                                const katexStaticElements = document.querySelectorAll('.katex-static');
                                katexStaticElements.forEach(el => {
                                    const formula = el.getAttribute('data-formula');
                                    if (formula) {
                                        // 清除旧内容
                                        el.innerHTML = '';
                                        try {
                                            katex.render(formula, el, {
                                                throwOnError: false
                                            });
                                        } catch (e) {
                                            console.error('KaTeX 渲染错误:', e);
                                        }
                                    }
                                });
                            }
                        }, 50);
                    });
                });
                
                onMounted(() => {
                    nextTick(() => {
                        initShapeCanvas();
                        initPolygonCanvas();
                        
                        // 监听窗口大小变化
                        window.addEventListener('resize', () => {
                            if (shapeStage.value) {
                                const container = document.getElementById('shape-canvas');
                                if (container) {
                                    shapeStage.value.width(container.offsetWidth);
                                    drawShapeCanvas();
                                }
                            }
                            if (polygonStage.value) {
                                const container = document.getElementById('polygon-canvas');
                                if (container) {
                                    polygonStage.value.width(container.offsetWidth);
                                    drawPolygonCanvas();
                                }
                            }
                        });
                        
                        // 自动渲染 KaTeX
                        nextTick(() => {
                            setTimeout(() => {
                                if (typeof renderMathInElement !== 'undefined') {
                                    try {
                                        renderMathInElement(document.body, {
                                            delimiters: [
                                                {left: '$$', right: '$$', display: true},
                                                {left: '$', right: '$', display: false},
                                                {left: '\\[', right: '\\]', display: true},
                                                {left: '\\(', right: '\\)', display: false}
                                            ],
                                            throwOnError: false
                                        });
                                    } catch (e) {
                                        console.error('KaTeX 渲染错误:', e);
                                    }
                                }
                                
                                // 手动渲染静态公式
                                if (typeof katex !== 'undefined') {
                                    const katexStaticElements = document.querySelectorAll('.katex-static');
                                    katexStaticElements.forEach(el => {
                                        const formula = el.getAttribute('data-formula');
                                        if (formula && !el.querySelector('.katex-html')) {
                                            try {
                                                katex.render(formula, el, {
                                                    throwOnError: false
                                                });
                                            } catch (e) {
                                                console.error('KaTeX 静态公式渲染错误:', e);
                                            }
                                        }
                                    });
                                }
                            }, 100);
                        });
                    });
                });
                
                return {
                    shapeType,
                    vertices,
                    polygonSides,
                    angles,
                    angleSum,
                    sideLengths,
                    currentShapeType,
                    polygonAngleSum,
                    practiceQuestions,
                    score,
                    setPresetShape,
                    checkAnswer
                };
            },
            template: `
                <div class="container">
                    <h1>⬛ 四边形</h1>
                    <p class="subtitle">探索四边形的性质和分类</p>
                    
                    <!-- 基本概念 -->
                    <div class="section">
                        <h2>📚 基本概念</h2>
                        <div class="concept-grid">
                            <div class="concept-card">
                                <h3>平行四边形</h3>
                                <p>两组对边分别平行的四边形</p>
                                <ul class="property-list">
                                    <li>对边平行且相等</li>
                                    <li>对角相等</li>
                                    <li>对角线互相平分</li>
                                </ul>
                            </div>
                            <div class="concept-card">
                                <h3>矩形</h3>
                                <p>有一个角是直角的平行四边形</p>
                                <ul class="property-list">
                                    <li>四个角都是90°</li>
                                    <li>对边平行且相等</li>
                                    <li>对角线相等且互相平分</li>
                                </ul>
                            </div>
                            <div class="concept-card">
                                <h3>菱形</h3>
                                <p>四条边都相等的平行四边形</p>
                                <ul class="property-list">
                                    <li>四条边都相等</li>
                                    <li>对边平行</li>
                                    <li>对角线互相垂直平分</li>
                                </ul>
                            </div>
                            <div class="concept-card">
                                <h3>正方形</h3>
                                <p>既是矩形又是菱形的四边形</p>
                                <ul class="property-list">
                                    <li>四条边都相等</li>
                                    <li>四个角都是90°</li>
                                    <li>对角线相等且互相垂直平分</li>
                                </ul>
                            </div>
                            <div class="concept-card">
                                <h3>梯形</h3>
                                <p>一组对边平行的四边形</p>
                                <ul class="property-list">
                                    <li>只有一组对边平行</li>
                                    <li>另一组对边不平行</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 交互式四边形 -->
                    <div class="section">
                        <h2>🔧 交互式四边形</h2>
                        <div class="canvas-container">
                            <div class="shape-selector">
                                <button class="shape-btn" :class="{ active: shapeType === 'parallelogram' }" @click="shapeType = 'parallelogram'; setPresetShape('parallelogram')">平行四边形</button>
                                <button class="shape-btn" :class="{ active: shapeType === 'rectangle' }" @click="shapeType = 'rectangle'; setPresetShape('rectangle')">矩形</button>
                                <button class="shape-btn" :class="{ active: shapeType === 'rhombus' }" @click="shapeType = 'rhombus'; setPresetShape('rhombus')">菱形</button>
                                <button class="shape-btn" :class="{ active: shapeType === 'square' }" @click="shapeType = 'square'; setPresetShape('square')">正方形</button>
                                <button class="shape-btn" :class="{ active: shapeType === 'trapezoid' }" @click="shapeType = 'trapezoid'; setPresetShape('trapezoid')">梯形</button>
                            </div>
                            
                            <div id="shape-canvas" class="canvas-wrapper"></div>
                            
                            <div class="info-panel">
                                <div class="info-item">
                                    <strong>当前类型：</strong>{{ currentShapeType }}
                                </div>
                                <div class="info-item">
                                    <strong>内角和：</strong>{{ angleSum.toFixed(1) }}°
                                </div>
                                <div class="info-item">
                                    <strong>提示：</strong>拖拽顶点A、B、C、D可以改变四边形的形状，观察性质是否保持
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 多边形内角和 -->
                    <div class="section">
                        <h2>📐 多边形内角和</h2>
                        <div class="canvas-container">
                            <div class="info-panel">
                                <div class="info-item">
                                    <strong>公式：</strong>
                                    <span class="katex-static" data-formula="内角和 = (n-2) \\times 180°"></span>
                                    <p style="margin-top: 10px; color: #666;">其中 n 是多边形的边数</p>
                                </div>
                                <div class="controls">
                                    <label style="font-weight: bold; color: #667eea;">边数 n：</label>
                                    <input type="range" v-model.number="polygonSides" min="3" max="10" step="1" style="width: 200px; margin: 0 10px;">
                                    <span style="min-width: 60px; text-align: center; padding: 5px 10px; background: #e3f2fd; border-radius: 5px; font-weight: bold; color: #1976d2;">{{ polygonSides }}</span>
                                </div>
                                <div class="info-item">
                                    <strong>内角和：</strong>
                                    <span class="katex-static" :data-formula="'(' + polygonSides + '-2) \\times 180° = ' + polygonAngleSum + '°'"></span>
                                </div>
                            </div>
                            
                            <div id="polygon-canvas" class="canvas-wrapper" style="height: 400px;"></div>
                            
                            <div class="info-item" style="margin-top: 20px;">
                                <strong>常见多边形：</strong>
                                <ul class="property-list">
                                    <li>三角形（3边）：(3-2) × 180° = 180°</li>
                                    <li>四边形（4边）：(4-2) × 180° = 360°</li>
                                    <li>五边形（5边）：(5-2) × 180° = 540°</li>
                                    <li>六边形（6边）：(6-2) × 180° = 720°</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 练习 -->
                    <div class="section">
                        <h2>✏️ 练习</h2>
                        <div class="practice-area">
                            <div v-for="question in practiceQuestions" :key="question.id" 
                                 :class="['practice-question', question.correct === true ? 'correct' : question.correct === false ? 'incorrect' : '']">
                                <h3>{{ question.question }}</h3>
                                <div class="controls">
                                    <input type="text" v-model="question.userAnswer" class="answer-input" placeholder="输入答案">
                                    <button class="btn" @click="checkAnswer(question)">检查</button>
                                </div>
                                <div v-if="question.correct === true" class="feedback correct">
                                    ✓ 正确！
                                </div>
                                <div v-if="question.correct === false" class="feedback incorrect">
                                    ✗ 错误，正确答案是：{{ question.answer }}
                                </div>
                            </div>
                            
                            <div style="margin-top: 30px; padding: 20px; background: #e3f2fd; border-radius: 10px;">
                                <h3 style="color: #1976d2;">得分：{{ score.correct }} / {{ score.total }}</h3>
                            </div>
                        </div>
                    </div>
                </div>
            `
        }).mount('#app');
    </script>
</body>
</html>
