    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css"

    <style>

        body {

        .container {

        .subtitle {

        }
        
        .section {

            border-radius: 15px;

        }
        
        .section h2 {
            color: #667eea;

        .shape-selector {

        .canvas-container {

        .info-item {

        .info-item strong {

        }
        
        .input-group {

        .input-group label {

        .input-group input {

        .calculator {
            background: white;
            padding: 25px;

            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .calculator h3 {

        .result-box {

        .result-box strong {

        .practice-area {

        .feedback {

        }
        
        .feedback.incorrect {
            background: #f8d7da;

        }
    </style>

<body>
    <div id="app"></div>
    
    <!-- Vue 3.5.20 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    
    <!-- Konva -->
    <script src="https://cdn.jsdelivr.net/npm/konva@10.0.12/konva.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/konva.min.js'"></script>
    
    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    
    <!-- KaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.auto-render.min.js'"></script>
    
    <script>
        const { createApp, ref, computed, onMounted, nextTick } = Vue;
        
        createApp({
            setup() {
                // 当前形状类型
                const shapeType = ref('rectangle');
                const demoType = ref('triangle');
                const recomposeStage = ref(null);
                const recomposeLayer = ref(null);
                const isAnimatingRecompose = ref(false); // 'rectangle', 'triangle', 'parallelogram', 'trapezoid'
                
                // 画布引用
                const demoStage = ref(null);
                const demoLayer = ref(null);
                const calcStage = ref(null);
                const calcLayer = ref(null);
                
                // 每个形状类型的计算画布
                const rectCalcStage = ref(null);
                const rectCalcLayer = ref(null);
                const triangleCalcStage = ref(null);
                const triangleCalcLayer = ref(null);
                const paraCalcStage = ref(null);
                const paraCalcLayer = ref(null);
                const trapCalcStage = ref(null);
                const trapCalcLayer = ref(null);
                
                // 尺寸参数（计算用）
                const rectLength = ref(10);
                const rectWidth = ref(6);
                const triangleBase = ref(8);
                const triangleHeight = ref(6);
                const paraBase = ref(10);
                const paraHeight = ref(6);
                const trapTopBase = ref(6);
                const trapBottomBase = ref(10);
                const trapHeight = ref(6);
                
                // 动画状态
                const animating = ref(false);
                
                // 计算面积和周长
                const rectangleArea = computed(() => rectLength.value * rectWidth.value);
                const rectanglePerimeter = computed(() => 2 * (rectLength.value + rectWidth.value));
                
                const triangleArea = computed(() => triangleBase.value * triangleHeight.value / 2);
                const trianglePerimeter = computed(() => {
                    // 假设是直角三角形，斜边 = sqrt(base^2 + height^2)
                    const hypotenuse = Math.sqrt(triangleBase.value ** 2 + triangleHeight.value ** 2);
                    return triangleBase.value + triangleHeight.value + hypotenuse;
                });
                
                const parallelogramArea = computed(() => paraBase.value * paraHeight.value);
                const parallelogramPerimeter = computed(() => {
                    // 假设另一边长度为height * 1.2（任意值用于演示）
                    const otherSide = paraHeight.value * 1.2;
                    return 2 * (paraBase.value + otherSide);
                });
                
                const trapezoidArea = computed(() => {
                    return (trapTopBase.value + trapBottomBase.value) * trapHeight.value / 2;
                });
                const trapezoidPerimeter = computed(() => {
                    // 假设两条斜边相等，每条 = sqrt(height^2 + ((bottom-top)/2)^2)
                    const sideDiff = (trapBottomBase.value - trapTopBase.value) / 2;
                    const side = Math.sqrt(trapHeight.value ** 2 + sideDiff ** 2);
                    return trapTopBase.value + trapBottomBase.value + 2 * side;
                });
                
                // 计算过程的公式字符串（用于KaTeX渲染）
                const rectAreaFormula = computed(() => {
                    return `${rectLength.value} \\times ${rectWidth.value} = ${rectangleArea.value.toFixed(2)}`;
                });
                
                const rectPerimeterFormula = computed(() => {
                    return `2(${rectLength.value} + ${rectWidth.value}) = ${rectanglePerimeter.value.toFixed(2)}`;
                });
                
                const triAreaFormula = computed(() => {
                    return `\\frac{${triangleBase.value} \\times ${triangleHeight.value}}{2} = ${triangleArea.value.toFixed(2)}`;
                });
                
                const paraAreaFormula = computed(() => {
                    return `${paraBase.value} \\times ${paraHeight.value} = ${parallelogramArea.value.toFixed(2)}`;
                });
                
                const trapAreaFormula = computed(() => {
                    return `\\frac{(${trapTopBase.value} + ${trapBottomBase.value}) \\times ${trapHeight.value}}{2} = ${trapezoidArea.value.toFixed(2)}`;
                });
                
                // 练习题目
                const practiceQuestions = ref([
                    {
                        id: 1,
                        shape: 'rectangle',
                        length: 12,
                        width: 8,
                        question: '长方形的面积是多少？',
                        answer: '96',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 2,
                        shape: 'triangle',
                        base: 10,
                        height: 6,
                        question: '三角形的面积是多少？',
                        answer: '30',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 3,
                        shape: 'parallelogram',
                        base: 9,
                        height: 5,
                        question: '平行四边形的面积是多少？',
                        answer: '45',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 4,
                        shape: 'trapezoid',
                        topBase: 4,
                        bottomBase: 8,
                        height: 5,
                        question: '梯形的面积是多少？',
                        answer: '30',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 5,
                        shape: 'rectangle',
                        length: 15,
                        width: 10,
                        question: '长方形的周长是多少？',
                        answer: '50',
                        userAnswer: '',
                        correct: null
                    }
                ]);
                
                // 绘制公式演示动画
                function drawFormulaDemo() {
                    if (!demoLayer.value) return;
                    
                    demoLayer.value.destroyChildren();
                    animating.value = false;
                    
                    const width = demoStage.value.width();
                    const height = demoStage.value.height();
                    const centerX = width / 2;
                    const centerY = height / 2;
                    
                    if (shapeType.value === 'rectangle') {
                        drawRectangleDemo(centerX, centerY, width, height);
                    } else if (shapeType.value === 'triangle') {
                        drawTriangleDemo(centerX, centerY, width, height);
                    } else if (shapeType.value === 'parallelogram') {
                        drawParallelogramDemo(centerX, centerY, width, height);
                    } else if (shapeType.value === 'trapezoid') {
                        drawTrapezoidDemo(centerX, centerY, width, height);
                    }
                }
                
                // 绘制长方形公式演示
                function drawRectangleDemo(cx, cy, width, height) {
                    const w = 120;
                    const h = 80;
                    const startX = cx - w / 2;
                    const startY = cy - h / 2;
                    
                    // 绘制长方形
                    const rect = new Konva.Rect({
                        x: startX,
                        y: startY,
                        width: w,
                        height: h,
                        fill: 'rgba(102, 126, 234, 0.3)',
                        stroke: '#667eea',
                        strokeWidth: 3
                    });
                    demoLayer.value.add(rect);
                    
                    // 标注长度
                    const lengthLine = new Konva.Line({
                        points: [startX, startY - 20, startX + w, startY - 20],
                        stroke: '#4caf50',
                        strokeWidth: 2,
                        dash: [5, 5]
                    });
                    demoLayer.value.add(lengthLine);
                    
                    const lengthLabel = new Konva.Text({
                        x: startX + w / 2 - 20,
                        y: startY - 45,
                        text: '长 a',
                        fontSize: 14,
                        fill: '#4caf50',
                        fontStyle: 'bold'
                    });
                    demoLayer.value.add(lengthLabel);
                    
                    // 标注宽度
                    const widthLine = new Konva.Line({
                        points: [startX - 20, startY, startX - 20, startY + h],
                        stroke: '#4caf50',
                        strokeWidth: 2,
                        dash: [5, 5]
                    });
                    demoLayer.value.add(widthLine);
                    
                    const widthLabel = new Konva.Text({
                        x: startX - 70,
                        y: startY + h / 2 - 10,
                        text: '宽 b',
                        fontSize: 14,
                        fill: '#4caf50',
                        fontStyle: 'bold'
                    });
                    demoLayer.value.add(widthLabel);
                    
                    // 显示公式
                    const formulaText = new Konva.Text({
                        x: cx - 100,
                        y: cy + h / 2 + 30,
                        text: '面积 = 长 × 宽 = a × b',
                        fontSize: 18,
                        fill: '#333',
                        fontStyle: 'bold',
                        padding: 10,
                        background: 'rgba(255,255,255,0.95)',
                        cornerRadius: 8
                    });
                    demoLayer.value.add(formulaText);
                    
                    // 分割成小正方形演示
                    if (typeof gsap !== 'undefined' && !animating.value) {
                        animating.value = true;
                        setTimeout(() => {
                            const gridSize = 20;
                            const cols = Math.floor(w / gridSize);
                            const rows = Math.floor(h / gridSize);
                            
                            for (let i = 0; i < rows; i++) {
                                for (let j = 0; j < cols; j++) {
                                    const square = new Konva.Rect({
                                        x: startX + j * gridSize,
                                        y: startY + i * gridSize,
                                        width: gridSize - 2,
                                        height: gridSize - 2,
                                        fill: 'rgba(255, 152, 0, 0.5)',
                                        stroke: '#ff9800',
                                        strokeWidth: 1,
                                        opacity: 0
                                    });
                                    demoLayer.value.add(square);
                                    
                                    gsap.to(square, {
                                        opacity: 1,
                                        duration: 0.1,
                                        delay: (i * cols + j) * 0.02,
                                        ease: 'power2.out'
                                    });
                                }
                            }
                            
                            const countText = new Konva.Text({
                                x: cx - 80,
                                y: cy + h / 2 + 70,
                                text: `可分成 ${cols} × ${rows} = ${cols * rows} 个小正方形`,
                                fontSize: 16,
                                fill: '#ff9800',
                                fontStyle: 'bold',
                                padding: 8,
                                background: 'rgba(255,255,255,0.95)',
                                cornerRadius: 8,
                                opacity: 0
                            });
                            demoLayer.value.add(countText);
                            
                            gsap.to(countText, {
                                opacity: 1,
                                duration: 0.5,
                                delay: rows * cols * 0.02 + 0.3
                            });
                        }, 500);
                    }
                    
                    demoLayer.value.draw();
                }
                
                // 绘制三角形公式演示
                function drawTriangleDemo(cx, cy, width, height) {
                    const base = 120;
                    const h = 80;
                    const startX = cx - base / 2;
                    const startY = cy + h / 2;
                    
                    // 绘制三角形
                    const triangle = new Konva.Line({
                        points: [
                            startX, startY,
                            startX + base, startY,
                            startX + base / 2, startY - h,
                            startX, startY
                        ],
                        closed: true,
                        fill: 'rgba(102, 126, 234, 0.3)',
                        stroke: '#667eea',
                        strokeWidth: 3
                    });
                    demoLayer.value.add(triangle);
                    
                    // 标注底边
                    const baseLabel = new Konva.Text({
                        x: startX + base / 2 - 20,
                        y: startY + 20,
                        text: '底 a',
                        fontSize: 14,
                        fill: '#4caf50',
                        fontStyle: 'bold'
                    });
                    demoLayer.value.add(baseLabel);
                    
                    // 标注高
                    const heightLine = new Konva.Line({
                        points: [startX + base / 2, startY, startX + base / 2, startY - h],
                        stroke: '#ff9800',
                        strokeWidth: 2,
                        dash: [5, 5]
                    });
                    demoLayer.value.add(heightLine);
                    
                    const heightLabel = new Konva.Text({
                        x: startX + base / 2 + 15,
                        y: startY - h / 2 - 10,
                        text: '高 h',
                        fontSize: 14,
                        fill: '#ff9800',
                        fontStyle: 'bold'
                    });
                    demoLayer.value.add(heightLabel);
                    
                    // 显示公式
                    const formulaText = new Konva.Text({
                        x: cx - 100,
                        y: startY + 50,
                        text: '面积 = 底 × 高 ÷ 2 = a × h ÷ 2',
                        fontSize: 18,
                        fill: '#333',
                        fontStyle: 'bold',
                        padding: 10,
                        background: 'rgba(255,255,255,0.95)',
                        cornerRadius: 8
                    });
                    demoLayer.value.add(formulaText);
                    
                    // 演示：两个三角形组成平行四边形
                    if (typeof gsap !== 'undefined' && !animating.value) {
                        animating.value = true;
                        setTimeout(() => {
                            const triangle2 = new Konva.Line({
                                points: [
                                    startX + base, startY,
                                    startX, startY,
                                    startX + base / 2, startY - h,
                                    startX + base, startY
                                ],
                                closed: true,
                                fill: 'rgba(255, 152, 0, 0.3)',
                                stroke: '#ff9800',
                                strokeWidth: 3,
                                opacity: 0
                            });
                            demoLayer.value.add(triangle2);
                            
                            gsap.to(triangle2, {
                                opacity: 1,
                                duration: 1,
                                delay: 0.5,
                                onComplete: () => {
                                    const explanationText = new Konva.Text({
                                        x: cx - 120,
                                        y: startY + 90,
                                        text: '两个相同的三角形可以拼成一个平行四边形',
                                        fontSize: 16,
                                        fill: '#ff9800',
                                        fontStyle: 'bold',
                                        padding: 8,
                                        background: 'rgba(255,255,255,0.95)',
                                        cornerRadius: 8,
                                        opacity: 0
                                    });
                                    demoLayer.value.add(explanationText);
                                    
                                    gsap.to(explanationText, {
                                        opacity: 1,
                                        duration: 0.5
                                    });
                                }
                            });
                        }, 500);
                    }
                    
                    demoLayer.value.draw();
                }
                
                // 绘制平行四边形公式演示
                function drawParallelogramDemo(cx, cy, width, height) {
                    const base = 120;
                    const h = 80;
                    const offset = 30;
                    const startX = cx - base / 2;
                    const startY = cy;
                    
                    // 绘制平行四边形
                    const para = new Konva.Line({
                        points: [
                            startX, startY,
                            startX + base, startY,
                            startX + base + offset, startY - h,
                            startX + offset, startY - h,
                            startX, startY
                        ],
                        closed: true,
                        fill: 'rgba(102, 126, 234, 0.3)',
                        stroke: '#667eea',
                        strokeWidth: 3
                    });
                    demoLayer.value.add(para);
                    
                    // 标注底边
                    const baseLabel = new Konva.Text({
                        x: startX + base / 2 - 20,
                        y: startY + 20,
                        text: '底 a',
                        fontSize: 14,
                        fill: '#4caf50',
                        fontStyle: 'bold'
                    });
                    demoLayer.value.add(baseLabel);
                    
                    // 标注高
                    const heightLine = new Konva.Line({
                        points: [startX + offset + base, startY, startX + offset + base, startY - h],
                        stroke: '#ff9800',
                        strokeWidth: 2,
                        dash: [5, 5]
                    });
                    demoLayer.value.add(heightLine);
                    
                    const heightLabel = new Konva.Text({
                        x: startX + base + offset + 15,
                        y: startY - h / 2 - 10,
                        text: '高 h',
                        fontSize: 14,
                        fill: '#ff9800',
                        fontStyle: 'bold'
                    });
                    demoLayer.value.add(heightLabel);
                    
                    // 显示公式
                    const formulaText = new Konva.Text({
                        x: cx - 100,
                        y: startY + 50,
                        text: '面积 = 底 × 高 = a × h',
                        fontSize: 18,
                        fill: '#333',
                        fontStyle: 'bold',
                        padding: 10,
                        background: 'rgba(255,255,255,0.95)',
                        cornerRadius: 8
                    });
                    demoLayer.value.add(formulaText);
                    
                    demoLayer.value.draw();
                }
                
                // 绘制梯形公式演示
                function drawTrapezoidDemo(cx, cy, width, height) {
                    const topBase = 60;
                    const bottomBase = 120;
                    const h = 80;
                    const startX = cx - bottomBase / 2;
                    const startY = cy;
                    
                    // 绘制梯形
                    const trap = new Konva.Line({
                        points: [

                // 绘制分割与重组动画
                function drawRecomposeCanvas() {
                    if (!recomposeLayer.value || !recomposeStage.value) return;
                    
                    recomposeLayer.value.destroyChildren();
                    const width = recomposeStage.value.width();
                    const height = recomposeStage.value.height();
                    const margin = 40; // 边距

                    const cy = height / 2;
                    const availableWidth = width - margin * 2;
                    const availableHeight = height - margin * 2;

                    recomposeLayer.value.draw();
