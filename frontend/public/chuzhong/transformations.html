<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图形变换 - 初中数学教学</title>
    <meta name="description" content="学习图形的平移、旋转、翻折、放缩变换，理解变换过程中的不变量，通过变换认识相似图形的本质特征。">
    <meta name="keywords" content="图形变换,平移,旋转,翻折,放缩,相似,不变量,形状大小,角度,初中数学">
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" 
          onerror="this.onerror=null; this.href='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.css'">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.2em;
        }
        
        .section {
            margin-bottom: 50px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .concept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .concept-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .concept-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .concept-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .canvas-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 600px;
            background: #f8f9fa;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            background: #667eea;
            color: white;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-active {
            background: #4caf50;
        }
        
        .info-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .info-item {
            margin: 10px 0;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }
        
        .info-item strong {
            color: #667eea;
            margin-right: 10px;
        }
        
        .slider-container {
            margin: 15px 0;
        }
        
        .slider-container label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #667eea;
        }
        
        .slider-container input[type="range"] {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <!-- Vue 3.5.20 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    
    <!-- Konva -->
    <script src="https://cdn.jsdelivr.net/npm/konva@10.0.12/konva.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/konva.min.js'"></script>
    
    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    
    <!-- KaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.auto-render.min.js'"></script>
    
    <script>
        const { createApp, ref, computed, onMounted, nextTick } = Vue;
        
        createApp({
            setup() {
                // 画布引用
                const transformStage = ref(null);
                const transformLayer = ref(null);
                
                // 变换类型
                const transformType = ref('translate'); // 'translate', 'rotate', 'reflect', 'scale'
                
                // 变换参数
                const translateX = ref(100);
                const translateY = ref(0);
                const rotationAngle = ref(45);
                const reflectAxis = ref('vertical'); // 'vertical', 'horizontal'
                const scaleFactor = ref(1.5);
                
                // 原始形状的中心和尺寸
                let originalCenter = null;
                let triangleSize = 80;
                
                // 绘制变换画布
                function drawTransformCanvas(animate = false) {
                    if (!transformLayer.value) return;
                    
                    transformLayer.value.destroyChildren();
                    
                    const width = transformStage.value.width();
                    const height = transformStage.value.height();
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const margin = 60;
                    
                    // 原始三角形位置（左侧）
                    originalCenter = { x: centerX - 150, y: centerY };
                    const originalX = originalCenter.x;
                    const originalY = originalCenter.y;
                    
                    // 绘制原始三角形
                    const originalGroup = new Konva.Group({
                        name: 'original-group',
                        x: originalX,
                        y: originalY
                    });
                    
                    const trianglePoints = [
                        -triangleSize / 2, triangleSize / 2,
                        triangleSize / 2, triangleSize / 2,
                        0, -triangleSize / 2
                    ];
                    
                    const originalTriangle = new Konva.Line({
                        points: [...trianglePoints, trianglePoints[0], trianglePoints[1]],
                        closed: true,
                        fill: 'rgba(102, 126, 234, 0.3)',
                        stroke: '#667eea',
                        strokeWidth: 3
                    });
                    originalGroup.add(originalTriangle);
                    
                    const originalLabel = new Konva.Text({
                        x: -triangleSize / 2,
                        y: triangleSize / 2 + 30,
                        text: '原图形',
                        fontSize: 14,
                        fill: '#667eea',
                        fontStyle: 'bold'
                    });
                    originalGroup.add(originalLabel);
                    
                    transformLayer.value.add(originalGroup);
                    
                    // 变换后的三角形
                    const transformedGroup = new Konva.Group({
                        name: 'transformed-group',
                        x: originalX,
                        y: originalY
                    });
                    
                    const transformedTriangle = new Konva.Line({
                        points: [...trianglePoints, trianglePoints[0], trianglePoints[1]],
                        closed: true,
                        fill: 'rgba(76, 175, 80, 0.3)',
                        stroke: '#4caf50',
                        strokeWidth: 3
                    });
                    transformedGroup.add(transformedTriangle);
                    
                    const transformedLabel = new Konva.Text({
                        x: -triangleSize / 2,
                        y: triangleSize / 2 + 30,
                        text: '变换后',
                        fontSize: 14,
                        fill: '#4caf50',
                        fontStyle: 'bold'
                    });
                    transformedGroup.add(transformedLabel);
                    
                    // 应用变换
                    let targetX = originalX;
                    let targetY = originalY;
                    let targetRotation = 0;
                    let targetScaleX = 1;
                    let targetScaleY = 1;
                    
                    if (transformType.value === 'translate') {
                        targetX = originalX + translateX.value;
                        targetY = originalY + translateY.value;
                    } else if (transformType.value === 'rotate') {
                        targetX = originalX;
                        targetY = originalY;
                        targetRotation = rotationAngle.value;
                    } else if (transformType.value === 'reflect') {
                        targetX = originalX + (reflectAxis.value === 'vertical' ? 200 : 0);
                        targetY = originalY + (reflectAxis.value === 'horizontal' ? 150 : 0);
                        targetScaleX = reflectAxis.value === 'vertical' ? -1 : 1;
                        targetScaleY = reflectAxis.value === 'horizontal' ? -1 : 1;
                    } else if (transformType.value === 'scale') {
                        targetX = originalX;
                        targetY = originalY;
                        targetScaleX = scaleFactor.value;
                        targetScaleY = scaleFactor.value;
                    }
                    
                    transformedGroup.x(targetX);
                    transformedGroup.y(targetY);
                    transformedGroup.rotation(targetRotation);
                    transformedGroup.scaleX(targetScaleX);
                    transformedGroup.scaleY(targetScaleY);
                    
                    transformLayer.value.add(transformedGroup);
                    
                    // 如果是动画模式，添加平滑动画
                    if (animate && typeof gsap !== 'undefined') {
                        transformedGroup.opacity(0);
                        gsap.to(transformedGroup, {
                            opacity: 1,
                            x: targetX,
                            y: targetY,
                            rotation: targetRotation,
                            scaleX: targetScaleX,
                            scaleY: targetScaleY,
                            duration: 1.5,
                            ease: 'power2.inOut',
                            onUpdate: () => {
                                transformLayer.value.draw();
                            }
                        });
                    }
                    
                    // 绘制对称轴（翻折时）
                    if (transformType.value === 'reflect') {
                        const axisLine = new Konva.Line({
                            points: reflectAxis.value === 'vertical' 
                                ? [originalX + 100, centerY - 200, originalX + 100, centerY + 200]
                                : [centerX - 300, originalY + 75, centerX + 100, originalY + 75],
                            stroke: '#ff9800',
                            strokeWidth: 2,
                            dash: [10, 5]
                        });
                        transformLayer.value.add(axisLine);
                        
                        const axisLabel = new Konva.Text({
                            x: reflectAxis.value === 'vertical' ? originalX + 105 : centerX - 250,
                            y: reflectAxis.value === 'vertical' ? centerY - 180 : originalY + 60,
                            text: '对称轴',
                            fontSize: 14,
                            fill: '#ff9800',
                            fontStyle: 'bold',
                            padding: 5,
                            background: 'rgba(255,255,255,0.9)',
                            cornerRadius: 5
                        });
                        transformLayer.value.add(axisLabel);
                    }
                    
                    transformLayer.value.draw();
                }
                
                // 设置变换类型
                function setTransformType(type) {
                    transformType.value = type;
                    drawTransformCanvas(true);
                }
                
                // 重置变换
                function resetTransform() {
                    translateX.value = 100;
                    translateY.value = 0;
                    rotationAngle.value = 45;
                    scaleFactor.value = 1.5;
                    drawTransformCanvas(false);
                }
                
                // 初始化画布
                function initTransformCanvas() {
                    const container = document.getElementById('transform-canvas');
                    if (!container || transformStage.value) return;
                    
                    const width = container.offsetWidth;
                    const height = 600;
                    
                    transformStage.value = new Konva.Stage({
                        container: 'transform-canvas',
                        width: width,
                        height: height
                    });
                    
                    transformLayer.value = new Konva.Layer();
                    transformStage.value.add(transformLayer.value);
                    
                    drawTransformCanvas(false);
                }
                
                // 监听参数变化
                Vue.watch([translateX, translateY], () => {
                    if (transformType.value === 'translate' && transformLayer.value) {
                        drawTransformCanvas(false);
                    }
                });
                
                Vue.watch(rotationAngle, () => {
                    if (transformType.value === 'rotate' && transformLayer.value) {
                        drawTransformCanvas(false);
                    }
                });
                
                Vue.watch([reflectAxis], () => {
                    if (transformType.value === 'reflect' && transformLayer.value) {
                        drawTransformCanvas(false);
                    }
                });
                
                Vue.watch(scaleFactor, () => {
                    if (transformType.value === 'scale' && transformLayer.value) {
                        drawTransformCanvas(false);
                    }
                });
                
                onMounted(() => {
                    nextTick(() => {
                        initTransformCanvas();
                        
                        // 监听窗口大小变化
                        window.addEventListener('resize', () => {
                            if (transformStage.value) {
                                const container = document.getElementById('transform-canvas');
                                if (container) {
                                    transformStage.value.width(container.offsetWidth);
                                    drawTransformCanvas(false);
                                }
                            }
                        });
                        
                        // 自动渲染 KaTeX
                        setTimeout(() => {
                            if (typeof renderMathInElement !== 'undefined') {
                                try {
                                    renderMathInElement(document.body, {
                                        delimiters: [
                                            {left: '$$', right: '$$', display: true},
                                            {left: '$', right: '$', display: false},
                                            {left: '\\[', right: '\\]', display: true},
                                            {left: '\\(', right: '\\)', display: false}
                                        ],
                                        throwOnError: false
                                    });
                                } catch (e) {
                                    console.error('KaTeX 渲染错误:', e);
                                }
                            }
                            
                            // 手动渲染静态公式
                            if (typeof katex !== 'undefined') {
                                const katexStaticElements = document.querySelectorAll('.katex-static');
                                katexStaticElements.forEach(el => {
                                    const formula = el.getAttribute('data-formula');
                                    if (formula && !el.querySelector('.katex-html')) {
                                        try {
                                            katex.render(formula, el, {
                                                throwOnError: false
                                            });
                                        } catch (e) {
                                            console.error('KaTeX 静态公式渲染错误:', e);
                                        }
                                    }
                                });
                            }
                        }, 100);
                    });
                });
                
                return {
                    transformType,
                    translateX,
                    translateY,
                    rotationAngle,
                    reflectAxis,
                    scaleFactor,
                    setTransformType,
                    resetTransform
                };
            },
            template: `
                <div class="container">
                    <h1>🔄 图形变换</h1>
                    <p class="subtitle">探索图形的平移、旋转、翻折和放缩</p>
                    
                    <!-- 基本概念 -->
                    <div class="section">
                        <h2>📚 基本概念</h2>
                        <div class="concept-grid">
                            <div class="concept-card">
                                <h3>平移</h3>
                                <p>图形沿某个方向移动一定距离，形状、大小、方向都不变</p>
                            </div>
                            <div class="concept-card">
                                <h3>旋转</h3>
                                <p>图形绕某个点旋转一定角度，形状、大小不变，方向改变</p>
                            </div>
                            <div class="concept-card">
                                <h3>翻折</h3>
                                <p>图形沿某条直线翻折，形状、大小不变，位置对称</p>
                            </div>
                            <div class="concept-card">
                                <h3>放缩</h3>
                                <p>图形按一定比例放大或缩小，形状不变，大小改变</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 交互式变换 -->
                    <div class="section">
                        <h2>🔧 交互式变换</h2>
                        <div class="canvas-container">
                            <div class="controls">
                                <button class="btn" :class="{ 'btn-active': transformType === 'translate' }" 
                                        @click="setTransformType('translate')">平移</button>
                                <button class="btn" :class="{ 'btn-active': transformType === 'rotate' }" 
                                        @click="setTransformType('rotate')">旋转</button>
                                <button class="btn" :class="{ 'btn-active': transformType === 'reflect' }" 
                                        @click="setTransformType('reflect')">翻折</button>
                                <button class="btn" :class="{ 'btn-active': transformType === 'scale' }" 
                                        @click="setTransformType('scale')">放缩</button>
                                <button class="btn btn-secondary" @click="resetTransform">重置</button>
                            </div>
                            
                            <!-- 平移控制 -->
                            <div v-if="transformType === 'translate'" class="slider-container">
                                <label>水平平移：{{ translateX }}</label>
                                <input type="range" v-model.number="translateX" min="-200" max="200" step="10">
                                <label style="margin-top: 10px;">垂直平移：{{ translateY }}</label>
                                <input type="range" v-model.number="translateY" min="-200" max="200" step="10">
                            </div>
                            
                            <!-- 旋转控制 -->
                            <div v-if="transformType === 'rotate'" class="slider-container">
                                <label>旋转角度：{{ rotationAngle }}°</label>
                                <input type="range" v-model.number="rotationAngle" min="0" max="360" step="15">
                            </div>
                            
                            <!-- 翻折控制 -->
                            <div v-if="transformType === 'reflect'" class="controls">
                                <button class="btn" :class="{ 'btn-active': reflectAxis === 'vertical' }" 
                                        @click="reflectAxis = 'vertical'">垂直翻折</button>
                                <button class="btn" :class="{ 'btn-active': reflectAxis === 'horizontal' }" 
                                        @click="reflectAxis = 'horizontal'">水平翻折</button>
                            </div>
                            
                            <!-- 放缩控制 -->
                            <div v-if="transformType === 'scale'" class="slider-container">
                                <label>放缩比例：{{ scaleFactor.toFixed(1) }}x</label>
                                <input type="range" v-model.number="scaleFactor" min="0.5" max="3" step="0.1">
                            </div>
                            
                            <div id="transform-canvas" class="canvas-wrapper"></div>
                        </div>
                    </div>
                    
                    <!-- 不变量 -->
                    <div class="section">
                        <h2>🔒 不变量</h2>
                        <div class="info-panel">
                            <div class="info-item">
                                <strong>平移不变量：</strong>形状、大小、方向、角度都保持不变
                            </div>
                            <div class="info-item">
                                <strong>旋转不变量：</strong>形状、大小、角度都保持不变，只有位置和方向改变
                            </div>
                            <div class="info-item">
                                <strong>翻折不变量：</strong>形状、大小、角度都保持不变，只有位置改变
                            </div>
                            <div class="info-item">
                                <strong>放缩不变量：</strong>只有形状和角度保持不变，大小会改变
                            </div>
                            <div class="info-item" style="background: #fff3cd; border-left-color: #ffc107;">
                                <strong>注意：</strong>所有变换都保持形状（相似）和角度不变，这是相似图形的基础
                            </div>
                        </div>
                    </div>
                    
                    <!-- 相似的理解 -->
                    <div class="section">
                        <h2>🔍 通过变换理解相似</h2>
                        <div class="info-panel">
                            <div class="info-item">
                                <strong>相似的定义：</strong>形状相同但大小不同的两个图形叫做相似图形
                            </div>
                            <div class="info-item">
                                <strong>相似变换：</strong>通过平移、旋转、翻折、放缩的组合，可以将一个图形变成另一个相似图形
                            </div>
                            <div class="info-item">
                                <strong>相似比：</strong>相似图形对应边的比值，等于放缩比例
                                <span class="katex-static" data-formula="相似比 = \\frac{放大后的边长}{原边长}"></span>
                            </div>
                            <div class="info-item">
                                <strong>相似的性质：</strong>
                                <ul style="margin-left: 20px; margin-top: 5px;">
                                    <li>对应角相等</li>
                                    <li>对应边成比例</li>
                                    <li>面积比等于相似比的平方</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            `
        }).mount('#app');
    </script>
</body>
</html>
