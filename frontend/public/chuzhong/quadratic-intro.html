<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次函数 - 初中数学教学</title>
    <meta name="description" content="学习二次函数的基本概念，理解抛物线的开口方向、顶点位置和截距，掌握二次函数图像的变化规律，通过因式分解方法求解二次方程的根。">
    <meta name="keywords" content="二次函数,抛物线,开口方向,顶点,截距,图像变化,因式分解,求根,初中数学">
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" 
          onerror="this.onerror=null; this.href='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.css'">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            animation: fadeIn 0.8s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.2em;
        }
        
        .section {
            margin-bottom: 50px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            border-left: 5px solid #667eea;
        }
        
        .section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .concept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .concept-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .concept-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        
        .concept-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .graph-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .graph-wrapper {
            position: relative;
            width: 100%;
            height: 600px;
            background: #f8f9fa;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 250px;
        }
        
        .slider-group label {
            font-weight: bold;
            color: #667eea;
            min-width: 30px;
        }
        
        .slider-group input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        
        .slider-group input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }
        
        .slider-value {
            min-width: 60px;
            text-align: center;
            padding: 5px 10px;
            background: #e3f2fd;
            border-radius: 5px;
            font-weight: bold;
            color: #1976d2;
        }
        
        .info-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .info-item {
            margin: 10px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }
        
        .info-item strong {
            color: #667eea;
            margin-right: 10px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            background: #667eea;
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .practice-area {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
        }
        
        .practice-question {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }
        
        .practice-question.correct {
            border-color: #28a745;
            background: #d4edda;
        }
        
        .practice-question.incorrect {
            border-color: #dc3545;
            background: #f8d7da;
        }
        
        .answer-input {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 16px;
            width: 200px;
            margin: 10px;
        }
        
        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-weight: 500;
        }
        
        .feedback.correct {
            background: #d4edda;
            color: #155724;
        }
        
        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
        }
        
        .factorization-demo {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .factor-steps {
            margin: 15px 0;
            padding: 15px;
            background: #fff3e0;
            border-radius: 8px;
            border-left: 4px solid #ff9800;
        }
        
        .factor-steps h4 {
            color: #f57c00;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <!-- Vue 3.5.20 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    
    <!-- Konva -->
    <script src="https://cdn.jsdelivr.net/npm/konva@10.0.12/konva.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/konva.min.js'"></script>
    
    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    
    <!-- KaTeX -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" 
            onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/katex.auto-render.min.js'"></script>
    
    <script>
        const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;
        
        const app = createApp({
            setup() {
                // 二次函数参数
                const a = ref(1);
                const b = ref(0);
                const c = ref(0);
                
                // 图形
                const graphStage = ref(null);
                const graphLayer = ref(null);
                
                // 动画控制
                const isAnimating = ref(false);
                const showVertexAnimation = ref(false);
                
                // 因式分解演示
                const factorExpr = ref('x² + 5x + 6');
                const factorSteps = ref([]);
                const factorAnimationSteps = ref([]);
                const currentFactorStep = ref(0);
                const isFactorizing = ref(false);
                
                // 顶点公式的 computed 属性
                const vertexFormulaX = computed(() => {
                    if (typeof katex === 'undefined') {
                        return `x_v = -\\frac{b}{2a} = -\\frac{${b.value.toFixed(1)}}{2 \\times ${a.value.toFixed(1)}} = ${vertex.value.x.toFixed(2)}`;
                    }
                    try {
                        return katex.renderToString(`x_v = -\\frac{b}{2a} = -\\frac{${b.value.toFixed(1)}}{2 \\times ${a.value.toFixed(1)}} = ${vertex.value.x.toFixed(2)}`, {
                            throwOnError: false
                        });
                    } catch (e) {
                        return `x_v = -\\frac{b}{2a} = -\\frac{${b.value.toFixed(1)}}{2 \\times ${a.value.toFixed(1)}} = ${vertex.value.x.toFixed(2)}`;
                    }
                });
                
                const vertexFormulaY = computed(() => {
                    if (typeof katex === 'undefined') {
                        return `y_v = a(x_v)^2 + b(x_v) + c = ${vertex.value.y.toFixed(2)}`;
                    }
                    try {
                        return katex.renderToString(`y_v = a(x_v)^2 + b(x_v) + c = ${vertex.value.y.toFixed(2)}`, {
                            throwOnError: false
                        });
                    } catch (e) {
                        return `y_v = a(x_v)^2 + b(x_v) + c = ${vertex.value.y.toFixed(2)}`;
                    }
                });
                
                const functionExpression = computed(() => {
                    if (typeof katex === 'undefined') {
                        return `y = ${a.value.toFixed(1)}x^2 ${b.value >= 0 ? '+' : ''}${b.value.toFixed(1)}x ${c.value >= 0 ? '+' : ''}${c.value.toFixed(1)}`;
                    }
                    try {
                        let expr = `y = ${a.value.toFixed(1)}x^2`;
                        if (Math.abs(b.value) > 0.01) {
                            expr += b.value >= 0 ? ` + ${b.value.toFixed(1)}x` : ` - ${Math.abs(b.value).toFixed(1)}x`;
                        }
                        if (Math.abs(c.value) > 0.01) {
                            expr += c.value >= 0 ? ` + ${c.value.toFixed(1)}` : ` - ${Math.abs(c.value).toFixed(1)}`;
                        }
                        return katex.renderToString(expr, {
                            throwOnError: false
                        });
                    } catch (e) {
                        return `y = ${a.value.toFixed(1)}x^2 ${b.value >= 0 ? '+' : ''}${b.value.toFixed(1)}x ${c.value >= 0 ? '+' : ''}${c.value.toFixed(1)}`;
                    }
                });
                
                // 练习题目
                const practiceQuestions = ref([
                    {
                        id: 1,
                        question: '二次函数 y = 2x² - 4x + 1 的开口方向是？',
                        answer: '向上',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 2,
                        question: '二次函数 y = -x² + 3x - 2 的顶点坐标是？',
                        answer: '(1.5, 0.25)',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 3,
                        question: '二次函数 y = x² - 4 与 y 轴的交点坐标是？',
                        answer: '(0, -4)',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 4,
                        question: '用因式分解法解方程：x² - 5x + 6 = 0',
                        answer: 'x = 2 或 x = 3',
                        userAnswer: '',
                        correct: null
                    },
                    {
                        id: 5,
                        question: '二次函数 y = -2x² + 8x - 6 的最大值是多少？',
                        answer: '2',
                        userAnswer: '',
                        correct: null
                    }
                ]);
                
                // 计算顶点坐标
                const vertex = computed(() => {
                    if (Math.abs(a.value) < 0.001) {
                        return { x: 0, y: c.value };
                    }
                    const x = -b.value / (2 * a.value);
                    const y = a.value * x * x + b.value * x + c.value;
                    return { x, y };
                });
                
                // 计算判别式
                const discriminant = computed(() => {
                    return b.value * b.value - 4 * a.value * c.value;
                });
                
                // 计算根
                const roots = computed(() => {
                    if (Math.abs(a.value) < 0.001) {
                        return [];
                    }
                    const disc = discriminant.value;
                    if (disc < 0) {
                        return [];
                    } else if (Math.abs(disc) < 0.001) {
                        const x = -b.value / (2 * a.value);
                        return [{ x, type: 'double' }];
                    } else {
                        const sqrtDisc = Math.sqrt(disc);
                        const x1 = (-b.value - sqrtDisc) / (2 * a.value);
                        const x2 = (-b.value + sqrtDisc) / (2 * a.value);
                        return [{ x: x1, type: 'single' }, { x: x2, type: 'single' }];
                    }
                });
                
                // 计算 y 轴截距
                const yIntercept = computed(() => {
                    return c.value;
                });
                
                // 开口方向
                const openingDirection = computed(() => {
                    return a.value > 0 ? '向上' : a.value < 0 ? '向下' : '不是二次函数';
                });
                
                // 绘制坐标系统
                function drawCoordinateSystem() {
                    if (!graphLayer.value) return;
                    
                    graphLayer.value.destroyChildren();
                    
                    const width = graphStage.value.width();
                    const height = graphStage.value.height();
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const scale = 40; // 每单位40像素
                    
                    // 绘制网格
                    const gridGroup = new Konva.Group({ name: 'grid' });
                    for (let i = -10; i <= 10; i++) {
                        // 垂直线
                        const vLine = new Konva.Line({
                            points: [centerX + i * scale, 0, centerX + i * scale, height],
                            stroke: i === 0 ? '#333' : '#e0e0e0',
                            strokeWidth: i === 0 ? 2 : 1,
                            dash: i === 0 ? [] : [5, 5]
                        });
                        gridGroup.add(vLine);
                        
                        // 水平线
                        const hLine = new Konva.Line({
                            points: [0, centerY + i * scale, width, centerY + i * scale],
                            stroke: i === 0 ? '#333' : '#e0e0e0',
                            strokeWidth: i === 0 ? 2 : 1,
                            dash: i === 0 ? [] : [5, 5]
                        });
                        gridGroup.add(hLine);
                    }
                    graphLayer.value.add(gridGroup);
                    
                    // 绘制坐标轴标签
                    const labelGroup = new Konva.Group({ name: 'labels' });
                    for (let i = -10; i <= 10; i++) {
                        if (i === 0) continue;
                        
                        // X轴标签
                        const xLabel = new Konva.Text({
                            x: centerX + i * scale - 10,
                            y: centerY + 10,
                            text: i.toString(),
                            fontSize: 12,
                            fill: '#666'
                        });
                        labelGroup.add(xLabel);
                        
                        // Y轴标签
                        const yLabel = new Konva.Text({
                            x: centerX + 10,
                            y: centerY - i * scale - 10,
                            text: i.toString(),
                            fontSize: 12,
                            fill: '#666'
                        });
                        labelGroup.add(yLabel);
                    }
                    
                    // 原点标签
                    const originLabel = new Konva.Text({
                        x: centerX + 10,
                        y: centerY + 10,
                        text: 'O',
                        fontSize: 14,
                        fill: '#333',
                        fontStyle: 'bold'
                    });
                    labelGroup.add(originLabel);
                    
                    // X轴箭头和标签
                    const xArrow = new Konva.Line({
                        points: [width - 20, centerY, width, centerY, width - 15, centerY - 5, width - 15, centerY + 5, width, centerY],
                        stroke: '#333',
                        strokeWidth: 2,
                        fill: '#333',
                        closed: true
                    });
                    labelGroup.add(xArrow);
                    
                    const xAxisLabel = new Konva.Text({
                        x: width - 15,
                        y: centerY + 20,
                        text: 'x',
                        fontSize: 16,
                        fill: '#333',
                        fontStyle: 'bold'
                    });
                    labelGroup.add(xAxisLabel);
                    
                    // Y轴箭头和标签
                    const yArrow = new Konva.Line({
                        points: [centerX, 20, centerX, 0, centerX - 5, 15, centerX + 5, 15, centerX, 0],
                        stroke: '#333',
                        strokeWidth: 2,
                        fill: '#333',
                        closed: true
                    });
                    labelGroup.add(yArrow);
                    
                    const yAxisLabel = new Konva.Text({
                        x: centerX - 20,
                        y: 5,
                        text: 'y',
                        fontSize: 16,
                        fill: '#333',
                        fontStyle: 'bold'
                    });
                    labelGroup.add(yAxisLabel);
                    
                    graphLayer.value.add(labelGroup);
                }
                
                // 绘制抛物线
                function drawParabola() {
                    if (!graphLayer.value || Math.abs(a.value) < 0.001) return;
                    
                    // 清除旧的抛物线
                    const oldParabola = graphLayer.value.findOne('.parabola');
                    if (oldParabola) oldParabola.destroy();
                    
                    // 清除函数表达式标签
                    const oldExprLabel = graphLayer.value.findOne('.function-expression');
                    if (oldExprLabel) oldExprLabel.destroy();
                    
                    const width = graphStage.value.width();
                    const height = graphStage.value.height();
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const scale = 40;
                    
                    const points = [];
                    for (let x = -15; x <= 15; x += 0.1) {
                        const y = a.value * x * x + b.value * x + c.value;
                        const screenX = centerX + x * scale;
                        const screenY = centerY - y * scale;
                        if (screenX >= 0 && screenX <= width && screenY >= 0 && screenY <= height) {
                            points.push(screenX, screenY);
                        }
                    }
                    
                    const parabola = new Konva.Line({
                        points: points,
                        stroke: '#667eea',
                        strokeWidth: 3,
                        lineCap: 'round',
                        lineJoin: 'round',
                        name: 'parabola'
                    });
                    graphLayer.value.add(parabola);
                    
                    // 在画布右上角显示函数表达式
                    let exprText = 'y = ';
                    if (Math.abs(a.value - 1) < 0.01) {
                        exprText += 'x²';
                    } else if (Math.abs(a.value + 1) < 0.01) {
                        exprText += '-x²';
                    } else {
                        exprText += a.value.toFixed(1) + 'x²';
                    }
                    
                    if (Math.abs(b.value) > 0.01) {
                        exprText += b.value >= 0 ? ' + ' : ' - ';
                        if (Math.abs(Math.abs(b.value) - 1) > 0.01) {
                            exprText += Math.abs(b.value).toFixed(1);
                        }
                        exprText += 'x';
                    }
                    
                    if (Math.abs(c.value) > 0.01) {
                        exprText += c.value >= 0 ? ' + ' : ' - ';
                        exprText += Math.abs(c.value).toFixed(1);
                    }
                    
                    const exprLabel = new Konva.Text({
                        x: width - 200,
                        y: 20,
                        text: exprText,
                        fontSize: 18,
                        fill: '#667eea',
                        fontStyle: 'bold',
                        padding: 10,
                        background: 'rgba(255,255,255,0.95)',
                        cornerRadius: 8,
                        align: 'left',
                        name: 'function-expression'
                    });
                    graphLayer.value.add(exprLabel);
                }
                
                // 绘制顶点
                function drawVertex() {
                    if (!graphLayer.value) return;
                    
                    const oldVertex = graphLayer.value.findOne('.vertex');
                    if (oldVertex) oldVertex.destroy();
                    
                    const width = graphStage.value.width();
                    const height = graphStage.value.height();
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const scale = 40;
                    
                    const v = vertex.value;
                    const screenX = centerX + v.x * scale;
                    const screenY = centerY - v.y * scale;
                    
                    const vertexGroup = new Konva.Group({
                        x: screenX,
                        y: screenY,
                        name: 'vertex'
                    });
                    
                    const circle = new Konva.Circle({
                        radius: 8,
                        fill: '#f57c00',
                        stroke: '#fff',
                        strokeWidth: 2
                    });
                    vertexGroup.add(circle);
                    
                    const label = new Konva.Text({
                        x: 15,
                        y: -10,
                        text: `顶点\n(${v.x.toFixed(2)}, ${v.y.toFixed(2)})`,
                        fontSize: 12,
                        fill: '#f57c00',
                        fontStyle: 'bold',
                        padding: 5,
                        background: 'rgba(255,255,255,0.95)',
                        cornerRadius: 5,
                        align: 'left'
                    });
                    vertexGroup.add(label);
                    
                    graphLayer.value.add(vertexGroup);
                    
                    // 顶点动画
                    if (showVertexAnimation.value && typeof gsap !== 'undefined') {
                        gsap.from(vertexGroup, {
                            scale: 0,
                            duration: 0.5,
                            ease: 'back.out(1.7)'
                        });
                    }
                }
                
                // 绘制截距
                function drawIntercepts() {
                    if (!graphLayer.value) return;
                    
                    const oldIntercepts = graphLayer.value.find('.intercept');
                    if (oldIntercepts && oldIntercepts.length) {
                        oldIntercepts.forEach(item => item.destroy());
                    }
                    
                    const width = graphStage.value.width();
                    const height = graphStage.value.height();
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const scale = 40;
                    
                    // Y轴截距
                    const yInt = yIntercept.value;
                    const yIntScreenY = centerY - yInt * scale;
                    
                    if (yIntScreenY >= 0 && yIntScreenY <= height) {
                        const yIntGroup = new Konva.Group({
                            x: centerX,
                            y: yIntScreenY,
                            name: 'intercept'
                        });
                        
                        const circle = new Konva.Circle({
                            radius: 6,
                            fill: '#4caf50',
                            stroke: '#fff',
                            strokeWidth: 2
                        });
                        yIntGroup.add(circle);
                        
                        const label = new Konva.Text({
                            x: 15,
                            y: -8,
                            text: `(0, ${yInt.toFixed(2)})`,
                            fontSize: 12,
                            fill: '#4caf50',
                            fontStyle: 'bold',
                            padding: 3,
                            background: 'rgba(255,255,255,0.9)',
                            cornerRadius: 3
                        });
                        yIntGroup.add(label);
                        
                        graphLayer.value.add(yIntGroup);
                    }
                    
                    // X轴截距（根）
                    roots.value.forEach((root, index) => {
                        const rootScreenX = centerX + root.x * scale;
                        const rootScreenY = centerY;
                        
                        if (rootScreenX >= 0 && rootScreenX <= width) {
                            const rootGroup = new Konva.Group({
                                x: rootScreenX,
                                y: rootScreenY,
                                name: 'intercept'
                            });
                            
                            const circle = new Konva.Circle({
                                radius: 6,
                                fill: '#f44336',
                                stroke: '#fff',
                                strokeWidth: 2
                            });
                            rootGroup.add(circle);
                            
                            const label = new Konva.Text({
                                x: -30,
                                y: 15,
                                text: `(${root.x.toFixed(2)}, 0)`,
                                fontSize: 12,
                                fill: '#f44336',
                                fontStyle: 'bold',
                                padding: 3,
                                background: 'rgba(255,255,255,0.9)',
                                cornerRadius: 3
                            });
                            rootGroup.add(label);
                            
                            graphLayer.value.add(rootGroup);
                        }
                    });
                }
                
                // 更新图形
                function updateGraph() {
                    if (!graphLayer.value || !graphStage.value) return;
                    try {
                        drawCoordinateSystem();
                        drawParabola();
                        drawVertex();
                        drawIntercepts();
                        graphLayer.value.batchDraw();
                    } catch (error) {
                        console.error('更新图形时出错:', error);
                    }
                }
                
                // 顶点动画
                function animateVertex() {
                    if (isAnimating.value || typeof gsap === 'undefined') return;
                    isAnimating.value = true;
                    
                    const width = graphStage.value.width();
                    const height = graphStage.value.height();
                    const centerX = width / 2;
                    const centerY = height / 2;
                    const scale = 40;
                    
                    const v = vertex.value;
                    const targetX = centerX + v.x * scale;
                    const targetY = centerY - v.y * scale;
                    
                    // 创建动画起点（原点或上一个顶点位置）
                    const oldVertex = graphLayer.value.findOne('.vertex');
                    let startX = centerX;
                    let startY = centerY;
                    
                    if (oldVertex) {
                        startX = oldVertex.x();
                        startY = oldVertex.y();
                    }
                    
                    // 创建临时的顶点标记用于动画
                    const animVertexGroup = new Konva.Group({
                        x: startX,
                        y: startY,
                        name: 'anim-vertex'
                    });
                    
                    const circle = new Konva.Circle({
                        radius: 10,
                        fill: '#ff5722',
                        stroke: '#fff',
                        strokeWidth: 3,
                        shadowBlur: 10,
                        shadowColor: '#ff5722',
                        shadowOpacity: 0.8
                    });
                    animVertexGroup.add(circle);
                    
                    const label = new Konva.Text({
                        x: 15,
                        y: -15,
                        text: `顶点移动\n到 (${v.x.toFixed(2)}, ${v.y.toFixed(2)})`,
                        fontSize: 12,
                        fill: '#ff5722',
                        fontStyle: 'bold',
                        padding: 8,
                        background: 'rgba(255,255,255,0.95)',
                        cornerRadius: 5,
                        align: 'left'
                    });
                    animVertexGroup.add(label);
                    
                    graphLayer.value.add(animVertexGroup);
                    graphLayer.value.moveToTop(animVertexGroup);
                    
                    // 绘制轨迹线
                    const traceLine = new Konva.Line({
                        points: [startX, startY, startX, startY],
                        stroke: '#ff5722',
                        strokeWidth: 2,
                        dash: [10, 5],
                        opacity: 0.6,
                        name: 'trace-line'
                    });
                    graphLayer.value.add(traceLine);
                    graphLayer.value.moveDown(traceLine);
                    
                    // 使用 GSAP 动画
                    const tl = gsap.timeline({
                        onComplete: () => {
                            // 动画完成后更新真正的顶点
                            if (oldVertex) oldVertex.destroy();
                            animVertexGroup.destroy();
                            traceLine.destroy();

                            updateGraph();
                            setTimeout(() => {
                                showVertexAnimation.value = false;
                                isAnimating.value = false;
                            }, 500);
                        }
                    });
                    
                    // 同时动画顶点位置和轨迹线
                    tl.to(animVertexGroup, {
                        x: targetX,
                        y: targetY,
                        duration: 1.5,
                        ease: 'power2.inOut'
                    }, 0);
                    
                    tl.to(traceLine, {
                        points: [startX, startY, targetX, targetY],
                        duration: 1.5,
                        ease: 'power2.inOut'
                    }, 0);
                    
                    // 添加缩放效果
                    gsap.to(circle, {
                        scale: 1.3,
                        duration: 0.3,
                        yoyo: true,
                        repeat: 1,
                        ease: 'power2.inOut'
                    });
                }
                
                // 因式分解
                function factorize() {
                    const expr = factorExpr.value.trim().replace(/\s+/g, '');
                    factorSteps.value = [];
                    factorAnimationSteps.value = [];
                    currentFactorStep.value = 0;
                    isFactorizing.value = false;
                    
                    // 简单解析：x² + bx + c 或 x² - bx + c 形式
                    let match = expr.match(/x²\s*([+-]?\d*)x\s*([+-]?\d+)/);
                    if (!match) {
                        // 尝试其他格式
                        match = expr.match(/x\^2\s*([+-]?\d*)x\s*([+-]?\d+)/);
                    }
                    if (!match) {
                        factorSteps.value = [{ step: '无法解析该表达式', explanation: '请输入 x² + bx + c 形式的表达式（例如：x² + 5x + 6）' }];
                        return;
                    }
                    
                    let bVal = 0;
                    const bStr = match[1];
                    if (bStr === '' || bStr === '+') {
                        bVal = 1;
                    } else if (bStr === '-') {
                        bVal = -1;
                    } else {
                        bVal = parseInt(bStr);
                    }
                    
                    const cVal = parseInt(match[2]);
                    
                    // 寻找两个数 p 和 q，使得 p + q = b, p * q = c
                    let found = false;
                    const absC = Math.abs(cVal);
                    let foundP = 0;
                    let foundQ = 0;
                    
                    // 创建搜索动画步骤
                    const searchSteps = [];
                    for (let p = -absC; p <= absC; p++) {
                        if (p === 0) continue;
                        if (absC % Math.abs(p) !== 0) continue;
                        const q = cVal / p;
                        searchSteps.push({ p, q, sum: p + q, product: p * q, matches: Math.abs(p + q - bVal) < 0.001 });
                        
                        if (Math.abs(p + q - bVal) < 0.001) {
                            found = true;
                            foundP = p;
                            foundQ = q;
                            break;
                        }
                    }
                    
                    if (found) {
                        const pDisplay = foundP >= 0 ? `+ ${foundP}` : `- ${Math.abs(foundP)}`;
                        const qDisplay = foundQ >= 0 ? `+ ${foundQ}` : `- ${Math.abs(foundQ)}`;
                        const root1 = -foundP;
                        const root2 = -foundQ;
                        
                        // 创建详细的动画步骤
                        factorAnimationSteps.value = [
                            { 
                                step: '步骤1：理解问题', 
                                expression: `x² ${bVal >= 0 ? '+' : ''}${bVal}x ${cVal >= 0 ? '+' : ''}${cVal} = 0`,
                                explanation: `我们需要找到两个数 p 和 q，使得：p + q = ${bVal}（x 的系数），p × q = ${cVal}（常数项）`,
                                highlight: 'original'
                            },
                            {
                                step: '步骤2：寻找符合条件的数',
                                expression: `尝试不同的 p 和 q 值`,
                                explanation: `从 ${cVal} 的因数开始尝试...`,
                                highlight: 'search',
                                searchSteps: searchSteps.slice(0, Math.min(5, searchSteps.length))
                            },
                            {
                                step: '步骤3：找到答案',
                                expression: `p = ${foundP}, q = ${foundQ}`,
                                explanation: `验证：${foundP} + ${foundQ} = ${bVal} ✓，${foundP} × ${foundQ} = ${cVal} ✓`,
                                highlight: 'found'
                            },
                            {
                                step: '步骤4：因式分解',
                                expression: `(x ${pDisplay})(x ${qDisplay}) = 0`,
                                explanation: `将 x² ${bVal >= 0 ? '+' : ''}${bVal}x ${cVal >= 0 ? '+' : ''}${cVal} 分解为两个一次因式的乘积`,
                                highlight: 'factor'
                            },
                            {
                                step: '步骤5：求解',
                                expression: `x ${pDisplay} = 0 或 x ${qDisplay} = 0`,
                                explanation: `根据零因子定理，至少有一个因式等于 0`,
                                highlight: 'solve'
                            },
                            {
                                step: '最终答案',
                                expression: `x = ${root1} 或 x = ${root2}`,
                                explanation: `所以方程的两个根是 ${root1} 和 ${root2}`,
                                highlight: 'answer'
                            }
                        ];
                        
                        factorSteps.value = factorAnimationSteps.value;
                    } else {
                        factorSteps.value = [{ step: '无法因式分解', explanation: '该表达式无法用整数因式分解，请尝试使用求根公式' }];
                    }
                }
                
                // 因式分解动画
                function animateFactorization() {
                    if (isFactorizing.value || factorAnimationSteps.value.length === 0) return;
                    isFactorizing.value = true;
                    currentFactorStep.value = 0;
                    
                    const showNextStep = () => {
                        if (currentFactorStep.value < factorAnimationSteps.value.length) {
                            currentFactorStep.value++;
                            if (currentFactorStep.value < factorAnimationSteps.value.length) {
                                setTimeout(showNextStep, 2000);
                            } else {
                                isFactorizing.value = false;
                            }
                        } else {
                            isFactorizing.value = false;
                        }
                    };
                    
                    showNextStep();
                }

                    if (currentFactorStep.value < factorAnimationSteps.value.length - 1) {
                        currentFactorStep.value++;
                    }
                }

                    if (currentFactorStep.value > 0) {
                        currentFactorStep.value--;

                }

                    const userAns = question.userAnswer.trim().toLowerCase().replace(/\s+/g, '');
                    const correctAns = question.answer.trim().toLowerCase().replace(/\s+/g, '');
                    question.correct = userAns === correctAns;
                }
                
                // 计算得分
                const score = computed(() => {
                    if (!practiceQuestions.value || practiceQuestions.value.length === 0) {
                        return { correct: 0, total: 0 };

                    const total = practiceQuestions.value.length;
                    const correct = practiceQuestions.value.filter(q => q.correct === true).length;
                    return { correct, total };
                });
                
                // 初始化图形
                function initGraph() {

                    if (!container || graphStage.value) return;

                    graphStage.value = new Konva.Stage({

                    graphLayer.value = new Konva.Layer();

                }
                
                // 监听参数变化
                Vue.watch([a, b, c], () => {
                    if (graphLayer.value) {

                    }
                });
                
                onMounted(() => {
                    nextTick(() => {
                        initGraph();
                        
                        // 监听窗口大小变化

                            if (graphStage.value) {

                                if (container) {
                                    graphStage.value.width(container.offsetWidth);
                                    updateGraph();
                                }
                            }
                        });
                        
                        // 自动渲染 KaTeX（渲染静态公式）
                        nextTick(() => {
                            // 等待 DOM 完全渲染
                            setTimeout(() => {
                                if (typeof renderMathInElement !== 'undefined') {
                                    try {
                                        renderMathInElement(document.body, {
                                            delimiters: [
                                                {left: '$$', right: '$$', display: true},
                                                {left: '$', right: '$', display: false},
                                                {left: '\\[', right: '\\]', display: true},
                                                {left: '\\(', right: '\\)', display: false}
                                            ],
                                            throwOnError: false,
                                            ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
                                        });
                                    } catch (e) {
                                        console.error('KaTeX 渲染错误:', e);
                                    }
                                }
                                
                                // 手动渲染所有 .katex-static 元素
                                if (typeof katex !== 'undefined') {
                                    const katexStaticElements = document.querySelectorAll('.katex-static');
                                    katexStaticElements.forEach(el => {
                                        const formula = el.getAttribute('data-formula');
                                        if (formula && !el.querySelector('.katex-html')) {
                                            try {
                                                katex.render(formula, el, {
                                                    throwOnError: false
                                                });
                                            } catch (e) {
                                                console.error('KaTeX 静态公式渲染错误:', e);
                                            }
                                        }
                                    });
                                }
                                
                                // 手动渲染所有 .katex 元素（包含文本内容的）
                                if (typeof katex !== 'undefined') {
                                    const katexElements = document.querySelectorAll('.katex:not(.katex-display):not(.katex-static)');
                                    katexElements.forEach(el => {
                                        const text = el.textContent.trim();
                                        if (text && !el.querySelector('.katex-html')) {
                                            try {
                                                // 清理文本，移除可能的转义字符
                                                const cleanText = text.replace(/\\\\/g, '\\');
                                                katex.render(cleanText, el, {
                                                    throwOnError: false
                                                });
                                            } catch (e) {
                                                console.error('KaTeX 单个元素渲染错误:', e, '文本:', el.textContent);
                                            }
                                        }
                                    });
                                }
                            }, 100);
                        });
                        
                        // 监听数据变化后重新渲染 KaTeX（使用防抖）
                        let katexRenderTimer = null;
                        Vue.watch([a, b, c], () => {
                            if (katexRenderTimer) clearTimeout(katexRenderTimer);
                            katexRenderTimer = setTimeout(() => {
                                nextTick(() => {
                                    if (typeof renderMathInElement !== 'undefined') {
                                        try {
                                            renderMathInElement(document.body, {
                                                delimiters: [
                                                    {left: '$$', right: '$$', display: true},
                                                    {left: '$', right: '$', display: false},
                                                    {left: '\\[', right: '\\]', display: true},
                                                    {left: '\\(', right: '\\)', display: false}
                                                ],
                                                throwOnError: false
                                            });
                                        } catch (e) {
                                            console.error('KaTeX 渲染错误:', e);
                                        }
                                    }
                                });
                            }, 300);
                        });
                    });
                });
                
                return {
                    a,
                    b,
                    c,
                    vertex,
                    roots,
                    yIntercept,
                    openingDirection,
                    discriminant,
                    factorExpr,
                    factorSteps,
                    factorAnimationSteps,
                    currentFactorStep,
                    isFactorizing,
                    vertexFormulaX,
                    vertexFormulaY,
                    functionExpression,
                    practiceQuestions,
                    score,
                    animateVertex,
                    factorize,
                    animateFactorization,
                    nextFactorStep,
                    prevFactorStep,
                    checkAnswer
                };
            },
            template: `
                <div class="container">

                            <div id="graph-canvas" class="graph-wrapper"></div>
                            
                            <div class="info-panel">

                                    <span v-html="functionExpression"></span>

                                    <!-- 搜索步骤可视化 -->

                    <div class="section">
                        <h2>✏️ 练习</h2>
                        <div class="practice-area">
                            <div v-for="question in practiceQuestions" :key="question.id" 
                                 :class="['practice-question', question.correct === true ? 'correct' : question.correct === false ? 'incorrect' : '']">
                                <h3>{{ question.question }}</h3>
                                <div class="controls">
                                    <input type="text" v-model="question.userAnswer" class="answer-input" placeholder="输入答案">
                                    <button class="btn" @click="checkAnswer(question)">检查</button>
                                </div>
                                <div v-if="question.correct === true" class="feedback correct">
                                    ✓ 正确！
                                </div>
                                <div v-if="question.correct === false" class="feedback incorrect">
                                    ✗ 错误，正确答案是：{{ question.answer }}
                                </div>
                            </div>
                            
                            <div style="margin-top: 30px; padding: 20px; background: #e3f2fd; border-radius: 10px;">
                                <h3 style="color: #1976d2;">得分：{{ score.correct }} / {{ score.total }}</h3>
                            </div>
                        </div>
                    </div>
                </div>
            `
        });
        
        app.mount('#app');
    </script>
</body>
</html>
