<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人物奔跑骨骼演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
      background: radial-gradient(circle at top, #1f2937 0%, #020617 55%, #000 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e5e7eb;
    }
    h1 { font-size: clamp(1.4rem, 3vw, 2rem); margin-bottom: 6px; }
    p { font-size: 0.9rem; opacity: 0.8; margin-bottom: 10px; }
    #canvas {
      background: linear-gradient(to top, #020617, #0b1120);
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.4);
      box-shadow: 0 10px 40px rgba(0,0,0,0.7);
      max-width: 100%;
    }
  </style>
</head>
<body>
  <h1>人物奔跑 - 骨骼与形体</h1>
  <p>用 KineticsCore 多链一体驱动「有厚度」的身体与四肢，展示连续、丝滑的跑步循环。</p>
  <canvas id="canvas" width="900" height="420"></canvas>

  <script src="KinecticsCore.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      const groundY = H - 70;
      const KC = window.KineticsCore;

      let t0 = performance.now();
      const runSpeed = 1.6;

      const torsoLen1 = 20, torsoLen2 = 20, torsoLen3 = 18;
      const thighLen = 32, shinLen = 30, footLen = 26;
      const upperArmLen = 20, forearmLen = 18, handLen = 16;
      const pelvisW = 10, shoulderW = 14;
      const neckLen = 12, headR = 18;
      const spinePointShoulder = 3;

      const spine = new KC.KinematicChain(0, 0);
      spine.addStaticBone(torsoLen1).addStaticBone(torsoLen2).addStaticBone(torsoLen3);

      function makeLimb3(seg1, seg2, seg3) {
        const c = new KC.KinematicChain(0, 0);
        c.addStaticBone(seg1).addStaticBone(seg2).addStaticBone(seg3);
        return c;
      }

      const skeleton = new KC.KinematicSkeleton(0, 0);
      skeleton.setSpine(spine);
      skeleton.addLimb('leftLeg', makeLimb3(thighLen, shinLen, footLen), 0, -pelvisW, 0);
      skeleton.addLimb('rightLeg', makeLimb3(thighLen, shinLen, footLen), 0, pelvisW, 0);
      skeleton.addLimb('leftArm', makeLimb3(upperArmLen, forearmLen, handLen), spinePointShoulder, -shoulderW, 0);
      skeleton.addLimb('rightArm', makeLimb3(upperArmLen, forearmLen, handLen), spinePointShoulder, shoulderW, 0);

      function drawGround() {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#0b1120';
        ctx.fillRect(0, groundY, W, H - groundY);
        ctx.strokeStyle = 'rgba(15,23,42,0.9)';
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(W, groundY);
        ctx.stroke();
      }

      function drawRunner(time) {
        const centerX = W / 2;
        const phase = time * runSpeed;
        const bodyBob = Math.sin(phase * 2) * 4;
        const hipY = groundY - 78;
        const shoulderY = hipY - torsoLen1 - torsoLen2 - torsoLen3 + bodyBob;

        skeleton.origin.x = centerX;
        skeleton.origin.y = hipY + bodyBob;

        const lean = -0.18 + Math.sin(phase * 1.5) * 0.05;
        const runStep = 38;
        const leftFootX = centerX - runStep * Math.sin(phase);
        const rightFootX = centerX + runStep * Math.sin(phase);
        const armSwing = 28;
        const leftHandX = centerX - shoulderW - armSwing * Math.sin(phase * 1.8);
        const rightHandX = centerX + shoulderW + armSwing * Math.sin(phase * 1.8);
        const handY = shoulderY - 14;

        skeleton.solve({
          spineTargetX: centerX + Math.sin(lean) * 15,
          spineTargetY: shoulderY - 8,
          limbTargets: {
            leftLeg: [leftFootX, groundY],
            rightLeg: [rightFootX, groundY],
            leftArm: [leftHandX, handY],
            rightArm: [rightHandX, handY]
          },
          ikOptions: { iterations: 14, tolerance: 1e-3 }
        });

        const hipCenter = { x: skeleton.origin.x, y: skeleton.origin.y };
        const spinePts = spine.points;
        const shoulderLevel = spinePts[spinePointShoulder];
        const leftHip = { x: hipCenter.x - pelvisW, y: hipCenter.y };
        const rightHip = { x: hipCenter.x + pelvisW, y: hipCenter.y };
        const leftShoulder = { x: shoulderLevel.x - shoulderW, y: shoulderLevel.y };
        const rightShoulder = { x: shoulderLevel.x + shoulderW, y: shoulderLevel.y };

        ctx.save();
        ctx.translate(hipCenter.x, hipCenter.y);
        ctx.rotate(lean);
        ctx.translate(-hipCenter.x, -hipCenter.y);

        ctx.fillStyle = 'rgba(148,163,184,0.95)';
        ctx.strokeStyle = 'rgba(15,23,42,0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(leftHip.x, leftHip.y);
        ctx.lineTo(leftShoulder.x + 2, leftShoulder.y + 4);
        ctx.quadraticCurveTo(hipCenter.x, shoulderY - 4, rightShoulder.x - 2, rightShoulder.y + 4);
        ctx.lineTo(rightHip.x, rightHip.y);
        ctx.quadraticCurveTo(hipCenter.x, hipCenter.y + 10, leftHip.x, leftHip.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = 'rgba(226,232,240,0.95)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(hipCenter.x - 4, shoulderY + 6);
        ctx.lineTo(hipCenter.x + 4, shoulderY - 10);
        ctx.stroke();

        const headCx = hipCenter.x + 4;
        const headCy = shoulderLevel.y - neckLen - headR + 4;
        ctx.fillStyle = '#e5e7eb';
        ctx.strokeStyle = '#020617';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(headCx, headCy, headR, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = '#020617';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(headCx + 6, headCy - 4, 1.8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(headCx + 4, headCy + 4);
        ctx.quadraticCurveTo(headCx + 8, headCy + 6, headCx + 6, headCy + 9);
        ctx.stroke();

        function drawLimbFromChain(chain, color, zBehind) {
          const pts = chain.points;
          if (pts.length < 2) return pts[pts.length - 1];
          ctx.strokeStyle = color;
          ctx.lineCap = 'round';
          const w = zBehind ? [10, 8, 6] : [12, 10, 8];
          for (let i = 0; i < pts.length - 1; i++) {
            ctx.lineWidth = w[Math.min(i, w.length - 1)];
            ctx.beginPath();
            ctx.moveTo(pts[i].x, pts[i].y);
            ctx.lineTo(pts[i + 1].x, pts[i + 1].y);
            ctx.stroke();
          }
          ctx.fillStyle = '#e5e7eb';
          for (let i = 1; i < pts.length - 1; i++) {
            ctx.beginPath();
            ctx.arc(pts[i].x, pts[i].y, 4, 0, Math.PI * 2);
            ctx.fill();
          }
          return pts[pts.length - 1];
        }

        const leftLeg = skeleton.limbs['leftLeg'].chain;
        const rightLeg = skeleton.limbs['rightLeg'].chain;
        const leftArm = skeleton.limbs['leftArm'].chain;
        const rightArm = skeleton.limbs['rightArm'].chain;

        const leftLegEnd = drawLimbFromChain(leftLeg, 'rgba(75,85,99,0.95)', true);
        drawLimbFromChain(leftArm, 'rgba(148,163,184,0.7)', true);
        const rightLegEnd = drawLimbFromChain(rightLeg, 'rgba(248,250,252,0.95)', false);
        drawLimbFromChain(rightArm, 'rgba(226,232,240,0.95)', false);

        ctx.fillStyle = 'rgba(15,23,42,0.9)';
        [leftLegEnd, rightLegEnd].forEach((foot) => {
          const yClamp = groundY + 1;
          const fy = Math.min(foot.y, yClamp);
          ctx.beginPath();
          ctx.ellipse(foot.x, yClamp + 6, 14, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#e5e7eb';
          ctx.beginPath();
          ctx.ellipse(foot.x, fy, 9, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(15,23,42,0.9)';
        });

        ctx.restore();
      }

      function loop(now) {
        const t = (now - t0) / 1000;
        drawGround();
        drawRunner(t);
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
