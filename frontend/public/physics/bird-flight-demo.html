<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵动飞羽 - p5.js 骨骼飞行演示</title>
  <!-- 引入 p5.js 库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #ui {
      position: absolute;
      top: 2rem;
      left: 2rem;
      z-index: 10;
      color: #fff;
      font-family: 'PingFang SC', sans-serif;
      pointer-events: none;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 0.1rem;
      opacity: 0.9;
    }

    p {
      font-size: 0.9rem;
      opacity: 0.5;
      margin-top: 0.5rem;
    }
  </style>
</head>

<body>
  <div id="ui">
    <h1>灵动飞羽</h1>
    <p>基于 p5.js 的三段式骨骼飞行算法</p>
  </div>

  <script>
    /**
     * 灵动飞羽 - 核心飞行逻辑
     * 采用三段式动力学骨骼（肩、肘、腕）
     * 引入相位偏移（Phase Offset）实现羽翼的扇形波浪感
     */

    let bird;
    let clouds = [];

    function setup() {
      createCanvas(windowWidth, windowHeight);
      bird = new Bird();
      // 初始化云朵，营造空间深度感
      for (let i = 0; i < 6; i++) {
        clouds.push(new Cloud());
      }
    }

    function draw() {
      // 深邃天空背景
      background(10, 25, 47);
      drawSkyGradient();

      // 绘制运动的云
      for (let cloud of clouds) {
        cloud.update();
        cloud.display();
      }

      // 居中绘制鸟
      translate(width / 2, height / 2);
      bird.update();
      bird.display();
    }

    function drawSkyGradient() {
      noFill();
      for (let i = 0; i <= height; i++) {
        let inter = map(i, 0, height, 0, 1);
        let c = lerpColor(color(20, 40, 60), color(5, 10, 20), inter);
        stroke(c);
        line(-width, i - height / 2, width * 2, i - height / 2);
      }
    }

    class Cloud {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = random(width, width * 2);
        this.y = random(-height / 2, 0);
        this.size = random(100, 250);
        this.speed = random(1, 3);
        this.opacity = random(50, 150);
      }
      update() {
        this.x -= this.speed;
        if (this.x < -this.size - width / 2) this.reset();
      }
      display() {
        noStroke();
        fill(255, this.opacity);
        ellipse(this.x, this.y, this.size, this.size * 0.4);
      }
    }

    class Bird {
      constructor() {
        this.angle = 0;
        this.bob = 0;
        this.flapSpeed = 0.12;
        this.time = 0;
      }

      update() {
        this.time += this.flapSpeed;
        // 身体自然起伏
        this.bob = sin(this.time * 0.5) * 8;
      }

      display() {
        push();
        translate(0, this.bob);

        // 1. 远侧翅膀 (层级关系)
        this.drawWing(-1);

        // 2. 鸟身细节
        this.drawBody();

        // 3. 近侧翅膀
        this.drawWing(1);
        pop();
      }

      drawBody() {
        // 尾羽
        fill(220);
        noStroke();
        beginShape();
        vertex(-45, 0);
        vertex(-70, -10);
        vertex(-65, 10);
        endShape(CLOSE);

        // 主躯干
        fill(255);
        stroke(30, 80);
        strokeWeight(1);
        ellipse(0, 0, 90, 45);

        // 头部
        ellipse(45, -15, 30, 30);

        // 眼睛
        fill(10, 30, 50);
        noStroke();
        ellipse(55, -20, 4, 4);

        // 喙
        fill(255, 200, 50);
        triangle(60, -15, 75, -12, 60, -9);
      }

      drawWing(side) {
        push();
        // 翅膀根部位置（肩部）
        translate(10, -5);

        // 三段骨骼结构：肩部-上臂 (Upper)、肘部-前臂 (Mid)、腕部-翼尖 (Tip)
        let flap = sin(this.time) * 0.7; // 核心呼吸角

        // 肩关节弧度
        let angle1 = side * (flap - 0.2);
        // 肘关节滞后（产生波动感）
        let angle2 = side * (sin(this.time - 0.4) * 0.5);
        // 腕关节滞后
        let angle3 = side * (sin(this.time - 0.8) * 0.4);

        let L1 = 60, L2 = 50, L3 = 40;

        // 计算节点坐标
        let x1 = cos(angle1 - HALF_PI) * L1;
        let y1 = sin(angle1 - HALF_PI) * L1;

        let x2 = x1 + cos(angle1 + angle2 - HALF_PI) * L2;
        let y2 = y1 + sin(angle1 + angle2 - HALF_PI) * L2;

        let x3 = x2 + cos(angle1 + angle2 + angle3 - HALF_PI) * L3;
        let y3 = y2 + sin(angle1 + angle2 + angle3 - HALF_PI) * L3;

        // 绘羽翼轮廓
        fill(side === 1 ? 255 : 200, 230); // 远近侧色差
        stroke(50, 100);
        strokeWeight(1.5);

        beginShape();
        vertex(0, 0);
        // 前沿骨骼线
        bezierVertex(x1 * 0.5, y1 * 0.5, x1, y1, x1, y1);
        bezierVertex(x1 + (x2 - x1) * 0.5, y1 + (y2 - y1) * 0.5, x2, y2, x2, y2);
        bezierVertex(x2 + (x3 - x2) * 0.5, y2 + (y3 - y2) * 0.5, x3, y3, x3, y3);

        // 后沿羽毛线（产生宽阔的翼面）
        // 增加特定的偏置使翅膀看起来有面积感
        let backOffset = side * 30;
        bezierVertex(x3 * 0.8, y3 + backOffset, x1 * 0.5, y1 + backOffset, 0, 0);
        endShape(CLOSE);

        pop();
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>

</html>
