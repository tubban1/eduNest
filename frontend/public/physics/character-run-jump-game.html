<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 人物跳跃小游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      color: #fff;
      font-family: 'PingFang SC', sans-serif;
    }

    #ui {
      position: absolute;
      top: 2rem;
      left: 2rem;
      z-index: 10;
      pointer-events: none;
    }

    #score-board {
      position: absolute;
      bottom: 2rem;
      left: 2rem;
      font-size: 1.5rem;
      z-index: 10;
    }

    .msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      display: none;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }
  </style>
</head>

<body>
  <div id="ui">
    <h1>3D 跑酷：粒子扫描人</h1>
    <p>空格键跳跃，躲避红色方块</p>
  </div>
  <div id="score-board">得分：<span id="score">0</span></div>
  <div id="game-over" class="msg">游戏结束</div>

  <!-- 使用可靠的 jsDelivr GitHub 存档确保版本匹配 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.86.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.86.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // 确保脚本加载后再运行
    window.onload = function () {
      if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
        console.error('Three.js 或控制器加载失败');
        // 备选方案：尝试从 cdnjs 重新绑定
        const s = document.createElement('script');
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r86/three.min.js";
        document.head.appendChild(s);
      }
      initGame();
    };

    function initGame() {
      //__________ Variables
      var main_color = 0x000000;
      var time = 0;
      var scanMesh;
      var loader = new THREE.JSONLoader();
      var scene = new THREE.Scene();
      var camera, renderer, controls;
      var camHelper;

      var obstacles = [];
      var score = 0;
      var gameOver = false;

      // 运动学变量
      var jumpVy = 0;
      var charY = 0;
      const GRAVITY = 0.5;
      const JUMP_POWER = 12;

      // 动画系数
      var facX = Math.random() * 10 * .001;
      var facY = Math.random() * 10 * .001;
      var facZ = Math.random() * 10 * .001;

      init();
      animate(0);

      function init() {
        // Camera setup
        camHelper = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial());
        camHelper.visible = false;
        scene.add(camHelper);

        camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 50, 150);
        camHelper.add(camera);

        // Renderer
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setClearColor(main_color, 1);
        document.body.appendChild(renderer.domElement);

        // Controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.2;
        controls.target.set(0, 20, 0);

        // Lights
        var light = new THREE.HemisphereLight(0xACC5E1, 0x1588C8, 1);
        light.intensity = 0.6;
        scene.add(light);

        var ambient = new THREE.AmbientLight(0x333333);
        scene.add(ambient);

        var spotLight = new THREE.SpotLight(0xFFFFFF);
        spotLight.position.set(0, 200, 100);
        spotLight.castShadow = true;
        scene.add(spotLight);

        // Floor
        var floorGeo = new THREE.PlaneGeometry(2000, 2000);
        var floorMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        var floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Grid helper
        var grid = new THREE.GridHelper(2000, 50, 0x333333, 0x222222);
        scene.add(grid);

        // Load Character
        loader.load('https://s3-us-west-2.amazonaws.com/s.cdpn.io/61062/scan.json', function (geometry) {
          var material = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            shading: THREE.FlatShading,
            skinning: true,
            metalness: 0.0,
            roughness: 0.9
          });
          scanMesh = new THREE.SkinnedMesh(geometry, new THREE.MeshFaceMaterial([material]));
          scanMesh.receiveShadow = true;
          scanMesh.castShadow = true;
          scanMesh.scale.set(1.5, 1.5, 1.5);
          scene.add(scanMesh);
        });

        window.addEventListener('resize', onWindowResize, false);
        document.addEventListener('keydown', onKeyDown);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function onKeyDown(e) {
        if (e.code === 'Space' && charY <= 0.1 && !gameOver) {
          jumpVy = JUMP_POWER;
        }
        if (gameOver) location.reload();
      }

      function spawnObstacle() {
        if (gameOver) return;
        var geo = new THREE.BoxGeometry(20, 20 + Math.random() * 30, 20);
        var mat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
        var box = new THREE.Mesh(geo, mat);
        box.position.set(400, 10, (Math.random() - 0.5) * 40);
        box.castShadow = true;
        scene.add(box);
        obstacles.push(box);
      }

      var lastSpawnTime = 0;

      function animate(t) {
        requestAnimationFrame(animate);
        var delta = t - lastSpawnTime;

        if (!gameOver) {
          time = t;
          charY += jumpVy;
          jumpVy -= GRAVITY;
          if (charY < 0) { charY = 0; jumpVy = 0; }
          if (scanMesh && scanMesh.skeleton && scanMesh.skeleton.bones && scanMesh.skeleton.bones.length > 5) {
            // 1. 基本物理位置
            scanMesh.position.y = charY;

            // 2. 注入您代码中的随机/呼吸律动 (主要影响躯干)
            // 增加频率系数，让律动更明显
            let t_jitter = time * 0.002;
            scanMesh.skeleton.bones[1].rotation.y = (Math.cos(0.005 + facY * time) * 0.4);
            scanMesh.skeleton.bones[1].rotation.x = (Math.cos(0.005 + facX * time) * 0.4);
            scanMesh.skeleton.bones[1].rotation.z = (Math.sin(0.004 + facZ * time) * 0.4);

            // 3. 奔跑/空中的四肢动画
            let runCycle = time * 0.012; // 增加步频

            if (charY <= 0.1) {
              // 地面奔跑：大幅度迈步 + 身体起伏
              let stride = Math.sin(runCycle);

              // 大腿逻辑：骨骼 2 和 3
              scanMesh.skeleton.bones[2].rotation.x = stride * 1.1;
              scanMesh.skeleton.bones[3].rotation.x = -stride * 1.1;

              // 手臂/小腿逻辑：骨骼 4 和 5 协同摆动
              scanMesh.skeleton.bones[4].rotation.x = Math.cos(runCycle) * 0.8;
              scanMesh.skeleton.bones[5].rotation.x = -Math.cos(runCycle) * 0.8;

              // 身体随步频轻微起伏 (Bobbing)
              scanMesh.position.y += Math.abs(stride) * 3;
            } else {
              // 空中跳跃：腿部呈现收缩/前探姿态
              scanMesh.skeleton.bones[2].rotation.x = -0.8; // 后收
              scanMesh.skeleton.bones[3].rotation.x = 0.5;  // 前探
              scanMesh.rotation.x = -0.2; // 身体前倾
            }

            // 落地时恢复身体角度
            if (charY <= 0.1) scanMesh.rotation.x = 0;
          }
          if (delta > 1500) {
            spawnObstacle();
            lastSpawnTime = t;
          }

          for (var i = obstacles.length - 1; i >= 0; i--) {
            obstacles[i].position.x -= 4;
            if (scanMesh && Math.abs(obstacles[i].position.x - scanMesh.position.x) < 22 &&
              Math.abs(obstacles[i].position.z - scanMesh.position.z) < 22 &&
              charY < obstacles[i].geometry.parameters.height) {
              gameOver = true;
              document.getElementById('game-over').style.display = 'block';
            }
            if (obstacles[i].position.x < -100 && !obstacles[i].scored) {
              score++;
              obstacles[i].scored = true;
              document.getElementById('score').innerText = score;
            }
            if (obstacles[i].position.x < -500) {
              scene.remove(obstacles[i]);
              obstacles.splice(i, 1);
            }
          }
        }
        camHelper.rotateY(-0.005);
        controls.update();
        renderer.render(scene, camera);
      }
    }
  </script>
</body>

</html>
