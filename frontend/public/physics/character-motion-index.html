<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人物运动示例 - 选一个试试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      padding: 24px;
      color: #e5e7eb;
    }
    h1 { font-size: 1.6rem; margin-bottom: 8px; }
    p { opacity: 0.9; margin-bottom: 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      max-width: 900px;
    }
    a.card {
      display: block;
      padding: 16px 20px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(71, 85, 105, 0.6);
      border-radius: 12px;
      color: #e5e7eb;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    a.card:hover { border-color: #3b82f6; background: rgba(30, 58, 95, 0.5); }
    a.card h2 { font-size: 1.1rem; margin-bottom: 6px; color: #f1f5f9; }
    a.card p { margin: 0; font-size: 0.85rem; opacity: 0.8; }
  </style>
</head>
<body>
  <h1>人物运动示例</h1>
  <p>下面是几种「模拟人物运动」的小游戏和演示，选一个打开看看哪种最适合你。</p>
  <div class="grid">
    <a href="character-run-jump-game.html" class="card">
      <h2>跑跳小游戏</h2>
      <p>骨骼跑步动画 + 抛物线跳跃，空格跳、躲障碍、吃金币。适合横版跑酷。</p>
    </a>
    <a href="character-walk-game.html" class="card">
      <h2>走路接金币</h2>
      <p>走路骨骼动画，左右键移动接住落下的金币。适合强调「走路」节奏的游戏。</p>
    </a>
    <a href="human-run-demo.html" class="card">
      <h2>跑步骨骼演示</h2>
      <p>纯演示：有厚度的躯干与四肢，跑步循环。无游戏逻辑，可当动画参考。</p>
    </a>
    <a href="human-walk-demo.html" class="card">
      <h2>走路骨骼演示</h2>
      <p>纯演示：穿衣服的走路循环，手脚对侧协调。无游戏逻辑。</p>
    </a>
    <a href="kinematics-motion-game.html" class="card">
      <h2>机械臂 + 生物</h2>
      <p>逆运动学机械臂追目标，触碰小动物/小人。偏「骨骼 IK」互动。</p>
    </a>
  </div>
</body>
</html>
