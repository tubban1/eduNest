<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>艺术像素猎豹 - 骨骼随动演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at bottom, #1a1c2c 0%, #000 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #stage {
      position: relative;
      transform: scale(1.2);
      /* 防止 CSS 变换导致模糊 */
      image-rendering: pixelated;
    }

    /* 核心图层样式：移除了 overflow: hidden 以显示 box-shadow 像素皮肤 */
    .layer {
      position: absolute;
      display: block;
      height: 2px;
      width: 2px;
      background-color: rgba(0, 0, 0, 1.00);
      border-radius: 600px;
      transform-origin: left center;
      /* 关键：绕关节左侧旋转 */
      pointer-events: none;
    }

    /* 注入用户提供的像素猎豹皮肤 (精选代表性阴影以平衡性能与效果) */
    .cheetah-skin {
      box-shadow:
        -2px 1px 0px 0px #000,
        2px 2px 8px 2px #f2bd21,
        10px 5px 0px 8px #f2bd21,
        -10px 0px 0px 4px #f2bd21,
        0px 0px 5px 12px #f2bd21,
        /* 斑点 */
        5px -2px 0px 2px #000,
        -5px 3px 0px 3px #000,
        8px 8px 0px 2px #000,
        /* 高光 */
        0px -5px 10px 1px rgba(255, 255, 255, 0.4);
    }

    /* 头部皮肤细节 */
    .head-skin {
      box-shadow:
        0px 0px 10px 10px #f2bd21,
        8px -2px 0px 2px #000,
        /* 眼睛 */
        12px 2px 0px 1px #000;
      /* 鼻子 */
    }

    .ground {
      position: absolute;
      bottom: -150px;
      width: 800px;
      left: -400px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #f2bd21, transparent);
      opacity: 0.2;
    }

    #ui {
      position: absolute;
      top: 2rem;
      left: 2rem;
      color: #f2bd21;
      font-family: 'PingFang SC', sans-serif;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>
  <div id="ui">
    <h1>像素猎豹 (CSS Art)</h1>
    <p>基于 box-shadow 堆叠与 FK 骨骼动力学</p>
  </div>

  <div id="stage">
    <div class="ground"></div>
    <!-- 猎豹 DOM 容器 -->
    <div id="cheetah-root"></div>
  </div>

  <script>
    /**
     * 骨骼随动逻辑
     * 1. 使用嵌套 DOM 结构
     * 2. 子骨骼定位在父骨骼末端 (left: length)
     * 3. 动态旋转旋转中心
     */

    class Bone {
      constructor(parent, length, className = "") {
        this.length = length;
        this.element = document.createElement('div');
        this.element.className = "layer " + className;
        // 设置骨骼表现长度
        this.element.style.width = length + "px";

        if (parent) {
          parent.appendChild(this.element);
          // 关键：子骨骼必须定位在父骨骼的末端，这样旋转时才会像链条一样
          this.element.style.left = parent.style.width;
          this.element.style.top = "0";
        } else {
          document.getElementById('cheetah-root').appendChild(this.element);
        }
      }

      rotate(angle) {
        this.element.style.transform = `rotate(${angle}rad)`;
      }

      move(x, y) {
        this.element.style.left = x + "px";
        this.element.style.top = y + "px";
      }
    }

    class Cheetah {
      constructor() {
        this.time = 0;
        // 1. 创建脊椎骨骼链
        this.spine = [];
        let lastBone = null;
        for (let i = 0; i < 6; i++) {
          let b = new Bone(lastBone, 28, "cheetah-skin");
          this.spine.push(b);
          lastBone = b.element;
        }
        this.spine[0].move(-100, 0); // 初始锚点

        // 2. 挂载四肢 (分别挂载在脊椎的首尾)
        this.legBL = this.createLeg(this.spine[0].element); // 后脚1
        this.legBR = this.createLeg(this.spine[0].element); // 后脚2
        this.legFL = this.createLeg(this.spine[4].element); // 前脚1
        this.legFR = this.createLeg(this.spine[4].element); // 前脚2

        // 3. 头部与尾巴
        this.head = new Bone(this.spine[5].element, 10, "head-skin");
        this.tail = new Bone(this.spine[0].element, 50, "cheetah-skin");
      }

      createLeg(parent) {
        let thigh = new Bone(parent, 35, "cheetah-skin");
        let calf = new Bone(thigh.element, 40, "cheetah-skin");
        let foot = new Bone(calf.element, 15, "cheetah-skin");
        return [thigh, calf, foot];
      }

      update() {
        this.time += 0.08;

        // 1. 身体起伏与前进律动
        let bob = Math.sin(this.time * 2) * 12;
        this.spine[0].move(-80 + Math.cos(this.time) * 10, bob);

        // 2. 脊椎波动 (由前向后传导)
        for (let i = 0; i < this.spine.length; i++) {
          let wave = Math.sin(this.time * 2 - i * 0.45) * 0.25;
          this.spine[i].rotate(wave);
        }

        // 3. 驱动四肢 (典型的四足步态相位)
        this.animateLeg(this.legFR, 0, 1);       // 前右
        this.animateLeg(this.legBL, 1.5, 0);     // 后左
        this.animateLeg(this.legFL, 3.1, 0);     // 前左
        this.animateLeg(this.legBR, 4.6, 1);     // 后右

        // 4. 头尾细节
        this.head.rotate(Math.sin(this.time * 2) * 0.2 - 0.1);
        this.tail.rotate(Math.PI * 0.8 + Math.sin(this.time * 1.5) * 0.6);
      }

      animateLeg(leg, phase, isNear) {
        let t = (this.time * 2.5 + phase) % 6.28;

        // 跑步运动模型
        let a1 = Math.sin(t) * 0.7 + 0.5; // 大腿主摆动
        let a2 = (t > 1 && t < 4) ? 1.8 : 0.4; // 膝盖收缩逻辑
        let a3 = -a1 * 0.6; // 平衡足部

        leg[0].rotate(a1 + 1.2);
        leg[1].rotate(a2);
        leg[2].rotate(a3);

        // 远近层级阴影表现
        leg[0].element.style.filter = isNear ? "brightness(1.1)" : "brightness(0.6)";
        leg[0].element.style.zIndex = isNear ? "10" : "-10";
      }
    }

    const cheetahInstance = new Cheetah();
    function step() {
      cheetahInstance.update();
      requestAnimationFrame(step);
    }
    step();
  </script>
</body>

</html>
