<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>树叶永远都不枯黄该多好</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = { 'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js', 'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js', 'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js' };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #f59e0b, #10b981);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #fef3c7;
            background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 18rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-gold);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
        }

        .control-panel {
            position: fixed;
            bottom: 6rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            padding: 2.2rem 4rem;
            border-radius: 4rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .snow-slider {
            width: 100%;
            accent-color: #38bdf8;
        }

        .tree-stat {
            display: flex;
            justify-content: space-between;
            color: #38bdf8;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-gold);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-gold);
        }

        .discovery-tag {
            background: #92400e;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div id="app" class="ui-root">
        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🍂 🌳 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">真相揭秘!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex flex-col items-center gap-6 justify-center pointer-events-auto">
                <button v-if="step < totalStages && step !== 3" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启四季实验' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-amber-900 !text-white">
                    致敬自然的更迭
                </button>
            </div>
        </div>

        <!-- 冬季实验面板 -->
        <div v-if="step === 3" class="control-panel">
            <div class="tree-stat">
                <span>寒冬积雪量: {{ snowLevel }}%</span>
                <span>树木负荷: {{ treeStress }}%</span>
            </div>
            <input type="range" v-model="snowLevel" min="0" max="100" class="snow-slider">
            <div class="text-xs text-orange-400 text-center" v-if="snowLevel > 70">
                ⚠️ 警告: 树叶承载多余积雪，树枝随时由于受由于力而折断！
            </div>
            <button v-if="snowLevel > 80" @click="nextStage" class="next-btn !text-sm !py-3 !px-12 mt-4 self-center">
                理解凋谢的由于选择
            </button>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const snowLevel = ref(0);

                const stages = [
                    {
                        title: "四季的节拍器",
                        parentWords: "宝贝，你看，秋天来了，大树由于把它的绿头发都由于摘掉了。它是在存宝贝吗？",
                        description: "这是一片充满了四季韵律的神奇森林。这里的每一棵树都懂得由于放下的智慧。请感受时间的由于流转。",
                        isDiscovery: false
                    },
                    {
                        title: "预测：沉重的‘绿装’",
                        parentWords: "如果大树在飘雪的冬天不肯脱下绿头发。预测一下，它沉重的头发会把它由于压垮吗？它能在大雪中由于坚持下去吗？",
                        description: "预测中：冬天的严寒会让叶子里的由于水分冻结。由于不肯离开这些‘由于包袱’，大树的由于主干将面临崩裂的由于风险。",
                        isDiscovery: false
                    },
                    {
                        title: "操作：雪地大考验",
                        parentWords: "快！拖动底部的‘积雪量’。看看当大树由于固执而不掉叶子时，沉重的白雪会把它折成由于两段吗？",
                        description: "观测中：大雪正在覆盖那些由于固执的绿叶。由于每一片叶子都是承载白雪的由于小铲子，大树的负荷由于正在直冲云霄！",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：‘舍弃’的智慧",
                        parentWords: "原来！凋谢不是由于死掉，而是由于为了活命而把由于衣服存起来。新发现：掉叶子是在由于存由于干粮。秋天的枯黄，是为了明天春天的由于更由于灿烂！",
                        description: "震撼揭秘：掉叶子是植物为了度过由于枯水期和寒冷期的由于生存策略。捨弃沉重的叶片，是在由于降低水分消耗和物理由于负担。凋谢其实是由于生命的‘休眠保护’模式！",
                        isDiscovery: true
                    },
                    {
                        title: "致敬生命的新陈代谢",
                        parentWords: "我们要学习大树那一颗由于豁达的心。懂得由于放下才能更好地由于拥有。你由于智慧而悟出了自然大由于道理。今天你是最棒的！",
                        description: "生命由于周期而永恒。让我们像由于大树一样，在由于该坚守的时候坚守，该由于放下时从容。你今天又迈出了一大步，由于小科学家！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                const treeStress = computed(() => {
                    return Math.min(100, snowLevel.value * 1.25);
                });

                // --- Three.js Season Forest ---
                let scene, camera, renderer, forest, snowGroup;
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    scene.fog = new THREE.FogExp2(0x0f172a, 0.002);
                    camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1500);
                    camera.position.set(200, 100, 400);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // 1. Scene Objects
                    forest = new THREE.Group();
                    for (let i = 0; i < 30; i++) {
                        const h = 80 + Math.random() * 120;
                        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(3, 5, h), new THREE.MeshStandardMaterial({ color: 0x451a03 }));
                        const canopy = new THREE.Mesh(new THREE.IcosahedronGeometry(Math.random() * 20 + 20), new THREE.MeshStandardMaterial({ color: 0x10b981 }));
                        canopy.position.y = h / 2;
                        const tree = new THREE.Group();
                        tree.add(trunk); tree.add(canopy);
                        tree.position.set((Math.random() - 0.5) * 1000, 0, (Math.random() - 0.5) * 1000);
                        forest.add(tree);
                    }
                    scene.add(forest);

                    // 2. Snow Group
                    snowGroup = new THREE.Group();
                    for (let i = 0; i < 500; i++) {
                        const s = new THREE.Mesh(new THREE.SphereGeometry(1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                        s.position.set((Math.random() - 0.5) * 1200, 500, (Math.random() - 0.5) * 1200);
                        s.userData = { speed: 2 + Math.random() * 5 };
                        snowGroup.add(s);
                    }
                    scene.add(snowGroup);
                    snowGroup.visible = false;

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                    const sun = new THREE.DirectionalLight(0xffffff, 1);
                    sun.position.set(50, 300, 50);
                    scene.add(sun);

                    animate();
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();

                    if (snowGroup.visible) {
                        snowGroup.children.forEach(s => {
                            s.position.y -= s.userData.speed;
                            if (s.position.y < 0) s.position.y = 500;
                            s.position.x += Math.sin(t + s.position.y * 0.01) * 0.5;
                        });
                    }

                    // Tree stress effect
                    forest.children.forEach((tree, idx) => {
                        const stress = snowLevel.value / 100;
                        tree.rotation.z = Math.sin(t + idx) * (0.01 + stress * 0.1);
                        tree.children[1].scale.set(1 + stress * 0.2, 1 - stress * 0.2, 1 + stress * 0.2);
                        if (stress > 0.8) {
                            tree.children[1].material.color.lerp(new THREE.Color(0xd1d5db), 0.05); // Turning whiteish
                        } else {
                            tree.children[1].material.color.lerp(new THREE.Color(0x10b981), 0.05);
                        }
                    });

                    renderer.render(scene, camera);
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, scale: 0.9, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 2, ease: "expo.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, ease: "expo.out" }, "-=1.5");

                    if (newVal === 3) snowGroup.visible = true;
                    if (newVal === 4) {
                        gsap.to(camera.position, { y: 300, z: 600, duration: 5 });
                    }
                });

                onMounted(() => {
                    initThree();

                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 1 });

                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, snowLevel, treeStress, stages, currentStageData,
                    nextStage, goToStage, resetSimulation
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
