<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物怎么不会跑</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = { 'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js', 'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js', 'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js' };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-green: #10b981;
            --accent-brown: #78350f;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #064e3b;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #10b981, #34d399);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #d1fae5;
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 18rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-green);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
        }

        .root-indicator {
            position: fixed;
            bottom: 3.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 2rem;
            color: var(--accent-green);
            font-weight: bold;
            opacity: 0;
        }

        .root-bar {
            width: 200px;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .root-fill {
            height: 100%;
            background: var(--accent-green);
            transition: width 0.5s;
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-green);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-green);
        }

        .discovery-tag {
            background: #065f46;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        .pull-btn {
            background: #10b981;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
            border: none;
            pointer-events: auto;
            color: white;
        }

        .pull-btn:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div id="app" class="ui-root">
        <!-- 根系 HUD -->
        <div class="root-indicator" ref="rootHud">
            <div class="text-xs uppercase">Ground Stability</div>
            <div class="root-bar">
                <div class="root-fill" :style="{ width: groundStability + '%' }"></div>
            </div>
            <span>{{ groundStability }}%</span>
        </div>

        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🌳 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">大发现!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex flex-col items-center gap-6 justify-center pointer-events-auto">
                <button v-if="step < totalStages && step !== 3" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启街道模拟' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-emerald-900 !text-white">
                    回归大地宁静
                </button>
                <div v-if="step === 3" class="flex items-center gap-8">
                    <button @click="pullPlant" class="pull-btn">拔根!</button>
                    <button v-if="groundStability < 30" @click="nextStage"
                        class="next-btn !bg-emerald-500">理解原理</button>
                </div>
            </div>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const groundStability = ref(100);

                const stages = [
                    {
                        title: "生根的‘不动明王’",
                        parentWords: "宝贝，你看，大树和花朵总是乖乖地待在一个地方。如果它们能穿上跑鞋飞快地赛跑，森林里会不会一团糟？",
                        description: "这是一片繁茂的森林观察区。这里的每一棵植物都在地下有着粗壮的由于‘生命锚点’。请观察它们汲取能量的安静姿态。",
                        isDiscovery: false
                    },
                    {
                        title: "预测：奔跑的后果",
                        parentWords: "如果一棵由于大树为了躲避由于烈日而飞快地跑向阴暗处。预测一下，它地下的由于根系会断掉吗？它还能由于光合作用而获取足够养分吗？",
                        description: "预测中：植物无法离开土地，因为它们和土地是连在一起的。由于过度追求移动，它们可能由于失去唯一的‘加油站’。",
                        isDiscovery: false
                    },
                    {
                        title: "操作：拔根而起",
                        parentWords: "快！点击‘拔根’按钮。看看由于大树被拔离开土地，它还能像以前那样绿意由于盎然吗？看！它的稳定性在由于掉落！",
                        description: "观测中：大树正在由于你的由于点化而试图移动。但每迈出一步，由于脆弱的根茎都在由于断裂。它开始由于枯萎了。",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：‘静止’的超能力",
                        parentWords: "你看！真正的奇迹是由于静止而深扎大地。原野之所以由于常青，是因为根由于深埋泥土。植物的‘跑酷’其实是由于土壤下的生命之网！",
                        description: "震撼揭秘：植物由于不跑是因为它们已经站在了由于最棒的‘加油站’上。光合作用由于赋予了它们不用奔波就能获取能量的特权。静止其实是由于另一种伟大的力量！",
                        isDiscovery: true
                    },
                    {
                        title: "致敬大自然的多元",
                        parentWords: "动物跑是因为由于寻找，植物停是因为已经由于拥有。让我们在大树下坐一会儿，由于感受这份大地的宁静。你今天由于智慧而看透了宁静的力量！",
                        description: "自然之由于精妙由于在于各司其职。我们要学会欣赏这由于一份份绿色的坚定。你今天做得太棒了，由于智慧小思想家！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js Forest Scene ---
                let scene, camera, renderer, treesGroup, rootsGroup;
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    scene.fog = new THREE.FogExp2(0x064e3b, 0.003);
                    camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 2000);
                    camera.position.set(0, 50, 400);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // 1. Forest Floor
                    const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({ color: 0x064e3b }));
                    floor.rotation.x = -Math.PI / 2;
                    scene.add(floor);

                    // 2. Main Trees
                    treesGroup = new THREE.Group();
                    rootsGroup = new THREE.Group();
                    scene.add(treesGroup);
                    scene.add(rootsGroup);

                    for (let i = 0; i < 25; i++) {
                        const h = 100 + Math.random() * 150;
                        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(4, 6, h), new THREE.MeshStandardMaterial({ color: 0x451a03 }));
                        const canopy = new THREE.Mesh(new THREE.IcosahedronGeometry(Math.random() * 20 + 20), new THREE.MeshStandardMaterial({ color: 0x10b981 }));
                        canopy.position.y = h / 2;
                        const tree = new THREE.Group();
                        tree.add(trunk); tree.add(canopy);
                        tree.position.set((Math.random() - 0.5) * 1000, 0, (Math.random() - 0.5) * 1000);
                        treesGroup.add(tree);

                        // Visual Roots
                        const roots = new THREE.Mesh(new THREE.TorusGeometry(15, 1, 16, 100), new THREE.MeshStandardMaterial({ color: 0x78350f, transparent: true, opacity: 0.3 }));
                        roots.rotation.x = Math.PI / 2;
                        roots.position.copy(tree.position);
                        rootsGroup.add(roots);
                    }

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                    const sun = new THREE.DirectionalLight(0xd1fae5, 1);
                    sun.position.set(50, 300, 50);
                    scene.add(sun);

                    animate();
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();

                    if (!isPulling.value) {
                        treesGroup.children.forEach((tree, idx) => {
                            tree.rotation.z = Math.sin(t + idx) * 0.02;
                        });
                    }

                    renderer.render(scene, camera);
                };

                const isPulling = ref(false);
                const pullPlant = () => {
                    isPulling.value = true;
                    groundStability.value = Math.max(0, groundStability.value - 20);

                    const targetTree = treesGroup.children[0];
                    const targetRoots = rootsGroup.children[0];

                    gsap.to(targetTree.position, { y: 150, repeat: 1, yoyo: true, duration: 2, ease: "power2.inOut" });
                    gsap.to(targetRoots.scale, { x: 0.1, z: 0.1, duration: 1 });
                    gsap.to(targetTree.children[1].material.color, { r: 0.4, g: 0.3, b: 0, duration: 3 }); // Withering
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, scale: 0.9, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 2, ease: "expo.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, ease: "expo.out" }, "-=1.5");

                    if (newVal >= 2) gsap.to('.root-indicator', { opacity: 1, duration: 1 });
                    if (newVal === 4) {
                        gsap.to(camera.position, { y: 400, z: 800, duration: 5, ease: "power2.inOut" });
                    }
                });

                onMounted(() => {
                    initThree();

                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 1 });

                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, groundStability, stages, currentStageData,
                    nextStage, goToStage, resetSimulation, pullPlant
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
