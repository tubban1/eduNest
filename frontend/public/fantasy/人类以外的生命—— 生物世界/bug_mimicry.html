<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虫子能变成草吗</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = { 'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js', 'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js', 'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js' };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-green: #22c55e;
            --accent-brown: #92400e;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #022c22;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #22c55e, #14532d);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #d1fae5;
            background: linear-gradient(90deg, transparent, rgba(34, 197, 94, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
            display: inline-block;
            margin-top: 1rem;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 5rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
            z-index: 20;
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 1);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-green);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.3);
        }

        .scan-status {
            position: fixed;
            left: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            color: var(--accent-green);
            font-weight: 700;
            opacity: 0;
        }

        .counter-card {
            background: rgba(0, 0, 0, 0.4);
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid rgba(34, 197, 94, 0.4);
            text-align: center;
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-green);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-green);
        }

        .discovery-tag {
            background: #065f46;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        .interact-radar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            cursor: crosshair;
        }

        .mimic-target {
            position: absolute;
            width: 60px;
            height: 60px;
            background: transparent;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mimic-target:hover {
            border-color: var(--accent-green);
            box-shadow: 0 0 15px var(--accent-green);
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="radar" class="interact-radar"></div>

    <div id="app" class="ui-root">
        <!-- 统计 HUD -->
        <div class="scan-status" ref="scanHud">
            <div class="text-xs uppercase opacity-60">Mimicry Scan</div>
            <div class="counter-card">
                <div class="text-xs">已发现伪装者</div>
                <div class="text-3xl font-bold">{{ foundCount }}</div>
            </div>
        </div>

        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🦗 🍃 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">真相揭晓!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages && step !== 3" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启街道模拟' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-emerald-900 !text-white">
                    回归大自然平衡
                </button>
                <button v-if="step === 3 && foundCount >= 3" @click="nextStage"
                    class="next-btn !bg-emerald-500 ml-4">理解生存智慧</button>
            </div>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const foundCount = ref(0);

                const stages = [
                    {
                        title: "伪装者的派对",
                        parentWords: "宝贝，你看这片绿油油的草地。其实里面藏着很多超级厉害的‘由于隐身专家’。你由于锐利的由于眼睛由于能看出来吗？",
                        description: "这是一座由于静谧由于而充满了杀机的生态微观室。有些由于看起来像植物的，其实是由于生命体。",
                        isDiscovery: false
                    },
                    {
                        title: "预测：形态的由于极限",
                        parentWords: "如果一只小虫子长得越来越像由于树皮。预测一下，它能由于不仅骗由于敌人，还能由于骗过它的同伴吗？",
                        description: "预测中：拟态虽然在由于防御上由于无敌，但它限制了由于动物由于本身的多样化。这就是由于演化的代价！",
                        isDiscovery: false
                    },
                    {
                        title: "操作：识破伪装",
                        parentWords: "快！用你的智慧光束扫过草丛。点击那些看起来不对劲的地方。看！由于你的发现，‘由于假叶子’跳起来动了！",
                        description: "识破大动作：你由于识破了那些狡猾的拟态者。每一个被点击的目标都会由于展现出昆虫的由于本相。它们可真是由于演化的由于大师！",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：进化的秘密武器",
                        parentWords: "哇！你看，这些虫子依然是由于虫子。它们长得由于像草是由于为了不被小鸟吃。新发现：虫子和草是由于两个完全不同的由于谱系！这种相似是由于为了活命而在各方面的由于妥协。",
                        description: "震撼揭秘：由于虫子和草是由于完全不同的物种。长得像并不是由于变成了对方，而是由于趋同进化的结果。每种生命形态都有其由于特有的细胞壁垒！",
                        isDiscovery: true
                    },
                    {
                        title: "致敬生命的多样奇迹",
                        parentWords: "爱这一份由于巧妙由于。让我们感恩自然由于赋予的这份由于生存由于魔法。你今天也是一名超棒的由于达尔文小徒弟！",
                        description: "多样性让世界如此由于五彩缤纷。让我们继续由于这由于一份份生命链接由于感叹吧。你今天完成了由于伟大的由于生物学发现！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js Mimicry Scene ---
                let scene, camera, renderer, grassGroup, bugGroup;
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 30, 100);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // 1. Grassland
                    grassGroup = new THREE.Group();
                    for (let i = 0; i < 100; i++) {
                        const h = 5 + Math.random() * 20;
                        const geo = new THREE.CylinderGeometry(0.1, 0.5, h);
                        const mat = new THREE.MeshStandardMaterial({ color: 0x14532d });
                        const grass = new THREE.Mesh(geo, mat);
                        grass.position.set((Math.random() - 0.5) * 200, h / 2, (Math.random() - 0.5) * 200);
                        grassGroup.add(grass);
                    }
                    scene.add(grassGroup);

                    // 2. Bug Group (Hidden in plain sight)
                    bugGroup = new THREE.Group();
                    scene.add(bugGroup);
                    spawnBugs();

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                    const sun = new THREE.DirectionalLight(0xffffff, 1);
                    sun.position.set(20, 100, 20);
                    scene.add(sun);

                    animate();
                };

                const createBugModel = (color) => {
                    const group = new THREE.Group();
                    const mat = new THREE.MeshStandardMaterial({ color });

                    // Head/Thorax (Hexagonal)
                    const thorax = new THREE.Mesh(new THREE.CylinderGeometry(2, 2.5, 3, 6), mat);
                    thorax.rotation.x = Math.PI / 2;
                    group.add(thorax);

                    // Horns
                    const hornGeo = new THREE.ConeGeometry(0.5, 3, 8);
                    const leftHorn = new THREE.Mesh(hornGeo, mat);
                    leftHorn.position.set(-1, 0, -2);
                    leftHorn.rotation.x = -Math.PI / 4;
                    group.add(leftHorn);

                    const rightHorn = new THREE.Mesh(hornGeo, mat);
                    rightHorn.position.set(1, 0, -2);
                    rightHorn.rotation.x = -Math.PI / 4;
                    group.add(rightHorn);

                    // Abdomen (Large shell)
                    const abdomen = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 16), mat);
                    abdomen.scale.set(1, 0.7, 1.2);
                    abdomen.position.z = 4;
                    group.add(abdomen);

                    // Shell Lines (Visual Segments)
                    const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.2 });
                    const line1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 7), lineMat);
                    line1.position.set(0, 3, 4);
                    group.add(line1);

                    const line2 = new THREE.Mesh(new THREE.BoxGeometry(6, 0.1, 0.1), lineMat);
                    line2.position.set(0, 3, 3);
                    group.add(line2);

                    // Legs
                    const legGeo = new THREE.CylinderGeometry(0.2, 0.2, 5);
                    for (let i = 0; i < 3; i++) {
                        // Left legs
                        const lLeg = new THREE.Mesh(legGeo, mat);
                        lLeg.position.set(-4, 0, i * 3);
                        lLeg.rotation.z = Math.PI / 3;
                        group.add(lLeg);

                        // Right legs
                        const rLeg = new THREE.Mesh(legGeo, mat);
                        rLeg.position.set(4, 0, i * 3);
                        rLeg.rotation.z = -Math.PI / 3;
                        group.add(rLeg);
                    }

                    return group;
                };

                const spawnBugs = () => {
                    const radar = document.getElementById('radar');
                    for (let i = 0; i < 5; i++) {
                        const bugColor = 0x14532d;
                        const bug = createBugModel(bugColor);

                        const pos = new THREE.Vector3((Math.random() - 0.5) * 150, 4, (Math.random() - 0.5) * 80);
                        bug.position.copy(pos);
                        bug.rotation.y = Math.random() * Math.PI * 2;
                        bug.userData = { id: i, found: false };
                        bugGroup.add(bug);

                        // Projection for radar buttons
                        const btn = document.createElement('div');
                        btn.className = 'mimic-target';
                        btn.id = `bug-${i}`;
                        btn.onclick = () => revealBug(i);
                        radar.appendChild(btn);
                    }
                };

                const revealBug = (id) => {
                    const bug = bugGroup.children.find(b => b.userData.id === id);
                    if (bug && !bug.userData.found) {
                        bug.userData.found = true;
                        foundCount.value++;

                        // Recursively color all children
                        bug.traverse(node => {
                            if (node.isMesh && node.material.color) {
                                gsap.to(node.material.color, { r: 1, g: 0.8, b: 0, duration: 1 });
                            }
                        });

                        gsap.to(bug.position, { y: 15, duration: 0.5, yoyo: true, repeat: 1 });
                        gsap.to(bug.rotation, { y: bug.rotation.y + Math.PI * 2, duration: 2, ease: "power2.inOut" });
                        document.getElementById(`bug-${id}`).style.display = 'none';
                    }
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();

                    // Update radar positions
                    bugGroup.children.forEach(b => {
                        const vector = b.position.clone().project(camera);
                        const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                        const y = (-(vector.y * 0.5 - 0.5) * window.innerHeight);
                        const btn = document.getElementById(`bug-${b.userData.id}`);
                        if (btn) {
                            btn.style.left = `${x - 30}px`;
                            btn.style.top = `${y - 30}px`;
                            btn.style.display = (step.value === 3 && !b.userData.found) ? 'block' : 'none';
                        }
                    });

                    camera.lookAt(0, 0, 0); // Center the view!
                    renderer.render(scene, camera);
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, scale: 0.9, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 2, ease: "expo.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, ease: "expo.out" }, "-=1.5");
                    if (newVal >= 2) gsap.to('.scan-status', { opacity: 1, duration: 1 });
                });

                onMounted(() => {
                    initThree();

                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 1 });

                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, foundCount, stages, currentStageData,
                    nextStage, goToStage, resetSimulation
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
