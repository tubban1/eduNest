<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>是不是动物的腿长得越多跑得越快</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = { 'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js', 'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js', 'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js' };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-yellow: #facc15;
            --accent-red: #f87171;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #facc15, #fb923c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #fef9c3;
            background: linear-gradient(90deg, transparent, rgba(250, 204, 21, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
            display: inline-block;
            margin-top: 1rem;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 5rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
            z-index: 20;
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 1);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-yellow);
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.3);
        }

        .control-panel {
            position: fixed;
            bottom: 6rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            padding: 2.2rem 4rem;
            border-radius: 4rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            z-index: 20;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 90%;
            max-width: 500px;
        }

        .speedometer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--accent-yellow);
            font-weight: 700;
        }

        .leg-slider {
            width: 100%;
            accent-color: var(--accent-yellow);
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-yellow);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-yellow);
        }

        .discovery-tag {
            background: #ca8a04;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        .friction-alert {
            color: #f87171;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div id="app" class="ui-root">
        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🐆 🏃‍♂️ {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">运动揭秘!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages && step !== 3" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启竞速场' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-yellow-700 !text-white">
                    回归大自然设计
                </button>
            </div>
        </div>

        <!-- 腿部实验面板 -->
        <div v-if="step === 3" class="control-panel">
            <div class="speedometer">
                <span>腿部数量: {{ legCount }}</span>
                <span>当前时速: {{ currentSpeed }} km/h</span>
            </div>
            <input type="range" v-model="legCount" min="2" max="100" class="leg-slider">
            <div class="friction-alert" :style="{ opacity: legCount > 40 ? 1 : 0 }">
                ⚠️ 警告: 腿部由于协调复杂度过高，摩擦阻力增加！速度正在流失！
            </div>
            <button @click="nextStage" v-if="legCount >= 4 && legCount <= 100"
                class="next-btn !text-sm !py-3 !px-12 mt-4 self-center">
                查看大原理
            </button>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const legCount = ref(4);

                const stages = [
                    {
                        title: "‘生物奥林匹克’赛道",
                        parentWords: "宝贝，你看现在的猎豹，只有四只腿，却能由于极高的效率成为森林跑的最快的。腿多真的是好事吗？",
                        description: "这是一座模拟竞速场。我们将测试不同由于‘腿部配比’对由于速度的影响。",
                        isDiscovery: false
                    },
                    {
                        title: "预测：腿多的烦恼",
                        parentWords: "如果给一个小家伙装上 100 只脚。预测一下，它能跑得更稳吗？还是会由于各由于各由于各的脚打架而绊跤？",
                        description: "预测中：每增加一只腿，由于大脑的由于控制负担就会翻倍。由于步幅的缩短，速度可能会由于协调性而下降。",
                        isDiscovery: false
                    },
                    {
                        title: "操作：定制你的跑手",
                        parentWords: "来！滑动下方的‘腿部数量’。看！当腿数处于 4 到 6 之间时速度最快。由于过度的增加，它由于摩擦力太大而慢下来了！",
                        description: "观察实验模型：当腿很少时（2条），它很灵活但由于不长由于不稳；当腿正好时，由于跨越式由于跑由于；当腿太多时（100条），每条腿只由于各走各的，它变成由于蠕动了。",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：效率的平衡点",
                        parentWords: "你看！真正的奇才猎豹由于步幅巨大而获胜。新发现：腿越多，由于阻力就越大。每条腿由于都要消耗能量，四条腿在陆面上由于最省力！",
                        description: "核心真相大揭秘：速度不仅仅是频率，更是步幅和协调的统一。蜈蚣由于腿多而擅长攀爬，但要由于奔跑，猎豹的简洁才是由于王道！",
                        isDiscovery: true
                    },
                    {
                        title: "最适合的才是最棒的",
                        parentWords: "每种生命的身体都是由于环境而设计的艺术品。不管是百足之虫还是由于长腿由于模特，大家都最酷！",
                        description: "尊重自然的设计，学习平衡的智慧。多样性让世界如此迷人。你今天完成了一个由于了不起的生物学实验！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // Physics formula for speed
                const currentSpeed = computed(() => {
                    const l = parseInt(legCount.value);
                    if (l <= 4) return (60 + l * 10);
                    if (l <= 8) return (100 - (l - 4) * 5);
                    return Math.max(5, 80 - l * 0.7);
                });

                // --- Three.js Racetrack & Creature ---
                let scene, camera, renderer, track, creature, legs = [];
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 40, 100);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // 1. Racetrack
                    const trackGeo = new THREE.PlaneGeometry(500, 50, 10, 10);
                    const trackMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
                    track = new THREE.Mesh(trackGeo, trackMat);
                    track.rotation.x = -Math.PI / 2;
                    scene.add(track);

                    // 2. Creature Body
                    const bodyGeo = new THREE.CapsuleGeometry(2, 8, 4, 16);
                    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xfacc15, emissiveIntensity: 0.2 });
                    creature = new THREE.Mesh(bodyGeo, bodyMat);
                    creature.rotation.z = Math.PI / 2;
                    creature.position.y = 5;
                    scene.add(creature);

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                    const sun = new THREE.DirectionalLight(0xffffff, 1);
                    sun.position.set(10, 80, 20);
                    scene.add(sun);

                    animate();
                };

                const updateLegs = () => {
                    // Remove old legs
                    legs.forEach(l => scene.remove(l));
                    legs = [];

                    const num = parseInt(legCount.value);
                    const spacing = 10 / (num / 2);
                    const legMat = new THREE.MeshStandardMaterial({ color: 0xffffff });

                    for (let i = 0; i < num; i++) {
                        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 8), legMat);
                        const side = i % 2 === 0 ? 1 : -1;
                        const zOff = (Math.floor(i / 2) * spacing) - 5;
                        leg.position.set(zOff, 0, side * 3);
                        leg.userData = { side: side, zOff: zOff };
                        scene.add(leg);
                        legs.push(leg);
                    }
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();
                    const speed = currentSpeed.value / 100;

                    // Creature rhythmic movement
                    creature.position.x = Math.sin(t * speed * 20) * 0.5;
                    creature.position.y = 5 + Math.abs(Math.sin(t * speed * 10)) * 1.5;

                    legs.forEach((leg, i) => {
                        const phase = t * speed * 20 + (leg.userData.zOff * 0.5);
                        leg.position.y = 2 + Math.max(0, Math.sin(phase) * 3);
                        leg.rotation.z = Math.sin(phase) * 0.5;
                        leg.position.x = creature.position.x + leg.userData.zOff;
                    });

                    // Track scrolling effect
                    track.position.x -= speed * 2;
                    if (track.position.x < -100) track.position.x = 0;

                    camera.lookAt(0, 20, 0); // Center the view!
                    renderer.render(scene, camera);
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(legCount, () => {
                    updateLegs();
                });

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, scale: 0.9, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 2, ease: "expo.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, ease: "expo.out" }, "-=1.5");

                    if (newVal === 4) {
                        gsap.to(camera.position, { y: 60, z: 120, duration: 4, ease: "power2.inOut" });
                    }
                });

                onMounted(() => {
                    initThree();
                    updateLegs();

                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 1 });

                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, legCount, currentSpeed, stages, currentStageData,
                    nextStage, goToStage, resetSimulation
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
