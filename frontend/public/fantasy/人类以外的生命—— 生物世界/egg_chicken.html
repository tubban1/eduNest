<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鸡生蛋还是蛋生鸡</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = { 'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js', 'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js', 'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js' };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-egg: #fef08a;
            --accent-comb: #f87171;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #451a03;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #fef08a, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(254, 240, 138, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #fefcbf;
            background: linear-gradient(90deg, transparent, rgba(254, 240, 138, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
            display: inline-block;
            margin-top: 1rem;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 5rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
            z-index: 20;
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 1);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-egg);
            box-shadow: 0 0 30px rgba(254, 240, 138, 0.3);
        }

        .mutation-egg {
            position: absolute;
            width: 100px;
            height: 130px;
            background: radial-gradient(circle at 30% 30%, #fff, #fef08a);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .mutation-egg:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 15px 30px rgba(254, 240, 138, 0.5);
        }

        .hatch-sparkle {
            pointer-events: none;
            position: absolute;
            font-size: 3rem;
            opacity: 0;
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-egg);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-egg);
        }

        .discovery-tag {
            background: #ca8a04;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        #egg-field {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="egg-field"></div>

    <div id="app" class="ui-root">
        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🥚 🐓 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">真相大白!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages && step !== 3" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启演化现场' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-yellow-900 !text-white">
                    致敬生命起源
                </button>
                <button v-if="step === 3 && isHatched" @click="nextStage"
                    class="next-btn !bg-yellow-500 ml-4">理解突变</button>
            </div>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const isHatched = ref(false);

                const stages = [
                    {
                        title: "时光倒流实验室",
                        parentWords: "宝贝，如果我们能穿越到几百万年前。那时候还没有家里的老母鸡。鸡蛋是从哪里冒出来的呢？",
                        description: "这是一间‘时间加速实验室’。我们正聚焦在第一枚鸡蛋诞生的瞬间。由于基因的微调，变化正在由于发生。",
                        isDiscovery: false
                    },
                    {
                        title: "预测：演化的足迹",
                        parentWords: "如果所有的原鸡都长得一模一样。预测一下，会有哪枚由于特殊的蛋能孵出新伙伴吗？大自然在由于变魔术吗？",
                        description: "预测中：两只类似的禽类会产生由于随机的基因突变。而这枚由于突变的蛋，就是通往新物种的钥匙。",
                        isDiscovery: false
                    },
                    {
                        title: "操作：寻找‘第一枚鸡蛋’",
                        parentWords: "快！在由于草丛里找出那枚闪光的‘奇迹蛋’。当你孵化它时，由于大自然的第一只鸡就会由于降临！",
                        description: "观察中：草丛里有很多蛋。只有这枚由于带有微弱荧光的，才是由于基因由于进化由于跨越的关键。",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：答案揭晓",
                        parentWords: "你看！真相是：鸡蛋由于变异而在先。新的蛋孵出了历史上第一只鸡。所以以后你就由于智慧而知道啦：是蛋生了第一只鸡！",
                        description: "震撼揭秘：在生命演化的长河中，变异发生在受精卵即‘蛋’中。这个由于突变的个体成为了新物种的始祖。蛋是由于进化的桥梁！",
                        isDiscovery: true
                    },
                    {
                        title: "生命由于改变而精彩",
                        parentWords: "每一个微小的改变都由于积累成了伟大的奇迹。让我们感恩每一个‘突变’的由于意外。你今天解开了世界上由于最难的谜题！",
                        description: "无论是由于恐龙到鸟类，还是由于原鸡到家鸡。这都是由于时间与自然的合奏。你做得太棒了，由于智慧小探险家！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js Evolution Space ---
                let scene, camera, renderer, chickens = [];
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 30, 120);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // 1. Warm Background
                    const floor = new THREE.Mesh(new THREE.CircleGeometry(200, 32), new THREE.MeshStandardMaterial({ color: 0x451a03 }));
                    floor.rotation.x = -Math.PI / 2;
                    scene.add(floor);

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
                    const sun = new THREE.PointLight(0xfef08a, 2, 300);
                    sun.position.set(20, 100, 50);
                    scene.add(sun);

                    animate();
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();

                    chickens.forEach((c, idx) => {
                        c.position.y = 5 + Math.sin(t * 2 + idx) * 2;
                        c.rotation.y = t * 0.5 + idx;
                    });

                    camera.lookAt(0, 0, 0); // Center the view!
                    renderer.render(scene, camera);
                };

                const addChicken = (isReal) => {
                    const group = new THREE.Group();
                    const body = new THREE.Mesh(new THREE.SphereGeometry(4), new THREE.MeshStandardMaterial({ color: isReal ? 0xfef08a : 0x78350f }));
                    group.add(body);
                    const comb = new THREE.Mesh(new THREE.ConeGeometry(1, 4), new THREE.MeshStandardMaterial({ color: 0xf87171 }));
                    comb.position.y = 4;
                    group.add(comb);

                    group.position.set((Math.random() - 0.5) * 100, 5, (Math.random() - 0.5) * 100);
                    scene.add(group);
                    chickens.push(group);
                    gsap.from(group.scale, { x: 0, y: 0, z: 0, duration: 1 });
                };

                const spawnEgg = () => {
                    const egg = document.createElement('div');
                    egg.className = 'mutation-egg';
                    const x = (Math.random() * 60 + 20) + '%';
                    const y = (Math.random() * 40 + 30) + '%';
                    egg.style.left = x;
                    egg.style.top = y;
                    egg.onclick = () => hatchEgg(egg);
                    document.getElementById('egg-field').appendChild(egg);
                };

                const hatchEgg = (el) => {
                    if (isHatched.value) return;
                    isHatched.value = true;

                    gsap.to(el, { scale: 1.5, rotate: 10, duration: 0.1, yoyo: true, repeat: 5 });
                    setTimeout(() => {
                        el.style.opacity = '0';
                        addChicken(true);
                    }, 600);
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, scale: 0.9, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 2, ease: "expo.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, ease: "expo.out" }, "-=1.5");

                    if (newVal === 3) {
                        for (let i = 0; i < 3; i++) spawnEgg();
                        document.getElementById('egg-field').style.pointerEvents = 'auto';
                    } else {
                        document.getElementById('egg-field').style.pointerEvents = 'none';
                    }
                });

                onMounted(() => {
                    initThree();
                    for (let i = 0; i < 5; i++) addChicken(false);

                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 1 });

                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, isHatched, stages, currentStageData,
                    nextStage, goToStage, resetSimulation
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
