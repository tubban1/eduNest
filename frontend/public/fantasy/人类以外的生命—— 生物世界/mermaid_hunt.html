<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我想找到海的女儿</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = { 'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js', 'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js', 'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js' };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&family=Sacramento&display=swap');

        :root {
            --accent-cyan: #22d3ee;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);

            /* Mermaid Colors */
            --wild-sand: #F5F5F5;
            --chamois: #EDE1B4;
            --mystic: #D6E6E5;
            --opal: #ABCDCC;
            --ice-cold: #9FECF4;
            --med-turquoise: #3AC1CC;
            --burnt-sienna: #F16A51;
            --mauve: #C69AF4;
            --negroni: #efc2a3;
            --cosmos: #FCD9C4;
            --apricot: #F9CCB1;
            --rose: #E292A1;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #083344;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #22d3ee, #0ea5e9);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #cffafe;
            background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 18rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.3);
        }

        .hud-status {
            position: fixed;
            left: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            color: #22d3ee;
            font-weight: 700;
        }

        .scan-count {
            background: rgba(34, 211, 238, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            border: 1px solid #22d3ee;
            font-size: 0.8rem;
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-cyan);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        .discovery-tag {
            background: #0891b2;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        .flashlight-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 150px, rgba(0, 0, 0, 0.95) 250px);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
        }

        /* --- MERMAID CSS --- */
        .mermaid-stage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            z-index: 15;
            opacity: 0;
            pointer-events: none;
        }

        .backdrop {
            background-color: var(--wild-sand);
            box-shadow: inset 0 0 0 4px var(--mystic);
            width: 360px;
            height: 360px;
            border-radius: 50%;
            position: relative;
        }

        .backdrop:before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: linear-gradient(var(--chamois), pink);
        }

        .backdrop:after {
            content: '';
            position: absolute;
            background-color: var(--wild-sand);
            bottom: 0;
            height: 100px;
            width: 100%;
            z-index: 0;
        }

        .water {
            position: absolute;
            bottom: 92px;
            width: 100%;
            height: 8px;
            background-color: var(--opal);
            z-index: 1;
            border-radius: 20px;
        }

        .water:before,
        .water:after {
            content: '';
            background-color: var(--mystic);
            position: absolute;
            top: 15px;
            height: 8px;
            border-radius: 20px;
        }

        .water:before {
            left: 10px;
            width: 50%;
        }

        .water:after {
            right: 10px;
            width: 25%;
        }

        .mermaid {
            width: 174px;
            height: 130px;
            position: absolute;
            left: 50%;
            bottom: 198px;
            transform: translateX(-50%) translateY(0) translateZ(0);
            animation: mermaid-motion 3500ms cubic-bezier(0.4, 0, 1, 1) infinite alternate;
        }

        .hair {
            background-color: var(--burnt-sienna);
            height: 230px;
            width: 170px;
            border-radius: 90% 90% 0 0;
        }

        .hair:after {
            content: '';
            background-color: #d64a33;
            /* darken burnt-sienna 5% */
            position: absolute;
            top: 45px;
            left: 3%;
            width: 160px;
            height: 140%;
            border-radius: 80% 80% 0 0;
        }

        .hair--left,
        .hair--middle,
        .hair--right {
            position: absolute;
        }

        .hair--left {
            left: 48px;
            top: 45px;
            width: 8px;
            background-color: var(--burnt-sienna);
            border-radius: 0 0 0 50px;
            height: 14px;
            z-index: 5;
        }

        .hair--left:before {
            content: '';
            position: absolute;
            top: 0;
            left: 8px;
            width: 8px;
            height: 8px;
            background-color: var(--burnt-sienna);
            border-radius: 0 0 50px 0;
        }

        .hair--right {
            right: 48px;
            top: 45px;
            width: 8px;
            border-radius: 0 0 50px 0;
            background-color: var(--burnt-sienna);
            height: 14px;
            z-index: 5;
        }

        .hair--right:before {
            content: '';
            position: absolute;
            top: 0;
            right: 8px;
            width: 20px;
            height: 8px;
            background-color: var(--burnt-sienna);
            border-radius: 0 0 0 50px;
        }

        .hair--middle {
            top: 14px;
            left: 40%;
            width: 80px;
            height: 40px;
            border-radius: 0 90%;
            z-index: 6;
            background-color: #d64a33;
            transform: translateX(-50%) rotate(-10deg);
        }

        .hair--middle:after {
            content: '';
            position: absolute;
            top: 32px;
            right: 0;
            width: 50px;
            height: 14px;
            border-radius: 0 90%;
            background-color: #c13c27;
            /* darken burnt-sienna 8% */
            transform: rotate(-10deg);
        }

        .ear--left,
        .ear--right {
            position: absolute;
            top: 50px;
            width: 16px;
            height: 24px;
            background-color: var(--apricot);
        }

        .ear--left {
            left: 40px;
            border-radius: 50px 0 0 50px;
        }

        .ear--right {
            right: 40px;
            border-radius: 0 50px 50px 0;
        }

        .face {
            background-color: var(--apricot);
            width: 78px;
            border-radius: 0 0 50px 50px;
            height: 58px;
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
        }

        .face:after {
            background-color: var(--cosmos);
            width: 68px;
            border-radius: 0 0 50px 50px;
            height: 52px;
            content: '';
            left: 50%;
            transform: translateX(-50%);
            position: absolute;
        }

        .eye {
            width: 12px;
            height: 12px;
            background-color: black;
            position: absolute;
            left: 15px;
            top: 14px;
            z-index: 5;
            border-radius: 50px;
        }

        .eye+.eye {
            left: auto;
            right: 15px;
        }

        .eye:after {
            content: '';
            width: 16px;
            left: -2px;
            height: 14px;
            background-color: var(--cosmos);
            border-radius: 50%;
            position: absolute;
            animation: eyes-blink 3500ms cubic-bezier(0.4, 0, 1, 1) infinite alternate;
        }

        .cheek {
            position: absolute;
            top: 28px;
            width: 16px;
            left: 12px;
            height: 14px;
            background-color: pink;
            border-radius: 50%;
            z-index: 5;
        }

        .cheek+.cheek {
            left: auto;
            right: 12px;
        }

        .nose {
            background-color: var(--negroni);
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 5px;
            z-index: 5;
            border-radius: 20px;
        }

        .mouth {
            width: 18px;
            height: 8px;
            border-radius: 0 0 50px 50px;
            background-color: var(--rose);
            position: absolute;
            bottom: 11px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
        }

        .neck {
            width: 26px;
            height: 26px;
            background-color: var(--apricot);
            border-radius: 0 0 50px 50px;
            bottom: 4px;
            z-index: 4;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .body {
            background-color: var(--apricot);
            position: absolute;
            bottom: -60px;
            width: 70px;
            height: 78px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50px 50px 0 0;
            z-index: 1;
        }

        .body:before {
            content: '';
            background-color: #d1a88b;
            /* darken negroni 10% */
            position: absolute;
            top: 80%;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            border-radius: 100%;
        }

        .body:after {
            content: '';
            position: absolute;
            width: 70px;
            height: 70px;
            transform: translateX(-50%);
            left: 50%;
            border-radius: 0 0 50px 50px;
            background: radial-gradient(var(--ice-cold), var(--med-turquoise));
            top: 70px;
        }

        .arm {
            background-color: var(--negroni);
            position: absolute;
            top: 112px;
            width: 20px;
            height: 80px;
            left: 21%;
            transform: rotate(45deg);
            border-radius: 50px;
            z-index: 0;
        }

        .arm:after {
            content: '';
            background-color: #f72c38;
            /* approximate darken pink 10% */
            position: absolute;
            top: 10px;
            left: 4px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .arm+.arm {
            top: 80px;
            left: 70%;
            transform: rotate(60deg);
        }

        .bra--cup {
            position: absolute;
            top: 20px;
            width: 35px;
            left: 2px;
            height: 30px;
            background-color: #ad7ce0;
            /* darken mauve 10% */
            border-radius: 50%;
        }

        .bra--cup:after {
            content: '';
            position: absolute;
            left: 3px;
            width: 30px;
            height: 25px;
            background-color: var(--mauve);
            border-radius: 50%;
        }

        .bra--cup+.bra--cup {
            left: auto;
            right: 2px;
        }

        .tail {
            background: #2eaeb8;
            /* darken med-turquoise 5% */
            position: absolute;
            top: 100px;
            left: 70px;
            border-radius: 5px 90%;
            height: 25px;
            width: 20px;
            transform: rotate(95deg);
        }

        .fin {
            background: var(--ice-cold);
            position: absolute;
            top: 50px;
            left: 90px;
            border-radius: 5px 90%;
            border: 4px solid #8fd5dc;
            /* approximate darken ice-cold 10% */
            height: 60px;
            width: 60px;
            z-index: 1;
        }

        .fin {
            transform: translateX(90%) rotate(95deg);
        }

        .fin+.fin {
            top: 37px;
            left: 60px;
            transform: translateX(20%) rotate(45deg);
        }

        @keyframes mermaid-motion {
            0% {
                transform: translateX(-50%) translateY(45px) translateZ(0);
            }

            15% {
                transform: translateX(-50%) translateY(50px) translateZ(0);
            }

            30% {
                transform: translateX(-50%) translateY(45px) translateZ(0);
            }

            45% {
                transform: translateX(-50%) translateY(50px) translateZ(0);
            }

            60% {
                transform: translateX(-50%) translateY(0px) translateZ(0);
            }

            100% {
                transform: translateX(-50%) translateY(0px) translateZ(0);
            }
        }

        @keyframes eyes-blink {
            0% {
                transform: translateY(16px) translateZ(0);
            }

            15% {
                transform: translateY(16px) translateZ(0);
            }

            30% {
                transform: translateY(16px) translateZ(0);
            }

            45% {
                transform: translateY(16px) translateZ(0);
            }

            60% {
                transform: translateY(4px) translateZ(0);
            }

            100% {
                transform: translateY(4px) translateZ(0);
            }
        }

        .mermaid-title {
            font-family: 'Sacramento', cursive;
            font-size: 3rem;
            color: #d64a33;
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div class="flashlight-mask" id="flashlight"></div>

    <!-- MERMAID ELEMENT -->
    <div class="mermaid-stage" id="mermaid-root">
        <div class="backdrop">
            <div class="water"></div>
            <div class="mermaid">
                <div class="hair">
                    <div class="hair--left"></div>
                    <div class="hair--middle"></div>
                    <div class="hair--right"></div>
                </div>
                <div class="ear">
                    <div class="ear--left"></div>
                    <div class="ear--right"></div>
                </div>
                <div class="face">
                    <div class="eyes">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                    <div class="cheeks">
                        <div class="cheek"></div>
                        <div class="cheek"></div>
                    </div>
                    <div class="nose"></div>
                    <div class="mouth"></div>
                </div>
                <div class="neck"></div>
                <div class="body">
                    <div class="bra">
                        <div class="bra--cup"></div>
                        <div class="bra--cup"></div>
                    </div>
                    <div class="tail"></div>
                    <div class="fins">
                        <div class="fin"></div>
                        <div class="fin"></div>
                    </div>
                </div>
                <div class="arms">
                    <div class="arm"></div>
                    <div class="arm"></div>
                </div>
            </div>
        </div>
        <h1 class="mermaid-title">I'd rather be a mermaid.</h1>
    </div>

    <div id="app" class="ui-root">
        <!-- 扫描状态 HUD -->
        <div class="hud-status" v-if="step >= 3">
            <div class="text-xs uppercase opacity-60">Sonar Search</div>
            <div class="scan-count">已扫描生命点: {{ foundCount }}</div>
        </div>

        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🌊 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">深海发现!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages && step !== 3" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '启动声呐潜航' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-cyan-700 !text-white">
                    回归海面蓝天
                </button>
                <button v-if="step === 3 && foundCount >= 5" @click="nextStage" class="next-btn !bg-cyan-500 ml-4">
                    揭秘水下宫殿
                </button>
            </div>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const foundCount = ref(0);

                const stages = [
                    {
                        title: "蔚蓝的深海剧场",
                        parentWords: "宝贝，海底世界黑漆漆的，却总是有发光的小星星。那里是不是藏着很多美丽的传说？",
                        description: "这是一片深度 1000 米的‘午夜区’。在这里，由于光照不进来，真正的海洋明星都学会了‘自发光’。",
                        isDiscovery: false
                    },
                    {
                        title: "深海之家的‘生存法则’",
                        parentWords: "如果人类像人鱼一样住在水底。我们要面临氧气、海水压力和寒潮的挑战。预测一下，你的潜水服得有多厚？",
                        description: "预测中：人类的皮肤太薄了。我们要想在这里过得舒服，需要由于压力而变强的保护壳和由于黑暗而闪亮的眼睛。",
                        isDiscovery: false
                    },
                    {
                        title: "操作：寻找深海奇迹",
                        parentWords: "快！移动你的鼠标（就像声呐发出的信号），扫视幽暗的海底森林。看看有哪些发光的‘海中仙女’？",
                        description: "随着探测光的扫视，你可以发现藏在岩石后面的‘海之子’。每扫到一个发光物体，我们的认知就会提升一点！",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：真正的‘海之子’",
                        parentWords: "你看！真正的奇迹是那些在超高压力下依然快乐游泳的海豚和绚烂的水母。原来真正的海女儿，一直都在大自然里跳舞！",
                        description: "震撼大发现：人类无法通过快速进化而在短时间内变成鱼。海洋属于那些由于环境而进化出腮和鳍的精灵。我们要想访问它们，得依靠科技而发明的潜水舱！",
                        isDiscovery: true
                    },
                    {
                        title: "守护蔚蓝的梦幻",
                        parentWords: "保护好大海的清澈，就是保护这些美丽邻居的殿堂. 无论有无童话，这片深蓝都值得我们永远守护。",
                        description: "每一颗落入海中的塑料碎屑，都会让海洋女儿伤心。让我们去做最棒的海洋保护兵吧。你是今天最智慧的探险家！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js Underwater World ---
                let scene, camera, renderer, bubbleGroup, fishGroup, seabed;
                let clock = new THREE.Clock();
                let raycaster = new THREE.Raycaster();
                let mouse = new THREE.Vector2();

                const initThree = () => {
                    scene = new THREE.Scene();
                    scene.fog = new THREE.FogExp2(0x083344, 0.005);
                    camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 50, 200);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // 1. Particle Bubbles
                    bubbleGroup = new THREE.Group();
                    for (let i = 0; i < 300; i++) {
                        const b = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 }));
                        b.position.set((Math.random() - 0.5) * 400, (Math.random() - 0.5) * 400, (Math.random() - 0.5) * 400);
                        b.userData = { speed: Math.random() * 2 + 1 };
                        bubbleGroup.add(b);
                    }
                    scene.add(bubbleGroup);

                    // 2. Fish & Life (Hidden initially)
                    fishGroup = new THREE.Group();
                    for (let i = 0; i < 15; i++) {
                        const f = new THREE.Mesh(new THREE.IcosahedronGeometry(2), new THREE.MeshStandardMaterial({ color: 0x22d3ee, emissive: 0x22d3ee, emissiveIntensity: 2 }));
                        f.position.set((Math.random() - 0.5) * 300, (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200);
                        f.userData = { scanned: false };
                        fishGroup.add(f);
                    }
                    scene.add(fishGroup);

                    // 3. Seabed Plane
                    const sbGeo = new THREE.PlaneGeometry(1000, 1000, 32, 32);
                    const sbMat = new THREE.MeshStandardMaterial({ color: 0x0c4a6e, roughness: 1 });
                    seabed = new THREE.Mesh(sbGeo, sbMat);
                    seabed.rotation.x = -Math.PI / 2;
                    seabed.position.y = -100;
                    scene.add(seabed);

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.2));
                    const flash = new THREE.PointLight(0x22d3ee, 5, 100);
                    flash.position.set(0, 0, 50);
                    scene.add(flash);

                    animate();
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();

                    if (bubbleGroup) {
                        bubbleGroup.children.forEach(b => {
                            b.position.y += b.userData.speed * 0.1;
                            if (b.position.y > 200) b.position.y = -200;
                        });
                    }

                    if (fishGroup) {
                        fishGroup.children.forEach(f => {
                            f.rotation.y = t * 2;
                            f.position.x += Math.cos(t + f.uuid.length) * 0.2;
                        });
                    }

                    renderer.render(scene, camera);
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, scale: 0.9, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 2, ease: "expo.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, ease: "expo.out" }, "-=1.5");

                    if (newVal === 3) {
                        gsap.to('#flashlight', { opacity: 1, duration: 2 });
                    } else {
                        gsap.to('#flashlight', { opacity: 0, duration: 2 });
                    }

                    if (newVal === 4) {
                        gsap.to('#mermaid-root', { opacity: 1, scale: 1.2, duration: 2, ease: "elastic.out(1, 0.3)" });
                    } else {
                        gsap.to('#mermaid-root', { opacity: 0, scale: 0.5, duration: 1 });
                    }
                });

                onMounted(() => {
                    initThree();

                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 1 });

                    window.addEventListener('mousemove', (e) => {
                        const fx = e.clientX;
                        const fy = e.clientY;
                        const fl = document.getElementById('flashlight');
                        if (fl) fl.style.background = `radial-gradient(circle at ${fx}px ${fy}px, transparent 150px, rgba(0, 0, 0, 0.95) 250px)`;

                        // Intersection for scan
                        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                        raycaster.setFromCamera(mouse, camera);
                        const intersects = raycaster.intersectObjects(fishGroup.children);
                        if (intersects.length > 0 && step.value === 3) {
                            const obj = intersects[0].object;
                            if (!obj.userData.scanned) {
                                obj.userData.scanned = true;
                                foundCount.value++;
                                gsap.from(obj.scale, { x: 5, y: 5, z: 5, duration: 0.5, ease: "elastic" });
                            }
                        }
                    });

                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, foundCount, stages, currentStageData,
                    nextStage, goToStage, resetSimulation
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
