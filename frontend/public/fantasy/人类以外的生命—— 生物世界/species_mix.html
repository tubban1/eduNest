<body>
    <div id="canvas-container"></div>

    <div id="app" class="ui-root">
        <div class="danger-alert" :style="{ opacity: mixVal > 0.8 || mixVal < 0.2 ? 1 : 0 }">
            ⚠️ DNA 逻辑冲突 (天性不匹配)
        </div>

        <!-- PET STAGE -->
        <div class="pet-stage">
            <div class="pet-box cat-box" :style="catStyle">
                <div class="cat" :class="{ 'logic-conflict': mixVal > 0.8, 'genetic-stripes': mixVal > 0.6 }">
                    <div class="ears1"></div>
                    <div class="head1">
                        <div class="eyes1"></div>
                        <div class="nose1"></div>
                    </div>
                    <div class="body1">
                        <div class="left-paw1"></div>
                        <div class="right-paw1"></div>
                    </div>
                    <div class="tail1"></div>
                </div>
            </div>
            <div class="pet-box dog-box" :style="dogStyle">
                <div class="dog" :class="{ 'logic-conflict': mixVal < 0.2, 'genetic-stripes': mixVal < 0.4 }">
                    <div class="ears2"></div>
                    <div class="head2">
                        <div class="eyes2"></div>
                        <div class="nose2"></div>
                    </div>
                    <div class="body2">
                        <div class="left-paw2"></div>
                        <div class="right-paw2"></div>
                    </div>
                    <div class="tail2"></div>
                </div>
            </div>
        </div>

        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🐈 🐕 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">大揭秘!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages && step !== 3" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启混合模拟' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-pink-700 !text-white">
                    回归生命本色
                </button>
            </div>
        </div>

        <!-- DNA 混合面板 -->
        <div v-if="step === 3" class="control-panel">
            <div class="slider-header">
                <span>小花猫 (Cat)</span>
                <span>二哈 (Dog)</span>
            </div>
            <input type="range" v-model="mixVal" min="0" max="1" step="0.01">
            <div class="text-xs text-center opacity-60">滑动混合物种蓝图</div>
            <button @click="nextStage" v-if="mixVal > 0.4 && mixVal < 0.6"
                class="next-btn !text-sm !py-3 !px-12 mt-4">已达成微妙平衡</button>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const mixVal = ref(0.5);

                const stages = [
                    {
                        title: "‘生命之窗’的宁静",
                        parentWords: "宝贝，你看，这是一只在阳光下伸懒腰的猫咪，那是只在公园里追球的小狗。它们原本的样子是不是最和谐的？",
                        description: "在这个微观实验室里，我们模拟了猫和狗的生命蓝图。它们有着完全不同的语言和习惯。",
                        isDiscovery: false
                    },
                    {
                        title: "预测：错位的语言",
                        parentWords: "如果让猫妈妈也学会摇尾巴求关注，小狗学会爬到柜子顶上抓小鸟。预测一下，这种‘身份交换’会出乱子吗？",
                        description: "预测中：猫的爪子是用来攀爬的，狗的骨骼是为了长跑的。逻辑的冲突由于强行融合而产生。",
                        isDiscovery: false
                    },
                    {
                        title: "操作：拨动‘生命旋钮’",
                        parentWords: "来！滑动下方的混合条，看看当猫和狗的特征叠加在一起时，形态会如何变幻。中间那个平衡点，真的是我们要的吗？",
                        description: "观察模型的形变：你可以看到猫和狗的遗传信息在互相拉扯。由于天性的不同，它们看起来似乎不太舒服。",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：精准的蓝图",
                        parentWords: "你看！当你拨得太左或太右，逻辑就会由于过于‘混搭’而报错。原来每个生命生来就有一套最适合它们的‘生命密码’！",
                        description: "核心真相：DNA不只是样子的设计，更是行为的脚本。猫喜欢独处是由于它们是伏击型猎手；狗喜欢集群是由于它们是围猎者。混在一起会导致由于天性矛盾而产生的‘逻辑混乱’。",
                        isDiscovery: true
                    },
                    {
                        title: "珍惜每一种独特的生命",
                        parentWords: "让猫咪当好猫，让小狗当好狗。它们的每个动作、每声叫唤，都是大自然最独特的礼物。我们要继续爱这些独一无二的朋友哦！",
                        description: "多样性是生命最伟大的宝藏。尊重差异、爱惜本位，就是学习生命科学最重要的一课。你今天表现得很出色！",

                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                const catStyle = computed(() => {
                    const val = mixVal.value;
                    const baseOpacity = 0.85; // Base transparency for readability
                    return {
                        transform: `translateX(${(0.5 - val) * 200}px) scale(${1 + (1 - val) * 0.2})`,
                        opacity: baseOpacity - (val > 0.8 ? (val - 0.8) * 4 : 0),
                        filter: `hue-rotate(${val * 50}deg)`
                    }
                });

                const dogStyle = computed(() => {
                    const val = mixVal.value;
                    const baseOpacity = 0.85; // Base transparency for readability
                    return {
                        transform: `translateX(${(0.5 - val) * 200}px) scale(${1 + val * 0.2})`,
                        opacity: baseOpacity - (val < 0.2 ? (0.2 - val) * 4 : 0),
                        filter: `hue-rotate(${(1 - val) * 50}deg)`
                    }
                });

                // --- Three.js Background Glow ---
                let scene, camera, renderer, particles;
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 0, 100);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // DNA like particles
                    const geo = new THREE.BufferGeometry();
                    const positions = [];
                    for (let i = 0; i < 1000; i++) {
                        positions.push((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200, (Math.random() - 0.5) * 200);
                    }
                    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                    const mat = new THREE.PointsMaterial({ color: 0x60a5fa, size: 0.5 });
                    particles = new THREE.Points(geo, mat);
                    scene.add(particles);

                    animate();
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();
                    if (particles) {
                        particles.rotation.y = t * 0.1;
                        particles.material.color.setHSL((Math.sin(t * 0.2) + 1) / 2, 0.5, 0.5);
                    }
                    renderer.render(scene, camera);
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, scale: 0.9, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 2, ease: "expo.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, ease: "expo.out" }, "-=1.5");

                    if (newVal === 5) {
                        gsap.to(mixVal, { value: 0.5, duration: 2 });
                    }
                });

                onMounted(() => {
                    initThree();
                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 1 });

                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, mixVal, stages, currentStageData,
                    nextStage, goToStage, resetSimulation, catStyle, dogStyle
                };
            }
        }).mount('#app');
    </script>
</body>
