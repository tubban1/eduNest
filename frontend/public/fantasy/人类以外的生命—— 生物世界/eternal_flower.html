<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鲜花只开不谢该多好</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = { 'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js', 'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js', 'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js' };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-pink: #f472b6;
            --accent-purple: #a855f7;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1b4b;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #f472b6, #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(244, 114, 182, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #fae8ff;
            background: linear-gradient(90deg, transparent, rgba(244, 114, 182, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 18rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-pink);
            box-shadow: 0 0 30px rgba(244, 114, 182, 0.3);
        }

        .freeze-timer {
            position: fixed;
            left: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            color: var(--accent-pink);
            font-weight: 700;
            opacity: 0;
        }

        .timer-circle {
            width: 80px;
            height: 80px;
            border: 4px solid var(--accent-pink);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 15px var(--accent-pink);
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-pink);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-pink);
        }

        .discovery-tag {
            background: #86198f;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        .freeze-panel {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            padding: 2.2rem 4rem;
            border-radius: 4rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 2rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .freeze-btn {
            background: #f472b6;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.6);
            border: none;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div id="app" class="ui-root">
        <!-- 冻结 HUD -->
        <div class="freeze-timer" ref="timerHud">
            <div class="text-xs uppercase opacity-60">Garden Flow</div>
            <div class="timer-circle">
                {{ isFrozen ? '∞' : timeSpent + 's' }}
            </div>
            <div class="text-xs mt-2 text-center uppercase">{{ isFrozen ? 'Locked State' : 'Natural Bloom' }}</div>
        </div>

        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🌸 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">大发现!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex flex-col items-center gap-6 justify-center pointer-events-auto">
                <button v-if="step < totalStages && step !== 3" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启花园实验室' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-purple-900 !text-white">
                    回归自然节拍
                </button>
                <div v-if="step === 3" class="freeze-panel">
                    <div class="flex flex-col gap-1">
                        <div class="text-xs uppercase text-pink-300">Magic Lock</div>
                        <div class="text-xl font-bold">时间定格：{{ isFrozen ? '已开启' : '关闭' }}</div>
                    </div>
                    <button @click="toggleFreeze" class="freeze-btn">❄️</button>
                    <button v-if="isFrozen" @click="nextStage"
                        class="next-btn !text-sm !py-3 !px-12 ml-4">理解流转之美</button>
                </div>
            </div>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const isFrozen = ref(false);
                const timeSpent = ref(0);

                const stages = [
                    {
                        title: "永恒的花园剧场",
                        parentWords: "宝贝，如果公园里的小花永远不枯萎，一直开得那么灿烂。我们的地球会变成一幅永远不变的画吗？生命由于还在前进吗？",
                        description: "这是一间奇妙的‘延时花园实验室’。每一朵鲜花都在展示它由于灿烂的生命力和瞬间的美丽。请进入时间流动室。",
                        isDiscovery: false
                    },
                    {
                        title: "预测：静止的代价",
                        parentWords: "如果一朵花由于永远不凋谢。预测一下，它还能由于结出甜美的果实吗？原本要播撒的由于种子还能由于入土吗？",
                        description: "预测中：生命由于流转而由于存在。如果花儿不谢，由于蜜蜂就不会忙碌，果实之由于生命也无法在这个世界上由于繁衍。",
                        isDiscovery: false
                    },
                    {
                        title: "操作：定格瞬间",
                        parentWords: "快！点击‘冻结’按钮。看看当花朵由于被定格在最美的一刻，蜜蜂不再飞来，种子也无法由于成熟。花园由于于单一而失去了活力。",
                        description: "观测中：你施展了‘定格魔法’。由于最美的时刻被永远留住。但看！由于没有凋谢，新的花骨朵再也没有由于长出来的勇气了。",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：凋谢的价值",
                        parentWords: "你看！真正的奇迹是由于流逝而新生。凋谢是由于为了种子的降临。新发现：如果鲜花永存，由于世界将很快挤满死气沉沉的颜色，由于循环才是生命的‘超级电量’！",
                        description: "震撼揭秘：由于为了未来的果实。凋谢不是结束，而是为了将由于能量传递给种子。新发现：如果鲜花不落，地球将很快被死板的‘永恒之花’填满，原本的由于生命循环就会由于断裂！",
                        isDiscovery: true
                    },
                    {
                        title: "致敬大自然的节奏",
                        parentWords: "让我们珍惜每一个当下的由于花开与花落。这份由于流转的自然诗篇。你今天不仅看透了美丽，还由于读懂了生命的‘新陈代谢’！",
                        description: "自然之由于伟大在于它懂得由于放下与开始。我们要学习这份由于一份份生命的接力。你做得太棒了，由于智慧小诗人！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js Flower Garden ---
                let scene, camera, renderer, flowers = [];
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 50, 150);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                    const sun = new THREE.PointLight(0xf472b6, 2, 300);
                    sun.position.set(20, 100, 50);
                    scene.add(sun);

                    // Initial Flowers
                    for (let i = 0; i < 15; i++) addFlower();

                    animate();
                };

                const addFlower = () => {
                    const group = new THREE.Group();
                    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 30), new THREE.MeshStandardMaterial({ color: 0x166534 }));
                    const petals = new THREE.Mesh(new THREE.TorusKnotGeometry(4, 1, 100, 16), new THREE.MeshStandardMaterial({ color: 0xf472b6 }));
                    petals.position.y = 15;
                    group.add(stem); group.add(petals);

                    group.position.set((Math.random() - 0.5) * 150, 15, (Math.random() - 0.5) * 150);
                    group.userData = { offset: Math.random() * 10, isBlooming: true };
                    scene.add(group);
                    flowers.push(group);
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const dt = clock.getDelta();
                    const t = clock.getElapsedTime();

                    if (!isFrozen.value) {
                        timeSpent.value = Math.floor(t % 60);
                        flowers.forEach((f, idx) => {
                            const scale = 0.5 + Math.sin(t + f.userData.offset) * 0.5;
                            f.scale.set(scale, scale, scale);
                            f.rotation.y += dt;
                        });
                    }

                    renderer.render(scene, camera);
                };

                const toggleFreeze = () => {
                    isFrozen.value = !isFrozen.value;
                    gsap.to(camera.position, { z: isFrozen.value ? 100 : 150, duration: 2 });
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, scale: 0.9, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 2, ease: "expo.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, ease: "expo.out" }, "-=1.5");

                    if (newVal >= 2) gsap.to('.freeze-timer', { opacity: 1, duration: 1 });
                    if (newVal === 4) {
                        gsap.to(camera.position, { y: 200, z: 250, duration: 5, ease: "power2.inOut" });
                    }
                });

                onMounted(() => {
                    initThree();

                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 1 });

                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, isFrozen, timeSpent, stages, currentStageData,
                    nextStage, goToStage, resetSimulation, toggleFreeze
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
