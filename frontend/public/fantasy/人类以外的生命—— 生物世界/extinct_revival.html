<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灭绝动物都复活了该怎么办</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = { 'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js', 'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js', 'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js' };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-emerald: #10b981;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #10b981, #34d399);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #d1fae5;
            background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 5rem auto;
            /* Reduced margin to keep at bottom but visible */
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
            z-index: 20;
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 1);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-emerald);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
        }

        .control-panel {
            position: fixed;
            bottom: 6rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            padding: 2.2rem 4rem;
            border-radius: 4rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            z-index: 20;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .ray-btn {
            background: #10b981;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
            border: none;
        }

        .ray-btn:hover {
            transform: scale(1.15);
            filter: brightness(1.2);
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.8);
        }

        .ray-btn:active {
            transform: scale(0.9);
        }

        .status-tag {
            background: rgba(16, 185, 129, 0.2);
            padding: 0.5rem 1.2rem;
            border-radius: 1rem;
            border: 1px solid rgba(16, 185, 129, 0.4);
            font-size: 0.9rem;
            color: #34d399;
            font-weight: 700;
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-emerald);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-emerald);
        }

        .discovery-tag {
            background: #059669;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        @keyframes pulse-emerald {
            0% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(16, 185, 129, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div id="app" class="ui-root">
        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🧭 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">新发现!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages && step !== 3" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启复苏核心' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-emerald-700 !text-white">
                    致敬生命长河
                </button>
            </div>
        </div>

        <!-- 复苏发射器 -->
        <div v-if="step === 3" class="control-panel">
            <div class="flex flex-col gap-2">
                <div class="status-tag">复苏能量：{{ energyLevel }}%</div>
                <div class="text-xs text-emerald-400 opacity-60">ANCIENT DNA RECOVERY SYSTEM</div>
            </div>
            <button @click="revivePulse" class="ray-btn"
                :style="{ animation: energyLevel < 100 ? 'pulse-emerald 2s infinite' : 'none' }">⚡</button>
            <button @click="nextStage" v-if="energyLevel >= 100" class="next-btn !text-sm !py-3 !px-12">见证大道理</button>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const energyLevel = ref(0);

                const stages = [
                    {
                        title: "静谧的生命博物馆",
                        parentWords: "宝贝，你看这些发光的影子，它们曾是地球上的王者。可惜，我们现在只能在画里见到它们了。",
                        description: "在这片‘虚空剧场’中，长毛象、渡渡鸟和剑齿虎以星尘的形式存在。它们在耐心地等待着...",
                        isDiscovery: false
                    },
                    {
                        title: "预测：违背时间的后果",
                        parentWords: "如果我们把已经消失的大家伙带回现在的公园，它们能在柏油马路上找到路吗？它们会觉得热吗？",
                        description: "由于时间之门已经关闭，强行带回它们需要消耗巨大的能量。预测一下，复活一个消失的物种，真的只是‘变魔术’那么简单吗？",
                        isDiscovery: false
                    },
                    {
                        title: "操作：激活‘复苏核心’",
                        parentWords: "来！对着那些虚影按下‘生命脉冲’！只要三次能量充值，这些大家伙就会显形！我们要帮它们重新感受心跳。",
                        description: "点击闪电按钮进行能量充磁。随着能量增加，星尘会聚集成实色。看！猛犸象正在苏醒，但它似乎很迷惑现在的环境。",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：遗失的钥匙",
                        parentWords: "你看！猛犸象太重了，会压坏现在的石桥；渡渡鸟太老实了，会被现在的野猫欺负。原来，消失不是运气不好，而是它们的钥匙开不开现在的门啦。",
                        description: "震撼揭秘：灭绝不仅仅是死亡，更是生命与家园（环境）失去了同步。我们无法在现代复刻万年前的冰原，这意味着由于环境变了，它们无法真正‘回家’。",
                        isDiscovery: true
                    },
                    {
                        title: "保护好现在的‘邻居’",
                        parentWords: "与其在它们离开后才想办法‘复活’，不如在它们还在的时候，多给它们留一些森林和海洋。我们要当好现在的英雄！",
                        description: "生命最美的样子，是在属于它的土地上自由奔跑。让我们珍惜当下的自然奇迹。你是今天最棒的自然小卫士！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js Magical Life Stream ---
                let scene, camera, renderer, mammoth, dodo, cityBlocks;
                let particles;
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 50, 180);
                    camera.lookAt(0, 20, 0); // Center the view!

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // 1. Particle Cloud (Ancient Spirits)
                    const pCount = 5000;
                    const pGeo = new THREE.BufferGeometry();
                    const pPos = new Float32Array(pCount * 3);
                    const pColors = new Float32Array(pCount * 3);
                    for (let i = 0; i < pCount; i++) {
                        pPos[i * 3] = (Math.random() - 0.5) * 200;
                        pPos[i * 3 + 1] = Math.random() * 80;
                        pPos[i * 3 + 2] = (Math.random() - 0.5) * 200;
                        pColors[i * 3] = 0.5; pColors[i * 3 + 1] = 0.8; pColors[i * 3 + 2] = 1;
                    }
                    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
                    pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
                    const pMat = new THREE.PointsMaterial({ size: 1.5, vertexColors: true, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
                    particles = new THREE.Points(pGeo, pMat);
                    scene.add(particles);

                    // 2. The Mammoth (Low-poly abstract)
                    mammoth = new THREE.Group();
                    const body = new THREE.Mesh(new THREE.CapsuleGeometry(10, 15, 4, 16), new THREE.MeshStandardMaterial({ color: 0x4b3621, wireframe: true }));
                    body.rotation.z = Math.PI / 2;
                    mammoth.add(body);
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1, 2, 12), new THREE.MeshStandardMaterial({ color: 0x4b3621, wireframe: true }));
                    trunk.position.set(12, 0, 0);
                    trunk.rotation.z = Math.PI / 3;
                    mammoth.add(trunk);
                    mammoth.position.y = 15;
                    mammoth.visible = false;
                    scene.add(mammoth);

                    // 3. Modern City "Blocks"
                    cityBlocks = new THREE.Group();
                    for (let i = 0; i < 15; i++) {
                        const block = new THREE.Mesh(new THREE.BoxGeometry(20, Math.random() * 40 + 20, 20), new THREE.MeshStandardMaterial({ color: 0x1e293b, transparent: true, opacity: 0.3 }));
                        block.position.set((Math.random() - 0.5) * 150, 0, (Math.random() - 0.5) * 150);
                        cityBlocks.add(block);
                    }
                    scene.add(cityBlocks);
                    cityBlocks.visible = false;

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
                    const light = new THREE.PointLight(0x10b981, 2, 400);
                    light.position.set(20, 100, 50);
                    scene.add(light);

                    animate();
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();

                    if (particles) {
                        particles.rotation.y += 0.001;
                        const pos = particles.geometry.attributes.position.array;
                        for (let i = 0; i < pos.length / 3; i++) {
                            pos[i * 3 + 1] += Math.sin(t + i) * 0.1;
                        }
                        particles.geometry.attributes.position.needsUpdate = true;
                    }

                    if (mammoth.visible) {
                        mammoth.rotation.y = Math.sin(t * 0.5) * 0.2;
                        mammoth.position.y = 15 + Math.sin(t * 2) * 2;
                    }

                    renderer.render(scene, camera);
                };

                const revivePulse = () => {
                    energyLevel.value = Math.min(100, energyLevel.value + 34);
                    gsap.to(camera.position, { z: camera.position.z - 5, duration: 0.2, yoyo: true, repeat: 1 });

                    if (energyLevel.value >= 100) {
                        mammoth.visible = true;
                        mammoth.children.forEach(c => {
                            gsap.to(c.material, { wireframe: false, duration: 2 });
                        });
                        cityBlocks.visible = true;
                        gsap.to(camera.position, { y: 100, z: 250, duration: 5, onUpdate: () => camera.lookAt(0, 20, 0) });
                        gsap.to(cityBlocks.scale, { y: 1.2, duration: 5, repeat: -1, yoyo: true });
                    }
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                    if (n >= 4) { energyLevel.value = 100; mammoth.visible = true; cityBlocks.visible = true; }
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, scale: 0.9, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 2, ease: "expo.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, ease: "expo.out" }, "-=1.5");

                    if (newVal === 4) {
                        gsap.to(camera.position, { z: 200, y: 80, duration: 4, ease: "power2.inOut" });
                    }
                    if (newVal === 5) {
                        gsap.to(mammoth.scale, { x: 0.1, y: 0.1, z: 0.1, duration: 2 });
                        gsap.to(cityBlocks.scale, { y: 0.1, duration: 2 });
                    }
                });

                onMounted(() => {
                    initThree();

                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 1 });

                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, energyLevel, stages, currentStageData,
                    nextStage, goToStage, resetSimulation, revivePulse
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
