<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能看到声音多有意思</title>
    <!-- 依赖库，包含 fallback -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script>(function () { var g = "tailwind", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script>(function () { var g = "Vue", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script>(function () { var g = "gsap", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>(function () { var g = "THREE", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --sonic-glow: #22d3ee;
            --deep-space: #0f172a;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--deep-space);
            font-family: 'Noto Sans SC', sans-serif;
            color: #fff;
        }

        #stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-overlay {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3.5rem;
            pointer-events: none;
        }

        .ptr-auto {
            pointer-events: auto;
        }

        .header {
            text-align: center;
            opacity: 0;
            transform: translateY(-30px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4rem;
            background: linear-gradient(135deg, #fff, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .parent-hint {
            background: rgba(34, 211, 238, 0.1);
            backdrop-filter: blur(15px);
            padding: 0.6rem 2.5rem;
            border-radius: 4rem;
            border: 1px solid rgba(34, 211, 238, 0.3);
            font-size: 1.1rem;
            color: #22d3ee;
            display: inline-block;
        }

        .content-box {
            max-width: 800px;
            margin: 0 auto 15rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
        }

        .description {
            font-size: 1.6rem;
            line-height: 2;
            margin-bottom: 2.5rem;
            text-shadow: 0 4px 15px #000;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1.2rem 4rem;
            border-radius: 5rem;
            color: #fff;
            font-weight: bold;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.4s;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .action-btn:hover {
            transform: scale(1.1);
            background: rgba(34, 211, 238, 0.2);
            border-color: #22d3ee;
        }

        /* 交互面板 */
        .sonic-panel {
            position: fixed;
            bottom: 4rem;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 480px;
            pointer-events: auto;
            z-index: 100;
            text-align: center;
        }

        .frequency-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #334155;
            border-radius: 3px;
            outline: none;
            margin: 1.5rem 0;
        }

        .frequency-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #22d3ee;
            cursor: pointer;
            border: 4px solid #fff;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.6);
        }

        .nav-progress {
            position: fixed;
            right: 2.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            pointer-events: auto;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: 0.3s;
        }

        .dot.active {
            background: #22d3ee;
            border-color: #22d3ee;
            transform: scale(1.4);
        }

        .ripple-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0.5;
            color: #22d3ee;
            font-size: 1.2rem;
        }
    </style>
</head>

<body>
    <div id="stage"></div>

    <div id="app" class="ui-overlay">
        <div class="header" ref="header">
            <h1 class="main-title">{{ current.title }}</h1>
            <div class="parent-hint">🎵 {{ current.parentWords }}</div>
        </div>

        <div class="content-box" ref="content">
            <p class="description">{{ current.description }}</p>
            <div class="flex justify-center ptr-auto">
                <button v-if="step !== 3 && step < 5" @click="next" class="action-btn">继续探索</button>
                <button v-if="step === 5" @click="reset" class="action-btn">聆听无声之韵</button>
            </div>
        </div>

        <!-- S3 核心交互 -->
        <div v-if="step === 3" class="sonic-panel">
            <div class="text-cyan-400 font-bold mb-2">声波显微镜交互台</div>
            <div class="text-[10px] text-gray-400 mb-6">点击屏幕任意位置来激发布里渊波</div>

            <div class="flex flex-col items-center">
                <div class="flex justify-between w-full text-[10px] text-cyan-200">
                    <span>低音 (悠远) 🔅</span>
                    <span>高音 (急促) 🔆</span>
                </div>
                <input type="range" v-model="pitch" min="0.5" max="3" step="0.1" class="frequency-slider">
                <div class="mt-4 flex gap-4">
                    <button @click="clearWaves" class="action-btn !py-1 !px-4 !text-xs">清空波纹</button>
                    <button v-if="waveCount > 5" @click="next"
                        class="action-btn !py-1 !px-6 !text-xs !bg-cyan-700">理解振动</button>
                </div>
            </div>
        </div>

        <div class="nav-progress">
            <div v-for="n in 5" :key="n" :class="['dot', { active: step === n }]" @click="jump(n)"></div>
        </div>

        <div v-if="step === 3 && waveCount === 0" class="ripple-guide">🤏 点击屏幕这里试试</div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const pitch = ref(1.0);
                const waveCount = ref(0);

                const stages = [
                    {
                        title: "无影无踪的信使",
                        parentWords: "宝贝，闭上眼睛。你能听到妈妈说话，却看不见这些声音是怎么飞到你耳朵里的，对不对？",
                        description: "声波就像顽皮的小精灵，在大气层中跳着隐形的舞蹈。它们极其迅速地在空气分子间跳跃，传递着万物的讯息。"
                    },
                    {
                        title: "假如空气会发光",
                        parentWords: "如果我们能给空气涂上荧光粉，你会发现当你拍手时，周围会泛起一圈圈绚丽的波纹。",
                        description: "声音本质上是振动。当鼓面跳动，它会挤压周围的空气，产生疏密相间的涟漪。整个空气海洋其实一直在波涛汹涌。"
                    },
                    {
                        title: "声波的可视化",
                        parentWords: "来！用你的手指轻点空气。调整滑块改变它的调子，看看在这个多彩的视角下，声音是如何扩散的？",
                        description: "你会发现，高亢的尖叫声，波纹总是密密麻麻的；沉闷的脚步声，波纹则宽大有力。这就是声音的阶梯，频率的魔法。"
                    },
                    {
                        title: "空气的物理回响",
                        parentWords: "你看！这些波纹在撞到墙壁时会弹回来，那就是回声。如果没有空气分子的碰撞，我们的世界将陷入永恒的死寂。",
                        description: "声音的传播需要‘梯子’。在真空的太空中，任凭礼花齐放也不会有任何声响。是空气这层介质，记录并转述了这个世界的旋律。"
                    },
                    {
                        title: "万物的节拍",
                        parentWords: "虽然我们看不见声音，但我们的心脏、呼吸、甚至是星星的旋转都有它们的节拍。感受这份共鸣吧。",
                        description: "了解振动，我们就了解了世界的语言。每一个美妙的乐章，都是由无数微小的波动交织而成的。故事讲完了，晚安。"
                    }
                ];

                const current = computed(() => stages[step.value - 1]);

                // --- Three.js Implementation ---
                let scene, camera, renderer, ripples = [];
                let mouse = new THREE.Vector2(), raycaster = new THREE.Raycaster();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 50, 100);
                    camera.lookAt(0, 0, 0);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    document.getElementById('stage').appendChild(renderer.domElement);

                    // Grid helper to represent air medium
                    const grid = new THREE.GridHelper(200, 40, 0x1e293b, 0x1e293b);
                    scene.add(grid);

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.3));
                    const sun = new THREE.PointLight(0x22d3ee, 1, 300);
                    sun.position.set(0, 50, 0);
                    scene.add(sun);

                    window.addEventListener('mousedown', (e) => {
                        if (step.value === 3) createWave(e);
                    });

                    animate();
                };

                const createWave = (e) => {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);

                    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
                    const intersect = new THREE.Vector3();
                    raycaster.ray.intersectPlane(plane, intersect);

                    const tubeGeo = new THREE.TorusGeometry(1, 0.2, 8, 50);
                    const tubeMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.8 });
                    const ripple = new THREE.Mesh(tubeGeo, tubeMat);
                    ripple.rotation.x = Math.PI / 2;
                    ripple.position.copy(intersect);
                    ripple.userData = {
                        scale: 1,
                        opacity: 0.8,
                        speed: 0.5 * (1 / pitch.value)
                    };

                    scene.add(ripple);
                    ripples.push(ripple);
                    waveCount.value++;
                };

                const animate = () => {
                    requestAnimationFrame(animate);

                    ripples.forEach((r, idx) => {
                        r.userData.scale += r.userData.speed;
                        r.scale.set(r.userData.scale, r.userData.scale, 1);
                        r.userData.opacity -= 0.008;
                        r.material.opacity = r.userData.opacity;

                        if (r.userData.opacity <= 0) {
                            scene.remove(r);
                            ripples.splice(idx, 1);
                        }
                    });

                    // Background pulsing
                    if (ripples.length > 0) {
                        scene.background = new THREE.Color(0x0f172a).lerp(new THREE.Color(0x1e3a8a), 0.1);
                    } else {
                        scene.background = new THREE.Color(0x0f172a);
                    }

                    renderer.render(scene, camera);
                };

                // Methods
                const next = () => { if (step.value < 5) step.value++; };
                const jump = (n) => { step.value = n; };
                const reset = () => { step.value = 1; clearWaves(); };
                const clearWaves = () => {
                    ripples.forEach(r => scene.remove(r));
                    ripples = [];
                    waveCount.value = 0;
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.header', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 1 });
                    gsap.fromTo('.content-box', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1, delay: 0.3 });
                    window.eduNestRuntime?.dispatchLearningEvent('stage_change', { stageIndex: newVal, totalStages: 5 });
                });

                onMounted(() => {
                    initThree();
                    gsap.to('.header', { opacity: 1, y: 0, duration: 1.5, delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 1.5, delay: 1 });

                    window.__eduNestUIStateProvider = () => ({
                        stageIndex: step.value, totalStages: 5, currentStage: stages[step.value - 1].title
                    });
                });

                return { step, current, pitch, waveCount, next, jump, reset, clearWaves };
            }
        }).mount('#app');
    </script>
</body>

</html>
