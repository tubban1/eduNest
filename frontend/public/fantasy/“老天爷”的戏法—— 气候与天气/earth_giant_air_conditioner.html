    <title>怎么不给地球装一个大空调</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

        * {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000408;
            font-family: 'PingFang SC', sans-serif;
            color: #fff;
        }

        #main-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 标准化 UI 布局 */
        .ui-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .top-title-box {
            padding: 20px;
            text-align: center;
        }

        .main-title {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 3rem;
            background: linear-gradient(to right, #60A5FA, #34D399, #F87171);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.3));
            margin-bottom: 10px;
        }

        .parent-words-box {
            background: rgba(15, 23, 42, 0.6);
            display: inline-block;
            padding: 6px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #d1d5db;
            font-style: italic;
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }

        /* 沉浸式文字层：居中平衡 */
        .story-text-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding-bottom: 150px;
            /* 为底部按钮留出视觉平衡空间 */
        }

        .stage-content {
            font-size: 1.6rem;
            line-height: 1.6;
            color: #f1f5f9;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
        }

        /* 底部 HUD 交互中心 */
        .bottom-hud {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .btn-action {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: #fff;
            padding: 12px 40px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
        }

        .btn-action:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.6);
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        /* 特有组件：空调控制器 */
        .ac-controller {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(25px);
            padding: 1.5rem 2rem;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 320px;
            text-align: center;
        }

        .thermostat-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.2rem;
            color: #38BDF8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            margin-bottom: 0.5rem;
        }

        .ac-slider {
            width: 100%;
            appearance: none;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #3B82F6, #F87171);
            outline: none;
            margin: 1rem 0;
        }

        .ac-slider::-webkit-slider-thumb {
            appearance: none;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: all 0.6s ease;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
            transform: translateY(20px);
            filter: blur(5px);
        }

        /* 导航进度点 */
        .nav-progress {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 20;
        }

        .nav-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-dot.active {
            background: #38bdf8;
            box-shadow: 0 0 10px #38bdf8;
            transform: scale(1.3);
        }
    </style>
</head>

<body>
    <div id="main-canvas"></div>

    <div id="app" class="ui-overlay">
        <!-- 顶部：标题与家长引导 -->
        <div class="top-title-box">
            <transition name="fade" mode="out-in">
                <h1 :key="step" class="main-title">[[ stages[step-1].title ]]</h1>
            </transition>
            <transition name="fade" mode="out-in">
                <div :key="step" class="parent-words-box">
                    🕹️ [[ stages[step-1].parentWords ]]
                </div>
            </transition>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-progress pointer-events-auto">
            <div v-for="n in stages.length" :key="n" :class="['nav-dot', { active: step === n }]" @click="jumpTo(n)">
            </div>
        </div>

        <!-- 沉浸式文字层 -->
        <div class="story-text-container">
            <transition name="fade" mode="out-in">
                <div :key="step">
                    <p class="stage-content" v-html="stages[step-1].description"></p>
                </div>
            </transition>
        </div>

        <!-- 底部交互中心 -->
        <div class="bottom-hud">
            <!-- 第三阶段：空调调节器 -->
            <transition name="fade">
                <div v-if="step === 3" class="ac-controller pointer-events-auto">
                    <div class="thermostat-display">[[ targetTemp.toFixed(1) ]]°C</div>
                    <input type="range" v-model.number="targetTemp" min="0" max="50" step="0.5" class="ac-slider">
                    <div class="text-xs text-sky-300 opacity-60">滑动滑块，寻找完美的 25.0°C</div>
                </div>
            </transition>

            <div class="action-area pointer-events-auto">
                <button v-if="step < stages.length && step !== 3" @click="nextStep" class="btn-action">
                    [[ step === 2 ? '启动安装计划' : '继续探索' ]]
                </button>
                <button v-else-if="step === 3" @click="nextStep" class="btn-action"
                    :disabled="Math.abs(targetTemp - 25) > 1"
                    :style="{ opacity: Math.abs(targetTemp - 25) <= 1 ? 1 : 0.4 }">
                    设定温度并启动
                </button>
                <button v-else-if="step === stages.length" @click="reset" class="btn-action">重新认识自然 🌿</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, watch } = Vue;

        createApp({
            delimiters: ['[[', ']]'],
            setup() {
                const step = ref(1);
                const targetTemp = ref(15);
                const stages = [
                    {
                        title: "地球的‘发烧’与‘受凉’",
                        parentWords: "宝贝，你看现在的地球，中间红通通的是赤道，两端白花花的是南北极。热的热，冷的冷。",
                        description: "由于太阳斜着晒，地球接收到的热量完全不一样。这种自然的不平衡，正是风和洋流源源不断的动力来源。"
                    },
                    {
                        title: "超级空调狂想曲",
                        parentWords: "想象一下，我们能在太空装几个巨大的风扇，就像家里空调的出风口一样对着地球吹。",
                        description: "如果我们要把全地球都调到宜人的 25.0°C。热的地方吹冷气，冷的地方吹暖气，听起来是不是很完美？"
                    },
                    {
                        title: "安装‘巨型外机’",
                        parentWords: "来，握住遥控器！滑动下方的滑块，试着把那个冷热不均的地球调成温柔的绿色吧。",
                        description: "当你接近 25 度，地球表面的极端色调就会慢慢消失。那些巨大的风扇正在全力工作，强行拉平星球的温度。"
                    },
                    {
                        title: "罢工的季风",
                        parentWords: "看！由于没有冷热不均，风停了。要是真的装了空调，地球的气候循环就会彻底断开呢。",
                        description: "我们发现了一个深奥的秘密：当温度变得完美统一，地球大气的‘传送带’也随之断裂。没有温差，就没有了生机盎然的呼吸。"
                    },
                    {
                        title: "大自然的‘智能’系统",
                        parentWords: "其实，森林和海洋就是地球自带的空调组件。它们不需要电费，只要我们小心呵护就能工作得很好。",
                        description: "自然的力量在于差异与循环。保护好我们的森林和水源，就是给地球维护最完美的空气调节系统。晚安，未来的地球管家。"
                    }
                ];

                // --- Three.js ---
                let scene, camera, renderer, globe, fans = [], globeShader;
                const clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.z = 220;

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    document.getElementById('main-canvas').appendChild(renderer.domElement);

                    // Stars
                    const starGeo = new THREE.BufferGeometry();
                    const starPos = [];
                    for (let i = 0; i < 3000; i++) {
                        starPos.push((Math.random() - 0.5) * 1000, (Math.random() - 0.5) * 1000, (Math.random() - 0.5) * 1000);
                    }
                    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
                    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 })));

                    // Globe
                    const globeGeo = new THREE.SphereGeometry(80, 64, 64);
                    globeShader = {
                        uniforms: {
                            targetTemp: { value: 15 },
                            influence: { value: 0 }
                        },
                        vertexShader: `
                            varying vec2 vUv;
                            varying vec3 vNormal;
                            void main() {
                                vUv = uv;
                                vNormal = normalize(normalMatrix * normal);
                                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                            }
                        `,
                        fragmentShader: `
                            varying vec2 vUv;
                            varying vec3 vNormal;
                            uniform float targetTemp;
                            uniform float influence;
                            void main() {
                                float lat = abs(vUv.y - 0.5) * 2.0;
                                vec3 nature = mix(vec3(0.9, 0.2, 0.1), vec3(0.1, 0.4, 0.9), lat);
                                float tNorm = clamp(targetTemp / 50.0, 0.0, 1.0);
                                vec3 ac = mix(vec3(0.1, 0.6, 1.0), vec3(0.1, 0.9, 0.4), tNorm);
                                if(targetTemp > 30.0) ac = mix(ac, vec3(1.0, 0.4, 0.0), (targetTemp - 30.0)/20.0);
                                vec3 finalColor = mix(nature, ac, influence);
                                float light = max(0.2, dot(vNormal, vec3(1,1,1)));
                                gl_FragColor = vec4(finalColor * light, 1.0);
                            }
                        `
                    };
                    globe = new THREE.Mesh(globeGeo, new THREE.ShaderMaterial(globeShader));
                    scene.add(globe);

                    // Fans
                    for (let i = 0; i < 3; i++) {
                        const fan = createFan();
                        const angle = (i / 3) * Math.PI * 2;
                        fan.position.set(Math.cos(angle) * 110, Math.sin(angle) * 110, 0);
                        fan.visible = false;
                        fans.push(fan);
                        scene.add(fan);
                    }

                    animate();
                };

                const createFan = () => {
                    const group = new THREE.Group();
                    const hub = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 8), new THREE.MeshBasicMaterial({ color: 0x64748b }));
                    hub.rotation.x = Math.PI / 2;
                    group.add(hub);
                    for (let i = 0; i < 3; i++) {
                        const blade = new THREE.Mesh(new THREE.BoxGeometry(30, 8, 1), new THREE.MeshBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.6 }));
                        blade.position.x = 18;
                        const bladePivot = new THREE.Group();
                        bladePivot.add(blade);
                        bladePivot.rotation.z = (i / 3) * Math.PI * 2;
                        group.add(bladePivot);
                    }
                    return group;
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();
                    if (globe) globe.rotation.y += 0.003;
                    fans.forEach(f => {
                        f.rotation.z += 0.05;
                        f.children.forEach(c => { if (c.rotation) c.rotation.z += 0.1; });
                    });
                    if (globeShader) {
                        globeShader.uniforms.targetTemp.value = targetTemp.value;
                        const targetInf = (step.value === 3 || step.value === 4) ? 0.9 : (step.value === 5 ? 0.0 : 0.0); // Reset at end
                        globeShader.uniforms.influence.value = THREE.MathUtils.lerp(globeShader.uniforms.influence.value, targetInf, 0.05);
                    }
                    renderer.render(scene, camera);
                };

                const nextStep = () => { if (step.value < stages.length) step.value++; };
                const jumpTo = (n) => { step.value = n; };
                const reset = () => { step.value = 1; targetTemp.value = 15; fans.forEach(f => f.visible = false); };

                watch(step, (val) => {
                    fans.forEach(f => f.visible = (val === 3 || val === 4));
                    window.eduNestRuntime?.dispatchLearningEvent('stage_change', { stageIndex: val, totalStages: stages.length });
                });

                onMounted(() => {
                    initThree();
                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });
                    window.__eduNestUIStateProvider = () => ({
                        stageIndex: step.value,
                        totalStages: stages.length,
                        currentStage: stages[step.value - 1].title
                    });
                });

                return { step, stages, targetTemp, nextStep, jumpTo, reset };
            }
        }).mount('#app');
    </script>
</body>

</html>
