<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怎么不给地球装一个大空调</title>
    <!-- 依赖库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 依赖库，包含 fallback -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script>(function () { var g = "Vue", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script>(function () { var g = "gsap", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>(function () { var g = "THREE", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000408;
            font-family: 'Noto Sans SC', sans-serif;
            color: #fff;
        }

        #canvas-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3.5rem;
            pointer-events: none;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .title-area {
            text-align: center;
            opacity: 0;
            transform: translateY(-30px);
        }

        .hero-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 3.8rem;
            background: linear-gradient(to right, #60A5FA, #34D399, #F87171);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .guide-box {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 0.6rem 2.5rem;
            border-radius: 4rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 1.1rem;
        }

        .content-area {
            max-width: 800px;
            margin: 0 auto 15rem auto;
            /* 避让底部的调节器面板 */
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
        }

        .main-desc {
            font-size: 1.5rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
            font-weight: 300;
        }

        .primary-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 1rem 3rem;
            border-radius: 4rem;
            font-size: 1.25rem;
            color: #fff;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .primary-btn:hover {
            transform: scale(1.05) translateY(-3px);
            background: rgba(255, 255, 255, 0.2);
            border-color: #60A5FA;
        }

        .ac-controller {
            position: fixed;
            bottom: 4rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(25px);
            padding: 2rem;
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: auto;
            z-index: 50;
        }

        .thermostat-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.5rem;
            color: #38BDF8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            margin-bottom: 1rem;
            text-align: center;
        }

        .ac-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 10px;
            border-radius: 5px;
            background: linear-gradient(to right, #3B82F6, #F87171);
            outline: none;
            margin-bottom: 1rem;
        }

        .ac-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 30px;
            height: 30px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .ac-badges {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .ac-badge {
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.1);
            color: #94A3B8;
        }

        .ac-badge.active {
            background: #3B82F6;
            color: #fff;
        }
    </style>
</head>

<body>
    <div id="canvas-ui"></div>

    <div id="app" class="overlay">
        <div class="title-area">
            <h1 class="hero-title">{{ stages[step-1].title }}</h1>
            <div class="guide-box">
                🕹️ {{ stages[step-1].parentWords }}
            </div>
        </div>

        <div class="content-area">
            <p class="main-desc">{{ stages[step-1].description }}</p>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < 5 && step !== 3" @click="nextStep" class="primary-btn">
                    {{ step === 2 ? '启动安装计划' : '继续探索' }}
                </button>
                <button v-else-if="step === 5" @click="reset" class="primary-btn">回归自然平衡</button>
            </div>
        </div>

        <!-- 只有在第三步显示空调控制器 -->
        <div v-if="step === 3" class="ac-controller pointer-events-auto">
            <div class="thermostat-display">{{ targetTemp.toFixed(1) }}°C</div>
            <input type="range" v-model.number="targetTemp" min="0" max="50" step="0.5" class="ac-slider">
            <div class="ac-badges">
                <span :class="['ac-badge', { active: targetTemp < 20 }]">制冷模式</span>
                <span :class="['ac-badge', { active: targetTemp >= 20 && targetTemp <= 30 }]">恒温模式</span>
                <span :class="['ac-badge', { active: targetTemp > 30 }]">强热模式</span>
            </div>
            <div class="flex justify-center mt-6">
                <button @click="nextStep" class="primary-btn !text-sm !py-2 !px-8"
                    :style="{ opacity: targetTemp === 25 ? 1 : 0.6 }">
                    完成设定
                </button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const targetTemp = ref(15);
                const stages = [
                    {
                        title: "地球的‘发烧’与‘受凉’",
                        parentWords: "宝贝，你看现在的地球，中间红通通的是赤道，两端白花花的是南北极。热的热，冷的冷。",
                        description: "由于太阳斜着晒，地球接收到的热量完全不一样。这种自然的不平衡，正是风和洋流源源不断的动力来源。"
                    },
                    {
                        title: "超级空调狂想曲",
                        parentWords: "想象一下，我们能在太空装几个巨大的长风扇，就像家里空调的出风口一样对着地球吹。",
                        description: "要把地球调到宜人的 25.0°C。热的地方吹冷气，冷的地方吹暖气，听起来是不是很棒？"
                    },
                    {
                        title: "安装‘巨型外机’",
                        parentWords: "来，握住遥控器！滑动滑块，试着把那个蓝色的地球调成温柔的绿色。",
                        description: "当你接近 25 度，你会发现地球表面的极端色调消失了。那些巨大的风扇正在全力工作，改变星球的热量分布。"
                    },
                    {
                        title: "罢工的季风",
                        parentWords: "看！风停了。因为没有冷热不均，空气懒得动了。要是真的装了空调，地球的降雨也会混乱呢。",
                        description: "我们发现了一个矛盾：当温度变得完美统一，地球大气的‘传送带’也随之断裂。没有温差，也就没有了循环呼吸。"
                    },
                    {
                        title: "大自然的‘智能’调节",
                        parentWords: "故事讲完啦。其实，森林和海洋就是地球自带的空调，虽然不常显示数字，但它们比机器更懂平衡。",
                        description: "自然的力量在于差异与循环。保护好我们的森林和海洋，就是给地球维护最好的空调系统。晚安。"
                    }
                ];

                // --- Three.js Implementation ---
                let scene, camera, renderer, globe, fans = [], globeShader;
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.z = 220;

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    document.getElementById('canvas-ui').appendChild(renderer.domElement);

                    // Stars
                    const starGeo = new THREE.BufferGeometry();
                    const starPos = [];
                    for (let i = 0; i < 3000; i++) {
                        starPos.push((Math.random() - 0.5) * 1000, (Math.random() - 0.5) * 1000, (Math.random() - 0.5) * 1000);
                    }
                    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
                    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 })));

                    // Globe
                    const globeGeo = new THREE.SphereGeometry(80, 64, 64);
                    globeShader = {
                        uniforms: {
                            targetTemp: { value: 15 }, // Current real global consistency
                            influence: { value: 0 }    // 0 to 1
                        },
                        vertexShader: `
                            varying vec2 vUv;
                            varying vec3 vNormal;
                            void main() {
                                vUv = uv;
                                vNormal = normalize(normalMatrix * normal);
                                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                            }
                        `,
                        fragmentShader: `
                            varying vec2 vUv;
                            varying vec3 vNormal;
                            uniform float targetTemp;
                            uniform float influence;
                            
                            void main() {
                                float lat = abs(vUv.y - 0.5) * 2.0;
                                // Nature: Hot(red) at 0, Cold(blue) at 1
                                vec3 nature = mix(vec3(0.9, 0.2, 0.1), vec3(0.1, 0.4, 0.9), lat);
                                
                                // AC Target (25C is green/safe)
                                float tNorm = clamp(targetTemp / 50.0, 0.0, 1.0);
                                vec3 ac = mix(vec3(0.0, 0.8, 1.0), vec3(1.0, 0.6, 0.0), tNorm);
                                
                                vec3 finalColor = mix(nature, ac, influence);
                                
                                float light = max(0.2, dot(vNormal, vec3(1,1,1)));
                                gl_FragColor = vec4(finalColor * light, 1.0);
                            }
                        `
                    };
                    globe = new THREE.Mesh(globeGeo, new THREE.ShaderMaterial(globeShader));
                    scene.add(globe);

                    // AC Fans (3 markers)
                    for (let i = 0; i < 3; i++) {
                        const fan = createFan();
                        const phi = (i / 3) * Math.PI * 2;
                        fan.position.set(Math.cos(phi) * 120, Math.sin(phi) * 120, 0);
                        fan.visible = false;
                        fans.push(fan);
                        scene.add(fan);
                    }

                    animate();
                };

                const createFan = () => {
                    const group = new THREE.Group();
                    const hub = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 10), new THREE.MeshBasicMaterial({ color: 0xcccccc }));
                    hub.rotation.x = Math.PI / 2;
                    group.add(hub);
                    for (let i = 0; i < 4; i++) {
                        const blade = new THREE.Mesh(new THREE.BoxGeometry(40, 10, 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 }));
                        blade.rotation.z = (i / 4) * Math.PI * 2;
                        blade.position.x = 25;
                        const bladePivot = new THREE.Group();
                        bladePivot.add(blade);
                        bladePivot.rotation.z = (i / 4) * Math.PI * 2;
                        group.add(blade);
                    }
                    return group;
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();

                    if (globe) globe.rotation.y += 0.003;

                    fans.forEach((f, idx) => {
                        f.rotation.z += 0.1;
                        f.children.forEach(b => b.rotation.z += 0.05); // simple spin
                    });

                    if (globeShader) {
                        // Smoothly approach targetTemp
                        globeShader.uniforms.targetTemp.value = targetTemp.value;
                        const inf = (step.value === 3 || step.value === 4) ? 0.9 : (step.value >= 5 ? 1.0 : 0.0);
                        globeShader.uniforms.influence.value = THREE.MathUtils.lerp(globeShader.unforms?.influence?.value || 0, inf, 0.05);
                    }

                    renderer.render(scene, camera);
                };

                const next = () => {
                    if (step.value < 5) {
                        step.value++;
                    }
                };

                const reset = () => {
                    step.value = 1;
                    targetTemp.value = 15;
                    fans.forEach(f => f.visible = false);
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.title-area', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 1 });
                    gsap.fromTo('.content-area', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1, delay: 0.3 });
                    if (newVal === 3) fans.forEach(f => f.visible = true);
                    if (newVal === 4) targetTemp.value = 25.0; // Perfect AC
                    window.eduNestRuntime?.dispatchLearningEvent('stage_change', { stageIndex: newVal, totalStages: 5 });
                });

                onMounted(() => {
                    initThree();
                    gsap.fromTo('.title-area', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 1.5, delay: 0.5 });
                    gsap.fromTo('.content-area', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1.5, delay: 0.8 });

                    window.addEventListener('mousemove', (e) => {
                        const x = (e.clientX / window.innerWidth - 0.5) * 2;
                        const y = (e.clientY / window.innerHeight - 0.5) * 2;
                        gsap.to(camera.position, { x: x * 20, y: -y * 20, duration: 2 });
                        camera.lookAt(0, 0, 0);
                        gsap.to('.overlay', { x: -x * 10, y: -y * 10, duration: 1.5 });
                    });

                    window.__eduNestUIStateProvider = () => ({
                        stageIndex: step.value,
                        totalStages: 5,
                        currentStage: stages[step.value - 1].title
                    });
                });

                return { step, stages, targetTemp, nextStep, reset };
            }
        }).mount('#app');
    </script>
</body>

</html>
