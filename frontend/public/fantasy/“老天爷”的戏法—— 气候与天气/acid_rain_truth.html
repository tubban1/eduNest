<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酸雨真的很酸吗</title>
    <!-- 依赖库，包含 fallback -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script>(function () { var g = "tailwind", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script>(function () { var g = "Vue", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script>(function () { var g = "gsap", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>(function () { var g = "THREE", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --acid-green: #8BC34A;
            --polluted-grey: #455A64;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #263238;
            font-family: 'Noto Sans SC', sans-serif;
            color: #fff;
        }

        #stage-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-panel {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3.5rem;
            pointer-events: none;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .header-section {
            text-align: center;
            opacity: 0;
            transform: translateY(-30px);
        }

        .story-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 3.8rem;
            background: linear-gradient(135deg, #FFEB3B, #8BC34A);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.8rem;
        }

        .parent-words {
            display: inline-block;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            padding: 0.6rem 2.8rem;
            border-radius: 4rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1.15rem;
            color: #ECEFF1;
        }

        .middle-content {
            max-width: 800px;
            margin: 0 auto 15rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
        }

        .desc-p {
            font-size: 1.45rem;
            line-height: 2.1;
            margin-bottom: 2.5rem;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            font-weight: 300;
        }

        .action-btn {
            background: rgba(139, 195, 74, 0.2);
            backdrop-filter: blur(10px);
            padding: 1.2rem 4rem;
            border-radius: 5rem;
            border: 1px solid rgba(139, 195, 74, 0.4);
            color: #fff;
            font-weight: bold;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .action-btn:hover {
            transform: scale(1.08) translateY(-5px);
            background: rgba(139, 195, 74, 0.35);
            border-color: #fff;
        }

        .hud-display {
            position: fixed;
            bottom: 4rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(38, 50, 56, 0.85);
            backdrop-filter: blur(25px);
            padding: 2rem;
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            z-index: 50;
        }

        .ph-meter {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.8rem;
            text-align: center;
            margin-bottom: 1rem;
            transition: color 0.5s;
        }

        .pollution-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 10px;
            border-radius: 5px;
            outline: none;
            margin: 1.5rem 0;
            background: linear-gradient(to right, #8BC34A, #FFEB3B, #F44336);
        }

        .pollution-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: 4px solid #455A64;
        }

        .side-nav {
            position: fixed;
            left: 2.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            pointer-events: auto;
        }

        .nav-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-dot.active {
            background: #8BC34A;
            border-color: #8BC34A;
            transform: scale(1.5);
            box-shadow: 0 0 15px #8BC34A;
        }
    </style>
</head>

<body>
    <div id="stage-canvas"></div>

    <div id="app" class="ui-panel">
        <div class="header-section">
            <h1 class="story-title">{{ stages[step-1].title }}</h1>
            <div class="parent-words">🧪 {{ stages[step-1].parentWords }}</div>
        </div>

        <div class="middle-content">
            <p class="desc-p">{{ stages[step-1].description }}</p>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < 5 && step !== 3" @click="next" class="action-btn">
                    {{ step === 2 ? '开启酸度实验室' : '继续了解守护地球' }}
                </button>
                <button v-else-if="step === 5" @click="reset" class="action-btn">还给地球清新空气</button>
            </div>
        </div>

        <div v-if="step === 3" class="hud-display">
            <div class="ph-meter" :style="{ color: phColor }">pH {{ currentPH.toFixed(1) }}</div>
            <div class="flex justify-between text-xs font-bold text-gray-400">
                <span>纯净雨水 (pH 5.6)</span>
                <span>强酸性雨 (pH 4.0)</span>
            </div>
            <input type="range" v-model="pollution" min="0" max="1" step="0.01"
                class="pollution-slider pointer-events-auto">
            <div class="flex justify-center mt-3">
                <button @click="next" class="action-btn !text-xs !py-2 !px-8"
                    :style="{ opacity: pollution > 0.8 ? 1 : 0.6 }">
                    观察环境受损细节
                </button>
            </div>
        </div>

        <div class="side-nav">
            <div v-for="n in 5" :key="n" :class="['nav-dot', { active: step === n }]" @click="jump(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const pollution = ref(0);

                const stages = [
                    {
                        title: "迷雾中的城市",
                        parentWords: "宝贝，你看那些工厂的大烟囱排出了灰蒙蒙的气体。它们其实带了一些坏脾气的硫和氮哦。",
                        description: "这些气体飞到天上，和云朵里的水宝宝成了‘坏朋友’。它们发生了一连串的化学反应，把原本纯净的雨给‘变质’了。"
                    },
                    {
                        title: "云层里的化学课",
                        parentWords: "变了质的雨水落下来，虽然看起来和普通的雨没两样，但它其实带了点酸味。你觉得它会伤害谁？",
                        description: "这就叫酸雨。它虽然不像醋那么酸，但却像一个‘慢性杀手’，正悄悄地溶化掉公园的雕塑，让绿色的森林变得焦黄。"
                    },
                    {
                        title: "酸度实验室",
                        parentWords: "来！滑动污染调节器。看看如果排出的气体变多，雨水的 pH 值（酸度）会怎么下降？",
                        description: "pH 值越低，代表酸性越强。当这个值降到 4.0 左右时，那些美丽的古建筑就会开始‘掉皮’，鱼儿在湖里也会觉得很不舒服。"
                    },
                    {
                        title: "无声的破坏者",
                        parentWords: "你看！这尊石像已经模糊了，树叶也在掉落。这就是酸雨对地球妈妈开的‘无声玩笑’。",
                        description: "我们发现了一个环保真相：污染是不分国界的。为了这一抹不该有的‘酸’，自然界付出了巨大的代价。我们要学会保护空气的纯净。"
                    },
                    {
                        title: "守护清新的天空",
                        parentWords: "故事讲完啦。只要我们少排一点废气，雨水就会重新变回甘露。让我们一起保护地球吧。晚安。",
                        description: "通过科学的减排，我们能让 pH 值慢慢回升到健康状态。每一个节能的小动作，都是在给雨滴‘洗澡’。愿你的梦里也有一片清新的天空。晚安。"
                    }
                ];

                const currentPH = computed(() => 5.6 - pollution.value * 1.6);
                const phColor = computed(() => {
                    const ph = currentPH.value;
                    if (ph > 5.0) return "#8BC34A";
                    if (ph > 4.5) return "#FFEB3B";
                    return "#F44336";
                });

                // --- Three.js Implementation ---
                let scene, camera, renderer, ground, statue, particles = [];
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 20, 150);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    document.getElementById('stage-canvas').appendChild(renderer.domElement);

                    // Add a simple "statue" (Octahedron for low-poly feel)
                    const sGeo = new THREE.OctahedronGeometry(30, 1);
                    const sMat = new THREE.MeshLambertMaterial({ color: 0xCFD8DC, flatShading: true });
                    statue = new THREE.Mesh(sGeo, sMat);
                    statue.position.set(0, 0, 0);
                    scene.add(statue);

                    // Ground
                    const gGeo = new THREE.PlaneGeometry(800, 800);
                    const gMat = new THREE.MeshLambertMaterial({ color: 0x37474F });
                    ground = new THREE.Mesh(gGeo, gMat);
                    ground.rotation.x = -Math.PI / 2;
                    ground.position.y = -40;
                    scene.add(ground);

                    // Lights
                    scene.add(new THREE.AmbientLight(0x455A64, 0.5));
                    const sun = new THREE.DirectionalLight(0xffffff, 1);
                    sun.position.set(50, 50, 50);
                    scene.add(sun);

                    // Rain Particles
                    const pCount = 800;
                    const pGeo = new THREE.BufferGeometry();
                    const pPos = new Float32Array(pCount * 3);
                    for (let i = 0; i < pCount; i++) {
                        pPos[i * 3] = (Math.random() - 0.5) * 300;
                        pPos[i * 3 + 1] = Math.random() * 200;
                        pPos[i * 3 + 2] = (Math.random() - 0.5) * 300;
                    }
                    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
                    const pMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1, transparent: true, opacity: 0.3 });
                    const rPart = new THREE.Points(pGeo, pMat);
                    scene.add(rPart);
                    particles.push(rPart);

                    animate();
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();

                    if (statue) {
                        statue.rotation.y += 0.005;
                        // Corrode effect: change color to brownish/grey as pollution grows
                        statue.material.color.lerp(new THREE.Color(0x9E9E9E), pollution.value * 0.02);
                        // Jitter or slightly scale down to simulate "melting"
                        const s = 1.0 - pollution.value * 0.1;
                        statue.scale.set(s, s, s);
                    }

                    if (particles[0]) {
                        const pos = particles[0].geometry.attributes.position;
                        for (let i = 0; i < pos.count; i++) {
                            let y = pos.getY(i);
                            y -= 8;
                            if (y < -40) y = 160;
                            pos.setY(i, y);
                        }
                        pos.needsUpdate = true;
                        // Change rain color slightly
                        particles[0].material.color.lerp(new THREE.Color(0x8BC34A), pollution.value * 0.05);
                    }

                    // Background color shift
                    scene.background = new THREE.Color().lerpColors(new THREE.Color(0x263238), new THREE.Color(0x1a2124), pollution.value);

                    renderer.render(scene, camera);
                };

                const next = () => {
                    if (step.value < 5) {
                        step.value++;
                        if (step.value === 4) gsap.to(pollution, { value: 1, duration: 2 });
                    }
                };
                const jump = (n) => {
                    step.value = n;
                    if (n < 3) pollution.value = 0;
                    if (n > 3) pollution.value = 1;
                };
                const reset = () => {
                    step.value = 1; pollution.value = 0;
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.header-section', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 1 });
                    gsap.fromTo('.middle-content', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1, delay: 0.3 });
                    window.eduNestRuntime?.dispatchLearningEvent('stage_change', { stageIndex: newVal, totalStages: 5 });
                });

                onMounted(() => {
                    initThree();
                    gsap.to('.header-section', { opacity: 1, y: 0, duration: 1.5, delay: 0.5 });
                    gsap.to('.middle-content', { opacity: 1, y: 0, duration: 1.5, delay: 1 });

                    window.addEventListener('mousemove', (e) => {
                        const x = (e.clientX / window.innerWidth - 0.5) * 2;
                        const y = (e.clientY / window.innerHeight - 0.5) * 2;
                        gsap.to(camera.rotation, { x: -y * 0.05, y: -x * 0.05, duration: 2 });
                    });

                    window.__eduNestUIStateProvider = () => ({
                        stageIndex: step.value, totalStages: 5, currentStage: stages[step.value - 1].title
                    });
                });

                return { step, stages, pollution, currentPH, phColor, next, jump, reset };
            }
        }).mount('#app');
    </script>
</body>

</html>
