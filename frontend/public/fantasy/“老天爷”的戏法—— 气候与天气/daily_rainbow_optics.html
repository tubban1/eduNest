<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天天能看到彩虹该多好</title>
    <!-- 依赖库，包含 fallback -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script>(function () { var g = "Vue", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script>(function () { var g = "gsap", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>(function () { var g = "THREE", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0ea5e9;
            font-family: 'Noto Sans SC', sans-serif;
            color: #fff;
        }

        #canvas-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3.5rem;
            pointer-events: none;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .header-unit {
            text-align: center;
            opacity: 0;
            transform: translateY(-30px);
        }

        .title-arc {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 3.8rem;
            background: linear-gradient(to right, #FF5252, #FFEB3B, #4CAF50, #2196F3, #9C27B0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.8rem;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4));
        }

        .guide-text {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 0.6rem 2.8rem;
            border-radius: 4rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 1.15rem;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .main-narrative {
            max-width: 800px;
            margin: 0 auto 15rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
        }

        .p-content {
            font-size: 1.5rem;
            line-height: 2;
            margin-bottom: 2.5rem;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            font-weight: 300;
        }

        .btn-rainbow {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1.2rem 4rem;
            border-radius: 5rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            font-weight: bold;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.5s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .btn-rainbow:hover {
            transform: scale(1.08) translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
            border-color: #FFEB3B;
        }

        .rainbow-control {
            position: fixed;
            bottom: 4rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            padding: 2.2rem;
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: auto;
            z-index: 50;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        .arc-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 10px;
            border-radius: 5px;
            outline: none;
            margin: 1.5rem 0;
            background: linear-gradient(to right, #f87171, #fbbf24, #34d399, #60a5fa, #a78bfa);
        }

        .arc-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: 4px solid #fff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        }

        .nav-list {
            position: fixed;
            right: 2.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            pointer-events: auto;
        }

        .progress-circle {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        .progress-circle.active {
            background: #FFEB3B;
            border-color: #FFEB3B;
            transform: scale(1.5);
            box-shadow: 0 0 15px #FFEB3B;
        }
    </style>
</head>

<body>
    <div id="canvas-ui"></div>

    <div id="app" class="ui-root">
        <div class="header-unit" ref="head">
            <h1 class="title-arc">{{ stages[step-1].title }}</h1>
            <div class="guide-text">🌈 {{ stages[step-1].parentWords }}</div>
        </div>

        <div class="main-narrative" ref="nar">
            <p class="p-content">{{ stages[step-1].description }}</p>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < 5 && step !== 3" @click="next" class="btn-rainbow">
                    {{ step === 2 ? '开启彩虹发生器' : '继续探索光学奥秘' }}
                </button>
                <button v-else-if="step === 5" @click="reset" class="btn-rainbow">珍惜美妙瞬时</button>
            </div>
        </div>

        <div v-if="step === 3" class="rainbow-control">
            <div class="flex justify-between text-xs font-bold text-blue-100 mb-2">
                <span>干燥晴空 ☀️</span>
                <span>七彩常伴 🌈</span>
            </div>
            <input type="range" v-model="humidity" min="0" max="1" step="0.01" class="arc-slider pointer-events-auto">
            <div class="flex justify-center mt-4">
                <button @click="next" class="btn-rainbow !text-sm !py-2 !px-8"
                    :style="{ opacity: humidity > 0.8 ? 1 : 0.6 }">
                    完成光学设定
                </button>
            </div>
        </div>

        <div class="nav-list">
            <div v-for="n in 5" :key="n" :class="['progress-circle', { active: step === n }]" @click="jump(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const humidity = ref(0);

                const stages = [
                    {
                        title: "雨后的礼物",
                        parentWords: "宝贝，你看天边那一抹彩虹，它可是阳光和雨滴一起玩出的魔术呀。",
                        description: "彩虹很害羞，只有在雨后初晴、阳光刚好照射在空气里的小水滴上时，才会折射出七彩的光芒。它的美，在于它的难得。"
                    },
                    {
                        title: "彩虹的‘黄金食谱’",
                        parentWords: "如果你希望能天天看到它，那代表空气里得一直有水雾，阳光也得一直以那个神奇的角度照着你。",
                        description: "这需要非常精准的几何关系：太阳在后，雨幕在前，而你的眼睛正好处于那个 42 度的汇聚点上。"
                    },
                    {
                        title: "搭建永久彩虹桥",
                        parentWords: "来，握住光线遥控器！滑动滑块，增加空气中的湿度，尝试让彩虹永远定格在天空中。",
                        description: "当你把湿度调高，你会发现彩虹变亮了，但周围的风景似乎也变得湿漉漉的。为了这一抹美，整个气候系统都在超负荷工作。"
                    },
                    {
                        title: "视线的交织",
                        parentWords: "你看！不管你往哪里跑，彩虹都跟着你跑。原来它并不是一座桥，而是光在逗你玩呢。",
                        description: "我们发现了一个光学真理：彩虹是一个随着观察者移动的位置。天天有彩虹意味着极高的湿度，这种环境并不适合大部分陆地生物居住。"
                    },
                    {
                        title: "稀缺的美感",
                        parentWords: "故事讲完啦。偶尔出现的彩虹才是最甜的。让我们珍惜每一刻稍纵即逝的美丽吧。",
                        description: "自然的智慧在于平衡。彩虹是雨后的点缀，是守得云开见月明的奖励。稀缺性赋予了它不朽的美感。晚安。"
                    }
                ];

                // --- Three.js Logic ---
                let scene, camera, renderer, rainbow, mist;
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 40, 150);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    document.getElementById('canvas-ui').appendChild(renderer.domElement);

                    // Sky Background
                    const skyGeo = new THREE.SphereGeometry(800, 32, 32);
                    const skyMat = new THREE.MeshBasicMaterial({ color: 0x0ea5e9, side: THREE.BackSide });
                    const sky = new THREE.Mesh(skyGeo, skyMat);
                    scene.add(sky);

                    // Rainbow Arc (Torus Geometry, but masked)
                    const arcGeo = new THREE.TorusGeometry(80, 5, 2, 64, Math.PI);
                    const arcMat = new THREE.ShaderMaterial({
                        uniforms: {
                            humidity: { value: 0 },
                            time: { value: 0 }
                        },
                        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                        fragmentShader: `
                            varying vec2 vUv;
                            uniform float humidity;
                            uniform float time;
                            void main() {
                                // Rainbow spectrum
                                vec3 c;
                                float h = vUv.y;
                                if(h < 0.14) c = vec3(1.0, 0.0, 0.0); // Red
                                else if(h < 0.28) c = vec3(1.0, 0.5, 0.0); // Orange
                                else if(h < 0.42) c = vec3(1.0, 0.9, 0.0); // Yellow
                                else if(h < 0.56) c = vec3(0.0, 1.0, 0.0); // Green
                                else if(h < 0.7) c = vec3(0.0, 0.5, 1.0); // Blue
                                else if(h < 0.84) c = vec3(0.0, 0.0, 1.0); // Deep Blue
                                else c = vec3(0.5, 0.0, 1.0); // Purple
                                
                                float alpha = humidity * 0.8 * (1.0 - abs(vUv.x - 0.5) * 2.0);
                                gl_FragColor = vec4(c, alpha);
                            }
                        `,
                        transparent: true, side: THREE.DoubleSide
                    });
                    rainbow = new THREE.Mesh(arcGeo, arcMat);
                    rainbow.rotation.x = -Math.PI / 10;
                    rainbow.position.y = -20;
                    scene.add(rainbow);

                    // Ground / Horizon
                    const gGeo = new THREE.PlaneGeometry(1000, 1000);
                    const gMat = new THREE.MeshBasicMaterial({ color: 0x86efac });
                    const ground = new THREE.Mesh(gGeo, gMat);
                    ground.rotation.x = -Math.PI / 2;
                    ground.position.y = -25;
                    scene.add(ground);

                    // Mist/Humidity particles
                    const pCount = 500;
                    const pGeo = new THREE.BufferGeometry();
                    const pPos = new Float32Array(pCount * 3);
                    for (let i = 0; i < pCount; i++) {
                        pPos[i * 3] = (Math.random() - 0.5) * 300;
                        pPos[i * 3 + 1] = Math.random() * 200;
                        pPos[i * 3 + 2] = (Math.random() - 0.5) * 300;
                    }
                    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
                    mist = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2, transparent: true, opacity: 0 }));
                    scene.add(mist);

                    animate();
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const dt = clock.getDelta();
                    const t = clock.getElapsedTime();

                    if (rainbow) {
                        rainbow.material.uniforms.humidity.value = THREE.MathUtils.lerp(rainbow.material.uniforms.humidity.value, humidity.value, 0.05);
                        rainbow.material.uniforms.time.value = t;
                        // Parallax effect: rainbow stays relatively "centered" based on camera
                        rainbow.position.x = camera.position.x * 0.5;
                    }

                    if (mist) {
                        mist.material.opacity = humidity.value * 0.3;
                        mist.rotation.y += 0.001;
                    }

                    renderer.render(scene, camera);
                };

                const next = () => {
                    if (step.value < 5) {
                        step.value++;
                        if (step.value === 4) gsap.to(humidity, { value: 1, duration: 2 });
                    }
                };
                const jump = (n) => {
                    step.value = n;
                    if (n < 3) humidity.value = 0;
                    if (n > 3) humidity.value = 1;
                };
                const reset = () => {
                    step.value = 1; humidity.value = 0;
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.header-unit', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 1 });
                    gsap.fromTo('.main-narrative', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1, delay: 0.3 });
                    if (newVal === 5) gsap.to(humidity, { value: 0, duration: 3 });
                    window.eduNestRuntime?.dispatchLearningEvent('stage_change', { stageIndex: newVal, totalStages: 5 });
                });

                onMounted(() => {
                    initThree();
                    gsap.to('.header-unit', { opacity: 1, y: 0, duration: 1.5, delay: 0.5 });
                    gsap.to('.main-narrative', { opacity: 1, y: 0, duration: 1.5, delay: 1 });

                    window.addEventListener('mousemove', (e) => {
                        const x = (e.clientX / window.innerWidth - 0.5) * 2;
                        const y = (e.clientY / window.innerHeight - 0.5) * 2;
                        gsap.to(camera.position, { x: x * 40, y: 40 - y * 20, duration: 2 });
                        camera.lookAt(0, 0, 0);
                    });

                    window.__eduNestUIStateProvider = () => ({
                        stageIndex: step.value, totalStages: 5, currentStage: stages[step.value - 1].title
                    });
                });

                return { step, stages, humidity, next, jump, reset };
            }
        }).mount('#app');
    </script>
</body>

</html>
