<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我怎么不是女孩（男孩）</title>
    <!-- ELITE DEPENDENCIES -->
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = { 'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js', 'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js', 'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js' };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-pink: #ff69b4;
            --accent-blue: #4facfe;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #8e2de2, #4facfe);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(79, 172, 254, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #A5F3FC;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 18rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-blue);
            box-shadow: 0 0 30px rgba(79, 172, 254, 0.3);
        }

        .lottery-panel {
            position: fixed;
            bottom: 6rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2rem;
            pointer-events: auto;
            z-index: 20;
        }

        .lottery-item {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 1.5rem 2.5rem;
            border-radius: 2rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.4s;
            text-align: center;
        }

        .lottery-item.active-pink {
            border-color: var(--accent-pink);
            background: rgba(255, 105, 180, 0.2);
        }

        .lottery-item.active-blue {
            border-color: var(--accent-blue);
            background: rgba(79, 172, 254, 0.2);
        }

        .discovery-tag {
            background: #8e2de2;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: #8e2de2;
            transform: scale(1.5);
            box-shadow: 0 0 15px #8e2de2;
        }

        /* 呼吸背景光 */
        @keyframes glow-breath {
            0% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 0.3;
            }
        }

        .glow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #4facfe 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: glow-breath 5s infinite;
        }
    </style>
</head>

<body>
    <div class="glow-overlay" ref="glowOverlay"></div>
    <div id="canvas-container"></div>

    <div id="app" class="ui-root">
        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                👩‍👧‍👦 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">新发现!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages && step !== 3" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开始生命乐透' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-indigo-600 !text-white">
                    再次探索奥秘
                </button>
            </div>
        </div>

        <!-- 交互抽奖面板 -->
        <div v-if="step === 3" class="lottery-panel">
            <div class="lottery-item" :class="{ 'active-pink': combo === 'XX' }" @click="selectCombo('XX')">
                <div class="text-3xl font-bold text-pink-400">X + X</div>
                <div class="text-xs uppercase mt-2">灿烂女孩</div>
            </div>
            <div class="lottery-item" :class="{ 'active-blue': combo === 'XY' }" @click="selectCombo('XY')">
                <div class="text-3xl font-bold text-blue-400">X + Y</div>
                <div class="text-xs uppercase mt-2">勇敢男孩</div>
            </div>
            <button v-if="combo" @click="nextStage" class="next-btn !text-sm !py-3 !px-12 ml-10">确定组合</button>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const combo = ref(null);

                const stages = [
                    {
                        title: "生命的两个‘剧本’",
                        parentWords: "宝贝，你知道吗？每一个人在来到这个世界上以前，就像在进行一场神奇的‘生命大抽奖’。这里有两套最美的剧本等着大家。",
                        description: "在这个微观世界里，漂浮着两种神奇的魔法棒：有的是 X，有的是 Y。它们决定了你是帅气的男孩子，还是可爱的小公举。",
                        isDiscovery: false
                    },
                    {
                        title: "如果交换剧本？",
                        parentWords: "假如有一颗种子，它带着一根 X 魔法棒，它在寻找另一根伙伴。如果是两个 X 在一起，那会是什么样呢？",
                        description: "性别的形成完全是随机且公平的。这就像是一场大自然的舞会，谁牵住了谁的手，生命就会指向不同的方向。",
                        isDiscovery: false
                    },
                    {
                        title: "开启生命大乐透",
                        parentWords: "来吧，作为‘生命导游’，由于我们要揭开这个奥秘，你来帮这两根小棒子配对吧！点击一个组合看看。",
                        description: "操作提示：点击最下方的组合。在这个阶段，你可以看到 X 和 Y 染色体是如何在微观世界里‘跳舞’并最终决定生命轨迹的。",
                        isDiscovery: false
                    },
                    {
                        title: "X 与 Y 的舞步",
                        parentWords: "看！由于你选了这些组合，生命之光发生了变化。XY 组合会绽放出勇气的蓝光，XX 组合会绽放出温柔的粉光。每个都震撼极了！",
                        description: "新发现：其实所有人最初都有一根基础的 X 魔法棒。决定性别的‘最终关键’，在于爸爸送来的那一根是 X 还是 Y。这就是大自然的奥秘！",
                        isDiscovery: true
                    },
                    {
                        title: "每个剧本都精彩",
                        parentWords: "不管你是男孩还是女孩，你都是爸爸妈妈的骄傲。你是按照自己最美的那个‘剧本’长大的，要记得爱自己哦！",
                        description: "男孩可以很温柔，女孩也可以很勇敢。性别只是大自然给你的第一件礼物。真正精彩的部分，是由你自己去描绘的。让我们为独一无二的自己鼓掌吧！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js Logic ---
                let scene, camera, renderer, chX, chY, stars;
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 0, 150);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // Stars
                    const sGeo = new THREE.BufferGeometry();
                    const sPos = [];
                    for (let i = 0; i < 2500; i++) {
                        sPos.push((Math.random() - 0.5) * 800, (Math.random() - 0.5) * 800, (Math.random() - 0.5) * 600);
                    }
                    sGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
                    stars = new THREE.Points(sGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent: true, opacity: 0.4 }));
                    scene.add(stars);

                    // Chromosome X (Neon Cross)
                    const xGroup = new THREE.Group();
                    const matX = new THREE.MeshStandardMaterial({
                        color: 0xff69b4,
                        emissive: 0xff69b4,
                        emissiveIntensity: 0.5,
                        roughness: 0,
                        metalness: 0.8
                    });
                    const tubeX1 = new THREE.Mesh(new THREE.CapsuleGeometry(3, 30, 8, 16), matX);
                    tubeX1.rotation.z = Math.PI / 4;
                    const tubeX2 = new THREE.Mesh(new THREE.CapsuleGeometry(3, 30, 8, 16), matX);
                    tubeX2.rotation.z = -Math.PI / 4;
                    xGroup.add(tubeX1, tubeX2);
                    xGroup.position.x = -40;
                    chX = xGroup;
                    scene.add(chX);

                    // Chromosome Y (Neon Hook)
                    const yGroup = new THREE.Group();
                    const matY = new THREE.MeshStandardMaterial({
                        color: 0x4facfe,
                        emissive: 0x4facfe,
                        emissiveIntensity: 0.5,
                        roughness: 0,
                        metalness: 0.8
                    });
                    const tubeY1 = new THREE.Mesh(new THREE.CapsuleGeometry(3, 22, 8, 16), matY);
                    const tubeY2 = new THREE.Mesh(new THREE.CapsuleGeometry(3, 10, 8, 16), matY);
                    tubeY2.position.set(8, -8, 0);
                    tubeY2.rotation.z = Math.PI / 3;
                    yGroup.add(tubeY1, tubeY2);
                    yGroup.position.x = 40;
                    chY = yGroup;
                    scene.add(chY);

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                    directionalLight.position.set(20, 50, 50);
                    scene.add(directionalLight);

                    animate();
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();

                    if (stars) stars.rotation.y += 0.0002;

                    if (chX) {
                        chX.rotation.y += 0.01;
                        chX.rotation.x += 0.005;
                        chX.position.y = Math.sin(t) * 10;
                    }
                    if (chY) {
                        chY.rotation.y -= 0.01;
                        chY.rotation.z += 0.005;
                        chY.position.y = Math.cos(t) * 10;
                    }

                    renderer.render(scene, camera);
                };

                const selectCombo = (val) => {
                    combo.value = val;
                    if (val === 'XX') {
                        gsap.to(chY.scale, { x: 0, y: 0, z: 0, duration: 1 });
                        gsap.to(chY.position, { x: 100, duration: 1 });
                        // Create a second X
                        const chX2 = chX.clone();
                        chX2.position.x = 100;
                        scene.add(chX2);
                        gsap.to(chX2.position, { x: 20, duration: 1.5, ease: "bounce.out" });
                        gsap.to(chX.position, { x: -20, duration: 1.5, ease: "bounce.out" });
                        gsap.to('.glow-overlay', { background: 'radial-gradient(circle, #ff69b4 0%, transparent 70%)', duration: 2 });
                    } else {
                        gsap.to(chX.position, { x: -20, duration: 1.5, ease: "bounce.out" });
                        gsap.to(chY.position, { x: 20, duration: 1.5, ease: "bounce.out" });
                        gsap.to('.glow-overlay', { background: 'radial-gradient(circle, #4facfe 0%, transparent 70%)', duration: 2 });
                    }
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    // UI Reveal
                    gsap.fromTo('.stage-title-container', { opacity: 0, scale: 0.9, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 2, ease: "expo.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, ease: "expo.out" }, "-=1.5");

                    if (newVal === 1) {
                        gsap.to(camera.position, { z: 150, duration: 3 });
                    } else if (newVal === 4) {
                        gsap.to(camera.position, { z: 100, duration: 2, ease: "power2.inOut" });
                    } else if (newVal === 5) {
                        gsap.to(camera.position, { z: 180, y: 40, duration: 4, ease: "power3.inOut" });
                    }
                });

                onMounted(() => {
                    initThree();

                    // Initial Reveal
                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 1 });

                    // Parallax
                    window.addEventListener('mousemove', (e) => {
                        const x = (e.clientX / window.innerWidth - 0.5) * 2;
                        const y = (e.clientY / window.innerHeight - 0.5) * 2;
                        gsap.to(camera.position, { x: x * 15, y: -y * 15 + (step.value === 5 ? 40 : 0), duration: 2.5 });
                        camera.lookAt(0, (step.value === 5 ? 30 : 0), 0);
                    });

                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, combo, stages, currentStageData,
                    nextStage, goToStage, resetSimulation, selectCombo
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
