<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如果人总也不死该多好</title>
    <!-- ELITE DEPENDENCIES -->
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = { 'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js', 'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js', 'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js' };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-green: #84fab0;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #84fab0, #8fd3f4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(132, 250, 176, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #d1fae5;
            background: linear-gradient(90deg, transparent, rgba(132, 250, 176, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 16rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-green);
            box-shadow: 0 0 30px rgba(132, 250, 176, 0.3);
        }

        .control-panel {
            position: fixed;
            bottom: 5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            padding: 3rem;
            border-radius: 4rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            z-index: 20;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
        }

        .orb-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            cursor: pointer;
        }

        .life-orb {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, #84fab0, #8fd3f4);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(132, 250, 176, 0.5);
            transition: all 0.3s ease;
        }

        .life-orb.active {
            transform: scale(0.9);
            box-shadow: 0 0 60px rgba(132, 250, 176, 0.8), inset 0 0 20px white;
            filter: hue-rotate(90deg);
        }

        .orb-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            font-weight: 700;
            color: #020617;
            font-size: 0.9rem;
            pointer-events: none;
        }

        .discovery-tag {
            background: #10b981;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-green);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-green);
        }

        .resource-indicator {
            position: fixed;
            left: 3rem;
            bottom: 10rem;
            height: 200px;
            width: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
        }

        .resource-bar {
            width: 100%;
            background: linear-gradient(0deg, #84fab0, #8fd3f4);
            transition: height 0.3s ease;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>

    <div id="app" class="ui-root">
        <!-- 侧边资源计 -->
        <div class="resource-indicator" v-if="step >= 3">
            <div class="resource-bar" :style="{ height: resourceLevel + '%' }"></div>
        </div>

        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🧭 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">大发现!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages && step !== 3" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启禁止凋谢魔法' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-emerald-600 !text-white">
                    回归自然律动
                </button>
            </div>
        </div>

        <!-- 交互控制面板 -->
        <div v-if="step === 3" class="control-panel">
            <div class="orb-container" @mousedown="startFreeze" @touchstart.prevent="startFreeze" @mouseup="stopFreeze"
                @mouseleave="stopFreeze" @touchend="stopFreeze">
                <div class="life-orb" :class="{ active: isOrbiting }"></div>
                <div class="orb-label">{{ isOrbiting ? '生命周期停滞中' : '长按封印时间' }}</div>
            </div>
            <div class="text-sm font-bold text-emerald-300 mb-6">
                当前停滞强度: {{ (eternalFactor * 100).toFixed(0) }}%
            </div>
            <div class="flex justify-center">
                <button @click="nextStage" class="next-btn !text-sm !py-3 !px-12"
                    :style="{ opacity: eternalFactor > 0.9 ? 1 : 0.4 }">
                    进入完全拥挤模式
                </button>
            </div>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const eternalFactor = ref(0);
                const resourceLevel = ref(100);
                const isOrbiting = ref(false);
                let freezeInterval = null;

                const stages = [
                    {
                        title: "长生不老的幻想",
                        parentWords: "宝贝，是不是觉得如果大家都永远不用说‘再见’，永远停留在这一刻，世界就像迪士尼乐园一样完美？",
                        description: "在这个花园里，每一个灵魂都像一簇闪光的粒子。如果我们让时间停下，看看会发生什么。",
                        isDiscovery: false
                    },
                    {
                        title: "停不下来的拥挤",
                        parentWords: "可是你看，由于新的生命还在不停出生，原本宽敞的草坪渐渐挤满了人。如果我们禁止‘老去和凋谢’，世界会变色吗？",
                        description: "自然界有一个伟大的规则，就是‘空出来的位子’。如果我们违背这个规则，花园的颜色会渐渐变得暗淡。",
                        isDiscovery: false
                    },
                    {
                        title: "关闭‘自然之门’",
                        parentWords: "来，看到那个发光的生命原核了吗？长按它！当你把时间封印，生命将无法‘周而复始’。仔细观察那些原本亮晶晶的资源能量条。",
                        description: "在这个阶段，你可以亲手通过‘长按’来模拟过度平衡。你会发现，当空间被占满，新生命就没有了生长的余地，整体的活力正在极速下降。只有一直按着，魔咒才会生效。",
                        isDiscovery: false
                    },
                    {
                        title: "发现生命的流动美",
                        parentWords: "你看！当你松开手（释放封印），旧的粒子落回大地，新的翠绿色粒子立刻就蹦了出来。这才是世界跳动的原因呀！",
                        description: "新发现：有限的时间其实是自然的仁慈。正是离去让大地得以呼吸，让每一轮新生的生命都能拥有更好的空气、更好的阳光，也让世界进化得更精彩。",
                        isDiscovery: true
                    },
                    {
                        title: "每一刻都值得珍藏",
                        parentWords: "虽然有告别，但正是因为‘有告别’，现在的每一份拥抱、每一个笑话才这样宝贵。我们要更好地爱彼此。",
                        description: "生命是一个伟大的接力。我们从过去接过火炬，终将把它传给未来。让我们珍惜当下这个‘色彩斑斓、生机勃勃’的流动的地球吧！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // AI Helper: Stop/Start freeze interval
                const startFreeze = () => {
                    isOrbiting.value = true;
                    clearInterval(freezeInterval);
                    freezeInterval = setInterval(() => {
                        eternalFactor.value = Math.min(1, eternalFactor.value + 0.02);
                    }, 30);
                };

                const stopFreeze = () => {
                    isOrbiting.value = false;
                    clearInterval(freezeInterval);
                    if (step.value === 3) {
                        freezeInterval = setInterval(() => {
                            eternalFactor.value = Math.max(0, eternalFactor.value - 0.01);
                            if (eternalFactor.value === 0) clearInterval(freezeInterval);
                        }, 30);
                    }
                };

                // --- Three.js Ecosystem Simulation ---
                let scene, camera, renderer, forestGroup, particles, stars;
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 50, 200);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // Stars
                    const sGeo = new THREE.BufferGeometry();
                    const sPos = [];
                    for (let i = 0; i < 2000; i++) {
                        sPos.push((Math.random() - 0.5) * 800, (Math.random() - 0.5) * 800, (Math.random() - 0.5) * 800);
                    }
                    sGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
                    stars = new THREE.Points(sGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.4 }));
                    scene.add(stars);

                    // Forest / Particle Cluster
                    forestGroup = new THREE.Group();
                    scene.add(forestGroup);

                    // Initial balanced cluster
                    for (let i = 0; i < 300; i++) {
                        addLifeParticle();
                    }

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                    const directionalLight = new THREE.DirectionalLight(0x84fab0, 1.5);
                    directionalLight.position.set(30, 100, 30);
                    scene.add(directionalLight);

                    animate();
                };

                const addLifeParticle = (isOld = false) => {
                    const geo = new THREE.SphereGeometry(Math.random() * 2 + 0.5, 8, 8);
                    const mat = new THREE.MeshStandardMaterial({
                        color: isOld ? 0x666666 : 0x84fab0,
                        emissive: isOld ? 0x222222 : 0x84fab0,
                        emissiveIntensity: 0.5,
                        transparent: true,
                        opacity: 0.8
                    });
                    const p = new THREE.Mesh(geo, mat);
                    const r = 60 + Math.random() * 20;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    p.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
                    p.userData = {
                        bornAt: clock.getElapsedTime(),
                        lifespan: 5 + Math.random() * 5,
                        originalY: p.position.y
                    };
                    forestGroup.add(p);
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();

                    if (stars) stars.rotation.y += 0.0001;

                    // Manage Particle Lifecycle
                    if (forestGroup) {
                        forestGroup.rotation.y += 0.001; // Slower rotation

                        forestGroup.children.forEach((p, idx) => {
                            // Reduced Floating motion (Jitter reduction)
                            p.position.y = p.userData.originalY + Math.sin(t * 0.5 + idx) * 1.5;

                            // Normal Natural Dwindling
                            if (eternalFactor.value < 0.1) {
                                const age = t - p.userData.bornAt;
                                if (age > p.userData.lifespan) {
                                    forestGroup.remove(p);
                                    addLifeParticle(); // Birth after death
                                }
                            } else {
                                // Crowding effect: particles stop cycling, change color to gray
                                if (idx > 400 - eternalFactor.value * 250) {
                                    p.material.color.lerp(new THREE.Color(0x222222), 0.02);
                                    p.material.emissiveIntensity *= 0.98;
                                }
                            }
                        });

                        // Add new ones if it's "Eternal Mode"
                        if (eternalFactor.value > 0.4 && forestGroup.children.length < 800) {
                            addLifeParticle(true);
                        }
                    }

                    // Resource Bar Logic
                    resourceLevel.value = 100 - (eternalFactor.value * 85);

                    renderer.render(scene, camera);
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                    if (n < 3) eternalFactor.value = 0;
                    if (n > 3) eternalFactor.value = 0.05;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, scale: 0.9, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 2, ease: "expo.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, ease: "expo.out" }, "-=1.5");

                    if (newVal === 1) {
                        gsap.to(camera.position, { z: 200, y: 50, duration: 3 });
                    } else if (newVal === 4) {
                        gsap.to(camera.position, { z: 250, duration: 2 });
                        gsap.to(eternalFactor, { value: 0, duration: 2 }); // New Discovery: Return to flow
                    } else if (newVal === 5) {
                        gsap.to(camera.position, { z: 300, y: 80, duration: 4, ease: "power2.inOut" });
                    }
                });

                onMounted(() => {
                    initThree();

                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 1 });

                    window.addEventListener('mousemove', (e) => {
                        const x = (e.clientX / window.innerWidth - 0.5) * 2;
                        const y = (e.clientY / window.innerHeight - 0.5) * 2;
                        gsap.to(camera.position, { x: x * 15, y: -y * 15 + 50, duration: 3 });
                        camera.lookAt(0, 0, 0);
                    });

                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, eternalFactor, resourceLevel, stages, currentStageData,
                    nextStage, goToStage, resetSimulation, startFreeze, stopFreeze, isOrbiting
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
