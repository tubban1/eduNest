<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我为什么没有千里眼和顺风耳</title>
    <!-- ELITE DEPENDENCIES -->
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = { 'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js', 'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js', 'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js' };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-purple: #a855f7;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #e9d5ff;
            background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 18rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-purple);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }

        .control-panel {
            position: fixed;
            bottom: 6rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2rem;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            padding: 2.5rem;
            border-radius: 3.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            z-index: 20;
        }

        .btn-switch {
            background: #222;
            padding: 1.5rem 3.5rem;
            border-radius: 2rem;
            color: #ddd;
            font-weight: bold;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.4s;
            border: 2px solid transparent;
        }

        .btn-switch.active {
            background: #a855f7;
            border-color: white;
            color: white;
            box-shadow: 0 0 20px #a855f7;
        }

        /* Signal HUD */
        .signal-hud {
            position: fixed;
            left: 3rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 2rem;
            font-family: monospace;
            color: #a855f7;
        }

        .wave-container {
            width: 80px;
            height: 40px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .wave-bar {
            width: 4px;
            background: currentColor;
            transition: height 0.1s;
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-purple);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-purple);
        }

        .discovery-tag {
            background: #7c3aed;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        .noise-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="noise" class="noise-layer"></div>

    <div id="app" class="ui-root">
        <!-- 信号 HUD -->
        <div class="signal-hud" v-if="step >= 2">
            <div>
                <div class="text-xs uppercase opacity-60 mb-2">Visual Input</div>
                <div class="wave-container">
                    <div v-for="n in 15" :key="n" class="wave-bar"
                        :style="{ height: Math.random() * (isSuperSenses ? 100 : 30) + '%' }"></div>
                </div>
            </div>
            <div>
                <div class="text-xs uppercase opacity-60 mb-2">Audio Frequency</div>
                <div class="wave-container">
                    <div v-for="n in 15" :key="n" class="wave-bar"
                        :style="{ height: Math.random() * (isSuperSenses ? 100 : 30) + '%' }"></div>
                </div>
            </div>
        </div>

        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                👂 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">大发现!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages && step !== 3" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启超感模式' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-purple-700 !text-white">
                    一键回归清净
                </button>
            </div>
        </div>

        <!-- 切换板 -->
        <div v-if="step === 3" class="control-panel">
            <div @click="toggleSuper" class="btn-switch" :class="{ active: isSuperSenses }">
                {{ isSuperSenses ? '超级感官: 捕捉一切信号' : '普通感官: 保护性过滤' }}
            </div>
            <button v-if="isSuperSenses" @click="nextStage" class="next-btn !text-sm !py-3 !px-12 ml-4">无法忍受了！</button>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const isSuperSenses = ref(false);

                const stages = [
                    {
                        title: "我为什么没有千里眼",
                        parentWords: "宝贝，是不是觉得如果能听到几千米外的悄悄话，就像拥有了超级英雄的耳朵？那一定是酷毙了吧！",
                        description: "在这间数字实验室里，我们正在利用‘大脑过滤器’来保护我们。现在，世界是宁静且专注的。观察眼前的这个球体，它代表此时你能注意到的最重要的信号。",
                        isDiscovery: false
                    },
                    {
                        title: "噪音的海洋",
                        parentWords: "可你不知道的是，其实空气里每秒钟都飞着几百万条无用的声音和光波。如果你的‘窗户’全部打开，会发生什么？",
                        description: "我们准备模拟‘无过滤状态’。你会看到全世界所有的信号。你预测你的眼睛和大脑能受得了吗？",
                        isDiscovery: false
                    },
                    {
                        title: "激活‘全频道过载’",
                        parentWords: "来！勇敢地点击那个紫色核心。现在，你拥有了神话里的千里眼和顺风耳。看看那些‘乱糟糟’的数字风暴！你还能找到刚才那个球体吗？",
                        description: "当你试图捕捉一切，也就意味着你什么也捕捉不到了。这种极端的信息过载，会让大脑彻底‘当机’（眩晕感）。这正是进化要保护我们的地方。",
                        isDiscovery: false
                    },
                    {
                        title: "发现‘没看到’的智慧",
                        parentWords: "你看！当你点击下方按钮（关掉噪音），世界瞬间清净了。大脑其实是个超级伟大的‘静音师’，它只让你看到最值得专注的美景。",
                        description: "新发现：看不见千里之外，是由于那些对你没用。不具备‘超级感官’，是由于我们的大脑把带宽留给了思考、想象和爱。‘舍弃’也是一种伟大的生存智慧。",
                        isDiscovery: true
                    },
                    {
                        title: "专注才是最好的天赋",
                        parentWords: "以后别羡慕超能力啦，你那双只能看到妈妈笑脸的眼睛，和你那只只能听懂朋友心事的耳朵，才是这个宇宙里最完美的礼物。",
                        description: "珍惜这种‘刚刚好’的距离。让我们带着这份宁静的礼物，去探索这个有序的世界吧！每一个生命都有它最合适的频道。",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js Overload Magic ---
                let scene, camera, renderer, coreSignals, noiseParticles;
                let clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 0, 150);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // 1. Core Target Signal
                    const coreGeo = new THREE.TorusKnotGeometry(12, 4, 100, 16);
                    coreSignals = new THREE.Mesh(coreGeo, new THREE.MeshStandardMaterial({
                        color: 0xa855f7,
                        emissive: 0xa855f7,
                        emissiveIntensity: 0.8,
                        wireframe: true
                    }));
                    scene.add(coreSignals);

                    // 2. Overload Noise Particles
                    noiseParticles = new THREE.Group();
                    scene.add(noiseParticles);
                    for (let i = 0; i < 3000; i++) {
                        const p = new THREE.Mesh(
                            new THREE.BoxGeometry(1, 1, 1),
                            new THREE.MeshBasicMaterial({ color: 0xec4899, transparent: true, opacity: 0.1 })
                        );
                        p.position.set((Math.random() - 0.5) * 500, (Math.random() - 0.5) * 500, (Math.random() - 0.5) * 500);
                        p.userData = { drift: Math.random() * 2 };
                        noiseParticles.add(p);
                    }
                    noiseParticles.visible = false;

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                    const pointLight = new THREE.PointLight(0xffffff, 1.5);
                    pointLight.position.set(20, 50, 50);
                    scene.add(pointLight);

                    animate();
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();

                    if (coreSignals) {
                        coreSignals.rotation.y += 0.01;
                        coreSignals.rotation.x += 0.005;
                    }

                    if (noiseParticles && isSuperSenses.value) {
                        noiseParticles.visible = true;
                        noiseParticles.children.forEach(p => {
                            p.position.y += Math.sin(t + p.userData.drift) * 2;
                            p.rotation.x += 0.05;
                            p.material.opacity = 0.5 + Math.sin(t * 10) * 0.5;
                        });
                        noiseParticles.rotation.y += 0.05;
                    } else if (noiseParticles) {
                        noiseParticles.visible = false;
                    }

                    renderer.render(scene, camera);
                };

                const toggleSuper = () => {
                    isSuperSenses.value = !isSuperSenses.value;
                    const noise = document.getElementById('noise');
                    if (isSuperSenses.value) {
                        noise.style.opacity = "0.4";
                        gsap.to(camera.position, { z: 120, duration: 1 });
                    } else {
                        noise.style.opacity = "0";
                    }
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, scale: 0.9, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 2, ease: "expo.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, ease: "expo.out" }, "-=1.5");

                    if (newVal === 4) {
                        isSuperSenses.value = false;
                        gsap.to(camera.position, { z: 150, duration: 2 });
                        document.getElementById('noise').style.opacity = "0";
                    }
                });

                onMounted(() => {
                    initThree();

                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 1 });

                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, isSuperSenses, stages, currentStageData,
                    nextStage, goToStage, resetSimulation, toggleSuper
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
