<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伸手就够到美丽的星星该多好</title>
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script>(function () { var g = "tailwind", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script>(function () { var g = "Vue", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script>(function () { var g = "gsap", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>(function () { var g = "THREE", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Fredoka:wght@400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #010409;
            font-family: 'Fredoka', 'ZCOOL XiaoWei', serif;
        }

        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            pointer-events: none;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 32px;
            max-width: 600px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
        }

        .content-card.minimized {
            max-width: 250px;
            padding: 15px 20px;
            border-radius: 20px;
        }

        .toggle-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            pointer-events: auto;
        }

        .parent-guide {
            background: rgba(255, 255, 255, 0.15);
            border-left: 4px solid #FFD93D;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.95rem;
            color: #FFD93D;
        }

        .stage-fade-enter-active,
        .stage-fade-leave-active {
            transition: all 0.8s ease;
        }

        .stage-fade-enter-from {
            opacity: 0;
            transform: translateY(30px);
        }

        .stage-fade-leave-to {
            opacity: 0;
            transform: translateY(-30px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366F1 0%, #A855F7 100%);
            color: white;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.4);
        }

        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.5s;
        }

        .progress-dot.active {
            background: #FFD93D;
            transform: scale(1.5);
            box-shadow: 0 0 10px #FFD93D;
        }
    </style>
</head>

<body>
    <div id="three-canvas" class="pointer-events-auto"></div>
    <div id="app" class="ui-root">
        <!-- Top Progress -->
        <div class="flex justify-center gap-4">
            <div v-for="n in stages.length" :key="n" class="progress-dot" :class="{ active: step === n }"></div>
        </div>

        <!-- Center Content -->
        <div class="flex flex-col items-center">
            <transition name="stage-fade" mode="out-in">
                <div :key="step" :class="['content-card', 'pointer-events-auto', { 'minimized': isMinimized }]">
                    <button @click="isMinimized = !isMinimized" class="toggle-btn">
                        {{ isMinimized ? '显示' : '隐藏' }}
                    </button>

                    <!-- Parent Guiding Words -->
                    <div v-if="!isMinimized" class="parent-guide">
                        <strong>👨‍👩‍👧 亲子导读：</strong> {{ parentGuides[step-1] }}
                    </div>

                    <h1
                        :class="['text-white font-bold tracking-tight', isMinimized ? 'text-lg mb-2' : 'text-3xl md:text-4xl mb-6']">
                        {{ stages[step-1].title }}
                    </h1>

                    <div v-if="!isMinimized" class="text-xl text-white/90 leading-relaxed mb-10">
                        <p v-html="stages[step-1].content"></p>
                    </div>

                    <div class="flex justify-center">
                        <button v-if="step < stages.length" @click="nextStage"
                            :class="['btn-primary rounded-full shadow-xl font-bold', isMinimized ? 'px-8 py-2 text-md' : 'px-12 py-5 text-xl']">
                            {{ buttonText }}
                        </button>
                        <button v-else @click="reset"
                            class="bg-white/10 text-white border border-white/30 px-10 py-4 rounded-full hover:bg-white/20 transition">
                            重新探索 ✨
                        </button>
                    </div>
                </div>
            </transition>
        </div>

        <!-- Bottom Tip -->
        <div class="text-white/40 text-sm text-center">
            {{ hintText }}
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, nextTick } = Vue;

        createApp({
            setup() {
                const stages = ref([
                    {
                        title: '第一步：静心观察',
                        content: '在寂静的森林草地上，抬头仰望，你会看到无数的小星星在天空中闪烁。它们看起来就像一颗颗细小的碎钻。'
                    },
                    {
                        title: '第一步：大胆预测',
                        content: '如果你伸手去够，你能碰到它们吗？有人说星星就在树顶上，有人说在月亮后面。你觉得呢？'
                    },
                    {
                        title: '第三步：出发！操作探索',
                        content: '让我们加速飞向星空！随着我们的靠近，你会发现原本细小的光点正在发生惊人的变化。'
                    },
                    {
                        title: '第四步：神奇的发现',
                        content: '看啊！近看星星竟然是巨大的红色火球！它和我们的太阳一样，一直在发光发热，只是因为它太远太远了，才显得那么小。'
                    },
                    {
                        title: '第五步：心得总结',
                        content: '原来，伸手够不到是因为宇宙太大了。但只要我们有一颗好奇心，就能通过知识，把最远的星辰握在手心里。'
                    }
                ]);
                const step = ref(1);
                const isMinimized = ref(false);
                const parentGuides = [
                    "引导孩子观察屏幕上的星星，问问他看到什么颜色，是不是在眨眼睛？",
                    "抛出问题：你觉得星星离我们有多远？是像气球一样高，还是更高？",
                    "鼓励孩子长按屏幕，像开小火箭一样出发，观察周围星星的变化。",
                    "快看！这就是星星的真面目，引导孩子观察它和太阳公公有什么相同点？",
                    "总结：天边的外边是非常非常广阔的宇宙，每颗小星点其实都是伟大的星球。"
                ];


                const buttonText = computed(() => ["准备出发", "开始飞行", "加速推进", "看清它了", "完成探险"][step.value - 1]);
                const hintText = computed(() => ["💡 点击星星可以跟它们互动", "💡 思考一下星星的形状", "💡 试试长按屏幕加速", "💡 移动屏幕旋转视角", "🚀 探险成功！"][step.value - 1]);

                // --- Three.js Logic ---
                let scene, camera, renderer, starfield, heroPlanet, clock = new THREE.Clock();

                const initThree = () => {
                    try {
                        scene = new THREE.Scene();
                        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                        camera.position.z = 20;

                        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                        renderer.setSize(window.innerWidth, window.innerHeight);
                        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                        document.getElementById('three-canvas').appendChild(renderer.domElement);

                        // Lights
                        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
                        const sun = new THREE.PointLight(0xffcc00, 2, 100);
                        sun.position.set(0, 0, 0);
                        scene.add(sun);

                        // Stars Background
                        createStarfield();

                        // Hero Feature (The star we approach)
                        const geo = new THREE.SphereGeometry(3, 64, 64);
                        const mat = new THREE.MeshStandardMaterial({
                            color: 0xff6600,
                            emissive: 0xff3300,
                            emissiveIntensity: 1,
                            roughness: 1
                        });
                        heroPlanet = new THREE.Mesh(geo, mat);
                        heroPlanet.position.set(0, 0, -100);
                        heroPlanet.visible = false;
                        scene.add(heroPlanet);

                        animate();
                    } catch (error) {
                        console.error("Error initializing Three.js:", error);
                        // Fallback UI or error message can be displayed here
                        document.getElementById('three-canvas').innerHTML = '<div style="color: white; text-align: center; padding-top: 50vh; transform: translateY(-50%);">无法加载3D场景，请尝试刷新页面或更换浏览器。</div>';
                    }
                };

                const createStarfield = () => {
                    const geo = new THREE.BufferGeometry();
                    const count = 5000;
                    const pos = new Float32Array(count * 3);
                    for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * 500;
                    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                    const mat = new THREE.PointsMaterial({ size: 0.8, color: 0xffffff, transparent: true, opacity: 0.8 });
                    starfield = new THREE.Points(geo, mat);
                    scene.add(starfield);
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();
                    if (starfield) starfield.rotation.y += 0.0002;
                    if (heroPlanet && heroPlanet.visible) {
                        heroPlanet.rotation.y += 0.01;
                        heroPlanet.scale.setScalar(1 + Math.sin(t * 2) * 0.05);
                    }
                    if (renderer && scene && camera) renderer.render(scene, camera);
                };

                const nextStage = () => {
                    step.value = Math.min(step.value + 1, stages.value.length);
                    try {
                        window.eduNestRuntime?.dispatchLearningEvent('stage_change', { stageIndex: step.value, totalStages: stages.value.length });
                    } catch (e) {
                        console.warn("eduNestRuntime not available or dispatchLearningEvent failed:", e);
                    }
                    if (step.value === 3) {
                        gsap.to(camera.position, { z: -80, duration: 4, ease: "power2.inOut" });
                        heroPlanet.visible = true;
                        gsap.from(heroPlanet.scale, { x: 0, y: 0, z: 0, duration: 2 });
                    } else if (step.value === 4) {
                        gsap.to(camera.position, { z: -8, duration: 2 });
                        gsap.to(heroPlanet.position, { x: 5, y: 2, duration: 2 });
                    }
                };

                const reset = () => {
                    step.value = 1;
                    gsap.to(camera.position, { z: 20, duration: 1.5 });
                    heroPlanet.visible = false;
                    heroPlanet.position.set(0, 0, -100);
                };

                onMounted(() => {
                    initThree();
                    window.addEventListener('resize', () => {
                        if (camera) {
                            camera.aspect = window.innerWidth / window.innerHeight;
                            camera.updateProjectionMatrix();
                        }
                        if (renderer) {
                            renderer.setSize(window.innerWidth, window.innerHeight);
                        }
                    });
                    try {
                        window.eduNestRuntime?.dispatchLearningEvent('activity_loaded', { activityName: 'Star Exploration' });
                    } catch (e) {
                        console.warn("eduNestRuntime not available or dispatchLearningEvent failed:", e);
                    }
                });

                // Runtime API
                if (typeof window !== 'undefined') {
                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: stages.value.length,
                            currentStage: (stages.value[step.value - 1] && stages.value[step.value - 1].title) || ''
                        };
                    };
                }

                return { step, isMinimized, stages, parentGuides, nextStage, reset, buttonText, hintText };
            }
        }).mount('#app');
    </script>
</body>

</html>
