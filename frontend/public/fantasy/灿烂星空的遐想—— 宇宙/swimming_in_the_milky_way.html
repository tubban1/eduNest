<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>到天河里去游泳多美妙</title>
    <!-- Standard Dependencies -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script>(function () { var g = "tailwind", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script>(function () { var g = "Vue", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script>(function () { var g = "gsap", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>(function () { var g = "THREE", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Fredoka:wght@400;700&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #010816;
            font-family: 'Fredoka', 'ZCOOL XiaoWei', serif;
        }

        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: auto;
        }

        .ui-safe-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 5vh;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .glass-box {
            background: rgba(0, 20, 40, 0.3);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 50px;
            padding: 35px;
            max-width: 650px;
            box-shadow: 0 0 40px rgba(0, 100, 255, 0.3);
            text-align: center;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
        }

        .glass-box.minimized {
            max-width: 250px;
            padding: 15px 25px;
            transform: translateY(20px);
        }

        .btn-toggle-ui {
            position: absolute;
            right: 25px;
            top: 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            pointer-events: auto;
        }

        .parent-callout {
            background: rgba(0, 150, 255, 0.15);
            border-bottom: 2px solid #00D2FF;
            padding: 10px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            color: #E0F2FE;
            text-align: left;
        }

        .btn-magical {
            background: linear-gradient(135deg, #6EE7B7 0%, #3B82F6 100%);
            color: white;
            font-weight: 800;
            border: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-magical:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 15px #00D2FF);
        }

        .fade-slide-enter-active,
        .fade-slide-leave-active {
            transition: all 0.8s ease;
        }

        .fade-slide-enter-from {
            opacity: 0;
            transform: scale(0.9) translateY(40px);
        }

        .fade-slide-leave-to {
            opacity: 0;
            transform: scale(1.1) translateY(-40px);
        }

        .progress-indicator {
            position: fixed;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
        }

        .dot.active {
            height: 24px;
            background: #00D2FF;
            box-shadow: 0 0 10px #00D2FF;
        }
    </style>
</head>

<body>
    <div id="three-canvas" class="pointer-events-auto"></div>
    <div id="app" class="ui-safe-layer">

        <div class="progress-indicator">
            <div v-for="n in 5" :key="n" class="dot" :class="{ active: step === n }"></div>
        </div>

        <transition name="fade-slide" mode="out-in">
            <div :key="step" :class="['glass-box', 'pointer-events-auto', { 'minimized': isMinimized }]">
                <button @click="isMinimized = !isMinimized" class="btn-toggle-ui">
                    {{ isMinimized ? '展开' : '隐藏' }}
                </button>

                <div v-if="!isMinimized" class="parent-callout">
                    <strong>🛋️ 陪学指南：</strong> {{ parentWords[step-1] }}
                </div>

                <h1
                    :class="['text-blue-50 font-bold italic tracking-wider', isMinimized ? 'text-lg mb-2' : 'text-3xl mb-6']">
                    {{ stages[step-1].title }}</h1>
                <div v-if="!isMinimized" class="text-xl text-blue-200 leading-relaxed mb-10"
                    v-html="stages[step-1].content"></div>

                <div class="flex justify-center">
                    <button v-if="step < 5" @click="nextStage"
                        :class="['swim-btn rounded-full shadow-2xl font-bold', isMinimized ? 'px-8 py-2 text-md' : 'px-14 py-5 text-xl']">
                        {{ buttonLabel }}
                    </button>
                    <button v-else @click="reset"
                        class="text-blue-400 font-bold uppercase tracking-widest border-b border-blue-400 mt-4">
                        游回岸边 💤
                    </button>
                </div>
            </div>
        </transition>

        <div class="mt-8 text-blue-300/40 text-sm">
            💡 {{ tips[step-1] }}
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const { nextTick } = Vue;
                const stages = ref([
                    { title: '入梦：星空长廊', content: '古人说，天上有一条银色的河。它静静地躺在那儿，横跨了整个夜空，真是又梦幻又神秘。' },
                    { title: '猜想：它是水做的吗？', content: '如果我们要跳进去游泳，你觉得星河里的水是凉凉的，还是像光一样暖暖的？里面会有小鱼吗？' },
                    { title: '启航：跃入星流', content: '扑通！我们跃入了这个发亮的世界。看，当你游动的时候，周围原本平静的群星也荡起了金色的波纹。' },
                    { title: '震撼：恒星之海', content: '当我们游到深处，凑近一看——天哪！原来那些‘水滴’竟然是成千上万个发光的太阳！这儿全是恒星的聚会。' },
                    { title: '感悟：我们的摇篮', content: '这就美妙的银河系。宇宙很大，星河很宽，而我们正住在这样美丽的长河里，每一天都在随波旅行。' }
                ]);
                const step = ref(1);
                const isMinimized = ref(false);
                const parentWords = [
                    "引导孩子在星空背景中找到那条淡淡的长廊。问问他这像不像在天上流淌的奶油？",
                    "思考一下：如果银河是一条河，它的‘水滴’会是什么？是冰块吗？还是滚烫的星球？",
                    "让孩子在屏上滑动手，像游水一样，感受‘星河之水’跟随指尖波动的快感。",
                    "指出每一颗亮晶晶的小点都是像太阳一样的超级星球。我们就在这片星辰大海中！",
                    "告诉孩子：银河系是我们的家。我们的地球就像星海里的一条小小鱼，而你是这颗种子。"
                ];


                const buttonLabel = computed(() => ["出发寻找星河", "准备跃入", "尽情畅游", "看清秘密", "完成美梦"][step.value - 1]);
                const tips = computed(() => ["观察发亮的带状区域", "发挥你的想象力", "尝试在屏幕上划动手指", "观察粒子的发光效果", "记住这种震撼的感觉"][step.value - 1]);

                // --- Three.js Magic ---
                let scene, camera, renderer, starPoints, mouse = new THREE.Vector2(-10, -10);
                let particleCount = 12000;
                let clock = new THREE.Clock();
                let initialPositions = [];

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.z = 80;

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    document.getElementById('three-canvas').appendChild(renderer.domElement);

                    // Milky Way Geometry (Elliptical distribution)
                    const geo = new THREE.BufferGeometry();
                    const positions = new Float32Array(particleCount * 3);
                    const colors = new Float32Array(particleCount * 3);
                    const sizes = new Float32Array(particleCount);

                    for (let i = 0; i < particleCount; i++) {
                        const radius = 30 + Math.random() * 40;
                        const angle = (i / particleCount) * Math.PI * 4;
                        positions[i * 3] = Math.cos(angle) * radius + (Math.random() - 0.5) * 15;
                        positions[i * 3 + 1] = Math.sin(angle) * 5 + (Math.random() - 0.5) * 10;
                        positions[i * 3 + 2] = (Math.random() - 0.5) * 20;

                        // Colors from blueish to golden-white
                        const c = new THREE.Color().setHSL(0.6 + Math.random() * 0.1, 0.8, 0.7 + Math.random() * 0.3);
                        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
                        sizes[i] = Math.random() * 2;

                        // Store original positions for interaction
                        initialPositions.push(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]);
                    }

                    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                    const mat = new THREE.PointsMaterial({
                        size: 0.6, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending
                    });
                    starPoints = new THREE.Points(geo, mat);
                    scene.add(starPoints);

                    animate();
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const time = clock.getElapsedTime();
                    starPoints.rotation.y += 0.0005;
                    starPoints.rotation.z += 0.0002;

                    const pos = starPoints.geometry.attributes.position.array;
                    for (let i = 0; i < particleCount; i++) {
                        const ix = i * 3, iy = i * 3 + 1, iz = i * 3 + 2;

                        // Basic waving
                        pos[iy] = initialPositions[iy] + Math.sin(time + i * 0.1) * 0.5;

                        // Interaction: Swimming through stars
                        // Map mouse to 3D space approx
                        const mx = mouse.x * 50, my = mouse.y * 30;
                        const dx = pos[ix] - mx, dy = pos[iy] - my;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 15) {
                            const force = (15 - dist) / 15;
                            pos[ix] += dx * force * 0.1;
                            pos[iy] += dy * force * 0.1;
                        } else {
                            // Recover
                            pos[ix] += (initialPositions[ix] - pos[ix]) * 0.05;
                        }
                    }
                    starPoints.geometry.attributes.position.needsUpdate = true;

                    renderer.render(scene, camera);
                };

                const nextStage = () => {
                    step.value = Math.min(step.value + 1, stages.value.length);
                    window.eduNestRuntime?.dispatchLearningEvent('stage_change', { stageIndex: step.value, totalStages: stages.value.length });
                    if (step.value === 3) {
                        gsap.to(camera.position, { z: 40, x: -10, duration: 3, ease: "power2.inOut" });
                        gsap.to(starPoints.material, { size: 1.2, duration: 2 });
                    } else if (step.value === 4) {
                        gsap.to(camera.position, { z: 12, x: 5, y: 2, duration: 4, ease: "slow" });
                        gsap.to(starPoints.material, { opacity: 1, duration: 2 });
                    }
                };

                const reset = () => {
                    step.value = 1;
                    nextTick(() => { });
                    gsap.to(camera.position, { x: 0, y: 0, z: 80, duration: 2.5 });
                    gsap.to(starPoints.material, { size: 0.6, duration: 1.5 });
                };

                if (typeof window !== 'undefined') {
                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: stages.value.length,
                            currentStage: (stages.value[step.value - 1] && stages.value[step.value - 1].title) || ''
                        };
                    };
                }

                onMounted(() => {
                    initThree();
                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });

                    // Unified Interaction (Mouse + Touch)
                    const onPointerMove = (e) => {
                        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    };
                    window.addEventListener('pointermove', onPointerMove);
                });

                return { step, isMinimized, stages, parentWords, nextStage, reset, buttonLabel, tips };
            }
        }).mount('#app');
    </script>
</body>

</html>
