<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天边的外边是什么</title>
  <!-- Standard Elite Dependencies -->
  <script src="https://cdn.tailwindcss.com"
    onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"

  <script>(function () { var g = "Vue", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
    onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
    onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
  <script>(function () { var g = "THREE", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"
    onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/OrbitControls.js'"></script>
  <script>(function () { var g = "THREE.OrbitControls", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/OrbitControls.js"; setTimeout(function () { if (window.THREE && window.THREE.OrbitControls === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Fredoka:wght@400;700&display=swap');

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Fredoka', 'ZCOOL XiaoWei', serif;
    }

    #three-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .ui-overlay {
      position: relative;
      z-index: 10;
      pointer-events: none;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px;
    }

    .pointer-events-auto {
      pointer-events: auto;
    }

    /* Premium Aesthetic: Glassmorphism */
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      padding: 35px;
      max-width: 580px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      margin: 0 auto;
      transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
      position: relative;
    }

    .glass-card.minimized {
      max-width: 250px;
      padding: 15px 20px;
      transform: translateY(20px);
    }

    .toggle-ui {
      position: absolute;
      right: 20px;
      top: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      pointer-events: auto;
    }

    .guide-banner {
      background: rgba(255, 217, 61, 0.15);
      border-left: 4px solid #FFD93D;
      padding: 12px 18px;
      border-radius: 12px;
      margin-bottom: 25px;
      font-size: 0.95rem;
      color: #FFD93D;
      text-align: left;
    }

    .stage-indicator {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .step-dot {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.6s;
    }

    .step-dot.active {
      background: #FFD93D;
      box-shadow: 0 0 10px #FFD93D;
    }

    .btn-magical {
      background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: none;
      /* Keep border none if it was intended to be a text button */
      font-weight: 800;
      /* Keep font-weight */
    }

    .btn-magical:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 15px 30px rgba(59, 130, 246, 0.4);
    }

    .fade-scale-enter-active,
    .fade-scale-leave-active {
      transition: all 0.8s ease;
    }

    .fade-scale-enter-from {
      opacity: 0;
      transform: scale(0.9) translateY(20px);
    }

    .fade-scale-leave-to {
      opacity: 0;
      transform: scale(1.1) translateY(-20px);
    }

    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(110, 231, 183, 0.3), transparent);
      animation: scan 4s linear infinite;
    }

    @keyframes scan {
      0% {
        top: 0;
      }

      100% {
        top: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="three-canvas"></div>
  <div class="scan-line"></div>

  <div id="app" class="ui-overlay">
    <!-- Header: Progressive Dots -->
    <div class="stage-indicator">
      <div v-for="n in 5" :key="n" class="step-dot" :class="{ active: step === n }"></div>
    </div>

    <!-- Center: Cognitive Content -->
    <div class="flex items-center justify-center flex-grow">
      <transition name="fade-scale" mode="out-in">
        <div :key="step"
          :class="['glass-card', 'pointer-events-auto', 'text-center', 'relative', 'overflow-hidden', { 'minimized': isMinimized }]">
          <button @click="isMinimized = !isMinimized" class="toggle-ui">
            {{ isMinimized ? '展开' : '隐藏' }}
          </button>

          <div v-if="!isMinimized" class="guide-banner">
            <strong>🛋️ 陪学互动：</strong> {{ parentGuides[step-1] }}
          </div>

          <h1
            :class="['text-white font-bold tracking-tight', isMinimized ? 'text-lg mb-2' : 'text-3xl md:text-4xl mb-6']">
            {{ stages[step-1].title }}
          </h1>

          <div v-if="!isMinimized" class="text-xl text-white/90 leading-relaxed mb-10">
            <p v-html="stages[step-1].content"></p>
          </div>

          <div class="flex justify-center">
            <button v-if="step < 5" @click="nextStage"
              :class="['btn-magical rounded-full shadow-xl font-bold', isMinimized ? 'px-8 py-2 text-md' : 'px-14 py-5 text-xl']">
              {{ buttonLabel }}
            </button>
            <button v-else @click="reset"
              class="bg-white/10 text-white border border-white/30 px-10 py-4 rounded-full hover:bg-white/20 transition">
              重启好奇心 🌀
            </button>
          </div>
        </div>
      </transition>
    </div>

    <!-- Footer: Tech Hint -->
    <div class="text-white/30 text-xs text-center tracking-widest uppercase">
      {{ techHints[step-1] }}
    </div>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const { nextTick } = Vue;
        const stages = ref([
          { title: '起始：地平线的幻想', content: '当你站在草原上，远处天和地连成了一条线。那是天边吗？如果我们一直跑，能不能摸到它的边缘？' },
          { title: '预测：跨越的代价', content: '有人说天边是世界的尽头，跨过去就会掉进虚无。你觉得呢？那道光的背后，是深渊，还是另一片璀璨？' },
          { title: '飞跃：打破视界的屏障', content: '坐稳了！我们要启动‘超空间引擎’。看，原本作为终点的地平线，正在化作五彩的光流被我们甩在身后！' },
          { title: '发现：无限的嵌套', content: '哇！天边的外边竟然是浩瀚的星系核。原来所谓的‘边’只是我们的视力限制，宇宙在外面还有无限的广阔。' },
          { title: '领悟：探索的圆环', content: '这就是天边的真相：它永远在那儿，却永远不是终局。就像人类的探索，每一步都在把‘外边’变成‘家园’。' }
        ]);
        const step = ref(1);
        const isMinimized = ref(false);
        const parentGuides = [
          "引导孩子看向最远的地平线，问问他：你觉得那天边像不像一扇紧闭的大门？",
          "抛出猜想：如果我们驾着马车冲过那道门，是会掉下去，还是会看到更美的天空？",
          "让孩子按住屏幕‘启动飞船’，他在这一刻就像一个勇敢的探险家冲破束缚。",
          "快看！天边外是瑰丽的星云。引导孩子理解：一个终点其实是另一个更伟大的起点。",
          "总结：宇宙没有尽头，只要你有好奇心，天边的外边永远都有新的惊喜在等你。"
        ];


        const buttonLabel = computed(() => ["去天边看看", "我知道答案了", "全速冲刺！", "见证真相", "完成旅程"][step.value - 1]);
        const techHints = computed(() => ["💡 观察地平线的视觉消失点", "💡 思考空间的连贯性", "💡 体验 GSAP 的径向运动效果", "💡 观察 3D 星云的立体结构", "🚀 获得探索家勋章"][step.value - 1]);

        // --- Advanced Three.js Deep Space Experience ---
        let scene, camera, renderer, controls, clock = new THREE.Clock();
        let cloudParticles = [], stars, cosmosGateway, heroGalaxy;

        const initThree = () => {
          scene = new THREE.Scene();
          scene.background = new THREE.Color(0x020308);

          camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
          camera.position.z = 100;

          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          document.getElementById('three-canvas').appendChild(renderer.domElement);

          // Orbit Controls
          controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.enabled = false;

          // 1. Mysterious Sea of Clouds (Stage 1-2)
          createMagicalClouds();

          // 2. Starfield (Base Layer)
          createDeepStarfield();

          // 3. Central Galaxy (The 'Beyond' Discovery)
          createDiscoveryGalaxy();

          scene.add(new THREE.AmbientLight(0x404040, 2));
          let dLight = new THREE.DirectionalLight(0xffffff, 1.5);
          dLight.position.set(0, 10, 50);
          scene.add(dLight);

          animate();
        };

        const createMagicalClouds = () => {
          const geo = new THREE.BoxGeometry(20, 10, 5);
          const mat = new THREE.MeshPhongMaterial({ color: 0x4B0082, transparent: true, opacity: 0.6, flatShading: true });
          for (let i = 0; i < 30; i++) {
            const m = new THREE.Mesh(geo, mat);
            m.position.set((Math.random() - 0.5) * 200, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 50);
            m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            m.scale.setScalar(Math.random() * 2 + 1);
            scene.add(m);
            cloudParticles.push(m);
          }
        };

        const createDeepStarfield = () => {
          const geo = new THREE.BufferGeometry();
          const count = 6000;
          const pos = new Float32Array(count * 3);
          for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * 1500;
          geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
          const mat = new THREE.PointsMaterial({ size: 1.2, color: 0xffffff, transparent: true, opacity: 0.8 });
          stars = new THREE.Points(geo, mat);
          scene.add(stars);
        };

        const createDiscoveryGalaxy = () => {
          const group = new THREE.Group();
          const coreGeo = new THREE.SphereGeometry(10, 32, 32);
          const coreMat = new THREE.MeshStandardMaterial({
            color: 0x00D9FF, emissive: 0x0077FF, emissiveIntensity: 2
          });
          const core = new THREE.Mesh(coreGeo, coreMat);
          group.add(core);

          // Spiral Arms representation
          for (let i = 0; i < 100; i++) {
            const s = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshPhongMaterial({ color: 0x6EE7B7 }));
            const angle = i * 0.2;
            const dist = i * 0.8 + 15;
            s.position.set(Math.cos(angle) * dist, Math.sin(angle) * dist, (Math.random() - 0.5) * 10);
            group.add(s);
          }
          group.position.set(0, 0, -500);
          group.visible = false;
          heroGalaxy = group;
          scene.add(group);
        };

        const animate = () => {
          requestAnimationFrame(animate);
          const time = clock.getElapsedTime();

          cloudParticles.forEach((p, idx) => {
            p.position.y += Math.sin(time + idx) * 0.05;
            p.rotation.x += 0.005;
          });

          stars.rotation.y += 0.0003;

          if (heroGalaxy.visible) {
            heroGalaxy.rotation.z += 0.005;
            heroGalaxy.rotation.y += 0.002;
          }

          if (controls.enabled) controls.update();
          renderer.render(scene, camera);
        };

        const nextStage = () => {
          step.value = Math.min(step.value + 1, stages.value.length);
          window.eduNestRuntime?.dispatchLearningEvent('stage_change', { stageIndex: step.value, totalStages: stages.value.length });
          if (step.value === 3) {
            // Warp Speed Transition
            gsap.to(camera.position, { z: -300, duration: 4, ease: "slow(0.7, 0.7, false)" });
            cloudParticles.forEach(p => {
              gsap.to(p.position, { x: p.position.x * 10, y: p.position.y * 10, duration: 3 });
              gsap.to(p.material, { opacity: 0, duration: 2 });
            });
            heroGalaxy.visible = true;
            gsap.fromTo(heroGalaxy.position, { z: -1000 }, { z: -450, duration: 5, ease: "power2.out" });
          } else if (step.value === 4) {
            gsap.to(camera.position, {
              z: -430, x: 20, duration: 3, ease: "power2.inOut", onComplete: () => {
                controls.enabled = true;
                controls.target.set(0, 0, -450);
              }
            });
          }
        };

        const reset = () => {
          step.value = 1;
          nextTick(() => { });
          controls.enabled = false;
          gsap.to(camera.position, { x: 0, y: 0, z: 100, duration: 3, ease: "expo.inOut" });
          heroGalaxy.visible = false;
          cloudParticles.forEach(p => {
            gsap.to(p.material, { opacity: 0.6, duration: 1.5 });
            gsap.to(p.position, {
              x: (Math.random() - 0.5) * 200,
              y: (Math.random() - 0.5) * 100,
              duration: 2
            });
          });
        };

        if (typeof window !== 'undefined') {
          window.__eduNestUIStateProvider = function () {
            return {
              stageIndex: step.value,
              totalStages: stages.value.length,
              currentStage: (stages.value[step.value - 1] && stages.value[step.value - 1].title) || ''
            };
          };
        }

        onMounted(() => {
          initThree();
          window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
          });
        });

        return { step, isMinimized, stages, parentGuides, nextStage, reset, buttonLabel, techHints };
      }
    }).mount('#app');
  </script>
</body>

</html>
