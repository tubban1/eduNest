<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一伸手就能让一座大楼移动该多好</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = {
                    'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js',
                    'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js',
                    'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'
                };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-blue: #3b82f6;
            --accent-glow: #60a5fa;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #dbeafe;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 18rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-blue);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-blue);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-blue);
        }

        .discovery-tag {
            background: #1e3a8a;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        .hint-text {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            color: #60a5fa;
            font-size: 1rem;
            opacity: 0.6;
            pointer-events: none;
        }

        .warning-label {
            position: absolute;
            background: rgba(239, 68, 68, 0.8);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 0.3rem;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="app" class="ui-root">
        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🏙️ {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">重力揭秘!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启超能力' : (step === 3 ? '查看城市根基' : '继续探索') }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-blue-900 !text-white">
                    回归坚固世界
                </button>
            </div>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>

        <div v-if="step === 3" class="hint-text">用鼠标拖拽蓝色高亮的大楼试试看</div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch, nextTick } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const foundInfrastructure = ref(false);

                const stages = [
                    {
                        title: "一伸手就能让一座大楼移动该多好",
                        parentWords: "宝贝，你看，这些大楼像巨人一样站得直直的。它们从来不会走路。要是它们像你的玩具积木一样，手一挥就能搬走，那会发生什么呢？",
                        description: "城市是宁静而稳固的。每一座建筑都深深地扎根在大地之中，为我们遮风挡雨。你是否想过，给它们注入一点‘移动魔法’？",
                        isDiscovery: false
                    },
                    {
                        title: "预测：大楼的‘树根’",
                        parentWords: "如果我们真的把大楼搬起来。预测一下，它地下的那些水管、电线还能拉住它吗？城市会不会像被拔起的萝卜一样乱糟糟的？",
                        description: "预测中：大楼不是浮在地面上的。它们拥有极其庞大的地下结构。一旦移动，那些连接整座城市的‘生命脉络’可能会被扯断。",
                        isDiscovery: false
                    },
                    {
                        title: "操作：超级重塑力量",
                        parentWords: "来吧，伸出你的魔法之手。拖拽那些发光的大楼。看！当你挪动它时，地底下暴露出了什么？那些彩色的管子和粗大的地基。",
                        description: "实验场：你拥有了移动建筑的力量。当你拔起一座楼时，你会发现大地的深处隐藏着维护城市运转的复杂血脉。",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：深藏不露的根基",
                        parentWords: "快看！原来大楼稳固是因为有深厚的‘根’。新发现：如果大楼可以随便动，由于地下电网和供水系统的断裂，整个城市都会陷入停电和停水。稳固才是幸福的基石！",
                        description: "震撼揭秘：稳定性是现代建筑的灵魂。新发现：大楼地下的桩基可能比楼本身还要结实。正是这种由于不能轻易移动的由于‘倔强’，才保证了千万家灯火的由于安全！",
                        isDiscovery: true
                    },
                    {
                        title: "致敬土地的恒久力量",
                        parentWords: "让我们拍拍坚硬的地面，对大楼说声‘谢谢你站得这么稳’。大自然的规律让世界变得由于井然有序。你今天完成了一个惊人的建筑发现！",
                        description: "世界由于稳定而美好。今天你不仅体验了由于超能力。更由于读懂了由于土地与生命之间的承诺。你真是个了不起的由于小小建筑师！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js City Scene ---
                let scene, camera, renderer, raycaster, mouse;
                let buildings = [];
                let ground, infraGroup;
                let selectedBuilding = null;
                let isDragging = false;
                let plane = new THREE.Plane();
                let pIntersect = new THREE.Vector3();
                let pNormal = new THREE.Vector3(0, 1, 0);

                const initThree = () => {
                    scene = new THREE.Scene();
                    scene.fog = new THREE.Fog(0x020617, 100, 1000);
                    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
                    camera.position.set(150, 150, 250);
                    camera.lookAt(0, 0, 0);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    raycaster = new THREE.Raycaster();
                    mouse = new THREE.Vector2();

                    // Lights
                    scene.add(new THREE.AmbientLight(0x404040, 2));
                    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
                    sun.position.set(200, 500, 200);
                    scene.add(sun);

                    // Ground
                    const groundSize = 1000;
                    const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize);
                    const groundMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, side: THREE.DoubleSide });
                    ground = new THREE.Mesh(groundGeo, groundMat);
                    ground.rotation.x = -Math.PI / 2;
                    scene.add(ground);

                    // City Grid Helper
                    const grid = new THREE.GridHelper(groundSize, 50, 0x1e293b, 0x1e293b);
                    grid.position.y = 0.1;
                    scene.add(grid);

                    // Create Buildings
                    createCity();

                    // Infrastructure Group (hidden)
                    infraGroup = new THREE.Group();
                    infraGroup.visible = false;
                    scene.add(infraGroup);
                    createInfrastructure();

                    animate();

                    window.addEventListener('mousedown', onMouseDown);
                    window.addEventListener('mousemove', onMouseMove);
                    window.addEventListener('mouseup', onMouseUp);
                    window.addEventListener('resize', onWindowResize);
                };

                const createCity = () => {
                    const colors = [0x3b82f6, 0x1d4ed8, 0x1e40af, 0x60a5fa];
                    for (let i = 0; i < 40; i++) {
                        const w = 10 + Math.random() * 15;
                        const h = 20 + Math.random() * 80;
                        const geo = new THREE.BoxGeometry(w, h, w);
                        const mat = new THREE.MeshStandardMaterial({
                            color: colors[Math.floor(Math.random() * colors.length)],
                            emissive: 0x000000
                        });
                        const b = new THREE.Mesh(geo, mat);
                        b.position.set((Math.random() - 0.5) * 400, h / 2, (Math.random() - 0.5) * 400);
                        b.userData.isMovable = true;
                        b.userData.originalY = h / 2;
                        buildings.push(b);
                        scene.add(b);

                        // Underground foundation
                        const fGeo = new THREE.CylinderGeometry(w / 2, w / 2.2, h / 1.5, 8);
                        const fMat = new THREE.MeshStandardMaterial({ color: 0x334155, transparent: true, opacity: 0.8 });
                        const f = new THREE.Mesh(fGeo, fMat);
                        f.position.y = -h / 3;
                        b.add(f);
                        f.visible = false;
                        b.userData.foundation = f;
                    }
                };

                const createInfrastructure = () => {
                    // Lines representing pipes/wires
                    for (let i = 0; i < 30; i++) {
                        const points = [];
                        const start = new THREE.Vector3((Math.random() - 0.5) * 500, -5, (Math.random() - 0.5) * 500);
                        const mid = new THREE.Vector3((Math.random() - 0.5) * 500, -10, (Math.random() - 0.5) * 500);
                        const end = new THREE.Vector3((Math.random() - 0.5) * 500, -5, (Math.random() - 0.5) * 500);
                        points.push(start, mid, end);
                        const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
                        const geo = new THREE.TubeGeometry(curve, 20, 1, 8, false);
                        const mat = new THREE.MeshBasicMaterial({
                            color: Math.random() > 0.5 ? 0xef4444 : 0xec4899,
                            opacity: 0.5,
                            transparent: true
                        });
                        infraGroup.add(new THREE.Mesh(geo, mat));
                    }
                };

                const onMouseDown = (event) => {
                    if (step.value !== 3) return;
                    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(buildings);
                    if (intersects.length > 0) {
                        isDragging = true;
                        selectedBuilding = intersects[0].object;
                        plane.setFromNormalAndCoplanarPoint(pNormal, intersects[0].point);
                        selectedBuilding.material.emissive.setHex(0x38bdf8);
                        selectedBuilding.userData.foundation.visible = true;
                        foundInfrastructure.value = true;
                        infraGroup.visible = true;

                        // Lift building effect
                        gsap.to(selectedBuilding.position, { y: selectedBuilding.userData.originalY + 20, duration: 0.5, ease: "back.out" });
                    }
                };

                const onMouseMove = (event) => {
                    if (!isDragging || !selectedBuilding) return;
                    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    raycaster.ray.intersectPlane(plane, pIntersect);
                    selectedBuilding.position.x = pIntersect.x;
                    selectedBuilding.position.z = pIntersect.z;
                };

                const onMouseUp = () => {
                    if (selectedBuilding) {
                        selectedBuilding.material.emissive.setHex(0x000000);
                        // drop back to ground
                        gsap.to(selectedBuilding.position, { y: selectedBuilding.userData.originalY, duration: 1, ease: "bounce.out" });
                    }
                    isDragging = false;
                    selectedBuilding = null;
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    if (infraGroup.visible) {
                        infraGroup.rotation.y += 0.001;
                    }
                    renderer.render(scene, camera);
                };

                const onWindowResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 1.5, ease: "power2.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.5, ease: "power2.out", delay: 0.5 });

                    if (newVal === 1) {
                        gsap.to(camera.position, { x: 150, y: 150, z: 250, duration: 3 });
                    } else if (newVal === 3) {
                        gsap.to(camera.position, { x: 250, y: 100, z: 350, duration: 2 });
                        buildings.forEach(b => {
                            b.material.transparent = true;
                            b.material.opacity = 0.8;
                        });
                    } else if (newVal === 4) {
                        gsap.to(camera.position, { x: 0, y: 400, z: 10, duration: 3 });
                        infraGroup.visible = true;
                        gsap.to(infraGroup.position, { y: 20, duration: 2 });
                    }
                });

                onMounted(() => {
                    initThree();
                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2, delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2, delay: 1 });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, currentStageData, foundInfrastructure,
                    nextStage, goToStage, resetSimulation
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
