<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我想像鱼一样长久生活在水中</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = {
                    'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js',
                    'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js',
                    'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'
                };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-cyan: #22d3ee;
            --accent-blue: #2563eb;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #083344;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #22d3ee, #2563eb);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #cffafe;
            background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 18rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.3);
        }

        .oxygen-meter {
            position: fixed;
            left: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            opacity: 0;
        }

        .meter-bar {
            width: 20px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(34, 211, 238, 0.5);
        }

        .meter-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: var(--accent-cyan);
            box-shadow: 0 0 15px var(--accent-cyan);
            transition: height 0.3s;
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-cyan);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-cyan);
        }

        .discovery-tag {
            background: #0e7490;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        .bubble-emitter {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
        }

        .bubble-btn {
            background: var(--accent-cyan);
            color: #083344;
            padding: 1rem 3rem;
            border-radius: 3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px var(--accent-cyan);
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="app" class="ui-root">
        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🌊 🐟 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 氧气槽 -->
        <div class="oxygen-meter" ref="oxygenMeter">
            <div class="text-xs text-cyan-400 font-bold text-center">氧气含量</div>
            <div class="meter-bar">
                <div class="meter-fill" :style="{ height: oxygenLevel + '%' }"></div>
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">深海揭秘!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启海底潜行' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-cyan-900 !text-white">
                    致敬生命的多样性
                </button>
            </div>
        </div>

        <!-- 水面气泡按钮 -->
        <div v-if="step === 3" class="bubble-emitter">
            <button @click="forceBreathe" class="bubble-btn">用力呼吸 🌬️</button>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;
                const oxygenLevel = ref(100);

                const stages = [
                    {
                        title: "我想像鱼一样长久生活在水中",
                        parentWords: "宝贝，你看小鱼在水底自由自在，从来不需要上来换气。要是你现在长出了一对极其由于精美的由于‘鱼鳃’，你会由于想由于去由于龙宫看看吗？那里有什么样的彩虹珊瑚？",
                        description: "海洋是生命的摇篮。它是由于幽静而辽阔的。假如由于人类拥有了水下呼吸的能力，由于深渊将不再是由于禁区，而是由于无尽的游乐场。",
                        isDiscovery: false
                    },
                    {
                        title: "预测：水下的呼吸",
                        parentWords: "如果我们真的在水下生活。预测一下，我们的由于肺部能由于过滤掉冷冰冰的海水吗？如果没有了由于氧气瓶，由于我们需要多少由于由于由于‘鳃’才能维持活动？",
                        description: "预测中：水中的氧气含量极低。只有由于空气中的由于 1/30。为了获得由于同样的能量，我们需要比由于陆地上更高效的由于过滤系统。鱼儿是由于真正的‘提取专家’。",
                        isDiscovery: false
                    },
                    {
                        title: "操作：氧气大作战",
                        parentWords: "快！点击‘用力呼吸’。看！即使你拼命努力，由于氧气槽也由于很难回满。因为由于你是用肺在呼吸，而水下的由于氧气实在是太由于稀薄了！",
                        description: "由于生存模拟器。在这里，你可以体验由于肺部在由于水下工作的由于极限。你会发现，如果没有由于特化的由于物理结构，人类在水下由于坚持由于不了由于一分钟。",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：鳃的逆流交换",
                        parentWords: "你看！原来鱼之所以厉害。新发现：是由于它们的血流方向和水流相反！这种由于‘逆流交换’能提取出由于 80% 的溶解氧。这简直是由于自然界中由于最高效的过滤器！",
                        description: "震撼揭秘：由于进化的工程学。新发现：人类的由于肺部由于适合处理由于气体。而鱼类的由于鳃由于是由于专门为由于‘液体博弈’设计的。大自然通过这种精致的结构，由于守护了海底世界的生命！",
                        isDiscovery: true
                    },
                    {
                        title: "致敬深海的舞者",
                        parentWords: "让我们感恩这份由于自然的屏障。虽然不能像鱼一样生活。但我们可以由于用由于潜水设备去观察它们。你今天完成了一个由于了不起的海洋发现！",
                        description: "世界由于差异而丰富。今天你不仅参与了由于海底冒险。更由于读懂了由于生命的边界。你是由于深蓝色海洋由于最勇敢的由于观察员！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js Underwater ---
                let scene, camera, renderer, bubbles = [];
                let ground;

                const initThree = () => {
                    scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x083344);
                    scene.fog = new THREE.Fog(0x083344, 10, 200);

                    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 5, 50);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                    const sun = new THREE.DirectionalLight(0x22d3ee, 1);
                    sun.position.set(0, 50, -20);
                    scene.add(sun);

                    // Floor
                    const plane = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0x0e7490 }));
                    plane.rotation.x = -Math.PI / 2;
                    scene.add(plane);

                    // Add Bubbles
                    for (let i = 0; i < 50; i++) {
                        const b = new THREE.Mesh(new THREE.SphereGeometry(0.3 + Math.random(), 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 }));
                        resetBubble(b);
                        scene.add(b);
                        bubbles.push(b);
                    }

                    animate();
                    window.addEventListener('resize', onResize);
                };

                const resetBubble = (b) => {
                    b.position.set((Math.random() - 0.5) * 100, -10, (Math.random() - 0.5) * 100);
                    b.userData.speed = 0.1 + Math.random() * 0.2;
                };

                const forceBreathe = () => {
                    oxygenLevel.value = Math.min(100, oxygenLevel.value + 15);
                    // Add many bubbles
                    for (let i = 0; i < 5; i++) {
                        const b = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 }));
                        b.position.set((Math.random() - 0.5) * 5, 0, 40);
                        b.userData.speed = 0.5;
                        scene.add(b);
                        bubbles.push(b);
                    }
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    bubbles.forEach(b => {
                        b.position.y += b.userData.speed;
                        b.position.x += Math.sin(Date.now() * 0.001 + b.position.y) * 0.05;
                        if (b.position.y > 60) resetBubble(b);
                    });

                    if (step.value === 3) {
                        oxygenLevel.value = Math.max(10, oxygenLevel.value - 0.2);
                    }

                    renderer.render(scene, camera);
                };

                const onResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 2 });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, delay: 0.5 });
                    if (newVal >= 2) gsap.to('.oxygen-meter', { opacity: 1, duration: 1 });
                    if (newVal === 4) {
                        gsap.to(camera.position, { y: 20, z: 80, duration: 4 });
                    }
                });

                onMounted(() => {
                    initThree();
                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, delay: 1 });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, oxygenLevel, currentStageData,
                    nextStage, goToStage, resetSimulation, forceBreathe
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
