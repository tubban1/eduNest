<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总知道别人在想什么该多好</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = {
                    'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js',
                    'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js',
                    'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'
                };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #f3e8ff;
            background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 18rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-purple);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-purple);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-purple);
        }

        .discovery-tag {
            background: #4c1d95;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        .thought-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 1.5rem;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.2rem;
            pointer-events: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
            z-index: 100;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="app" class="ui-root">
        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🧠 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">秘密发现!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启读心模式' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-purple-900 !text-white">
                    回归真实交流
                </button>
            </div>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;

                const stages = [
                    {
                        title: "总知道别人在想什么该多好",
                        parentWords: "宝贝，你看，每个人都有一个小脑袋，里面装着许许多多奇妙的想法。如果你的眼睛能像透视机一样，能看到别人在想什么，你会开心吗？",
                        description: "这是一个充满神秘气息的‘思想花园’。每个人都是一个独立的星球，星球表面平和，内心却由于风暴或星光而忙碌。",
                        isDiscovery: false
                    },
                    {
                        title: "预测：没有秘密的世界",
                        parentWords: "如果我们都能读心。预测一下，当你偷偷想吃糖被妈妈知道了，或者你还没送出的生日惊喜被拆穿了，这个世界还会由于惊喜而由于快乐吗？",
                        description: "预测中：隐私是心灵的盔甲。如果没有了这层保护，人与人之间的交流可能会变得极其直白，甚至由于失去由于模糊的美感。",
                        isDiscovery: false
                    },
                    {
                        title: "操作：探测思想电波",
                        parentWords: "快！点击那些在场景中漂浮的‘紫色光点’。它们是人们溢出的由于心声。看看大家都在由于悄悄想些什么？",
                        description: "由于超能力的觉醒。你现在可以触碰那些无形的思维碎片。但请记住，每一个声音都代表了一个由于独立的人格。",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：理解的多维性",
                        parentWords: "你看！原来有时候人们嘴上说的和心里想的完全相反。新发现：读心不一定能由于带来快乐，理解别人的由于情感（同理心）比由于看穿别人的由于念头更重要！",
                        description: "震撼揭秘：人类之所以特别，是因为由于心与心的沟通。新发现：读到文字不代表由于懂了表情。真正的连接是由于相互尊重的‘留白’。如果没有秘密，由于信任也就失去了价值！",
                        isDiscovery: true
                    },
                    {
                        title: "致敬心灵的距离",
                        parentWords: "让我们学着通过眼神和微笑去猜伙伴的想法，而不是由于去由于偷看。这份由于猜测的过程就是由于友谊。你今天完成了一个由于了不起的小侦探发现！",
                        description: "尊重每个人的内心世界。今天你不仅体验了由于读心。更由于读懂了由于尊重的深度。愿你的心里也由于装满温柔的星光！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js Mind Garden ---
                let scene, camera, renderer, particles = [];
                let raycaster = new THREE.Raycaster();
                let mouse = new THREE.Vector2();

                // --- Brain Waves ---
                let brainWaves = [];
                const createBrainWave = (yOffset, color, speed) => {
                    const points = [];
                    for (let i = 0; i <= 100; i++) {
                        points.push(new THREE.Vector3(i - 50, 0, 0));
                    }
                    const geo = new THREE.BufferGeometry().setFromPoints(points);
                    const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.4 });
                    const line = new THREE.Line(geo, mat);
                    line.position.y = yOffset;
                    line.userData = { speed, phase: Math.random() * Math.PI, amplitude: 5 + Math.random() * 5 };
                    scene.add(line);
                    brainWaves.push(line);
                };

                const updateBrainWaves = (time) => {
                    brainWaves.forEach((line, index) => {
                        const positions = line.geometry.attributes.position.array;
                        for (let i = 0; i <= 100; i++) {
                            const x = i - 50;
                            const y = Math.sin(x * 0.1 + time * line.userData.speed + line.userData.phase) * line.userData.amplitude;
                            positions[i * 3 + 1] = y;
                        }
                        line.geometry.attributes.position.needsUpdate = true;
                        line.visible = step.value >= 2; // Show after prediction stage
                    });
                };

                const initThree = () => {
                    scene = new THREE.Scene();
                    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 0, 100);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // Add ambient particles
                    for (let i = 0; i < 50; i++) {
                        const geo = new THREE.SphereGeometry(Math.random() * 2 + 1, 16, 16);
                        const mat = new THREE.MeshBasicMaterial({ color: 0x8b5cf6, transparent: true, opacity: 0.6 });
                        const p = new THREE.Mesh(geo, mat);
                        p.position.set((Math.random() - 0.5) * 150, (Math.random() - 0.5) * 100, (Math.random() - 0.5) * 50);
                        p.userData = {
                            initialX: p.position.x,
                            initialY: p.position.y,
                            speed: Math.random() * 0.02 + 0.01,
                            thought: [
                                "这颗星星真甜...",
                                "我想去月亮上滑滑梯...",
                                "晚饭吃什么呢？",
                                "要是能飞多多呀",
                                "今天的云像棉花糖",
                                "他在想我吗？"
                            ][Math.floor(Math.random() * 6)]
                        };
                        scene.add(p);
                        particles.push(p);
                    }

                    // Create several brain waves at different levels
                    createBrainWave(20, 0xec4899, 2);
                    createBrainWave(0, 0x8b5cf6, 3);
                    createBrainWave(-20, 0xec4899, 1.5);

                    animate();

                    window.addEventListener('click', onDocClick);
                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });
                };

                const onDocClick = (event) => {
                    if (step.value !== 3) return;
                    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(particles);
                    if (intersects.length > 0) {
                        const target = intersects[0].object;
                        showThought(event.clientX, event.clientY, target.userData.thought);
                        gsap.to(target.scale, { x: 2, y: 2, z: 2, duration: 0.3, yoyo: true, repeat: 1 });
                        gsap.to(target.material, { opacity: 1, duration: 0.1 });
                    }
                };

                const showThought = (x, y, text) => {
                    const bubble = document.createElement('div');
                    bubble.className = 'thought-bubble';
                    bubble.innerText = text;
                    bubble.style.left = `${x}px`;
                    bubble.style.top = `${y}px`;
                    document.body.appendChild(bubble);

                    gsap.fromTo(bubble,
                        { opacity: 0, y: 20, scale: 0.5 },
                        { opacity: 1, y: -60, scale: 1, duration: 0.8, ease: "back.out" }
                    );
                    gsap.to(bubble, { opacity: 0, y: -100, duration: 1.5, delay: 1, onComplete: () => bubble.remove() });
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const time = Date.now() * 0.001;
                    particles.forEach((p, i) => {
                        p.position.y = p.userData.initialY + Math.sin(time + i) * 5;
                        p.position.x = p.userData.initialX + Math.cos(time + i * 0.5) * 5;
                        p.rotation.y += p.userData.speed;
                    });

                    updateBrainWaves(time);

                    renderer.render(scene, camera);
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, scale: 0.9, y: -40 }, { opacity: 1, scale: 1, y: 0, duration: 2, ease: "expo.out" });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, ease: "expo.out", delay: 0.5 });

                    if (newVal === 4) {
                        gsap.to(camera.position, { z: 150, duration: 5 });
                    }
                });

                onMounted(() => {
                    initThree();
                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, ease: "expo.out", delay: 1 });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, currentStageData,
                    nextStage, goToStage, resetSimulation
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
