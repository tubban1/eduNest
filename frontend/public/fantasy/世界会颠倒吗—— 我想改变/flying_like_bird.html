<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我要像鸟儿一样飞</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = {
                    'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js',
                    'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js',
                    'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'
                };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-sky: #38bdf8;
            --accent-cloud: #f8fafc;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0ea5e9;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #f8fafc, #38bdf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #f0f9ff;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 18rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-sky);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .fly-hint {
            position: fixed;
            bottom: 4rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 1rem 3rem;
            border-radius: 3rem;
            color: white;
            font-weight: bold;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-sky);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-sky);
        }

        .discovery-tag {
            background: #0369a1;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="app" class="ui-root">
        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🦅 ☁️ {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">空天发现!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启飞行模拟' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-sky-900 !text-white">
                    致敬双翼的智慧
                </button>
            </div>
        </div>

        <!-- 飞行提示 -->
        <div v-if="step === 3" class="fly-hint">按住鼠标向上或向下拖拽来改变高度</div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;

                const stages = [
                    {
                        title: "我要像鸟儿一样飞",
                        parentWords: "宝贝，你看，小燕子轻盈地穿过白云，就像在空中跳舞。要是你现在背后长出一对长长的、羽毛极其由于柔软的翅膀。你会想由于飞去哪里？是由于去数数云朵，还是由于去和太阳公公由于打招呼？",
                        description: "天空是蓝色的海洋。它是自由的代名词。假如人类拥有了翅膀，我们的世界将从由于平面由于跃迁到由于立体空间。",
                        isDiscovery: false
                    },
                    {
                        title: "预测：飞翔的重量",
                        parentWords: "如果你真的长了翅膀。预测一下，你的由于双臂由于需要由于多大的力量才能扇动空气？如果我们要飞向太空，翅膀还能由于带我们去吗？",
                        description: "预测中：飞翔需要代价。由于空气的支撑力是有限的。为了对抗重力，鸟儿的骨头是由于空心的，而人类由于沉由于重的由于骨骼可能是飞翔的最大障碍。",
                        isDiscovery: false
                    },
                    {
                        title: "操作：穿梭在云霄",
                        parentWords: "来吧！控制你的飞行高度。向上滑是寻找上升气流，向下滑是由于俯冲加速。看！掠过云端的感觉是不是由于让整个人都由于变轻了？",
                        description: "空天飞行场。在这里，你可以体验翅膀如何在由于不同高度的由于气压中工作。每一次拍打，都是由于对重力的由于勇敢挑衅。",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：升力与流体力学",
                        parentWords: "快看！原来飞起来不是靠‘拍打’本身。新发现：是由于翅膀的形状让由于上方的空气跑得更快，由于下方的空气托住了你！这就是著名的由于‘伯努利原理’！",
                        description: "震撼揭秘：由于翅膀的秘密在于弧度。新发现：如果翅膀是平的，你根本飞不起来。大自然设计的由于每一片羽毛，都在由于利用空气的由于压强差。飞翔是由于物理的艺术！",
                        isDiscovery: true
                    },
                    {
                        title: "致敬伟大的天空梦",
                        parentWords: "即使由于没有由于真实的翅膀，人类由于用由于智慧造出了更好的由于‘机械双翼’——飞机。让我们对蓝天由于保持敬畏。你今天完成了一个由于了不起的领航发现！",
                        description: "梦想是翱翔的动力。今天你不仅体验了飞行的快感。更由于读懂了由于风的语言。你是由于天空由于最勇敢的由于追梦人！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js Flight Scene ---
                let scene, camera, renderer, clouds = [];
                let isDragging = false, lastY = 0;

                const initThree = () => {
                    scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x0ea5e9);
                    scene.fog = new THREE.FogExp2(0x0ea5e9, 0.002);

                    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
                    camera.position.set(0, 0, 100);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
                    const sun = new THREE.DirectionalLight(0xffffff, 0.5);
                    sun.position.set(1, 1, 1);
                    scene.add(sun);

                    // Helper to create a fluffy cloud
                    const createCloud = () => {
                        const group = new THREE.Group();
                        const tuftCount = 3 + Math.floor(Math.random() * 4);
                        const mat = new THREE.MeshStandardMaterial({
                            color: 0xffffff,
                            transparent: true,
                            opacity: 0.85,
                            roughness: 0.8
                        });

                        for (let j = 0; j < tuftCount; j++) {
                            const size = 10 + Math.random() * 15;
                            const geo = new THREE.SphereGeometry(size, 8, 8);
                            const mesh = new THREE.Mesh(geo, mat);
                            mesh.position.set(
                                (Math.random() - 0.5) * 30,
                                (Math.random() - 0.5) * 15,
                                (Math.random() - 0.5) * 20
                            );
                            group.add(mesh);
                        }
                        return group;
                    };

                    // Create Clouds
                    for (let i = 0; i < 60; i++) {
                        const cloud = createCloud();
                        cloud.position.set(
                            (Math.random() - 0.5) * 2000,
                            (Math.random() - 0.5) * 600,
                            (Math.random() - 0.5) * 3000
                        );
                        scene.add(cloud);
                        clouds.push(cloud);
                    }

                    animate();

                    window.addEventListener('mousedown', (e) => { isDragging = true; lastY = e.clientY; });
                    window.addEventListener('mouseup', () => { isDragging = false; });
                    window.addEventListener('mousemove', onMouseMove);
                    window.addEventListener('resize', onResize);
                };

                const onMouseMove = (event) => {
                    if (!isDragging || step.value !== 3) return;
                    const deltaY = event.clientY - lastY;
                    camera.position.y -= deltaY * 0.2;
                    camera.rotation.x = -deltaY * 0.005;
                    lastY = event.clientY;
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    // Move clouds towards camera
                    clouds.forEach(c => {
                        c.position.z += 5;
                        if (c.position.z > 200) c.position.z = -2800;
                    });
                    renderer.render(scene, camera);
                };

                const onResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 2 });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 2, delay: 0.5 });
                });

                onMounted(() => {
                    initThree();
                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, delay: 1 });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, currentStageData,
                    nextStage, goToStage, resetSimulation
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
