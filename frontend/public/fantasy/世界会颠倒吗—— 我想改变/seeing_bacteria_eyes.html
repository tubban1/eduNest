<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用肉眼能看到细菌该多好</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/OrbitControls.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = {
                    'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js',
                    'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js',
                    'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'OrbitControls': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/OrbitControls.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'
                };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-green: #22c55e;
            --accent-lime: #a3e635;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #22c55e, #a3e635);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(34, 197, 94, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #dcfce7;
            background: linear-gradient(90deg, transparent, rgba(34, 197, 94, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 18rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-green);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.3);
        }

        .interaction-hint {
            position: fixed;
            bottom: 4rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1rem 3rem;
            border-radius: 3rem;
            color: white;
            font-weight: bold;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-green);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-green);
        }

        .discovery-tag {
            background: #166534;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="app" class="ui-root">
        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🔬 👻 {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 交互提示 -->
        <div v-if="step === 3" class="interaction-hint">
            滚轮缩放进入微观世界，拖动旋转观察细菌
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">微观发现!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启超视距感官' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-emerald-900 !text-white">
                    致敬隐形的守护者
                </button>
            </div>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;

                const stages = [
                    {
                        title: "用肉眼能看到细菌该多好",
                        parentWords: "宝贝，你看由于你的由于小手，干干净净的对不对？但要是我们的由于眼睛变成了由于超级由于显微镜。你会发现上面住着一群由于极其由于由于忙碌由于的小家伙。你想由于跟它们由于打一声招呼吗？",
                        description: "这是一个隐形的大型社区。在我们由于看不见的角落，亿万个由于生命正在由于繁延生息。它们是由于世界由于最古老、数量由于最多的由于居民。",
                        isDiscovery: false
                    },
                    {
                        title: "预测：细菌的大世界",
                        parentWords: "如果我们真的能看到由于细菌。预测一下，当你准备由于由于由于喝一口水，看到杯子里游动着无数的小生物，你还会由于觉得由于这口水清甜吗？",
                        description: "预测中：信息量会大由于爆炸。由于视觉的精细度决定了我们的由于生活重心。如果能看到一切，眼前的世界将由于由于由于不再是由于整洁的物体，而是由于一团团由于蠕动的由于生命云团。",
                        isDiscovery: false
                    },
                    {
                        title: "操作：超级放大镜",
                        parentWords: "快！试着滚动鼠标滚轮。看！当我们深挖到微观层级时，由于原本平整的桌面出现了由于由于由于巨大的‘山脉’。那些由于圆滚滚的小点就是由于细菌！",
                        description: "微观探险场。在这里，你可以使用右侧的轨道控制功能，自由旋转、缩放。从由于可见光范围由于由于由于一跃进入由于由于由于奇妙的由于微生物世界。",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：细菌不是敌人",
                        parentWords: "你看！原来绝大多数细菌由于都在由于由于由于认真由于工作。新发现：我们身体里有由于 90% 的细胞其实是由于细菌！没有它们，由于我们甚至无法由于由于由于消化早餐！",
                        description: "震撼揭秘：由于共生的奥义。新发现：细菌不是‘脏’的代名词。它们更像是由于由于由于自然的清洁工和化工厂。生命的复杂性是由这些由于隐形的小功臣由于一手打造的！",
                        isDiscovery: true
                    },
                    {
                        title: "致敬隐形的生命力",
                        parentWords: "让我们感恩这份由于自然的安排。虽然肉眼看不到，但我们的由于免疫系统一直在由于由于由于保护由于我们。你今天完成了一个由于伟大的由于微观由于探索！",
                        description: "由于生命由于无处不在。今天你不仅‘看到’了由于细菌。更由于读懂了由于生命的包容性。你是由于世界由于最细心的由于实验室助理！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js Micro Scene ---
                let scene, camera, renderer, controls, microbes = [];

                const initThree = () => {
                    scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x020617);
                    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
                    camera.position.set(0, 100, 200);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // OrbitControls
                    controls = new THREE.OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;
                    controls.dampingFactor = 0.05;
                    controls.minDistance = 5;
                    controls.maxDistance = 500;
                    controls.autoRotate = step.value === 1;
                    controls.autoRotateSpeed = 0.5;

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.3));
                    const sun = new THREE.PointLight(0x22c55e, 2, 500);
                    sun.position.set(50, 50, 50);
                    scene.add(sun);

                    // Micro Terrain (Schematic)
                    const geo = new THREE.PlaneGeometry(300, 300, 64, 64);
                    const positions = geo.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i + 2] = Math.sin(positions[i] * 0.1) * 5 + Math.cos(positions[i + 1] * 0.1) * 5;
                    }
                    const mat = new THREE.MeshStandardMaterial({ color: 0x1e293b, wireframe: true, transparent: true, opacity: 0.4 });
                    const terrain = new THREE.Mesh(geo, mat);
                    terrain.rotation.x = -Math.PI / 2;
                    scene.add(terrain);

                    // Microbes (Only visible at high zoom)
                    for (let i = 0; i < 150; i++) {
                        const mGeo = new THREE.SphereGeometry(1, 12, 12);
                        const mMat = new THREE.MeshStandardMaterial({
                            color: Math.random() > 0.5 ? 0x22c55e : 0xa3e635,
                            transparent: true,
                            opacity: 0
                        });
                        const microbe = new THREE.Mesh(mGeo, mMat);
                        const angle = Math.random() * Math.PI * 2;
                        const dist = Math.random() * 100;
                        microbe.position.set(Math.cos(angle) * dist, 5, Math.sin(angle) * dist);
                        microbe.scale.set(0, 0, 0);
                        scene.add(microbe);
                        microbes.push(microbe);
                    }

                    animate();
                    window.addEventListener('resize', onResize);
                };

                const updateVisibilityByDistance = () => {
                    const distance = camera.position.length();
                    // When distance < 100, microbes start appearing
                    const opacity = THREE.MathUtils.clamp((150 - distance) / 100, 0, 0.8);
                    const scale = THREE.MathUtils.clamp((150 - distance) / 50, 0, 1.5);

                    microbes.forEach(m => {
                        m.material.opacity = opacity;
                        m.scale.set(scale, scale, scale);
                    });
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    if (controls) {
                        controls.update();
                        updateVisibilityByDistance();
                    }
                    microbes.forEach((m, i) => {
                        m.position.y = 5 + Math.sin(Date.now() * 0.001 + i) * 1.5;
                        m.rotation.y += 0.01;
                    });
                    renderer.render(scene, camera);
                };

                const onResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 1.5 });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.5, delay: 0.5 });

                    if (controls) {
                        controls.autoRotate = newVal === 1;
                    }

                    if (newVal === 4) {
                        gsap.to(camera.position, { x: 0, y: 10, z: 20, duration: 3, ease: "power2.inOut" });
                    }
                });

                onMounted(() => {
                    initThree();
                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, delay: 1 });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, currentStageData,
                    nextStage, goToStage, resetSimulation
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
</body>

</html>
