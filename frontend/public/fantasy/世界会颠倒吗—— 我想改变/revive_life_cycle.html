<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人死了能复活该多好</title>
    <!-- ELITE DEPENDENCIES WITH ROBUST FALLBACK (ONERROR + TIMEOUT) -->
    <script src="https://cdn.tailwindcss.com"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>
        (function () {
            const check = () => {
                const map = {
                    'Vue': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js',
                    'gsap': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js',
                    'THREE': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js',
                    'tailwind': 'https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/tailwind.min.js'
                };
                Object.keys(map).forEach(id => { if (!window[id]) { const s = document.createElement('script'); s.src = map[id]; s.async = false; document.head.appendChild(s); } });
            };
            setTimeout(check, 5000);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --accent-green: #34d399;
            --accent-orange: #fbbf24;
            --text-main: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-blur: blur(20px);
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #022c22;
            font-family: 'Noto Sans SC', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-root {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            padding: 4.5rem;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .stage-title-container {
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(-40px);
        }

        .main-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 4.6rem;
            letter-spacing: 0.15rem;
            background: linear-gradient(135deg, #34d399, #fbbf24);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.4));
        }

        .parent-words {
            font-size: 1.25rem;
            color: #d1fae5;
            background: linear-gradient(90deg, transparent, rgba(52, 211, 153, 0.1), transparent);
            padding: 1rem 4rem;
            border-radius: 2rem;
            font-weight: 300;
        }

        .content-box {
            max-width: 850px;
            margin: 0 auto 18rem auto;
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
        }

        .description-text {
            font-size: 1.8rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 3.5rem;
            font-weight: 300;
        }

        .next-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 1.5rem 5.5rem;
            border-radius: 5.5rem;
            font-weight: 700;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .next-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1) translateY(-12px);
            border-color: var(--accent-green);
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.3);
        }

        .nav-dots {
            position: fixed;
            right: 3.5rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            pointer-events: auto;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.5s;
        }

        .dot.active {
            background: var(--accent-green);
            transform: scale(1.5);
            box-shadow: 0 0 15px var(--accent-green);
        }

        .discovery-tag {
            background: #064e3b;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 700;
            margin-right: 1rem;
        }
    </style>
</head>

<body>
    <div id="canvas-container"></div>
    <div id="app" class="ui-root">
        <!-- 顶部标题与亲子引导 -->
        <div class="stage-title-container" ref="titleContainer">
            <h1 class="main-title">{{ currentStageData.title }}</h1>
            <div class="parent-words">
                🌱 ✨ {{ currentStageData.parentWords }}
            </div>
        </div>

        <!-- 中间内容盒子 -->
        <div class="content-box" ref="contentBox">
            <div class="description-text">
                <span v-if="currentStageData.isDiscovery" class="discovery-tag">生命之语!</span>
                {{ currentStageData.description }}
            </div>
            <div class="flex justify-center pointer-events-auto">
                <button v-if="step < totalStages" @click="nextStage" class="next-btn">
                    {{ step === 2 ? '开启循环体验' : '继续探索' }}
                </button>
                <button v-else-if="step === totalStages" @click="resetSimulation"
                    class="next-btn bg-emerald-900 !text-white">
                    感恩生命的接力
                </button>
            </div>
        </div>

        <!-- 侧边导航 -->
        <div class="nav-dots">
            <div v-for="n in totalStages" :key="n" :class="['dot', { active: step === n }]" @click="goToStage(n)"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch } = Vue;

        createApp({
            setup() {
                const step = ref(1);
                const totalStages = 5;

                const stages = [
                    {
                        title: "人死了能复活该多好",
                        parentWords: "宝贝，你看那一地的由于落叶，它们离开了由于大树，静静地躺在地上。你觉得它们的一生就由于到此结束了吗？它们还会由于以别的样子‘活’过来吗？",
                        description: "这是一趟关于‘生命环’的奇异旅行。我们常常觉得告别就是终点，但在自然的宏大剧本里，所有的告别都是为了另一场惊艳的重逢。",
                        isDiscovery: false
                    },
                    {
                        title: "预测：永不消失的拼图",
                        parentWords: "如果每个人都由于复活。预测一下，地球妈妈的怀抱还能放得下由于这么多人吗？如果老去的由于花朵不谢，新的由于种子还能由于找到土壤发芽吗？",
                        description: "预测中：生命需要空间。自然的智慧在于‘接力’。就像接力赛一样，只有当前面的选手交出由于接力棒，新的一代才能由于开启由于属于他们的灿烂篇章。",
                        isDiscovery: false
                    },
                    {
                        title: "操作：化作春泥更护花",
                        parentWords: "快！点击那些由于飘落的由于枯叶。看它们慢慢由于变成由于泥土，然后变成了嫩绿的小芽！这就是大自然最美的由于变身魔法。",
                        description: "由于生命转换场。在这里，没有真正的消失。每一分由于枯萎都融入了大地的怀抱，化作了由于下一次由于盛开的由于能量。",
                        isDiscovery: false
                    },
                    {
                        title: "大发现：生命的物质守恒",
                        parentWords: "你看！虽然样子变了，但那份由于生命能量还在。新发现：我们身体里的每一个由于碳原子，可能都曾是由于几亿年前的一颗星辰或一支恐龙的一部分。复活一直在发生！",
                        description: "震撼揭秘：由于循环是宇宙的长情告白。新发现：物质永不毁灭，只是由于变换了由于形态。我们活在一个由于由‘旧’材料组成的由于‘新’世界里。这就是由于最温柔的复活！",
                        isDiscovery: true
                    },
                    {
                        title: "致敬伟大的循环",
                        parentWords: "让我们感恩这份由于生生不息。每一次由于呼吸都是自然赐予的由于接力。你今天由于读懂了由于生命由于最宏大的由于史诗！",
                        description: "爱与生命永由于不凋零。今天你不仅参与了由于死与生的过渡。更由于领悟了由于存在的辽阔。你是由于生命旅途中由于最睿智的由于行者！",
                        isDiscovery: false
                    }
                ];

                const currentStageData = computed(() => stages[step.value - 1]);

                // --- Three.js Life Cycle ---
                let scene, camera, renderer, leaves = [];
                let ground, buds = [];

                const initThree = () => {
                    scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x022c22);
                    camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 30, 80);
                    camera.lookAt(0, 0, 0);

                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);

                    // Lights
                    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
                    const sun = new THREE.PointLight(0xfbbf24, 2, 200);
                    sun.position.set(20, 50, 20);
                    scene.add(sun);

                    // Ground
                    const plane = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x064e3b }));
                    plane.rotation.x = -Math.PI / 2;
                    scene.add(plane);

                    // Add Floating Leaves
                    for (let i = 0; i < 20; i++) {
                        const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 1), new THREE.MeshStandardMaterial({ color: 0xb45309 }));
                        leaf.position.set((Math.random() - 0.5) * 60, 40 + Math.random() * 20, (Math.random() - 0.5) * 60);
                        leaf.userData = {
                            speed: 0.1 + Math.random() * 0.1,
                            rot: Math.random() * 0.02
                        };
                        scene.add(leaf);
                        leaves.push(leaf);
                    }

                    animate();
                    window.addEventListener('click', onDocClick);
                    window.addEventListener('resize', onResize);
                };

                const onDocClick = (event) => {
                    if (step.value !== 3) return;
                    // Raycast to leaves
                    const mouse = new THREE.Vector2((event.clientX / window.innerWidth) * 2 - 1, -(event.clientY / window.innerHeight) * 2 + 1);
                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(leaves);

                    if (intersects.length > 0) {
                        const leaf = intersects[0].object;
                        gsap.to(leaf.position, {
                            y: 0.5, duration: 1.5, ease: "bounce.out", onComplete: () => {
                                leaf.visible = false;
                                growBud(leaf.position.x, leaf.position.z);
                            }
                        });
                        gsap.to(leaf.scale, { x: 0.1, y: 0.1, z: 0.1, duration: 1.5 });
                    }
                };

                const growBud = (x, z) => {
                    const bud = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshStandardMaterial({ color: 0x34d399 }));
                    bud.position.set(x, 0, z);
                    scene.add(bud);
                    gsap.to(bud.scale, { x: 8, y: 15, z: 8, duration: 2, ease: "elastic.out" });
                    gsap.to(bud.position, { y: 4, duration: 2 });
                    buds.push(bud);
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    leaves.forEach(l => {
                        if (l.visible && l.position.y > 0.5) {
                            l.position.y -= l.userData.speed;
                            l.rotation.x += l.userData.rot;
                            l.rotation.z += l.userData.rot;
                        }
                    });
                    renderer.render(scene, camera);
                };

                const onResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };

                const nextStage = () => {
                    if (step.value < totalStages) {
                        step.value++;
                    }
                };

                const goToStage = (n) => {
                    step.value = n;
                };

                const resetSimulation = () => {
                    location.reload();
                };

                watch(step, (newVal) => {
                    gsap.fromTo('.stage-title-container', { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 1.5 });
                    gsap.fromTo('.content-box', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.5, delay: 0.5 });

                    if (newVal === 4) {
                        // Change color of buds to flowers
                        buds.forEach(b => {
                            gsap.to(b.material.color, { r: 1, g: 0.8, b: 0, duration: 2 });
                        });
                        gsap.to(camera.position, { y: 60, z: 120, duration: 4 });
                    }
                });

                onMounted(() => {
                    initThree();
                    gsap.to('.stage-title-container', { opacity: 1, y: 0, duration: 2.5, delay: 0.5 });
                    gsap.to('.content-box', { opacity: 1, y: 0, duration: 2.5, delay: 1 });

                    window.__eduNestUIStateProvider = function () {
                        return {
                            stageIndex: step.value,
                            totalStages: totalStages,
                            currentStage: stages[step.value - 1].title
                        };
                    };
                });

                return {
                    step, totalStages, currentStageData,
                    nextStage, goToStage, resetSimulation
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
