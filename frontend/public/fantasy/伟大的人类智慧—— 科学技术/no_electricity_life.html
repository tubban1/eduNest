<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>没有电的生活会怎样</title>
    <!-- 核心库 (带 Fallback) -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script>(function () { var g = "Vue", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>(function () { var g = "THREE", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/OrbitControls.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/renderers/CSS2DRenderer.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/CSS2DRenderer.js'"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@15.2.12/build/Tone.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/Tone.min.js'"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

        * {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050505;
            color: #fff;
            font-family: 'PingFang SC', sans-serif;
        }

        #main-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #css-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .ui-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .top-title-box {
            padding: 20px;
            text-align: center;
        }

        .main-title {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 3rem;
            color: #f2bd21;
            text-shadow: 0 0 20px rgba(242, 189, 33, 0.5);
            margin-bottom: 10px;
        }

        .parent-words-box {
            background: rgba(0, 0, 0, 0.6);
            display: inline-block;
            padding: 6px 25px;
            border-radius: 50px;
            border: 1px solid rgba(242, 189, 33, 0.3);
            color: #ccc;
            font-style: italic;
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }

        .story-text-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding-bottom: 120px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
        }

        .stage-content {
            font-size: 1.6rem;
            line-height: 1.6;
            color: #eee;
        }

        .bottom-hud {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .switch-panel {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 20px;
            border: 1px solid rgba(242, 189, 33, 0.4);
            backdrop-filter: blur(10px);
        }

        .btn-fancy {
            background: linear-gradient(135deg, #f2bd21 0%, #d9a41b 100%);
            color: #000;
            padding: 12px 35px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 8px 20px rgba(242, 189, 33, 0.3);
            transition: all 0.3s;
            cursor: pointer;
            border: none;
        }

        .btn-fancy:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(242, 189, 33, 0.5);
        }

        /* 声音控制按钮 */
        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(242, 189, 33, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #f2bd21;
        }

        .nav-progress {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 20;
        }

        .nav-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(242, 189, 33, 0.3);
            transition: all 0.3s;
            cursor: pointer;
        }

        .nav-dot.active {
            background: #f2bd21;
            box-shadow: 0 0 15px #f2bd21;
            transform: scale(1.3);
        }

        .label-3d {
            color: #f2bd21;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid #f2bd21;
            font-size: 0.85rem;
            white-space: nowrap;
            pointer-events: none;
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: all 0.8s ease;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
            transform: translateY(20px);
            filter: blur(5px);
        }
    </style>
</head>

<body>
    <canvas id="main-canvas"></canvas>
    <div id="css-layer"></div>

    <div id="app" class="ui-overlay">
        <!-- 声音切换 -->
        <div class="sound-toggle pointer-events-auto" @click="toggleSound">
            [[ isMuted ? '🔇' : '🔊' ]]
        </div>

        <div class="top-title-box">
            <h1 class="main-title">没有电的生活</h1>
            <transition name="fade" mode="out-in">
                <div :key="step" class="parent-words-box">[[ stages[step-1].parent ]]</div>
            </transition>
        </div>

        <div class="nav-progress pointer-events-auto">
            <div v-for="n in stages.length" :key="n" class="nav-dot" :class="{ active: step === n }" @click="jumpTo(n)">
            </div>
        </div>

        <div class="story-text-container">
            <transition name="fade" mode="out-in">
                <div :key="step">
                    <h2 class="text-3xl font-bold text-yellow-400 mb-4">[[ stages[step-1].title ]]</h2>
                    <p class="stage-content" v-html="stages[step-1].content"></p>
                </div>
            </transition>
        </div>

        <div class="bottom-hud">
            <transition name="fade">
                <div v-if="step === 1 || step === 2" class="switch-panel pointer-events-auto">
                    <button @click="togglePower" class="btn-fancy">
                        [[ isPowerOn ? '切断全城电源 ⚡' : '接入光明能量 ✨' ]]
                    </button>
                </div>
            </transition>

            <div class="action-area pointer-events-auto">
                <button v-if="step < stages.length" @click="nextStage" class="btn-fancy">
                    继续探索我们的世界
                </button>
                <button v-else @click="reset" class="btn-fancy">重新开启魔法能量 ♻️</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, watch } = Vue;

        createApp({
            delimiters: ['[[', ']]'],
            setup() {
                const step = ref(1);
                const isPowerOn = ref(true);
                const isMuted = ref(false);

                const stages = [
                    { title: "万家灯火的夜晚", content: "我们的城市亮亮堂堂的！电灯、电视、电梯，电无处不在。它是点亮现代文明的‘魔法能量’。", parent: "宝贝，你看现在的城市是不是很漂亮？到处都是亮晶晶的电灯。" },
                    { title: "当电力“罢工”时", content: "如果我们切断电源，会发生什么呢？你会发现，喧闹的城市瞬间陷入了宁静的幽暗，所有电子心跳都停止了。", parent: "如果我们把这个开关关掉，你猜猜城市会变成什么样子？点一下试试？" },
                    { title: "烛光里的温馨", content: "没有电灯，我们就点燃蜡烛。虽然光线暗了，但你能看到天上的星星变得更亮了，家人围坐在一起分享秘密。", parent: "快看，小火苗亮起来了！虽然没有电灯亮，但是不是感觉家里更温馨了？" },
                    { title: "回归自然的节奏", content: "没有了网络的嘈杂，生活变慢了。夏天的西瓜被放进冰凉的井水里，想念朋友的时候，我们提笔写下真诚的信件。", parent: "虽然没有了手机，但我们可以用更多时间来拥抱和说话，这也是一种快乐哦。" },
                    { title: "珍爱我们的能量", content: "人类发明电是为了让生活更便捷，但它并非取之不尽。节约每一度电，就是保护我们的地球母亲。晚安，未来的智者。", parent: "电能是非常珍贵的‘发明天才’。我们要学会节约它，保护好这些聪明的发明哦！" }
                ];

                // --- Sound Context ---
                const synth = new Tone.PolySynth().toDestination();
                const noise = new Tone.NoiseSynth().toDestination();

                const playSwitchSound = () => {
                    if (isMuted.value) return;
                    Tone.start();
                    noise.triggerAttackRelease("16n", undefined, 0.2);
                };

                const playAmbience = (state) => {
                    if (isMuted.value) return;
                    Tone.start();
                    if (state) {
                        synth.triggerAttackRelease(["C3", "E3", "G3"], "2n", undefined, 0.1);
                    } else {
                        synth.triggerAttackRelease(["C2", "G2"], "4n", undefined, 0.1);
                    }
                };

                // --- Three.js ---
                let scene, camera, renderer, labelRenderer, city, stars, controls, lights = [];
                const clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x050505);
                    camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 40, 70);

                    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('main-canvas'), antialias: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);

                    labelRenderer = new THREE.CSS2DRenderer();
                    labelRenderer.setSize(window.innerWidth, window.innerHeight);
                    labelRenderer.domElement.style.position = 'absolute';
                    labelRenderer.domElement.style.top = '0';
                    labelRenderer.domElement.style.pointerEvents = 'none';
                    document.getElementById('css-layer').appendChild(labelRenderer.domElement);

                    controls = new THREE.OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;

                    // Build City
                    city = new THREE.Group();
                    const citySize = 50;
                    for (let i = 0; i < 60; i++) {
                        const h = 5 + Math.random() * 20;
                        const w = 4 + Math.random() * 4;
                        const bGeo = new THREE.BoxGeometry(w, h, w);
                        const bMat = new THREE.MeshPhongMaterial({ color: 0x1e293b });
                        const b = new THREE.Mesh(bGeo, bMat);
                        b.position.set((Math.random() - 0.5) * citySize, h / 2, (Math.random() - 0.5) * citySize);
                        city.add(b);

                        if (Math.random() > 0.4) {
                            const pLight = new THREE.PointLight(Math.random() > 0.5 ? 0x38bdf8 : 0xf2bd21, 2, 15);
                            pLight.position.set(b.position.x, h + 2, b.position.z);
                            lights.push(pLight);
                            scene.add(pLight);

                            if (i < 5) {
                                const div = document.createElement('div');
                                div.className = 'label-3d';
                                div.textContent = ["供电局", "住宅区", "商业街", "图书馆", "医院"][i];
                                const label = new THREE.CSS2DObject(div);
                                label.position.set(0, h / 2 + 2, 0);
                                b.add(label);
                            }
                        }
                    }
                    scene.add(city);

                    // Stars
                    const sGeo = new THREE.BufferGeometry();
                    const sPos = [];
                    for (let i = 0; i < 3000; i++) sPos.push((Math.random() - 0.5) * 300, Math.random() * 200, (Math.random() - 0.5) * 300);
                    sGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
                    stars = new THREE.Points(sGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.3 }));
                    scene.add(stars);

                    scene.add(new THREE.AmbientLight(0xffffff, 0.1));
                    animate();
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();
                    controls.update();

                    if (isPowerOn.value) {
                        lights.forEach((l, i) => l.intensity = 2 + Math.sin(t * 2 + i) * 1);
                    } else {
                        lights.forEach(l => l.intensity = 0);
                    }

                    renderer.render(scene, camera);
                    labelRenderer.render(scene, camera);
                };

                const togglePower = () => {
                    isPowerOn.value = !isPowerOn.value;
                    playSwitchSound();
                    playAmbience(isPowerOn.value);
                    gsap.to(stars.material, { opacity: isPowerOn.value ? 0.3 : 1, size: isPowerOn.value ? 0.2 : 0.6, duration: 2 });
                    if (!isPowerOn.value && step.value === 1) nextStage();
                };

                const toggleSound = () => {
                    isMuted.value = !isMuted.value;
                    if (isMuted.value) Tone.Destination.mute = true;
                    else Tone.Destination.mute = false;
                };

                const nextStage = () => {
                    if (step.value < stages.length) {
                        step.value++;
                        if (step.value === 3) gsap.to(camera.position, { x: 10, y: 15, z: 20, duration: 2 });
                        if (step.value === 5) gsap.to(camera.position, { x: 0, y: 50, z: 80, duration: 3 });
                    }
                };
                const jumpTo = (n) => {
                    step.value = n;
                    gsap.to(camera.position, { x: 0, y: 40, z: 70, duration: 1.5 });
                };
                const reset = () => { window.location.reload(); };

                onMounted(() => {
                    initThree();
                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                        labelRenderer.setSize(window.innerWidth, window.innerHeight);
                    });
                });

                return { step, stages, isPowerOn, isMuted, nextStage, jumpTo, reset, togglePower, toggleSound };
            }
        }).mount('#app');
    </script>
</body>

</html>
