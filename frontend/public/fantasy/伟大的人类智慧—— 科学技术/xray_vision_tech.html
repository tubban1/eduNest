<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一眼能看到人的骨头该多好</title>
    <!-- 核心库 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.20/dist/vue.global.prod.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js'"></script>
    <script>(function () { var g = "Vue", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/vue.global.prod.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js'"></script>
    <script>(function () { var g = "THREE", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/three.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/p5.min.js'"></script>
    <script>(function () { var g = "p5", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/p5.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
        onerror="this.onerror=null; this.src='https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js'"></script>
    <script>(function () { var g = "gsap", u = "https://tubban1.oss-cn-beijing.aliyuncs.com/static/lib/gsap.min.js"; setTimeout(function () { if (window[g] === void 0) { var s = document.createElement("script"); s.src = u; document.head.appendChild(s); } }, 5000); })();</script>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            color: #fff;
            font-family: 'PingFang SC', sans-serif;
        }

        #main-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #p5-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* 标准化 UI 布局 */
        .ui-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        .top-title-box {
            padding: 20px;
            text-align: center;
        }

        .main-title {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 3rem;
            color: #818cf8;
            text-shadow: 0 0 20px rgba(129, 140, 248, 0.5);
            margin-bottom: 10px;
        }

        .parent-words-box {
            background: rgba(15, 23, 42, 0.6);
            display: inline-block;
            padding: 6px 25px;
            border-radius: 50px;
            border: 1px solid rgba(129, 140, 248, 0.3);
            color: #94a3b8;
            font-style: italic;
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }

        /* 导航进度 */
        .nav-progress {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 20;
        }

        .nav-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(129, 140, 248, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-dot.active {
            background: #818cf8;
            box-shadow: 0 0 15px #818cf8;
            transform: scale(1.3);
        }

        /* 沉浸式文字层 */
        .immersive-text-layer {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            padding-bottom: 150px;
        }

        .stage-content {
            font-size: 1.6rem;
            line-height: 1.6;
            color: #e2e8f0;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8);
        }

        /* 底部 HUD */
        .bottom-hud {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .btn-action {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #fff;
            padding: 12px 40px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
            transition: all 0.3s;
            cursor: pointer;
            border: none;
        }

        .btn-action:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(79, 70, 229, 0.6);
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(129, 140, 248, 0.8);
            box-shadow: 0 0 15px #818cf8;
            pointer-events: none;
            z-index: 6;
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: all 0.8s ease;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
            transform: translateY(20px);
            filter: blur(5px);
        }
    </style>
</head>

<body>
    <canvas id="main-canvas"></canvas>
    <div id="p5-overlay"></div>
    <div id="scan" class="scan-line"></div>

    <div id="app" class="ui-overlay">
        <div class="top-title-box">
            <h1 class="main-title">一眼能看到人的骨头</h1>
            <transition name="fade" mode="out-in">
                <div :key="step" class="parent-words-box">[[ stages[step-1].parent ]]</div>
            </transition>
        </div>

        <div class="nav-progress pointer-events-auto">
            <div v-for="n in 5" :key="n" class="nav-dot" :class="{ active: step === n }" @click="jumpTo(n)"></div>
        </div>

        <div class="immersive-text-layer">
            <transition name="fade" mode="out-in">
                <div :key="step">
                    <h2 class="text-3xl font-bold text-indigo-400 mb-4">[[ stages[step-1].title ]]</h2>
                    <p class="stage-content" v-html="stages[step-1].content"></p>
                </div>
            </transition>
        </div>

        <div class="bottom-hud">
            <!-- 阶段2的交互：扫描模式 -->
            <div v-if="step === 2" class="flex gap-4 pointer-events-auto">
                <button @click="scanMode = 'body'" :class="{'opacity-50': scanMode !== 'body'}"
                    class="btn-action !py-2 !px-6 !text-sm">普通视觉</button>
                <button @click="scanMode = 'xray'" :class="{'opacity-50': scanMode !== 'xray'}"
                    class="btn-action !py-2 !px-6 !text-sm">X光透视</button>
            </div>

            <div class="action-area pointer-events-auto">
                <button v-if="step < 5" @click="nextStage" class="btn-action">继续探索奥秘</button>
                <button v-else @click="reset" class="btn-action">重回多彩世界 🦴</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, watch } = Vue;

        createApp({
            delimiters: ['[[', ']]'],
            setup() {
                const step = ref(1);
                const scanMode = ref('body');

                const stages = [
                    { title: "看见‘看不见’的光", content: "在彩色世界之外，隐藏着许多‘超级视力’。1895年发明的X射线，是一种波长极短的光，它们能直接穿过你的皮肤和肌肉。", parent: "宝贝，身体里藏着一副亮晶晶的‘骨架’，那就是骨头。有一种神奇的光带你看到它哦！" },
                    { title: "扫描魔法阵", content: "骨头比肉更‘紧密’，X射线穿过它时会被挡住。就像在雪地留下的脚印，这种‘影子’就是医生看到的图像。尝试切换模式！", parent: "快！就像拿个放大镜，在屏幕上找找看，哪里藏着手臂的骨头，哪里藏着跳动的心脏？" },
                    { title: "光的穿透实验", content: "不同的光有不同的脾气。红外线能看热量，超声波通过回声‘看’物体。未来的医生将拥有全能的‘智能透视眼’。", parent: "哇，你看！调节不同的光波模式，有的能看清骨头，有的能看清血管。是不是像超级英雄？" },
                    { title: "保护脆弱的细胞", content: "穿透光也有力量，它们会‘打扰’细胞休息。所以医生拍摄时会穿着厚厚的铅衣来保护自己，这也是科学的安全守则。", parent: "这些光很有劲，所以不能天天照哦。这就是为什么医生照相时要躲在厚厚的大门后面。" },
                    { title: "智慧的视界", content: "从一张黑白照片到现在的3D立体扫描。科学让我们能看得更深、更远。希望你也能拥有一双发现本质的智慧之眼。", parent: "科学让我们看清了生命的内部，就像看清了一个大玩具是怎么组装的一样。晚安！" }
                ];

                // --- Three.js ---
                let scene, camera, renderer, humanModel, skeletonModel;
                const clock = new THREE.Clock();

                const initThree = () => {
                    scene = new THREE.Scene();
                    scene.background = new THREE.Color(0x020617);

                    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.set(0, 0, 50);

                    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('main-canvas'), antialias: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);

                    // 创建 Stylized Human Body (Capsules + Spheres)
                    humanModel = new THREE.Group();
                    const bodyGeo = new THREE.CapsuleGeometry(5, 15, 4, 16);
                    const bodyMat = new THREE.MeshPhongMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.8 });
                    const body = new THREE.Mesh(bodyGeo, bodyMat);
                    humanModel.add(body);
                    scene.add(humanModel);

                    // 创建 Skeleton Model (Internal bones)
                    skeletonModel = new THREE.Group();
                    const boneGeo = new THREE.CylinderGeometry(1.5, 1.5, 15, 8);
                    const boneMat = new THREE.MeshBasicMaterial({ color: 0x818cf8, wireframe: true });
                    const bone = new THREE.Mesh(boneGeo, boneMat);
                    skeletonModel.add(bone);
                    scene.add(skeletonModel);
                    skeletonModel.visible = false;

                    const light = new THREE.PointLight(0x818cf8, 2, 100);
                    light.position.set(0, 10, 30);
                    scene.add(light);
                    scene.add(new THREE.AmbientLight(0xffffff, 0.2));

                    animate();
                };

                const animate = () => {
                    requestAnimationFrame(animate);
                    const t = clock.getElapsedTime();

                    humanModel.rotation.y += 0.01;
                    skeletonModel.rotation.y += 0.01;

                    if (scanMode.value === 'xray') {
                        humanModel.children[0].material.opacity = 0.1;
                        skeletonModel.visible = true;
                    } else {
                        humanModel.children[0].material.opacity = 0.8;
                        skeletonModel.visible = false;
                    }

                    renderer.render(scene, camera);
                };

                // --- P5.js Scan Line Animation ---
                let p5Instance;
                const initP5 = () => {
                    p5Instance = new p5((p) => {
                        p.setup = () => {
                            let canvas = p.createCanvas(p.windowWidth, p.windowHeight);
                            canvas.parent('p5-overlay');
                        };
                        p.draw = () => {
                            p.clear();
                            if (scanMode.value === 'xray') {
                                p.stroke(129, 140, 248, 100);
                                p.strokeWeight(2);
                                let y = (p.frameCount * 5) % p.height;
                                p.line(0, y, p.width, y);
                                p.noStroke();
                                p.fill(129, 140, 248, 20);
                                p.rect(0, y - 50, p.width, 50);
                            }
                        };
                        p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);
                    });
                };

                const nextStage = () => { if (step.value < 5) step.value++; };
                const jumpTo = (n) => { step.value = n; };
                const reset = () => { window.location.reload(); };

                onMounted(() => {
                    initThree();
                    initP5();
                    window.addEventListener('resize', () => {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    });
                });

                return { step, scanMode, stages, nextStage, jumpTo, reset };
            }
        }).mount('#app');
    </script>
</body>

</html>
