<div id="app">
    <div id="canvas-container"></div>
    <div class="controls">
        <h2>⚡ 光束控制面板</h2>
        
        <div class="control-group">
            <label>
                光束数量
                <span class="value-display" id="beamCountDisplay">5</span>
            </label>
            <input type="range" id="beamCount" min="1" max="20" value="5">
        </div>

        <div class="control-group">
            <label>
                运动速度
                <span class="value-display" id="speedDisplay">1.00</span>
            </label>
            <input type="range" id="speed" min="0.1" max="5" step="0.1" value="1">
        </div>

        <div class="control-group">
            <label>
                球体透明度
                <span class="value-display" id="opacityDisplay">0.20</span>
            </label>
            <input type="range" id="sphereOpacity" min="0" max="1" step="0.05" value="0.2">
        </div>

        <div class="control-group">
            <label>光束颜色</label>
            <input type="color" id="beamColor" value="#00ffff">
        </div>

        <button id="randomBtn">🎲 随机化光束</button>
        <button id="rotateBtn">⏸ 停止旋转</button>
    </div>
</div>
