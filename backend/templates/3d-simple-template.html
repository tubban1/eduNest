<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 建模 - AI 生成</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    
    #container {
      width: 100vw;
      height: 100vh;
    }
  </style>
  
  <!-- Three.js 基础库 - 使用 UMD 版本避免跨域问题 -->
  <script src="https://cdn.jsdelivr.net/npm/three@158.0.0/build/three.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@158.0.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="container"></div>
  
  <script>
    // ==================== 场景初始化 ====================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      45, 
      window.innerWidth / window.innerHeight, 
      0.1, 
      1000
    );
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('container').appendChild(renderer.domElement);
    
    // 相机位置
    camera.position.set(5, 5, 8);
    camera.lookAt(0, 0, 0);
    
    // ==================== 基础光照 ====================
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(5, 10, 7);
    scene.add(directionalLight);
    
    // ==================== 轨道控制器 ====================
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    
    // ==================== AI_GENERATED_CODE 占位符 ====================
    // AI 生成的代码会插入到这里
    
    // ==================== 动画循环 ====================
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
    
    // ==================== 窗口大小调整 ====================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
