  <text x="500" y="277" font-size="12" fill="#34d399" text-anchor="end" font-family="sans-serif">8.5</text>
  <text x="248" y="298" font-size="11" fill="#94a3b8" font-family="sans-serif">5</text>
  <rect x="328" y="288" width="160" height="10" rx="5" fill="rgba(0,0,0,0.2)"/>
  <rect x="328" y="288" width="109" height="10" rx="5" fill="url(#bar4)"/>
  <text x="500" y="297" font-size="12" fill="#fbbf24" text-anchor="end" font-family="sans-serif">6.8</text>
