  <text x="320" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="url(#titleGrad)" font-family="PingFang SC, Microsoft YaHei, sans-serif">eduNest</text>
  <text x="320" y="68" text-anchor="middle" font-size="14" fill="#94a3b8" font-family="sans-serif">AI &#183; Student &#183; Parent &#183; Teacher</text>
