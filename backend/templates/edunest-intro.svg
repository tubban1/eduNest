  <text x="500" y="257" font-size="12" fill="#a78bfa" text-anchor="end" font-family="sans-serif">6.5</text>
  <text x="248" y="278" font-size="11" fill="#94a3b8" font-family="sans-serif">4</text>
  <rect x="328" y="268" width="160" height="10" rx="5" fill="rgba(0,0,0,0.2)"/>
