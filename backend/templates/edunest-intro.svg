  <text x="552" y="228" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="sans-serif">Rt&#9651;</text>
<text x="552" y="242" text-anchor="middle" font-size="10" fill="#38bdf8" font-family="sans-serif">3,4,5</text>
