name: 💡 功能建议 (Feature Request)
description: 为 eduNest 提出新功能、新模型支持或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您为 eduNest 提供宝贵的改进建议！
  - type: textarea
    id: problem
    attributes:
      label: 您的需求 / 痛点是什么？
      description: 请清晰地描述当前系统缺失的能力或使用场景。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 您希望 eduNest 如何实现或改进该功能？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 您是否考虑过其他现有的解决方案或临时替代方案？
  - type: dropdown
    id: category
    attributes:
      label: 功能分类
      options:
        - 互动课件生成能力 (H5 / 3D / 题型)
        - 语音交互与多模态 (Voice / Audio)
        - 模型对接支持 (LLM Providers)
        - 考题库与学科支持 (Curriculum & Exams)
        - 移动端体验 (Flutter App)
        - 运营矩阵与分发 (Marketing Pipeline)
        - 商业化与管理面板 (SaaS & Admin)
        - 部署运维优化 (Docker / CI)
