name: 🐛 Bug 报告 (Bug Report)
description: 提交一个在使用 eduNest 过程中遇到的问题或错误
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您抽出宝贵时间提交 Bug 报告！在提交前，请确保您已检索过历史 Issue 并查阅相关文档。
  - type: checkboxes
    attributes:
      label: 确认清单
      options:
        - label: 我已搜索过已有的 Issues，确认该问题未被提出过。
          required: true
        - label: 我使用的是最新版本的代码或镜像。
          required: true
  - type: dropdown
    id: module
    attributes:
      label: 出现问题的模块 (Module)
      options:
        - 前端 Web 平台 (Next.js)
        - 后端 API 网关 (Express)
        - AI 互动课件生成 / H5 渲染
        - OpenAI Realtime 语音交互
        - 知识库检索 (RAG)
        - Stripe 支付与权限订阅
        - 移动端 (Flutter)
        - 社媒矩阵发布 (Playwright)
        - Docker 部署与环境配置
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述 (Problem Description)
      description: 请清晰、简明地描述该 Bug 是什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 (Steps to Reproduce)
      description: 请提供复现该问题的详细步骤。
      placeholder: |
        1. 启动服务...
        2. 点击...
        3. 输入...
        4. 出现错误...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 (Expected Behavior)
      description: 描述您期望发生的结果。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境 (Environment)
      description: 请提供您的操作系统、Node.js 版本、Docker 版本、浏览器等信息。
      placeholder: |
        - OS: [e.g. macOS 14.5 / Ubuntu 22.04]
        - Node.js: [e.g. v20.11.0]
        - Browser: [e.g. Chrome 124]
        - Deploy Mode: [e.g. Docker Compose / Local npm run dev]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误日志与截图 (Logs / Screenshots)
      description: 请附上终端报错日志、控制台报错或截图。
