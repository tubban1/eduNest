version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edunest-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-edunest-jwt-secret-key-production-change-me}
      - JWT_EXPIRES_IN=7d
      - ARK_API_KEY=${ARK_API_KEY:-}
      - ARK_URL=${ARK_URL:-https://ark.cn-beijing.volces.com/api/v3/chat/completions}
      - ARK_MODEL=${ARK_MODEL:-kimi-k2-250711}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - KIMI_URL=${KIMI_URL:-https://api.moonshot.cn/v1}
      - KIMI_MODEL=${KIMI_MODEL:-kimi-k2-0905-preview}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-ark}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      - FRONTEND_URL=http://localhost:3000
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID_PRO=${STRIPE_PRICE_ID_PRO:-}
      - STRIPE_CURRENCY=${STRIPE_CURRENCY:-usd}
      - GPT_REALTIME_API_KEY=${GPT_REALTIME_API_KEY:-}
      - GPT_REALTIME_WS_URL=${GPT_REALTIME_WS_URL:-wss://tourmaster.ch/v1/realtime}
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || curl -f http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - edunest-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edunest-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-${SUPABASE_URL}}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY}}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-${STRIPE_PUBLISHABLE_KEY}}
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - edunest-network

networks:
  edunest-network:
    driver: bridge
