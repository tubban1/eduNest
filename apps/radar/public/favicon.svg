<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Instrument Dark Green Base -->
  <rect width="64" height="64" rx="14" fill="#060e0c" stroke="#1d3d33" stroke-width="2"/>
  
  <!-- Outer Range Ring -->
  <circle cx="32" cy="32" r="24" stroke="#1c3a31" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Mid Range Ring -->
  <circle cx="32" cy="32" r="15" stroke="#255245" stroke-width="1.5"/>
  
  <!-- Inner Ring -->
  <circle cx="32" cy="32" r="6" stroke="#316e5c" stroke-width="1.5"/>

  <!-- Radar Crosshair -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#1c3a31" stroke-width="1"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#1c3a31" stroke-width="1"/>

  <!-- Radar Sweep Sector -->
  <path d="M 32 32 L 48 16 A 22.6 22.6 0 0 0 32 9 Z" fill="url(#sweepGrad)" opacity="0.85"/>

  <!-- Active Signal Beacons -->
  <circle cx="41" cy="22" r="2.5" fill="#3be29f"/>
  <circle cx="41" cy="22" r="5" stroke="#3be29f" stroke-width="1" opacity="0.6"/>

  <circle cx="23" cy="39" r="2" fill="#38dbe0"/>
  <circle cx="44" cy="42" r="1.8" fill="#3be29f" opacity="0.9"/>

  <!-- Central Sensor Blip -->
  <circle cx="32" cy="32" r="3" fill="#3be29f"/>
  <circle cx="32" cy="32" r="1.2" fill="#ffffff"/>

  <defs>
    <linearGradient id="sweepGrad" x1="32" y1="32" x2="48" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3be29f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3be29f" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
</svg>
